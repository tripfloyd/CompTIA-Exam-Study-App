 the classic System applet in Control Panel has been deprecated and now redirects to the About page within the System section of the Settings app. The About page displays detailed hardware and system information, including CPU model and speed, installed and usable RAM, as well as the Windows edition and version. It also offers quick access to common system utilities such as Device Manager and System Properties. In premium editions of Windows 10 and 11, this page additionally includes links to BitLocker and Remote Desktop.", "type": "bool", "options": ["True", "False"], "correct": [0], "exp": "This accurately describes the modern About page replacing the classic System applet.", "id": "c2t7q21"}, {"q": "In Windows 10 and 11, the About page within the System section of Windows Settings can be accessed through the following paths: (Select all that apply)", "type": "multi", "options": ["Windows Control Panel (icon view) > System", "Windows Start > System (via right-click on the Start button)", "Windows Control Panel (category view) > System and Security > System", "Windows Start > Settings > System > About page", "Windows Control Panel > Programs and Features > System"], "correct": [0, 1, 2, 3], "exp": "The About page can be reached via Control Panel icon/category views, Start right-click, or Settings > System > About.", "id": "c2t7q22"}, {"q": "Which of the following Control Panel applets in Windows 10 and Windows 11 provides access to firewall settings?", "type": "single", "options": ["Network and Sharing Center", "Windows Firewall", "Security and Maintenance", "Windows Defender Firewall"], "correct": [3], "exp": "Windows Defender Firewall is the applet providing firewall settings in modern Windows.", "id": "c2t7q23"}, {"q": "In Windows 10 and Windows 11, the Control Panel applet providing access to Microsoft Outlook configuration options is called:", "type": "single", "options": ["Mail", "Programs and Features", "User Accounts", "Administrative Tools"], "correct": [0], "exp": "The Mail applet provides Outlook configuration options.", "id": "c2t7q24"}, {"q": "Which of the answers listed below refers to an audio configuration Control Panel applet in Windows 10 and Windows 11?", "type": "single", "options": ["Sound", "Device Manager", "Sounds and Audio Devices", "Computer Management"], "correct": [0], "exp": "The Sound applet configures audio settings.", "id": "c2t7q25"}]}, {"id": "test8", "label": "Test 8", "questions": [{"q": "Which applet in the Windows Control Panel enables the modification of local user account settings?", "type": "single", "options": ["User Accounts", "Local Users and Groups", "Security and Maintenance", "User Account Control"], "correct": [0], "exp": "The User Accounts applet modifies local user account settings.", "id": "c2t8q1"}, {"q": "Which Windows Control Panel applet allows users to manage hardware and driver settings?", "type": "single", "options": ["Devices and Printers", "Computer Management", "Device Manager", "Administrative Tools"], "correct": [2], "exp": "Device Manager manages hardware and driver settings.", "id": "c2t8q2"}, {"q": "A Windows Control Panel applet designed to improve file search performance is known as:", "type": "single", "options": ["Storage Spaces", "Disk Clean-up", "Sync Center", "Indexing Options"], "correct": [3], "exp": "Indexing Options improves file search performance.", "id": "c2t8q3"}, {"q": "Windows Administrative Tools (renamed to Windows Tools in Windows 11) is a folder within the Control Panel that serves as a centralized collection of shortcuts to various system utilities and management consoles primarily designed for advanced configuration, monitoring, troubleshooting, and maintenance tasks on a Windows computer.", "type": "bool", "options": ["True", "False"], "correct": [0], "exp": "Administrative Tools/Windows Tools centralizes shortcuts to advanced system utilities.", "id": "c2t8q4"}, {"q": "Which path in the Windows 10 and Windows 11 Control Panel provides access to a configuration setting that enables displaying hidden files, folders, and drives?", "type": "single", "options": ["Folder Options applet > General tab > Show hidden files, folders, and drives", "File Explorer Options applet > View tab > Advanced settings: > Show hidden files, folders, and drives", "Folder Options applet > General tab > Advanced settings: > Show hidden files, folders, and drives", "File Explorer Options applet > Advanced settings: > Show hidden files, folders, and drives"], "correct": [1], "exp": "File Explorer Options > View tab > Advanced settings has the hidden files/folders/drives toggle.", "id": "c2t8q5"}, {"q": "Which of the following actions provides access to the Windows 10 and Windows 11 File Explorer setting that toggles the visibility of files and folders marked by default as hidden?", "type": "single", "options": ["Windows logo key + E > View > Hidden items", "Windows logo key + F > File > Change folder and search options > Hidden items", "Windows logo key + E > View > Advanced settings > Hidden items", "Windows logo key + F > File > Show hidden files and folders"], "correct": [0], "exp": "Win+E opens File Explorer; View > Hidden items toggles hidden file visibility.", "id": "c2t8q6"}, {"q": "Which sequence of steps in Windows 10 and Windows 11 Control Panel provides access to a configuration setting that enables showing or hiding extensions for known file types?", "type": "single", "options": ["Folder Options applet > View tab > Hide extensions for known file types", "File Explorer Options applet > View tab > Advanced settings: > Hide extensions for known file types", "Folder Options applet > General tab > Hide extensions for known file types", "File Explorer Options applet > Advanced settings tab > Hide extensions for known file types"], "correct": [1], "exp": "File Explorer Options > View tab > Advanced settings has the \"Hide extensions for known file types\" option.", "id": "c2t8q7"}, {"q": "The File Explorer setting that enables showing or hiding extensions for known file types in Windows 10 and 11 can be accessed via:", "type": "single", "options": ["Windows logo key + E > View > File name extensions", "Windows logo key + F > File > Change folder and search options > File name extensions", "Windows logo key + E > View > Options > Advanced settings > File name extensions", "Windows logo key + F > File > Settings > File name extensions"], "correct": [0], "exp": "Win+E opens File Explorer; View > File name extensions toggles the extension display.", "id": "c2t8q8"}, {"q": "Which of the settings listed below is not part of the General tab of the File Explorer Options Control Panel applet in Windows 10 and Windows 11?", "type": "single", "options": ["Selection of the default starting folder after launching File Explorer", "Visibility of hidden files, folders, and drives", "Folder browsing options (opening each folder in the same window or in its own window)", "Opening items (single-click vs. double-click to open an item)", "File Explorer browsing history options (Privacy section)"], "correct": [1], "exp": "Hidden file visibility is on the View tab, not the General tab.", "id": "c2t8q9"}, {"q": "In Windows 10 and Windows 11, the File Explorer View menu (Win+E > View) enables quick visual/layout changes for the current folder, while File Explorer Options View tab provides a system-wide, persistent configuration interface.", "type": "bool", "options": ["True", "False"], "correct": [0], "exp": "The View menu is per-folder/quick, while File Explorer Options is the persistent system-wide config.", "id": "c2t8q10"}, {"q": "Which of the following answers refer to hibernation mode in Windows? (Select 3 answers)", "type": "multi", "options": ["Saves the system state (e.g., all open/unsaved files and running applications) to a storage drive", "Resumes full system operation more slowly than it does when waking from sleep mode", "Turns the computer off after saving the system state to disk", "Requires a small amount of power to maintain system memory", "Keeps system state (e.g., all open/unsaved files and running applications) in RAM", "Resumes full system operation faster than when waking from sleep mode"], "correct": [0, 1, 2], "exp": "Hibernation saves system state to disk, powers off completely, and resumes more slowly than sleep.", "id": "c2t8q11"}, {"q": "A Windows power plan is a collection of hardware and system settings that determine how the computer uses power. In Windows Control Panel, the applet providing access to these settings is called:", "type": "single", "options": ["Hardware and Sound", "Computer Management", "Power Options", "System Properties"], "correct": [2], "exp": "Power Options is the applet for configuring power plans.", "id": "c2t8q12"}, {"q": "Which of the statements listed below describe the behavior of sleep mode in Windows? (Select 3 answers)", "type": "multi", "options": ["Requires a small amount of power to maintain system memory", "Saves the system state (e.g., all open/unsaved files and running applications) to a storage drive", "Turns the computer off after saving the system state to disk", "Resumes full system operation faster than it does when recovering from hibernation mode", "Keeps the system state (e.g., all open/unsaved files and running applications) in RAM", "Resumes full system operation more slowly than when recovering from hibernation mode"], "correct": [0, 3, 4], "exp": "Sleep keeps state in RAM (needing a trickle of power) and resumes faster than hibernation.", "id": "c2t8q13"}, {"q": "On Windows-based laptops, users can choose what happens when the laptop lid is closed (Do Nothing, Sleep, Hibernate, Shutdown). This setting can be accessed via: (Select all that apply)", "type": "multi", "options": ["Windows Control Panel (category view) > Hardware and Sound > Power Options > Choose what closing the lid does", "Windows Start > Settings > System > Power & sleep > Additional power settings > Choose what closing the lid does", "Windows Control Panel (icon view) > Power Options > Choose what closing the lid does", "Windows Start > Settings > Devices > Power & sleep > Additional power settings > Choose what closing the lid does"], "correct": [0, 1, 2], "exp": "Lid-close behavior is reachable via Control Panel (category or icon view) or Settings > System > Power & sleep.", "id": "c2t8q14"}, {"q": "The fast startup feature in Windows 10 and 11 puts the computer into a hibernation-like state, allowing faster resume on power-on. Which of the actions listed below provide(s) access to this setting? (Select all that apply)", "type": "multi", "options": ["Windows Control Panel (category view) > Hardware and Sound > Power Options > Choose what the power buttons do > Change settings that are currently unavailable > Turn on fast startup", "Windows Start > Settings > Devices > Power & sleep > Additional power settings > Choose what the power buttons do > Change settings that are currently unavailable > Turn on fast startup", "Windows Control Panel (icon view) > Power Options > Choose what the power buttons do > Change settings that are currently unavailable > Turn on fast startup", "Windows Start > Settings > System > Power & sleep > Additional power settings > Choose what the power buttons do > Change settings that are currently unavailable > Turn on fast startup"], "correct": [0, 2, 3], "exp": "Fast startup is reachable via Control Panel (category or icon view) or Settings > System > Power & sleep.", "id": "c2t8q15"}, {"q": "USB selective suspend allows the system to temporarily disable an individual USB port when not in use. This setting can be accessed via: (Select all that apply)", "type": "multi", "options": ["Windows Control Panel (icon view) > Power Options > Change plan settings > Change advanced power settings > USB settings > USB selective suspend setting", "Windows Start > Settings > System > Power & sleep > Additional power settings > Change plan settings > Change advanced power settings > USB settings > USB selective suspend setting", "Windows Control Panel (category view) > Hardware and Sound > Power Options > Change plan settings > Change advanced power settings > USB settings > USB selective suspend setting", "Windows Start > Settings > Devices > Power & sleep > Additional power settings > Change plan settings > Change advanced power settings > USB settings > USB selective suspend setting"], "correct": [0, 1, 2], "exp": "USB selective suspend is reachable via Control Panel (icon or category view) or Settings > System > Power & sleep.", "id": "c2t8q16"}, {"q": "Which of the following sections of the Settings app in Windows 10 includes configuration options aimed at users with disabilities?", "type": "single", "options": ["Accessibility", "Ease of Access Center", "User Accounts", "Ease of Access"], "correct": [3], "exp": "Ease of Access (in Windows 10 Settings) hosts accessibility configuration options.", "id": "c2t8q17"}, {"q": "Which section of the Windows Settings app enables configuration of date, time, region, language, and speech recognition settings?", "type": "single", "options": ["System", "Date and Time", "Clock and Region", "Time & Language"], "correct": [3], "exp": "Time & Language covers date/time, region, language, and speech recognition.", "id": "c2t8q18"}, {"q": "Which of the sections listed below provides access to backup, recovery, and OS upgrade options within the Windows 10 Settings app?", "type": "single", "options": ["Windows Update", "System", "Update & Security", "Backup and Restore"], "correct": [2], "exp": "Update & Security hosts backup, recovery, and OS upgrade options in Windows 10.", "id": "c2t8q19"}, {"q": "In the Windows Settings app, which section hosts desktop customization settings?", "type": "single", "options": ["Personalization", "System", "Appearance and Personalization", "Programs and Features"], "correct": [0], "exp": "Personalization hosts desktop customization settings.", "id": "c2t8q20"}, {"q": "Which section of the Windows Settings app includes options to modify installed programs?", "type": "single", "options": ["System", "Apps", "Privacy", "Storage"], "correct": [1], "exp": "The Apps section manages installed programs.", "id": "c2t8q21"}, {"q": "Which section of the Settings app in Windows 10 allows users to modify permissions for the operating system and applications?", "type": "single", "options": ["Update & Security", "Privacy", "Apps", "Privacy & security"], "correct": [1], "exp": "Privacy (Windows 10) manages OS/app permissions.", "id": "c2t8q22"}, {"q": "In the Windows Settings app, which section provides access to settings for display, sound, notifications, power management, and storage?", "type": "single", "options": ["Devices", "System", "Hardware and Sound", "Device Manager"], "correct": [1], "exp": "The System section covers display, sound, notifications, power, and storage settings.", "id": "c2t8q23"}, {"q": "Which section of the Settings app in Windows 10 includes options for managing Bluetooth devices, printers, and other connected hardware?", "type": "single", "options": ["Device Manager", "Devices", "Bluetooth & devices", "Devices and Printers"], "correct": [1], "exp": "The Devices section (Windows 10) manages Bluetooth, printers, and connected hardware.", "id": "c2t8q24"}, {"q": "Which section of the Windows Settings app provides access to network configuration options?", "type": "single", "options": ["Network & Internet", "Internet Options", "Network and Sharing Center", "Network Connections"], "correct": [0], "exp": "Network & Internet provides network configuration options in Windows Settings.", "id": "c2t8q25"}]}, {"id": "test9", "label": "Test 9", "questions": [{"q": "Which of the following enables access to gaming options in the Windows Settings app?", "type": "single", "options": ["Apps", "System", "Programs and Features", "Gaming"], "correct": [3], "exp": "The Gaming section in Windows Settings hosts gaming options.", "id": "c2t9q1"}, {"q": "Which section of the Settings app in Windows 10 and Windows 11 allows users to manage sign-in options and connected account settings, including email?", "type": "single", "options": ["Accessibility", "Network & internet", "Accounts", "Privacy & security"], "correct": [2], "exp": "The Accounts section manages sign-in options and connected accounts.", "id": "c2t9q2"}, {"q": "Which of the answers listed below best describe how resource sharing is managed in a Windows domain environment? (Select 3 answers)", "type": "multi", "options": ["Centralized access control", "Local user-based access control", "Active Directory integration", "Manual configuration per device", "Scalable across many users/devices", "Limited to small networks"], "correct": [0, 2, 4], "exp": "Domains use centralized access control, Active Directory integration, and scale across many users/devices.", "id": "c2t9q3"}, {"q": "Which of the following statements are true regarding resource sharing in Windows workgroups? (Select 3 answers)", "type": "multi", "options": ["Limited to small networks", "Scalable across many users/devices", "Manual configuration per device", "Active Directory integration", "Local user-based access control", "Centralized access control"], "correct": [0, 2, 4], "exp": "Workgroups are limited to small networks, require manual per-device config, and use local user-based access control.", "id": "c2t9q4"}, {"q": "Which navigation paths in Windows Control Panel provide access to resource sharing options? (Select 2 answers)", "type": "multi", "options": ["Network and Internet (in category view) > Sharing options", "Internet Options (in icon view) > Connections > LAN settings", "Network and Internet (in category view) > Network and Sharing Center > Change advanced sharing settings", "Devices and Printers (in icon view) > Manage network devices > Sharing options", "Network and Sharing Center (in icon view) > Change advanced sharing settings"], "correct": [2, 4], "exp": "Advanced sharing settings are reachable via Network and Internet > Network and Sharing Center, or directly from Network and Sharing Center in icon view.", "id": "c2t9q5"}, {"q": "The resource sharing options in the Windows 11 Settings app can be accessed via:", "type": "single", "options": ["Update & Security > Windows Security > Firewall & network protection > Advanced settings", "Network & Internet > Status > Network and Sharing Center > Change advanced sharing settings", "Devices > Printers & scanners > Manage (after selecting a device)", "Network & internet > Advanced network settings > Advanced sharing settings"], "correct": [3], "exp": "Windows 11 reaches sharing options via Network & internet > Advanced network settings > Advanced sharing settings.", "id": "c2t9q6"}, {"q": "A technician needs to ensure that a Windows system can both find and be found by other devices on a trusted LAN. Which feature of the advanced sharing settings must be turned on to enable this functionality?", "type": "single", "options": ["Remote access", "SSID broadcast", "Network discovery", "Guest account"], "correct": [2], "exp": "Network discovery must be enabled for a system to find and be found by other LAN devices.", "id": "c2t9q7"}, {"q": "A user reports that others can see their Windows PC on the network, but cannot access the shared printer attached to it. In advanced sharing settings, which feature is most likely disabled?", "type": "single", "options": ["Network discovery", "File and printer sharing", "Remote access", "Network profile type"], "correct": [1], "exp": "File and printer sharing must be enabled to share the attached printer, separate from network discovery.", "id": "c2t9q8"}, {"q": "A Windows-based system configured with correct network and sharing settings still prompts remote users for credentials. To allow unauthenticated access in a trusted environment, which feature in the advanced sharing settings should be turned off?", "type": "single", "options": ["Administrative access", "NTFS permissions", "Password-protected sharing", "Inbound firewall rules"], "correct": [2], "exp": "Turning off password-protected sharing allows unauthenticated access to shared resources.", "id": "c2t9q9"}, {"q": "Which character, when appended to the end of the name of a network share in Windows, indicates that the network share is intended for administrative access and not visible to regular users?", "type": "single", "options": ["#", "$", "?", "&"], "correct": [1], "exp": "Appending $ to a share name creates a hidden administrative share.", "id": "c2t9q10"}, {"q": "Which of the options listed below provides access to shared folders in a Windows environment?", "type": "single", "options": ["Control Panel > Administrative Tools (Windows 10) > Computer Management > System Tools > Shared Folders > Shares", "Windows command-line interface > Run the net share command", "Control Panel > Windows Tools (Windows 11) > Computer Management > System Tools > Shared Folders > Shares", "All of the above"], "correct": [3], "exp": "All of these methods provide access to shared folder information — all of the above.", "id": "c2t9q11"}, {"q": "In the Windows Control Panel, local printer sharing can be enabled via: (Select all that apply)", "type": "multi", "options": ["Windows Control Panel (icon view) > Devices and Printers > right-click on a selected printer > Printer properties > Sharing tab", "Windows Control Panel (category view) > Hardware and Sound > Devices and Printers > right-click on a selected printer > Printer properties > Sharing tab", "Windows Control Panel (icon view) > Devices and Printers > right-click on a selected printer > Properties > Sharing tab", "Windows Control Panel (category view) > View devices and printers (under Hardware and Sound) > right-click on a selected printer > Printer properties > Sharing tab"], "correct": [0, 1, 3], "exp": "Printer sharing is reachable via Devices and Printers in either icon or category Control Panel view, choosing \"Printer properties\" (not the generic \"Properties\").", "id": "c2t9q12"}, {"q": "Which path in the Windows 10 Settings app provides access to printer sharing configuration options?", "type": "single", "options": ["Devices > Printers & scanners > left-click on a selected printer > Manage > Printer properties > Sharing tab", "Hardware and Sound > Devices and Printers > right-click on a selected printer > Printer properties > Sharing tab", "Devices and Printers > right-click on a selected printer > Printer properties > Sharing tab", "Bluetooth & devices > Printers & scanners > left-click on a selected printer > Printer properties > Sharing tab"], "correct": [0], "exp": "Windows 10 Settings: Devices > Printers & scanners > Manage > Printer properties > Sharing tab.", "id": "c2t9q13"}, {"q": "In the Windows 11 Settings app, printer sharing options can be accessed via:", "type": "single", "options": ["Devices and Printers > right-click on a selected printer > Printer properties > Sharing tab", "Hardware and Sound > Devices and Printers > right-click on a selected printer > Printer properties > Sharing tab", "Bluetooth & devices > Printers & scanners > left-click on a selected printer > Printer properties > Sharing tab", "Devices > Printers & scanners > left-click on a selected printer > Manage > Printer properties > Sharing tab"], "correct": [2], "exp": "Windows 11 Settings: Bluetooth & devices > Printers & scanners > Printer properties > Sharing tab.", "id": "c2t9q14"}, {"q": "Which of the following protocols is commonly used by Windows servers to share files, printers, and other resources over a network?", "type": "single", "options": ["FTP", "SMB", "NetBIOS", "LDAP"], "correct": [1], "exp": "SMB is the standard Windows file/printer sharing protocol.", "id": "c2t9q15"}, {"q": "A user needs to access a folder named Projects located on a shared Windows file server FS1. Which UNC path would a technician use to connect to this resource?", "type": "single", "options": ["//FS1\\Projects", ":\\FS1\\Projects", "\\\\FS1\\Projects", "FS1:\\\\Projects"], "correct": [2], "exp": "UNC paths use the format \\\\ServerName\\ShareName — so \\\\FS1\\Projects.", "id": "c2t9q16"}, {"q": "The primary purpose of mapping a network drive in Windows is to assign a drive letter locally to a shared folder stored on a remote computer or server, making the resource appear as part of the local file system. This enables faster navigation, provides a consistent access point through a fixed drive letter, allows applications that require a local path to work seamlessly, and includes an option to automatically reconnect the drive at user sign-in to maintain ongoing access.", "type": "bool", "options": ["True", "False"], "correct": [0], "exp": "Mapped drives give shared folders a local drive letter with these described benefits.", "id": "c2t9q17"}, {"q": "What is the correct syntax for mapping a network drive using the Windows command-line interpreter?", "type": "single", "options": ["net map Z: \\\\Server\\Share", "map drive Z: \\\\Server\\Share", "net use Z: \\\\Server\\Share", "drive map Z: \\\\Server\\Share"], "correct": [2], "exp": "net use Z: \\\\Server\\Share is the correct syntax for mapping a network drive.", "id": "c2t9q18"}, {"q": "A technician needs to map a network drive for a user. The shared folder is located at \\\\Server1\\Documents, and the user wants it mapped to the drive letter X. What should the technician do to accomplish this task?", "type": "single", "options": ["Open File Explorer > right-click \"This PC\" > select \"Map network drive\" > choose X from the dropdown list, and enter \\\\Server1\\Documents", "Launch Windows command-line interpreter > type \"map drive X: \\\\Server1\\Documents\" (without double quotes), and press Enter", "Open File Explorer > right-click on the shared folder > select \"Pin to Quick access\" > choose X from the dropdown list, and enter \\\\Server1\\Documents", "Launch Windows command-line interpreter > type \"net map X: \\\\Server1\\Documents\" (without double quotes), and press Enter"], "correct": [0], "exp": "The GUI method: This PC > Map network drive > select X: and enter the UNC path.", "id": "c2t9q19"}, {"q": "Which of the steps listed below provide(s) access to an interface that allows users to modify how apps communicate through Windows Defender Firewall? (Select all that apply)", "type": "multi", "options": ["Windows Control Panel (category view) > System and Security > Allow an app through Windows Firewall (under Windows Defender Firewall)", "Windows Control Panel (icon view) > Network and Sharing Center > Windows Defender Firewall (bottom left pane) > Allow an app or feature through Windows Defender Firewall", "Windows Control Panel (category view) > Network and Internet > Windows Defender Firewall > Allow an app or feature through Windows Defender Firewall", "Windows Control Panel (icon view) > Windows Defender Firewall > Allow an app or feature through Windows Defender Firewall"], "correct": [0, 1, 3], "exp": "App firewall permissions are reachable via System and Security, Network and Sharing Center's firewall link, or the Windows Defender Firewall applet directly.", "id": "c2t9q20"}, {"q": "A systems administrator is tasked with securing a company laptop used by a traveling sales executive. The laptop requires advanced inbound, outbound, and encrypted connection rules, which can be managed through Windows Defender Firewall with Advanced Security. Which navigation path in Windows can the administrator use to access this tool? (Select 2 answers)", "type": "multi", "options": ["Windows Control Panel (icon view) > Internet Options > Security tab > Windows Defender Firewall with Advanced Security", "Windows Control Panel (category view) > System and Security > Windows Defender Firewall > Advanced settings", "Windows Control Panel (icon view) > Windows Defender Firewall > Advanced settings", "Windows Control Panel (category view) > System and Security > Windows Defender Firewall with Advanced Security", "Windows Control Panel (icon view) > Security and Maintenance > Windows Defender Firewall with Advanced Security"], "correct": [1, 2], "exp": "Advanced Security settings are reached via System and Security > Windows Defender Firewall > Advanced settings (category view) or directly from the icon-view applet's Advanced settings.", "id": "c2t9q21"}, {"q": "A logical numeric identifier assigned to every device on a TCP/IP network is known as:", "type": "single", "options": ["MAC address", "SSID", "IP address", "Host ID"], "correct": [2], "exp": "An IP address is the logical numeric identifier for devices on a TCP/IP network.", "id": "c2t9q22"}, {"q": "Which protocol is primarily responsible for translating domain names into IP addresses?", "type": "single", "options": ["DNS", "DHCP", "FTP", "HTTP"], "correct": [0], "exp": "DNS translates domain names into IP addresses.", "id": "c2t9q23"}, {"q": "Which of the following determines the network segment an IP address belongs to?", "type": "single", "options": ["IP address class", "Default gateway", "MAC address", "Subnet mask"], "correct": [3], "exp": "The subnet mask determines which network segment an IP address belongs to.", "id": "c2t9q24"}, {"q": "In a network using subnets, the term \"Default gateway\" refers to a network device (router) that enables exchange of data between hosts residing in different subnets.", "type": "bool", "options": ["True", "False"], "correct": [0], "exp": "The default gateway (router) routes traffic between different subnets.", "id": "c2t9q25"}]}, {"id": "test10", "label": "Test 10", "questions": [{"q": "Which of the answers listed below refers to an IP address that remains unchanged for a device until reconfigured?", "type": "single", "options": ["Static IP address", "Dynamic IP address", "Private IP address", "Public IP address"], "correct": [0], "exp": "A static IP address stays fixed until manually reconfigured.", "id": "c2t10q1"}, {"q": "What type of server handles the assignment of dynamic IP addresses?", "type": "single", "options": ["Proxy server", "DNS server", "NAT device", "DHCP server"], "correct": [3], "exp": "A DHCP server assigns dynamic IP addresses.", "id": "c2t10q2"}, {"q": "Which of the following answers refer(s) to information required for manual configuration of TCP/IP settings on a network adapter in Windows? (Select all that apply)", "type": "multi", "options": ["IP address", "Subnet mask", "Default gateway", "SSID (a.k.a. network name)", "MAC address", "DNS server address"], "correct": [0, 1, 2, 5], "exp": "Manual TCP/IP config needs IP address, subnet mask, default gateway, and DNS server address.", "id": "c2t10q3"}, {"q": "What is the correct sequence of steps for accessing the Network Connections applet that displays all available network adapters in Windows? (Select all that apply)", "type": "multi", "options": ["Control Panel (category view) > Hardware and Sound > Devices and Printers > Network adapters", "Control Panel (icon view) > Device Manager > Network adapters", "Windows Run dialog box > type \"ncpa.cpl\" (without double quotes), and press Enter", "Control Panel (category view) > Network and Internet > Network and Sharing Center > Change adapter settings", "Control Panel (icon view) > Network and Sharing Center > Change adapter settings"], "correct": [2, 3, 4], "exp": "Network Connections is reachable via ncpa.cpl, or Network and Sharing Center's \"Change adapter settings\" (category or icon view).", "id": "c2t10q4"}, {"q": "A technician is troubleshooting a laptop that occasionally fails to obtain an IP address from a DHCP server. To maintain network connectivity in these cases, they plan to configure a fallback static IP address. After opening the Network Connections applet and locating the correct adapter, which navigation path should they follow to reach the appropriate configuration interface?", "type": "single", "options": ["Right-click on the adapter > Properties > Internet Protocol version 4 (TCP/IPv4) > Properties", "Select the adapter > press Alt to display Menu bar > File > Properties", "Right-click on the adapter > Properties > Configure... > Advanced tab", "Select the adapter > Change settings for this connection (in the Command Bar) > Configure..."], "correct": [0], "exp": "Static IP config is set via adapter Properties > TCP/IPv4 > Properties.", "id": "c2t10q5"}, {"q": "A system that uses a public network (such as the internet) as a means for creating private encrypted connections between remote locations is called:", "type": "single", "options": ["WWAN", "VPN", "PAN", "VLAN"], "correct": [1], "exp": "A VPN creates private encrypted connections over a public network.", "id": "c2t10q6"}, {"q": "A type of network consisting of computers and peripheral devices that use high-frequency radio waves to communicate with each other is referred to as:", "type": "single", "options": ["MAN", "WLAN", "LAN", "VLAN"], "correct": [1], "exp": "A WLAN uses radio waves to network computers/devices.", "id": "c2t10q7"}, {"q": "Which of the answers listed below refers to the most common network communication technology used in wired LANs, MANs, and WANs?", "type": "single", "options": ["Dial-up", "DSL", "Ethernet", "ISDN"], "correct": [2], "exp": "Ethernet is the most common wired networking technology across LAN/MAN/WAN.", "id": "c2t10q8"}, {"q": "Which WAN technology takes advantage of cell towers that provide wireless signal coverage for mobile devices?", "type": "single", "options": ["MPLS", "WWAN", "ATM", "SONET"], "correct": [1], "exp": "WWAN uses cell towers to provide wireless WAN coverage.", "id": "c2t10q9"}, {"q": "Which sequence of steps in Windows provides access to an interface for creating network connections? (Select 2 answers)", "type": "multi", "options": ["Windows Control Panel (category view) > Internet Options > Set up a new connection or network", "Windows Control Panel (icon view) > Network and Sharing Center > Set up a new connection or network", "Windows Control Panel (category view) > View network status and tasks > Set up a new connection or network", "Windows Control Panel (icon view) > Internet Options > General tab > Set up a new connection or network", "Windows Control Panel (category view) > Network and Internet > Set up a new connection or network"], "correct": [1, 2], "exp": "\"Set up a new connection or network\" is reachable via Network and Sharing Center (icon view) or \"View network status and tasks\" (category view).", "id": "c2t10q10"}, {"q": "In Windows, proxy settings can be accessed via:", "type": "single", "options": ["Windows Control Panel (category view) > Network and Internet > Internet Options > Connections tab > LAN settings > Proxy server", "Windows Start > Settings > Network & Internet (Windows 10) > Proxy", "Windows Control Panel (icon view) > Internet Options > Connections tab > LAN settings > Proxy server", "Windows Run dialog box > type \"inetcpl.cpl\" (without double quotes), and press Enter > Connections tab > LAN settings > Proxy server", "Windows Start > Settings > Network & internet (Windows 11) > Proxy", "All of the above"], "correct": [5], "exp": "Proxy settings are reachable through all of these paths — all of the above.", "id": "c2t10q11"}, {"q": "Which of the following statements describe the default behavior of a private network profile in Windows? (Select 3 answers)", "type": "multi", "options": ["The PC remains hidden from other devices on the network", "Used for trusted networks, such as home or work networks", "The PC can't be used for file and printer sharing", "Enables the PC to become discoverable to other devices on the network", "Used for untrusted networks, such as a Wi-Fi network at a coffee shop", "Enables the PC to be used for file and printer sharing"], "correct": [1, 3, 5], "exp": "Private profile: used for trusted networks, makes the PC discoverable, and enables file/printer sharing.", "id": "c2t10q12"}, {"q": "Which of the answers listed below describe the default characteristics of a public network profile in Windows? (Select 3 answers)", "type": "multi", "options": ["Used for trusted networks, such as home or work networks", "Enables the PC to become discoverable to other devices on the network", "The PC can't be used for file and printer sharing", "Enables the PC to be used for file and printer sharing", "Used for untrusted networks, such as a Wi-Fi network at a coffee shop", "The PC remains hidden from other devices on the network"], "correct": [2, 4, 5], "exp": "Public profile: used for untrusted networks, hides the PC, and disallows file/printer sharing.", "id": "c2t10q13"}, {"q": "Which navigation paths in Windows provide access to a configuration interface used for modifying public/private network profile settings? (Select 2 answers)", "type": "multi", "options": ["Windows Control Panel (icon view) > Internet Options > Connections tab > LAN settings > Change advanced sharing settings", "Windows Control Panel (category view) > View network status and tasks > Change advanced sharing settings", "Windows Control Panel (icon view) > Windows Defender Firewall > expand Private/Public networks menu > modify network profile settings", "Windows Control Panel (category view) > System and Security > Check firewall status > expand Private/Public networks menu > modify network profile settings", "Windows Control Panel (icon view) > Network and Sharing Center > Change advanced sharing settings"], "correct": [1, 4], "exp": "Network profile settings are reachable via \"View network status and tasks\" (category view) or Network and Sharing Center (icon view), both leading to \"Change advanced sharing settings\".", "id": "c2t10q14"}, {"q": "File Explorer network navigation lets users browse shared files/folders/devices on a local network like local files, via a UNC path in the address bar (e.g., \\\\ComputerName\\SharedFolder).", "type": "bool", "options": ["True", "False"], "correct": [0], "exp": "File Explorer supports typing a UNC path to browse network shares directly.", "id": "c2t10q15"}, {"q": "A user reports that Windows updates are not automatically downloading on their laptop. Upon checking, the technician discovers the laptop is connected to a mobile hotspot with a data limit. What is the most likely cause of the update issue?", "type": "single", "options": ["Laptop's firewall is blocking all update traffic", "Network profile is set to public, which blocks Windows Update traffic", "Connection is set to metered, which pauses large downloads", "User has manually disabled all Windows updates"], "correct": [2], "exp": "A metered connection pauses large downloads like Windows Updates to conserve limited data.", "id": "c2t10q16"}, {"q": "Which Windows utility is used to enable or disable a metered connection?", "type": "single", "options": ["Computer Management", "Settings app", "Network and Sharing Center", "Internet Options"], "correct": [1], "exp": "The Settings app is used to toggle metered connection status.", "id": "c2t10q17"}, {"q": "What does a macOS file with the .dmg extension primarily represent?", "type": "single", "options": ["Compressed archive format similar to a .zip file", "Virtual disk image that can be mounted as a volume", "Application package file that installs directly from the App Store", "Executable installer file similar to a Windows .exe"], "correct": [1], "exp": ".dmg is a mountable virtual disk image format on macOS.", "id": "c2t10q18"}, {"q": "Which of the following refers to an installer file format processed by the macOS Installer utility?", "type": "single", "options": [".app", ".pkg", ".exe", ".dmg"], "correct": [1], "exp": ".pkg is the installer format processed by macOS Installer.", "id": "c2t10q19"}, {"q": "An .app file in macOS is a specialized folder (an application bundle) represented as a single file in Finder. This self-contained bundle includes all the essential components required to run the application, such as the executable program, resource files like icons and images, and configuration settings. It functions as an executable, so double-clicking it launches the application inside the bundle. Another important characteristic of .app files in macOS is that they can easily be moved or copied without affecting the application's functionality.", "type": "bool", "options": ["True", "False"], "correct": [0], "exp": "macOS .app bundles are self-contained folders that behave as portable executables.", "id": "c2t10q20"}, {"q": "Which of the answers listed below refers to a macOS built-in feature and tool that serves as the official digital distribution platform for applications?", "type": "single", "options": ["Spotlight", "AirDrop", "Launchpad", "App Store"], "correct": [3], "exp": "The App Store is macOS's official application distribution platform.", "id": "c2t10q21"}, {"q": "In macOS, most applications can be uninstalled by dragging the .app file to Trash (drag & drop deletion). App Store apps can also be removed via Launchpad (click-hold to wiggle, then click X). Some .pkg-installed apps need a dedicated uninstaller.", "type": "bool", "options": ["True", "False"], "correct": [0], "exp": "This accurately describes macOS app uninstall methods: drag-to-trash, Launchpad removal, or dedicated uninstallers.", "id": "c2t10q22"}, {"q": "Which macOS folder is the default location for both Apple-supplied and user-installed software?", "type": "single", "options": ["/Users", "/Applications", "/Library", "/System"], "correct": [1], "exp": "/Applications is the default location for both Apple and user-installed software on macOS.", "id": "c2t10q23"}, {"q": "A user wants to access their personal files in macOS. Where should they navigate to?", "type": "single", "options": ["/Users/[username]", "/Applications/[username]", "/Library/[username]", "/System/[username]"], "correct": [0], "exp": "/Users/[username] holds a macOS user's personal files.", "id": "c2t10q24"}, {"q": "Which of the following answers refers to macOS folder containing system-wide resources and settings used by applications and the operating system?", "type": "single", "options": ["/Users", "/Applications", "/Library", "/System"], "correct": [2], "exp": "/Library holds system-wide resources and settings used by apps and the OS.", "id": "c2t10q25"}]}, {"id": "test11", "label": "Test 11", "questions": [{"q": "Which folder in macOS contains the core OS files necessary for the system to run?", "type": "single", "options": ["/Library", "/Config", "/Applications", "/System"], "correct": [3], "exp": "/System contains the core OS files needed for macOS to run.", "id": "c2t11q1"}, {"q": "Which of the answers listed below refers to a macOS folder designed to store application data and settings specific to an individual user account?", "type": "single", "options": ["/System/Library/[username]", "/Library/[username]/Preferences", "/System/[username]/Library", "/Users/[username]/Library"], "correct": [3], "exp": "/Users/[username]/Library stores per-user application data/settings.", "id": "c2t11q2"}, {"q": "Which of the following provides SSO access exclusive to Apple's own ecosystem of products and services?", "type": "single", "options": ["Apple Passkey", "Gatekeeper", "Apple ID", "Sign in with Apple"], "correct": [2], "exp": "Apple ID provides SSO access across Apple's own ecosystem.", "id": "c2t11q3"}, {"q": "What is a common method for enforcing corporate restrictions on macOS devices?", "type": "single", "options": ["RSR", "MDM", "UAC", "MFA"], "correct": [1], "exp": "MDM enforces corporate restrictions/policies on macOS devices.", "id": "c2t11q4"}, {"q": "A reliable data backup strategy includes keeping multiple copies of data on different media types, storing at least one copy offsite, encrypting backup data, retaining multiple historical versions, automating backups, and periodically testing restoration.", "type": "bool", "options": ["True", "False"], "correct": [0], "exp": "These are all recognized best practices for a reliable backup strategy.", "id": "c2t11q5"}, {"q": "While macOS includes integrated malware protection features such as XProtect and Gatekeeper, organizations in business and regulated sectors often deploy third-party antivirus solutions to strengthen security against both known and emerging threats.", "type": "bool", "options": ["True", "False"], "correct": [0], "exp": "Built-in XProtect/Gatekeeper are often supplemented with third-party AV in regulated business environments.", "id": "c2t11q6"}, {"q": "A technician is configuring a batch of new macOS devices for a small business. The client wants to ensure all systems stay up to date with the latest patches automatically. Which System Settings location allows the technician to enable this functionality?", "type": "single", "options": ["Control Center > Updates", "Admin Tools > Updates", "Maintenance > Update Options", "General > Software Update"], "correct": [3], "exp": "General > Software Update is where automatic updates are configured in macOS System Settings.", "id": "c2t11q7"}, {"q": "Which of the answers listed below refers to an Apple-exclusive mechanism for deploying time-sensitive security patches independently of major OS updates?", "type": "single", "options": ["YUM", "RSR", "APT", "RPM"], "correct": [1], "exp": "RSR (Rapid Security Response) deploys urgent patches independently of major OS updates.", "id": "c2t11q8"}, {"q": "In macOS, the System Settings menu (formerly System Preferences), accessible from the Apple menu, provides a centralized location to configure hardware and peripheral devices such as displays, printers, or scanners. It can also be used to manage network connections, privacy and accessibility options, as well as system backups.", "type": "bool", "options": ["True", "False"], "correct": [0], "exp": "System Settings is macOS's centralized hub for hardware, network, privacy, and backup configuration.", "id": "c2t11q9"}, {"q": "Which of the following answers refers to the built-in backup utility in macOS?", "type": "single", "options": ["Time Machine", "ChronoSync", "iDrive", "Retrospect"], "correct": [0], "exp": "Time Machine is macOS's built-in backup utility.", "id": "c2t11q10"}, {"q": "Which macOS feature allows users to group and organize full-screen applications and windows into multiple virtual desktop environments?", "type": "single", "options": ["Dashboard", "Control Center", "Desktop Window Manager", "Spaces"], "correct": [3], "exp": "Spaces organizes apps/windows into multiple virtual desktops on macOS.", "id": "c2t11q11"}, {"q": "A macOS feature providing single-screen thumbnail preview of all open windows and applications is known as:", "type": "single", "options": ["Quick Look", "Spotlight", "Mission Control", "Stage Manager"], "correct": [2], "exp": "Mission Control shows thumbnail previews of all open windows/apps.", "id": "c2t11q12"}, {"q": "Which built-in macOS utility provides secure storage and management of passwords, encryption keys, certificates, and other sensitive credentials?", "type": "single", "options": ["Keychain", "Credential Manager", "Apple ID", "FileVault"], "correct": [0], "exp": "Keychain securely stores passwords, keys, certificates, and credentials on macOS.", "id": "c2t11q13"}, {"q": "Which of the answers listed below refers to a macOS system search utility?", "type": "single", "options": ["Explorer", "File explorer", "Spotlight", "Finder"], "correct": [2], "exp": "Spotlight is macOS's system-wide search utility.", "id": "c2t11q14"}, {"q": "Apple's cloud service for storing and syncing data across devices is called:", "type": "single", "options": ["iDrive", "AirDrop", "OneDrive", "iCloud"], "correct": [3], "exp": "iCloud is Apple's cloud storage/sync service.", "id": "c2t11q15"}, {"q": "Apple's iMessage is a proprietary service designed for secure exchange of email messages between Apple devices.", "type": "bool", "options": ["True", "False"], "correct": [1], "exp": "iMessage is for text/media messaging, not email — this statement is false.", "id": "c2t11q16"}, {"q": "Which macOS app can be used for real-time audio and video calling between Apple devices?", "type": "single", "options": ["iChat", "FaceTime", "Signal", "Zoom"], "correct": [1], "exp": "FaceTime provides real-time audio/video calling on Apple devices.", "id": "c2t11q17"}, {"q": "A user works on a MacBook at the office and wants to continue editing the same files later on their iPad at home. They need a solution that stores files in the cloud so the latest version is automatically available on all their Apple devices. Which macOS feature should they use?", "type": "single", "options": ["iCloud Drive", "AirDrop", "iDrive", "Continuity"], "correct": [0], "exp": "iCloud Drive syncs files in the cloud across all a user's Apple devices.", "id": "c2t11q18"}, {"q": "In modern macOS versions, gestures can be customized in System Settings under Trackpad preferences.", "type": "bool", "options": ["True", "False"], "correct": [0], "exp": "Trackpad gestures are customizable in System Settings > Trackpad.", "id": "c2t11q19"}, {"q": "Which of the following answers refers to the default file management application for macOS?", "type": "single", "options": ["Dock", "Explorer", "Spotlight", "Finder"], "correct": [3], "exp": "Finder is macOS's default file management app.", "id": "c2t11q20"}, {"q": "What is the name of the macOS feature that functions similarly to the Windows taskbar, providing quick access to frequently used and running applications, as well as minimized windows?", "type": "single", "options": ["Menu Bar", "Quick Look", "Dock", "Preview"], "correct": [2], "exp": "The Dock functions like a taskbar, giving quick access to apps and minimized windows.", "id": "c2t11q21"}, {"q": "A set of features allowing users to seamlessly transition tasks and data between different Apple devices is referred to as:", "type": "single", "options": ["iMessages", "Continuity", "Universal Clipboard", "iCloud Drive"], "correct": [1], "exp": "Continuity is the umbrella feature set for seamless task/data handoff between Apple devices.", "id": "c2t11q22"}, {"q": "Which macOS tool allows users to create .dmg files?", "type": "single", "options": ["Disk Management", "iDrive", "GParted", "Disk Utility"], "correct": [3], "exp": "Disk Utility can create .dmg disk image files on macOS.", "id": "c2t11q23"}, {"q": "Which macOS feature encrypts the contents of the startup disk to protect user data from unauthorized access?", "type": "single", "options": ["TrueCrypt", "FileVault", "Keychain", "Gatekeeper"], "correct": [1], "exp": "FileVault encrypts the macOS startup disk.", "id": "c2t11q24"}, {"q": "Which macOS tool provides access to different command-line shells?", "type": "single", "options": ["PowerShell", "Command Prompt", "Terminal", "Console"], "correct": [2], "exp": "Terminal provides access to command-line shells on macOS.", "id": "c2t11q25"}]}, {"id": "test12", "label": "Test 12", "questions": [{"q": "Which macOS feature allows users to terminate an unresponsive application or process?", "type": "single", "options": ["Safe Quit", "Force Stop", "End Task", "Force Quit"], "correct": [3], "exp": "Force Quit terminates an unresponsive app/process on macOS.", "id": "c2t12q1"}, {"q": "Which Linux command is used to display files and directories in the current working directory?", "type": "single", "options": ["pwd", "ls", "grep", "ps"], "correct": [1], "exp": "ls lists files and directories in the current directory.", "id": "c2t12q2"}, {"q": "Which command in Linux displays the absolute path of the current working directory?", "type": "single", "options": ["mv", "pwd", "rm", "dir"], "correct": [1], "exp": "pwd (print working directory) shows the current absolute path.", "id": "c2t12q3"}, {"q": "Which Linux command is used for moving or renaming files and directories?", "type": "single", "options": ["rm", "cp", "ln", "mv"], "correct": [3], "exp": "mv moves or renames files/directories in Linux.", "id": "c2t12q4"}, {"q": "Which of the commands listed below is used for copying files and directories in Linux?", "type": "single", "options": ["cp", "copy", "xcopy", "robocopy"], "correct": [0], "exp": "cp copies files/directories in Linux.", "id": "c2t12q5"}, {"q": "A command-line command in Linux used for deleting files and directories is known as:", "type": "single", "options": ["erase", "rm", "del", "edit"], "correct": [1], "exp": "rm deletes files/directories in Linux.", "id": "c2t12q6"}, {"q": "What is the function of the Linux chmod command?", "type": "single", "options": ["Alters group membership for a user", "Changes the owner and/or group of a file or directory", "Sets or modifies permissions for files and directories", "Updates the default shell for a user"], "correct": [2], "exp": "chmod sets/modifies file and directory permissions.", "id": "c2t12q7"}, {"q": "What does the chown command do in Linux?", "type": "single", "options": ["Sets or modifies permissions for files and directories", "Displays user identity and group information", "Changes the owner and/or group of a file or directory", "Modifies default file creation permissions"], "correct": [2], "exp": "chown changes the owner and/or group of a file/directory.", "id": "c2t12q8"}, {"q": "Which Linux command enables searching within file contents for specific text patterns?", "type": "single", "options": ["search", "find", "grep", "locate"], "correct": [2], "exp": "grep searches file contents for text patterns.", "id": "c2t12q9"}, {"q": "A Linux command-line utility used to search for files and directories is called:", "type": "single", "options": ["find", "path", "search", "grep"], "correct": [0], "exp": "find searches the filesystem for files and directories.", "id": "c2t12q10"}, {"q": "The fsck command in Linux can be used for: (Select 2 answers)", "type": "multi", "options": ["Formatting new partitions", "Verifying filesystem integrity", "Securely deleting files", "Repairing filesystem errors", "Checking available disk space"], "correct": [1, 3], "exp": "fsck verifies filesystem integrity and repairs filesystem errors.", "id": "c2t12q11"}, {"q": "The mount command in Linux is used to make a filesystem accessible to the operating system by attaching it to a specific directory (the mount point) within the Linux filesystem tree.", "type": "bool", "options": ["True", "False"], "correct": [0], "exp": "mount attaches a filesystem to a directory (mount point) to make it accessible.", "id": "c2t12q12"}, {"q": "Which Linux command allows a user to assume the identity of another system user and operate within that user's shell environment?", "type": "single", "options": ["login", "id", "usermod", "su"], "correct": [3], "exp": "su switches the current session to another user's identity/shell.", "id": "c2t12q13"}, {"q": "Which command in Linux allows a permitted user to execute a single command with elevated privileges, typically as the root user?", "type": "single", "options": ["chmod", "su", "usermod", "sudo"], "correct": [3], "exp": "sudo runs a single command with elevated (root) privileges.", "id": "c2t12q14"}, {"q": "Which of the following command-line utilities is used for installing, upgrading, and removing software packages on Debian and Debian-based Linux distributions?", "type": "single", "options": ["rpm", "apt", "dnf", "yum"], "correct": [1], "exp": "apt manages packages on Debian/Debian-based distros.", "id": "c2t12q15"}, {"q": "Which of the answers listed below refers to the software package manager used in modern Red Hat and Red Hat-based Linux distributions?", "type": "single", "options": ["pkg", "dnf", "dpkg", "apt"], "correct": [1], "exp": "dnf is the package manager for modern Red Hat-based distros.", "id": "c2t12q16"}, {"q": "Which modern Linux command-line utility is used for displaying and managing network configuration settings?", "type": "single", "options": ["ipconfig", "route", "ip", "netstat"], "correct": [2], "exp": "The ip command manages/displays network configuration on modern Linux.", "id": "c2t12q17"}, {"q": "A Linux network diagnostic utility used to test the reachability of a host on an IP network is known as:", "type": "single", "options": ["ping", "tracert", "dig", "netstat"], "correct": [0], "exp": "ping tests host reachability on Linux (as on other OSes).", "id": "c2t12q18"}, {"q": "Which of the following Linux command-line tools is specifically designed for transferring data using a wide range of supported internet protocols such as HTTP, FTP, or SMTP?", "type": "single", "options": ["curl", "wget", "scp", "rsync"], "correct": [0], "exp": "curl supports transferring data across a wide range of protocols (HTTP, FTP, SMTP, etc.).", "id": "c2t12q19"}, {"q": "Which of the answers listed below refers to a Linux network administration command-line utility used for querying DNS servers, retrieving various types of DNS records, and troubleshooting DNS resolution issues?", "type": "single", "options": ["mtr", "whois", "nc", "dig"], "correct": [3], "exp": "dig queries DNS servers and troubleshoots DNS resolution.", "id": "c2t12q20"}, {"q": "In Linux, tracert is a command-line utility that maps the path packets take from the local system to a remote host, displaying each hop along the route and round-trip times.", "type": "bool", "options": ["True", "False"], "correct": [1], "exp": "Linux uses traceroute, not tracert (tracert is the Windows command name).", "id": "c2t12q21"}, {"q": "Which of the following commands in Linux provides access to documentation and help pages for other commands?", "type": "single", "options": ["[command] usage", "man [command]", "[command] info", "docs [command]"], "correct": [1], "exp": "man [command] displays the manual/help page for a command in Linux.", "id": "c2t12q22"}, {"q": "Which of the answers listed below refer to the common functions of the Linux cat command? (Select 2 answers)", "type": "multi", "options": ["Listing files and directories in a folder", "Searching for specific text patterns within a file", "Displaying contents of one or more files to the terminal", "Concatenating contents of multiple files into a single output stream or file", "Renaming or moving a file to a new location"], "correct": [2, 3], "exp": "cat displays file contents and can concatenate multiple files into one output.", "id": "c2t12q23"}, {"q": "Which command-line utility in Linux provides a real-time, interactive view of system metrics such as CPU usage, memory consumption, and active processes?", "type": "single", "options": ["top", "vmstat", "ps", "tasklist"], "correct": [0], "exp": "top gives a real-time interactive view of system resource usage/processes.", "id": "c2t12q24"}, {"q": "Which Linux command provides a static snapshot of currently running processes at the moment the command is executed?", "type": "single", "options": ["dstat", "tasklist", "ps", "top"], "correct": [2], "exp": "ps gives a static (one-time) snapshot of running processes.", "id": "c2t12q25"}]}, {"id": "test13", "label": "Test 13", "questions": [{"q": "Which of the following Linux commands is used to estimate and display the amount of disk space used by individual files and directories?", "type": "single", "options": ["du", "fdisk", "parted", "df"], "correct": [0], "exp": "du estimates disk space used by files/directories.", "id": "c2t13q1"}, {"q": "The df command in Linux can be used to determine the disk space used by a specific directory and its contents.", "type": "bool", "options": ["True", "False"], "correct": [1], "exp": "df reports filesystem/volume-level space, not directory-level usage — that's du's job.", "id": "c2t13q2"}, {"q": "Which of the answers listed below refers to a command-line text editor for Linux?", "type": "single", "options": ["gedit", "cat", "nano", "touch"], "correct": [2], "exp": "nano is a command-line text editor in Linux.", "id": "c2t13q3"}, {"q": "Which of the following answers refers to a plain-text system file that contains essential information about user accounts in Linux?", "type": "single", "options": ["/etc/shadow", "/etc/users", "/etc/passwd", "/etc/sudoers"], "correct": [2], "exp": "/etc/passwd stores essential user account information.", "id": "c2t13q4"}, {"q": "Which Linux system file is used to store encrypted password hashes and additional password-related settings?", "type": "single", "options": ["/etc/sysconfig", "/etc/passwd", "/etc/login.defs", "/etc/shadow"], "correct": [3], "exp": "/etc/shadow stores encrypted password hashes.", "id": "c2t13q5"}, {"q": "In Linux, the system file used for local hostname to IP address resolution is located in:", "type": "single", "options": ["/etc/hosts", "/etc/sysconfig/network", "/etc/network/interfaces", "/etc/resolv.conf"], "correct": [0], "exp": "/etc/hosts maps hostnames to IP addresses locally.", "id": "c2t13q6"}, {"q": "The fstab system file in Linux, located at /etc/fstab, is a filesystem table that lists storage devices and partitions, along with their mount points and options, allowing the system to mount them automatically at boot.", "type": "bool", "options": ["True", "False"], "correct": [0], "exp": "/etc/fstab defines devices/partitions and their auto-mount settings at boot.", "id": "c2t13q7"}, {"q": "Which system file in Linux specifies the IP addresses of the DNS servers that the system will use to resolve domain names to IP addresses?", "type": "single", "options": ["/etc/hostname", "/etc/network/interfaces", "/etc/resolv.conf", "/etc/sysconfig/network"], "correct": [2], "exp": "/etc/resolv.conf lists the DNS servers used for name resolution.", "id": "c2t13q8"}, {"q": "Which of the answers listed below refers to the standard Linux system and service manager that handles the boot process and manages system resources?", "type": "single", "options": ["bootmgr", "systemd", "init", "systemctl"], "correct": [1], "exp": "systemd is the modern standard system/service manager in Linux.", "id": "c2t13q9"}, {"q": "Which core component of Linux manages the system's hardware resources and acts as an interface between applications and hardware?", "type": "single", "options": ["Kernel", "Device driver", "Shell", "Daemon"], "correct": [0], "exp": "The kernel manages hardware resources and interfaces between apps and hardware.", "id": "c2t13q10"}, {"q": "Which of the following answers refers to the Linux component responsible for loading the OS kernel into memory during the system startup process?", "type": "single", "options": ["Kernel loader", "Systemd", "BIOS/UEFI firmware", "Bootloader"], "correct": [3], "exp": "The bootloader loads the kernel into memory at startup.", "id": "c2t13q11"}, {"q": "A type of user account in Linux that has unrestricted access to all system files, commands, and administrative functions is called:", "type": "single", "options": ["Admin", "System", "Root", "Sudoer"], "correct": [2], "exp": "The root account has unrestricted system access in Linux.", "id": "c2t13q12"}, {"q": "Which command in Linux would display a detailed, long listing of all files in a directory, including hidden files that start with a dot (.)?", "type": "single", "options": ["ls -la", "ls -ah", "ls -fa", "ls -lh"], "correct": [0], "exp": "ls -la shows a detailed long listing including hidden dotfiles.", "id": "c2t13q13"}, {"q": "The ls -l command in Linux shows an entry starting with d in the permissions field (e.g., drwxr-xr-x). What does the d mean in this context?", "type": "single", "options": ["The entry item is a regular file", "The entry item is a symbolic link", "The entry item is a directory", "The entry item is a block device"], "correct": [2], "exp": "A leading d in ls -l output indicates a directory.", "id": "c2t13q14"}, {"q": "A system administrator needs to rename the file report.txt to final_report.txt in the current Linux directory. Which command should they use?", "type": "single", "options": ["cp report.txt final_report.txt", "echo report.txt > final_report.txt", "mv report.txt final_report.txt", "cat report.txt > final_report.txt"], "correct": [2], "exp": "mv renames (or moves) files in Linux.", "id": "c2t13q15"}, {"q": "A user wants to move fileA.txt and fileB.txt into /home/user/archive/. Which command in Linux correctly moves both files into the destination directory?", "type": "single", "options": ["mv fileA.txt fileB.txt > /home/user/archive/", "mv fileA.txt && fileB.txt /home/user/archive/", "mv fileA.txt fileB.txt /home/user/archive/", "mv [fileA.txt fileB.txt] /home/user/archive/"], "correct": [2], "exp": "mv fileA.txt fileB.txt /home/user/archive/ moves both files to the target directory in one command.", "id": "c2t13q16"}, {"q": "A Linux technician needs to create a copy of config.txt within the current working directory and name the new file config.bak. Which of the answers listed below refers to the correct Linux command to accomplish this task?", "type": "single", "options": ["cp config.txt config.bak", "echo config.txt > config.bak", "cp config.txt ~/config.bak", "mv config.txt config.bak"], "correct": [0], "exp": "cp config.txt config.bak copies the file to a new name in the same directory.", "id": "c2t13q17"}, {"q": "A user runs the command cp -r /var/log /home/user/log_backup in Linux. What is the purpose of the -r option in this command?", "type": "single", "options": ["To remove the source directory after copying", "To prompt for confirmation before overwriting existing files", "To recursively copy files and directories", "The command contains syntax error and will fail to execute"], "correct": [2], "exp": "The -r flag makes cp recursively copy directories and their contents.", "id": "c2t13q18"}, {"q": "A Linux user attempts to delete a large directory named old_reports with rm old_reports to free up system space, but the command results in an error. Which of the following answers lists the correct command to remove a directory and all of its contents in Linux?", "type": "single", "options": ["rm -f old_reports", "rm -d old_reports", "rmdir old_reports", "rm -r old_reports"], "correct": [3], "exp": "rm -r removes a directory and all its contents recursively.", "id": "c2t13q19"}, {"q": "The chmod command in Linux supports numeric (octal) notation consisting of 3 digits, where each digit is a combination of read (r), write (w), and execute (x) permissions represented in numerical form by 4, 2, and 1, respectively. Each of the resulting values in this notation applies to a different user category: owner, group, others (in that order). For example, chmod 755 script.sh sets permissions for the script.sh file and translates into -rwxr-xr-x. This gives the owner full rights (4 + 2 + 1) and read + execute access (4 + 1) to the group and others. The leading - in -rwxr-xr-x indicates the resource type, which in this case designates a regular file.", "type": "bool", "options": ["True", "False"], "correct": [0], "exp": "This accurately describes chmod's octal notation and how 755 translates to -rwxr-xr-x.", "id": "c2t13q20"}, {"q": "After running the command chmod 750 on a directory in Linux, a technician confirms the permissions with the ls -l command. Which of the strings listed below correctly represents the new permissions?", "type": "single", "options": ["drwxrw----", "drwxr-x---", "drwxr-----", "drwx-wx---"], "correct": [1], "exp": "750 = owner rwx (7), group r-x (5), others --- (0), i.e. drwxr-x---.", "id": "c2t13q21"}, {"q": "A Linux system admin is modifying permissions for a configuration file named apache.conf. To prevent unauthorized changes, they want to allow only the file's owner to read and write to it, while allowing the web server's group and all other users to only read it. Which of the following permission sets should they use?", "type": "single", "options": ["611", "644", "622", "666"], "correct": [1], "exp": "644 gives the owner read+write (6), and group/others read-only (4 each).", "id": "c2t13q22"}, {"q": "A Linux system admin needs to check if a file can be executed by its group. The ls -l command shows the file's permissions as -rw-r--r-x. Which of the following statements is true about this permission set?", "type": "single", "options": ["The owner is missing write permissions", "The group has write permissions", "The owner has execute permissions", "The group is missing the execute permission"], "correct": [3], "exp": "-rw-r--r-x: group segment is r-- (no execute) — the group is missing execute permission.", "id": "c2t13q23"}, {"q": "The chmod command supports symbolic notation: u/g/o/a for categories, r/w/x for permissions, and +/-/= operators. + and - adjust without touching other bits; = replaces the category's entire permission set with exactly what's specified.", "type": "bool", "options": ["True", "False"], "correct": [0], "exp": "This correctly describes chmod's symbolic notation and operator behavior.", "id": "c2t13q24"}, {"q": "If the current permissions for the config.cfg file in Linux are set to -rw-r--r--, what would be the resulting set of permissions after executing chmod a=r config.cfg on that file?", "type": "single", "options": ["644", "400", "666", "444"], "correct": [3], "exp": "chmod a=r sets read-only for all categories (owner, group, others), resulting in 444.", "id": "c2t13q25"}]}, {"id": "test14", "label": "Test 14", "questions": [{"q": "A Linux user needs to allow the group to execute the maintenance script maint.sh without changing any existing read or write permissions. The current permissions for the file are -rw-r-----. Which command should they use?", "type": "single", "options": ["chmod 640 maint.sh", "chmod g+x maint.sh", "chmod 660 maint.sh", "chmod g=x maint.sh"], "correct": [1], "exp": "chmod g+x adds execute for the group only, without touching existing read/write bits.", "id": "c2t14q1"}, {"q": "Which command in Linux can be used to remove the execute permission from the script.sh file for all users?", "type": "single", "options": ["chmod a-x script.sh", "chmod u-x,g-x,o-x script.sh", "chmod ugo-x script.sh", "Any of the above"], "correct": [3], "exp": "All three syntaxes achieve the same result: removing execute from all categories — any of the above.", "id": "c2t14q2"}, {"q": "A Linux system admin wants to change the group ownership of backup.tar.gz to admins. Which command should they use?", "type": "single", "options": ["chown :admins backup.tar.gz", "chown admins backup.tar.gz", "chown backup.tar.gz :admins", "chown +g admins backup.tar.gz"], "correct": [0], "exp": "chown :admins changes only the group ownership to admins.", "id": "c2t14q3"}, {"q": "A user gets \"Permission denied\" when running chown on a system file in Linux. What is the most likely cause?", "type": "single", "options": ["The user lacks write permission for the file", "The user does not have execute permission on the directory containing the file", "The user is not root or lacks necessary privileges", "The user specified incorrect command syntax"], "correct": [2], "exp": "chown typically requires root/sudo privileges — lacking them causes permission denied.", "id": "c2t14q4"}, {"q": "A Linux server admin needs to ensure that a configuration file, httpd.conf, is owned by the root user and the www-data group. Which command should they use to accomplish this task?", "type": "single", "options": ["chown www-data:root /etc/httpd/httpd.conf", "chown root www-data /etc/httpd/httpd.conf", "chown www-data root /etc/httpd/httpd.conf", "chown root:www-data /etc/httpd/httpd.conf"], "correct": [3], "exp": "chown owner:group syntax — root:www-data sets owner to root and group to www-data.", "id": "c2t14q5"}, {"q": "Which Linux command can be used to check whether the IP address 192.168.0.10 appears anywhere in the /etc/hosts file?", "type": "single", "options": ["search \"192.168.0.10\" /etc/hosts", "find /etc/hosts -name \"192.168.0.10\"", "grep \"192.168.0.10\" /etc/hosts", "locate \"192.168.0.10\" /etc/hosts"], "correct": [2], "exp": "grep searches file contents for a specific text pattern.", "id": "c2t14q6"}, {"q": "Which command in Linux can be used to search the /etc directory for a file that starts with the string \"default\" and has a .conf extension?", "type": "single", "options": ["find /etc -regex \"default*.conf\"", "find /etc -file \"default*.conf\"", "find /etc -type \"default*.conf\"", "find /etc -name \"default*.conf\""], "correct": [3], "exp": "find ... -name uses a filename pattern to search for matching files.", "id": "c2t14q7"}, {"q": "A Linux technician is looking for a file but can only recall that the file name has exactly three characters and ends with .dat. Which command should they use to search for this file in the current directory and its subdirectories?", "type": "single", "options": ["find . -type \"???.dat\"", "find . -name \"???.dat\"", "find . -regex \"???.dat\"", "find . -file \"???.dat\""], "correct": [1], "exp": "find . -name with ? wildcards matches filenames with a specific character count.", "id": "c2t14q8"}, {"q": "Which fsck flag in Linux enables automatic repair of any detected errors?", "type": "single", "options": ["-n", "-v", "-c", "-y"], "correct": [3], "exp": "fsck -y automatically answers yes to repair prompts, enabling automatic repair.", "id": "c2t14q9"}, {"q": "A Linux technician has connected a USB drive identified as /dev/sdb1 and created a directory /mnt/usbdrive. Which command will make the contents of the USB drive accessible at that mount point?", "type": "single", "options": ["mount usbdrive /dev/sdb1", "mount /dev/sdb1 /mnt/usbdrive", "mount /mnt/usbdrive /dev/sdb1", "mount /dev/sdb1 usbdrive"], "correct": [1], "exp": "mount [device] [mount point] — mount /dev/sdb1 /mnt/usbdrive attaches the drive at that location.", "id": "c2t14q10"}, {"q": "A user runs the command su in Linux and is prompted for a password. Which password is requested?", "type": "single", "options": ["The current user's password", "The root user's password", "The service account password", "The default system password"], "correct": [1], "exp": "Plain su (without a username) switches to root and requires the root password.", "id": "c2t14q11"}, {"q": "A Linux administrator, currently logged in as staff, needs to switch to a higher-level account called sysadmin and remain in that account to modify multiple application files in the current working directory. Which command changes the session to sysadmin?", "type": "single", "options": ["login sysadmin", "sudo sysadmin", "chroot sysadmin", "su sysadmin"], "correct": [3], "exp": "su sysadmin switches the session to the sysadmin account and stays there.", "id": "c2t14q12"}, {"q": "A user was recently added to a special group with elevated rights to perform system maintenance on a Debian-based Linux distribution. When attempting to install a new application with apt install, they receive a \"Permission denied\" error. Which command would allow them to successfully install the application?", "type": "single", "options": ["apt su install application-name", "sudo apt install application-name", "su apt install application-name", "apt sudo install application-name"], "correct": [1], "exp": "sudo apt install runs the install command with elevated privileges.", "id": "c2t14q13"}, {"q": "A technician is using sudo to run administrative commands in Linux. When running a sudo command for the first time in a session, they are prompted for a password. Which password should they enter?", "type": "single", "options": ["The root user's password", "The current user's password", "The sudo account password", "The default system password"], "correct": [1], "exp": "sudo prompts for the current (invoking) user's own password, not root's.", "id": "c2t14q14"}, {"q": "A technician is troubleshooting an Ubuntu workstation that needs the latest security patches. Which command should the technician run to refresh the local list of available packages and security updates?", "type": "single", "options": ["sudo apt upgrade", "sudo dnf update", "sudo dnf upgrade", "sudo apt update"], "correct": [3], "exp": "sudo apt update refreshes the local package list (upgrade actually installs updates).", "id": "c2t14q15"}, {"q": "A user wants to ensure that Firefox on their Fedora client is updated to the latest available version. Which command will accomplish this?", "type": "single", "options": ["sudo apt upgrade firefox", "sudo apt update firefox", "sudo dnf reinstall firefox", "sudo dnf upgrade firefox"], "correct": [3], "exp": "Fedora uses dnf; dnf upgrade firefox updates that specific package.", "id": "c2t14q16"}, {"q": "A technician needs to display the IP address, subnet mask, and broadcast address assigned to each network interface on a Linux server. Which of the commands listed below should they run?", "type": "single", "options": ["ip address show", "ip route show", "ip link show", "ip config show"], "correct": [0], "exp": "ip address show displays IP/subnet/broadcast info per interface.", "id": "c2t14q17"}, {"q": "A Linux system is experiencing a network outage. The technician suspects an issue with the default gateway. Which command should the technician run to verify the current routing table, including the default gateway?", "type": "single", "options": ["route print", "ip route show", "netstat -a", "ip route get"], "correct": [1], "exp": "ip route show displays the routing table, including the default gateway.", "id": "c2t14q18"}, {"q": "A Linux administrator logged in as the root user needs to assign a secondary IP address of 192.168.1.25/24 to the eth0 interface. Which command should be used?", "type": "single", "options": ["ip address set 192.168.1.25/24 dev eth0", "ip address update 192.168.1.25/24 dev eth0", "ip address add 192.168.1.25/24 dev eth0", "ip address assign 192.168.1.25/24 dev eth0"], "correct": [2], "exp": "ip address add assigns a (secondary) IP address to an interface.", "id": "c2t14q19"}, {"q": "Which keyboard shortcut in Linux can be used with the ping command to display its statistics summary?", "type": "single", "options": ["Ctrl + P", "Ctrl + S", "Ctrl + R", "Ctrl + C"], "correct": [3], "exp": "Ctrl+C stops ping and displays its statistics summary.", "id": "c2t14q20"}, {"q": "What is the default behavior of the Linux ping command when no packet count is provided?", "type": "single", "options": ["Sends 4 echo requests and stops", "Runs continuously until interrupted", "Stops after detecting packet loss", "Terminates after a set timeout"], "correct": [1], "exp": "Linux ping runs continuously by default until manually interrupted (unlike Windows' default 4 pings).", "id": "c2t14q21"}, {"q": "A Linux administrator enters curl https://server.local at the terminal. What does this command do by default?", "type": "single", "options": ["Downloads the web page content to a file", "Launches the default web browser and navigates to the URL", "Retrieves and displays the web page content in the terminal", "Opens a secure shell session with the server"], "correct": [2], "exp": "curl by default fetches and prints the page content directly to the terminal.", "id": "c2t14q22"}, {"q": "After running the command dig server.example.com in the Linux terminal, the output in the answer section shows an A record. What does this record type specifically indicate?", "type": "single", "options": ["The server's canonical name", "The server's authoritative name server", "The server's reverse lookup address", "The server's IPv4 address"], "correct": [3], "exp": "An A record maps a hostname to its IPv4 address.", "id": "c2t14q23"}, {"q": "Which of the following answers refer(s) to the typical output of the Linux traceroute command? (Select all that apply)", "type": "multi", "options": ["Sequence of network devices (hops) from source to destination", "Hostname (if resolvable), followed by the IP address, for each hop", "Round-trip time measurements (in milliseconds) for each hop", "Total number of packets sent and received"], "correct": [0, 1, 2], "exp": "traceroute
