<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>CompTIA A+ Study</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="A+ Learn">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#12161B">
<style>
  html, body {
    margin:0; padding:0; background:#12161B;
    -webkit-text-size-adjust:100%;
  }
  body {
    padding-top: env(safe-area-inset-top);
    padding-bottom: env(safe-area-inset-bottom);
    padding-left: env(safe-area-inset-left);
    padding-right: env(safe-area-inset-right);
  }
</style>
</head>
<body>
<style>
  :root{
    --bg:#12161B;
    --surface:#1B2129;
    --surface-raised:#222933;
    --line:#2B333D;
    --text:#E7ECF1;
    --text-dim:#8B99A8;
    --accent:#5EA8ED;
    --good:#5FC99B;
    --warn:#E0A458;
    --bad:#E0715F;
    --mono:'SF Mono','JetBrains Mono','Courier New',monospace;
    --sans:-apple-system,BlinkMacSystemFont,'Inter','Segoe UI',sans-serif;
  }
  *{box-sizing:border-box;}
  #root{
    font-family:var(--sans);
    background:var(--bg);
    color:var(--text);
    min-height:600px;
    padding:28px 18px 40px;
    display:flex;
    justify-content:center;
  }
  .wrap{width:100%;max-width:640px;}

  .topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;}
  .brand{font-family:var(--mono);font-size:12px;letter-spacing:.12em;color:var(--text-dim);text-transform:uppercase;cursor:pointer;}
  .crumbs{font-family:var(--mono);font-size:11px;color:var(--text-dim);margin-bottom:18px;}
  .crumbs span{cursor:pointer;}
  .crumbs span:hover{color:var(--accent);}
  .crumbs .sep{margin:0 6px;color:#3A4451;}
  .stat{font-family:var(--mono);font-size:12px;color:var(--text-dim);}
  .stat b{color:var(--good);font-weight:600;}
  .meter{
    height:6px;border-radius:3px;background:var(--surface-raised);
    overflow:hidden;margin:10px 0 26px;border:1px solid var(--line);
  }
  .meter-fill{height:100%;background:linear-gradient(90deg,var(--accent),var(--good));
    transition:width .5s cubic-bezier(.4,0,.2,1);}

  .card{
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:14px;
    padding:26px 24px 22px;
    min-height:360px;
    display:flex;flex-direction:column;
  }
  .tag{
    display:inline-flex;align-items:center;gap:6px;
    font-family:var(--mono);font-size:11px;color:var(--accent);
    background:rgba(94,168,237,.1);border:1px solid rgba(94,168,237,.25);
    padding:3px 9px;border-radius:20px;width:fit-content;margin-bottom:16px;
    letter-spacing:.04em;
  }
  .tag.review{color:var(--warn);background:rgba(224,164,88,.1);border-color:rgba(224,164,88,.3);}
  .qtext{font-size:17px;line-height:1.5;margin:0 0 20px;font-weight:500;}
  .hint{font-size:12px;color:var(--text-dim);margin:-12px 0 16px;font-family:var(--mono);}

  .opt{
    display:flex;align-items:flex-start;gap:11px;
    padding:12px 14px;margin-bottom:9px;
    border:1px solid var(--line);border-radius:9px;
    background:var(--surface-raised);
    cursor:pointer;font-size:14.5px;line-height:1.4;
    transition:border-color .15s, background .15s;
  }
  .opt:hover{border-color:#3A4451;}
  .opt.picked{border-color:var(--accent);background:rgba(94,168,237,.08);}
  .opt.correct{border-color:var(--good);background:rgba(95,201,155,.1);}
  .opt.incorrect{border-color:var(--bad);background:rgba(224,113,95,.1);}
  .opt.disabled{cursor:default;}
  .box{
    width:16px;height:16px;flex:0 0 16px;margin-top:1px;
    border-radius:4px;border:1.5px solid var(--text-dim);
  }
  .opt.picked .box{background:var(--accent);border-color:var(--accent);}
  .opt.correct .box{background:var(--good);border-color:var(--good);}
  .opt.incorrect .box{background:var(--bad);border-color:var(--bad);}
  .radio .box{border-radius:50%;}

  .spacer{flex:1;}
  .btnrow{display:flex;gap:10px;margin-top:14px;}
  button{
    font-family:var(--sans);font-size:14px;font-weight:600;
    padding:11px 18px;border-radius:9px;border:1px solid var(--line);
    background:var(--surface-raised);color:var(--text);cursor:pointer;
    transition:opacity .15s, transform .1s;
  }
  button:disabled{opacity:.35;cursor:default;}
  button.primary{background:var(--accent);border-color:var(--accent);color:#0B1015;}
  button:active:not(:disabled){transform:scale(.98);}

  .feedback{
    margin-top:16px;padding:14px 15px;border-radius:9px;
    background:var(--surface-raised);border:1px solid var(--line);
    font-size:13.5px;line-height:1.55;
  }
  .feedback .label{font-family:var(--mono);font-size:11px;letter-spacing:.06em;
    text-transform:uppercase;margin-bottom:6px;display:block;}
  .feedback.right .label{color:var(--good);}
  .feedback.wrong .label{color:var(--bad);}
  .feedback .answer{color:var(--text-dim);margin-bottom:6px;}

  .done{text-align:center;padding:50px 10px;}
  .done h2{font-size:20px;margin-bottom:8px;}
  .done p{color:var(--text-dim);font-size:14px;margin-bottom:22px;}

  /* selection screens */
  .menu-title{font-size:20px;font-weight:600;margin-bottom:6px;}
  .menu-sub{font-size:13.5px;color:var(--text-dim);margin-bottom:22px;}
  .menu-grid{display:flex;flex-direction:column;gap:9px;}
  .menu-item{
    display:flex;align-items:center;justify-content:space-between;
    padding:14px 16px;border:1px solid var(--line);border-radius:10px;
    background:var(--surface-raised);cursor:pointer;
    transition:border-color .15s, background .15s;
  }
  .menu-item:hover{border-color:var(--accent);background:rgba(94,168,237,.06);}
  .menu-item .mi-title{font-size:14.5px;font-weight:600;}
  .menu-item .mi-sub{font-size:12px;color:var(--text-dim);font-family:var(--mono);margin-top:2px;}
  .menu-item .mi-arrow{color:var(--text-dim);font-size:16px;}
  .menu-card{
    padding:16px 16px 20px;
  }
  .big-tiles{display:flex;flex-direction:column;gap:12px;}
  .big-tile{
    padding:22px 20px;border:1px solid var(--line);border-radius:12px;
    background:var(--surface-raised);cursor:pointer;text-align:left;
    transition:border-color .15s, background .15s, transform .1s;
  }
  .big-tile:hover{border-color:var(--accent);background:rgba(94,168,237,.06);}
  .big-tile:active{transform:scale(.99);}
  .big-tile .bt-title{font-size:16px;font-weight:700;margin-bottom:4px;}
  .big-tile .bt-sub{font-size:12.5px;color:var(--text-dim);}
  .grid2{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px;}
  .grid2 .menu-item{flex-direction:column;align-items:flex-start;justify-content:center;gap:2px;padding:14px;}

  /* exam mode */
  .examtimer{
    font-family:var(--mono);font-size:13px;font-weight:700;
    padding:4px 10px;border-radius:7px;border:1px solid var(--line);
    background:var(--surface-raised);color:var(--text);
  }
  .examtimer.low{color:var(--bad);border-color:var(--bad);background:rgba(224,113,95,.08);}
  .exam-qcount{font-family:var(--mono);font-size:12px;color:var(--text-dim);margin-bottom:14px;}
  .exam-answered-dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--good);margin-left:6px;}
  .qpalette{display:grid;grid-template-columns:repeat(10,1fr);gap:5px;margin:14px 0 4px;}

  @media (max-width: 480px){
    #root{padding:16px 10px 28px;}
    .card{padding:20px 16px 18px;}
    .qpalette{grid-template-columns:repeat(6,1fr);}
    .score-big{font-size:36px;}
    .qtext{font-size:16px;}
  }
  .qpal-item{
    font-family:var(--mono);font-size:11px;text-align:center;padding:6px 0;
    border-radius:5px;border:1px solid var(--line);background:var(--surface-raised);
    color:var(--text-dim);cursor:pointer;
  }
  .qpal-item.current{border-color:var(--accent);color:var(--accent);}
  .qpal-item.answered{color:var(--good);border-color:rgba(95,201,155,.4);}
  .exam-rules{font-size:13.5px;line-height:1.7;color:var(--text-dim);margin-bottom:20px;}
  .exam-rules li{margin-bottom:6px;}
  .score-big{font-family:var(--mono);font-size:44px;font-weight:700;color:var(--accent);text-align:center;margin:6px 0;}
  .score-sub{text-align:center;color:var(--text-dim);font-size:14px;margin-bottom:22px;}
  .review-item{
    padding:14px 15px;border:1px solid var(--line);border-radius:9px;
    background:var(--surface-raised);margin-bottom:10px;font-size:13.5px;line-height:1.55;
  }
  .review-item .rq{font-weight:600;margin-bottom:8px;}
  .review-item .ra{color:var(--text-dim);margin-bottom:4px;}
  .review-item .rc{color:var(--good);margin-bottom:8px;}
</style>

<div id="root"></div>

<script>
(function(){

var BANK = {"core1": {"label": "Core 1", "practice_tests": [{"id": "test1", "label": "Test 1", "questions": [{"q": "Which of the following actions are considered best practices for monitoring the health of a mobile device battery? (Select 3 answers)", "type": "multi", "options": ["Always fully discharge the battery before recharging", "Track battery health using built-in OS tools or third-party apps", "Disable battery-saving features to get a more accurate reading of capacity loss", "Monitor charging cycles and battery capacity degradation", "Check for swelling, overheating, or failure to hold a charge"], "correct": [1, 3, 4], "exp": "Battery health monitoring relies on OS/app tools, tracking cycles/degradation, and watching for physical warning signs.", "id": "t1q1"}, {"q": "Common battery types used in modern portable devices include: (Select 2 answers)", "type": "multi", "options": ["Nickel-Iron (Ni-Fe)", "Lithium-ion (Li-ion)", "Nickel–Metal Hydride (Ni-MH)", "Lithium-ion Polymer (LiPo)", "Nickel-Cadmium (Ni-Cd)"], "correct": [1, 3], "exp": "Modern portable devices use Li-ion and LiPo batteries; Ni-Fe, Ni-MH, and Ni-Cd are older/other-use chemistries.", "id": "t1q2"}, {"q": "Which of the steps listed below should be followed when replacing a mobile device's battery? (Select 3 answers)", "type": "multi", "options": ["Follow manufacturer guidelines for safe removal and installation", "Ensure proper disposal of the old battery according to local regulations for electronic waste", "Use any available universal battery as long as it fits physically within the device", "Charge the new battery to 100% immediately after installation and then let it fully discharge to \"condition\" it", "Ensure the replacement battery is compatible with the device model"], "correct": [0, 1, 4], "exp": "Follow manufacturer guidelines, dispose of the old battery properly, and use a compatible replacement.", "id": "t1q3"}, {"q": "Which laptop feature compensates for limited keyboard space by enabling additional functions on the same keys?", "type": "single", "options": ["Touchpad", "Numeric keypad", "Fn key", "Digitizer"], "correct": [2], "exp": "The Fn key unlocks secondary functions printed on keys, saving space on compact laptop keyboards.", "id": "t1q4"}, {"q": "Which action does not conform with recommended practices for diagnosing and repairing a mobile device's keyboard?", "type": "single", "options": ["Implement proper ESD safety measures by using an anti-static wristband and working on an ESD mat to protect sensitive components from static discharge", "Perform comprehensive diagnostics using specialized key testing software to accurately identify any malfunctioning keys", "Use appropriate tools (such as precision screwdrivers and plastic pry tools) and OEM-approved replacement parts to avoid causing further damage during the repair", "Conduct detailed visual inspections to detect physical damage, debris accumulation, or water exposure on the keyboard", "Follow manufacturer guidelines by consulting the service manual or official repair guide to ensure safe disassembly and reassembly of the device", "Leave the device powered on during repair to provide immediate feedback on the exact malfunctioning component, such as a faulty key"], "correct": [5], "exp": "Devices should be powered off during repair; leaving it on risks shock, shorts, and further damage.", "id": "t1q5"}, {"q": "Which of the following devices generally offers the easiest and most user-accessible RAM replacement procedure?", "type": "single", "options": ["Smartphone", "Tablet", "Gaming console", "Laptop"], "correct": [3], "exp": "Many laptops have accessible RAM slots/panels, unlike smartphones, tablets, and consoles which are usually soldered/sealed.", "id": "t1q6"}, {"q": "Which of the tools listed below can be used to monitor the health and performance of a laptop's storage drive?", "type": "single", "options": ["S.M.A.R.T.", "Storage Sense", "chkdsk", "Disk defragmenter"], "correct": [0], "exp": "S.M.A.R.T. monitors drive health indicators and predicts impending failures.", "id": "t1q7"}, {"q": "Which drive malfunction symptoms are not present in SSDs? (Select 2 answers)", "type": "multi", "options": ["Grinding noises", "Slow read/write speeds", "Corrupted or disappearing files", "Clicking sounds", "Blue screen errors"], "correct": [0, 3], "exp": "SSDs have no moving parts, so grinding/clicking noises (mechanical HDD symptoms) don't apply to them.", "id": "t1q8"}, {"q": "What should be the preliminary step of an HDD/SSD replacement procedure?", "type": "single", "options": ["Power down the device and remove the battery", "Format the new drive before installing it", "Perform a full system reset before replacing the drive", "Backup the data on the existing drive"], "correct": [3], "exp": "Always back up existing data before replacing a drive, in case anything is needed from the old one.", "id": "t1q9"}, {"q": "What is the easiest method to monitor the wireless card's performance in a mobile device?", "type": "single", "options": ["Check the Wi-Fi signal strength icon in the device's notification area", "Observe any LED indicators for Wi-Fi status on the device", "Perform an online speed test to measure the connection's performance", "Manually adjust the antenna position to improve signal strength"], "correct": [0], "exp": "The signal strength icon gives a quick, built-in way to gauge Wi-Fi performance without extra tools.", "id": "t1q10"}, {"q": "Which actions should be performed first when replacing a faulty wireless card/module in a laptop? (Select 2 answers)", "type": "multi", "options": ["Power down the laptop and remove the battery", "Label all screws and connectors during disassembly to aid reassembly", "Remove all external peripherals from the device", "Perform a full power cycle of the laptop by turning it off and then on again", "Locate the wireless card slot on the motherboard"], "correct": [0, 2], "exp": "Power down and remove the battery, then disconnect external peripherals, before opening the case.", "id": "t1q11"}, {"q": "Which of the following statements regarding a mobile device Bluetooth module is true?", "type": "single", "options": ["Bluetooth modules are typically located near the device's display and require screen removal for replacement", "Once a Bluetooth module is replaced, it will automatically adjust to the device's current settings without the need for manual pairing", "Bluetooth is usually integrated into the Wi-Fi card or directly into the motherboard", "When replacing a faulty Bluetooth module, as long as the physical connectors match, the new Bluetooth module can come from a different device model"], "correct": [2], "exp": "Bluetooth is commonly combined with Wi-Fi on a single combo card or built into the motherboard.", "id": "t1q12"}, {"q": "What is a recommended practice for assessing the effectiveness and reliability of biometric components on a mobile device?", "type": "single", "options": ["Using software tools to track scan success rates, response times, and error logs", "Ensuring proper calibration through built-in settings or specialized diagnostic software", "Tracking access attempts and failures for security auditing purposes", "Updating drivers and firmware to prevent malfunctions caused by outdated software", "All of the above"], "correct": [4], "exp": "Assessing biometric reliability involves tracking performance, calibration, auditing access, and keeping firmware updated — all of these.", "id": "t1q13"}, {"q": "After replacing a faulty biometric scanner on a mobile device, which essential step must be performed to ensure that the scanner produces accurate readings?", "type": "single", "options": ["Recalibration", "Factory reset", "Driver update", "Firmware update"], "correct": [0], "exp": "A newly installed biometric scanner needs recalibration to read accurately.", "id": "t1q14"}, {"q": "A technician is troubleshooting a mobile device's NFC functionality. Which action(s) would help verify the NFC scanner's operational status? (Select all that apply)", "type": "multi", "options": ["Check for dirt or moisture on the sensor's surface", "Test the NFC functionality with a known compatible NFC tag or device", "Update the device's screen brightness, as the NFC sensor relies on ambient light levels", "Connect to a Wi-Fi network to test device connectivity", "Ensure NFC is enabled in the device settings"], "correct": [0, 1, 4], "exp": "Check for physical obstructions, test with a known-good NFC tag, and confirm NFC is enabled — screen brightness and Wi-Fi are unrelated.", "id": "t1q15"}, {"q": "Which of the answers listed below correctly describes the typical location of a laptop's Wi-Fi antenna?", "type": "single", "options": ["On the WLAN module", "Near the top, inside display case", "Inside laptop's case", "Typically attached via external expansion port"], "correct": [1], "exp": "Laptop Wi-Fi antennas are usually routed up into the display bezel/lid for better reception.", "id": "t1q16"}, {"q": "Which of the following actions would not help in troubleshooting a malfunctioning mobile device camera?", "type": "single", "options": ["Inspect and clean the camera lens", "Verify camera settings and permissions", "Test camera functionality in multiple apps", "Adjust the host device's screen brightness", "Check for firmware and software updates"], "correct": [3], "exp": "Screen brightness has no effect on camera function, unlike lens cleanliness, settings, app testing, or updates.", "id": "t1q17"}, {"q": "Which of the items listed below is not recommended for clearing potential blockages from a mobile device microphone?", "type": "single", "options": ["Lint-free cloth", "Soft brush", "Can of compressed air", "Microfiber cloth"], "correct": [2], "exp": "Compressed air can force debris deeper into a microphone port or damage the diaphragm; soft cloths/brushes are safer.", "id": "t1q18"}, {"q": "Examples of USB ports that can be found on mobile devices include: (Select all that apply)", "type": "multi", "options": ["USB-C", "MicroUSB", "USB Type-A", "MiniUSB", "USB Type-B"], "correct": [0, 1, 3], "exp": "Mobile devices commonly use USB-C, MicroUSB, and MiniUSB; Type-A and Type-B are typically host-side connectors.", "id": "t1q19"}, {"q": "A type of USB connection method commonly used in modern mobile devices due to its reversible design, fast data transfer, and power capabilities is known as:", "type": "single", "options": ["USB Type-B", "MiniUSB", "USB-C", "MicroUSB", "USB Type-A"], "correct": [2], "exp": "USB-C's reversible connector, high speed, and power delivery make it standard on modern mobile devices.", "id": "t1q20"}, {"q": "Which proprietary connector was developed by Apple for its mobile devices?", "type": "single", "options": ["Thunderbolt", "USB-C", "FireWire", "Lightning"], "correct": [3], "exp": "Lightning is Apple's proprietary connector used on iPhones and other iOS devices.", "id": "t1q21"}, {"q": "NFC enables: (Select all that apply)", "type": "multi", "options": ["Contactless payment transactions", "Long-range wireless communication", "Device pairing and data exchange", "Access control and authentication", "Wireless charging of mobile devices"], "correct": [0, 2, 3], "exp": "NFC supports contactless payments, device pairing/data exchange, and access control — it's short-range, not for long-range comms or charging.", "id": "t1q22"}, {"q": "Which of the following is a popular, short-range wireless standard for connecting various personal devices in a WPAN?", "type": "single", "options": ["Zigbee", "NFC", "Bluetooth", "Wi-Fi Direct"], "correct": [2], "exp": "Bluetooth is the standard short-range wireless technology used to build personal area networks (WPANs).", "id": "t1q23"}, {"q": "Which of the terms listed below best describes a mobile device's ability to share its Internet connection with other devices?", "type": "single", "options": ["Pairing", "Clustering", "Tethering", "Bonding"], "correct": [2], "exp": "Tethering is sharing a mobile device's Internet connection with other devices.", "id": "t1q24"}, {"q": "A mobile hotspot is a device that creates a WLAN by acting as a portable WAP for other devices.", "type": "bool", "options": ["True", "False"], "correct": [0], "exp": "A mobile hotspot functions as a portable wireless access point, letting other devices join its WLAN.", "id": "t1q25"}]}, {"id": "test2", "label": "Test 2", "questions": [{"q": "Stylus — match to its primary function.", "type": "single", "options": ["Precise input and drawing", "Audio input and output", "Audio playback", "Video input for conferencing"], "correct": [0], "exp": "A stylus is used for precise input and drawing on a touchscreen.", "id": "t2q1"}, {"q": "Headset — match to its primary function.", "type": "single", "options": ["Precise input and drawing", "Audio input and output", "Audio playback", "Video input for conferencing"], "correct": [1], "exp": "A headset provides audio input (microphone) and output (speaker) in one accessory.", "id": "t2q2"}, {"q": "Speakers — match to its primary function.", "type": "single", "options": ["Precise input and drawing", "Audio input and output", "Audio playback", "Video input for conferencing"], "correct": [2], "exp": "Speakers are used strictly for audio playback.", "id": "t2q3"}, {"q": "Webcam — match to its primary function.", "type": "single", "options": ["Precise input and drawing", "Audio input and output", "Audio playback", "Video input for conferencing"], "correct": [3], "exp": "A webcam provides video input, typically for conferencing.", "id": "t2q4"}, {"q": "Stylus — match to its applicable connectivity option(s).", "type": "single", "options": ["Passive (direct-touch) or Active (Bluetooth-enabled)", "Wired (3.5mm port/jack, USB-C, Lightning) or Wireless (Bluetooth)", "Wired (auxiliary 3.5mm port/jack, USB) or Wireless (Bluetooth, Wi-Fi)", "Wired (USB) or Wireless (Wi-Fi)"], "correct": [0], "exp": "A stylus can be passive (direct touch, no power) or active (Bluetooth-enabled with extra features).", "id": "t2q5"}, {"q": "Headset — match to its applicable connectivity option(s).", "type": "single", "options": ["Passive (direct-touch) or Active (Bluetooth-enabled)", "Wired (3.5mm port/jack, USB-C, Lightning) or Wireless (Bluetooth)", "Wired (auxiliary 3.5mm port/jack, USB) or Wireless (Bluetooth, Wi-Fi)", "Wired (USB) or Wireless (Wi-Fi)"], "correct": [1], "exp": "Headsets connect wired (3.5mm/USB-C/Lightning) or wirelessly via Bluetooth.", "id": "t2q6"}, {"q": "Speakers — match to its applicable connectivity option(s).", "type": "single", "options": ["Passive (direct-touch) or Active (Bluetooth-enabled)", "Wired (3.5mm port/jack, USB-C, Lightning) or Wireless (Bluetooth)", "Wired (auxiliary 3.5mm port/jack, USB) or Wireless (Bluetooth, Wi-Fi)", "Wired (USB) or Wireless (Wi-Fi)"], "correct": [2], "exp": "Speakers connect via wired aux/USB or wirelessly through Bluetooth or Wi-Fi.", "id": "t2q7"}, {"q": "Webcam — match to its applicable connectivity option(s).", "type": "single", "options": ["Passive (direct-touch) or Active (Bluetooth-enabled)", "Wired (3.5mm port/jack, USB-C, Lightning) or Wireless (Bluetooth)", "Wired (auxiliary 3.5mm port/jack, USB) or Wireless (Bluetooth, Wi-Fi)", "Wired (USB) or Wireless (Wi-Fi)"], "correct": [3], "exp": "Webcams typically connect via wired USB or wirelessly over Wi-Fi.", "id": "t2q8"}, {"q": "Docking stations: (Select 3 answers)", "type": "multi", "options": ["Feature a compact and lightweight design, making them more convenient for mobile use", "Are often designed for specific brands or models, ensuring compatibility with unique laptop features", "Provide additional hardware capabilities, such as enhanced graphics or storage options, beyond basic connectivity", "Tend to be larger and less portable, making them more suitable for fixed workspaces", "Primarily expand connectivity options, such as additional USB ports and Ethernet, but do not support advanced hardware features like external graphics or storage", "Are generally designed for broad compatibility, working with a wide range of laptop models"], "correct": [1, 2, 3], "exp": "Docking stations are typically brand/model-specific, add advanced hardware capabilities, and are larger/less portable than port replicators.", "id": "t2q9"}, {"q": "Which of the following statements describe port replicators? (Select 3 answers)", "type": "multi", "options": ["Are generally designed for broad compatibility, working with a wide range of laptop models", "Provide additional hardware capabilities, such as enhanced graphics or storage options, beyond basic connectivity", "Feature a compact and lightweight design, making them more convenient for mobile use", "Are often designed for specific brands or models, ensuring compatibility with unique laptop features", "Primarily expand connectivity options, such as additional USB ports and Ethernet, but do not support advanced hardware features like external graphics or storage", "Tend to be larger and less portable, making them more suitable for fixed workspaces"], "correct": [0, 2, 4], "exp": "Port replicators are broadly compatible, compact/portable, and simply expand connectivity without added hardware capabilities.", "id": "t2q10"}, {"q": "What is the name of a laptop component that provides the function of a pointing device?", "type": "single", "options": ["Stylus", "Mouse", "Trackpad", "Cursor"], "correct": [2], "exp": "A trackpad is the built-in laptop pointing device.", "id": "t2q11"}, {"q": "Which of the input devices listed below requires a stylus?", "type": "single", "options": ["Touchpad", "Tracking point", "Drawing pad", "Trackpad"], "correct": [2], "exp": "A drawing pad (digitizer/graphics tablet) is designed to be used with a stylus.", "id": "t2q12"}, {"q": "A track point is a small pointing stick embedded in a keyboard used for precise cursor control.", "type": "bool", "options": ["True", "False"], "correct": [0], "exp": "A track point is that small joystick-like nub found between keys on some laptop keyboards, used for cursor control.", "id": "t2q13"}, {"q": "What is the latest standard for mobile telecommunications?", "type": "single", "options": ["Wi-Fi 7", "Bluetooth 6.0", "5G", "WiMAX 3", "None of the above"], "correct": [2], "exp": "5G is the current generation standard for mobile telecommunications (per this exam's material).", "id": "t2q14"}, {"q": "What is the primary purpose of enabling a mobile hotspot feature on a smartphone?", "type": "single", "options": ["To transfer files between the phone and other devices", "To boost Wi-Fi signal strength in the area", "To share the phone's cellular data connection with other devices", "To allow the phone to access a wired network"], "correct": [2], "exp": "A mobile hotspot shares the phone's cellular data connection with other nearby devices.", "id": "t2q15"}, {"q": "What can be a probable reason why a mobile hotspot might not be working on a device?", "type": "single", "options": ["The device has a locked SIM card", "Wi-Fi is disabled on the connecting device", "The device is not compatible with the connecting device", "Cellular data is disabled on the device"], "correct": [3], "exp": "A hotspot relies on cellular data; if that's disabled, the hotspot has no connection to share.", "id": "t2q16"}, {"q": "A user is attempting to connect to a workplace Wi-Fi network, but their mobile device shows no available networks. What is the most appropriate first step in troubleshooting this issue?", "type": "single", "options": ["Restart the wireless access point", "Switch to a different frequency band", "Verify that Wi-Fi is enabled on the mobile device", "Change the wireless channel"], "correct": [2], "exp": "Always confirm the basics first — check that Wi-Fi is actually enabled on the device before deeper troubleshooting.", "id": "t2q17"}, {"q": "Which of the statements listed below does not refer to the characteristic features of a traditional SIM?", "type": "single", "options": ["Physical card", "Installed by inserting the card into a device's SIM slot", "Can be moved between devices", "Requires physical SIM swap for changing carriers", "None of the above"], "correct": [4], "exp": "All the listed statements do describe traditional SIM cards, so \"none of the above\" is correct.", "id": "t2q18"}, {"q": "An eSIM is a modern alternative to the traditional SIM card. Unlike traditional SIMs, an eSIM is an embedded chip built into the device (not a physical card).", "type": "bool", "options": ["True", "False"], "correct": [0], "exp": "eSIMs are built-in embedded chips rather than removable physical cards.", "id": "t2q19"}, {"q": "In the Bluetooth authentication process, a PIN serves as a shared secret or passkey used during the pairing process to authenticate the identity of the two devices attempting to connect.", "type": "bool", "options": ["True", "False"], "correct": [0], "exp": "A Bluetooth PIN acts as a shared secret used to authenticate devices during pairing.", "id": "t2q20"}, {"q": "What is the correct sequence of steps to establish Bluetooth connectivity?", "type": "single", "options": ["Enable Bluetooth -> Test connectivity -> Find a device for pairing -> Enter identification code -> Enable pairing", "Find a device for pairing -> Enable Bluetooth -> Test connectivity -> Enable pairing -> Enter identification code", "Enable Bluetooth -> Enable pairing -> Find a device for pairing -> Enter identification code -> Test connectivity", "Test connectivity -> Enable Bluetooth -> Find a device for pairing -> Enable pairing -> Enter identification code"], "correct": [2], "exp": "Bluetooth setup order: enable Bluetooth, enable pairing, find the device, enter the code, then test the connection.", "id": "t2q21"}, {"q": "A mobile device's built-in functionality enabling the usage of locator applications is called:", "type": "single", "options": ["GPS", "LTE", "GSM", "MDM"], "correct": [0], "exp": "GPS is the built-in functionality that powers locator/location apps.", "id": "t2q22"}, {"q": "Which of the following is a common issue that can prevent cellular location services from working properly? (Select the best answer)", "type": "single", "options": ["Location services turned off", "Weak cellular signal", "Incorrect permissions for location-based applications", "Any of the above"], "correct": [3], "exp": "Disabled location services, weak signal, or wrong app permissions can all break cellular location services.", "id": "t2q23"}, {"q": "Which of the answers listed below accurately describes the advantage of using cellular location services over GPS in certain scenarios?", "type": "single", "options": ["Cellular location services can provide more precise location data than GPS", "Cellular location services work indoors and in locations where GPS signals are blocked", "Cellular location services use satellite signals for location tracking", "Cellular location services do not use network data"], "correct": [1], "exp": "Cellular (tower-based) location works indoors and in GPS-blocked areas, unlike satellite-dependent GPS.", "id": "t2q24"}, {"q": "Which software solution is used for centralized mobile device administration?", "type": "single", "options": ["XDR", "MDM", "DLP", "UTM"], "correct": [1], "exp": "MDM (Mobile Device Management) centrally administers mobile devices.", "id": "t2q25"}, {"q": "Which mobile device deployment model allows organizations to provide and own the devices while permitting personal use?", "type": "single", "options": ["BYOD", "COPE", "ZTA", "CYOD"], "correct": [1], "exp": "COPE (Corporate-Owned, Personally Enabled) means the org owns the device but allows personal use.", "id": "t2q26"}, {"q": "Which mobile device deployment model allows employees to use their personal mobile devices to access a company's restricted data and applications?", "type": "single", "options": ["COPE", "CYOD", "BYOD", "COBO"], "correct": [2], "exp": "BYOD (Bring Your Own Device) lets employees use personal devices for company access.", "id": "t2q27"}, {"q": "Which of the following allows organizations to manage and enforce mobile device policies and security procedures?", "type": "single", "options": ["MAC", "ZTA", "MDM", "EDR"], "correct": [2], "exp": "MDM lets organizations manage and enforce mobile device policies and security.", "id": "t2q28"}, {"q": "A user reports that a critical business application is no longer appearing on their company-issued smartphone, while other colleagues still have the application. What is the most likely cause to investigate first?", "type": "single", "options": ["The user accidentally deleted the application icon from their home screen", "The application may have been remotely uninstalled, or the user's access to it may have been revoked", "The app may be restricted due to the user's geolocation, causing it to be hidden", "The device is in airplane mode, preventing app synchronization"], "correct": [1], "exp": "Since the app is missing for only one user, the most likely cause is a remote uninstall or revoked access via MDM.", "id": "t2q29"}, {"q": "Mobile device synchronization involves ensuring that data across various applications, such as calendars, contacts, business emails, and cloud storage, is kept consistent between the device and remote servers. It is essential to manage synchronization carefully, especially with mobile data usage, to avoid exceeding data caps. By configuring devices to sync only over Wi-Fi or adjusting sync frequency, users can reduce mobile data consumption while ensuring critical business applications remain up-to-date.", "type": "bool", "options": ["True", "False"], "correct": [0], "exp": "Sync settings can be tuned (e.g., Wi-Fi only) to balance data freshness against mobile data usage.", "id": "t2q30"}, {"q": "What is the function of FTP?", "type": "single", "options": ["Email service", "Directory access", "Serving of web pages", "File exchange"], "correct": [3], "exp": "FTP (File Transfer Protocol) is used for file exchange.", "id": "t2q31"}]}, {"id": "test3", "label": "Test 3", "questions": [{"q": "A type of cryptographic network protocol for secure data communication, remote command-line login, remote command execution, and other secure network services between networked computers is called:", "type": "single", "options": ["RDP", "SSH", "Telnet", "SCP"], "correct": [1], "exp": "SSH encrypts remote login sessions, command execution, and file transfers between hosts.", "id": "t3q1"}, {"q": "Telnet: (Select 3 answers)", "type": "multi", "options": ["Encrypts network connection", "Provides username & password authentication", "Transmits data in an unencrypted form", "Does not provide authentication", "Enables remote login and command execution"], "correct": [1, 2, 4], "exp": "Telnet supports login credentials but sends everything unencrypted, and enables remote login/command execution.", "id": "t3q2"}, {"q": "Which of the answers listed below refers to a secure replacement for Telnet?", "type": "single", "options": ["SSH", "Rlogin", "rsh", "SNMP"], "correct": [0], "exp": "SSH was designed to replace Telnet by adding encryption.", "id": "t3q3"}, {"q": "The SMTP protocol is used for: (Select 2 answers)", "type": "multi", "options": ["Sending email messages between mail servers", "Name resolution services", "Serving of web pages", "Retrieving email messages from mail servers", "Sending email messages from a client device"], "correct": [0, 4], "exp": "SMTP handles outgoing mail: client-to-server submission and server-to-server relay.", "id": "t3q4"}, {"q": "Which of the following refers to a system that translates domain names to IP addresses and stores other domain-related records?", "type": "single", "options": ["DHCP", "ARP", "WINS", "DNS"], "correct": [3], "exp": "DNS resolves domain names to IP addresses and stores related records.", "id": "t3q5"}, {"q": "Which network protocol provides an automated alternative to manual IP address allocation?", "type": "single", "options": ["APIPA", "NAT", "DHCP", "Zeroconf"], "correct": [2], "exp": "DHCP automatically assigns IP addresses, removing the need for manual configuration.", "id": "t3q6"}, {"q": "Which of the protocols listed below is used to retrieve the contents of an Internet page from a web server?", "type": "single", "options": ["IMAP", "HTTP", "FTP", "SMTP"], "correct": [1], "exp": "HTTP retrieves web page content from a server.", "id": "t3q7"}, {"q": "POP3 is used for:", "type": "single", "options": ["Name resolution", "Sending email messages", "File exchange", "Email retrieval"], "correct": [3], "exp": "POP3 downloads email from a server to a client.", "id": "t3q8"}, {"q": "Which of the answers listed below refer to IMAP? (Select 2 answers)", "type": "multi", "options": ["Offers improved functionality in comparison to POP3", "Serves the same function as POP3", "Enables sending email messages from client devices", "Offers less functions than POP3", "Enables email exchange between mail servers"], "correct": [0, 1], "exp": "IMAP retrieves mail like POP3 but adds features like multi-device sync.", "id": "t3q9"}, {"q": "Which of the following answers refers to an API that enables communication between hosts on a LAN?", "type": "single", "options": ["DNS", "TCP/IP", "NetBIOS", "DHCP"], "correct": [2], "exp": "NetBIOS provides an API for communication between hosts on a LAN.", "id": "t3q10"}, {"q": "The function of the NetBT protocol is to allow NetBIOS services to be used over TCP/IP networks.", "type": "bool", "options": ["True", "False"], "correct": [0], "exp": "NetBT lets legacy NetBIOS applications run over modern TCP/IP networks.", "id": "t3q11"}, {"q": "LDAP is an example of:", "type": "single", "options": ["Authentication protocol", "Directory access protocol", "Address resolution protocol", "File exchange protocol"], "correct": [1], "exp": "LDAP is used to access and manage directory information.", "id": "t3q12"}, {"q": "Which protocol secures web traffic with SSL/TLS encryption to ensure the confidentiality, integrity, and authentication of the data exchanged between a user's browser and a web server?", "type": "single", "options": ["SFTP", "IPsec", "SSH", "HTTPS"], "correct": [3], "exp": "HTTPS is HTTP layered with SSL/TLS encryption.", "id": "t3q13"}, {"q": "SMB is a protocol used for:", "type": "single", "options": ["File and printer sharing between devices on a network", "Collecting diagnostic and monitoring data from networked devices", "Routing network traffic between different subnets", "Managing and allocating IP addresses within a network"], "correct": [0], "exp": "SMB lets devices share files, printers, and other resources.", "id": "t3q14"}, {"q": "What are the characteristic features of SMB/CIFS? (Select 2 answers)", "type": "multi", "options": ["Designed for Linux-based environments", "Optimized for secure file sharing over the Internet", "Primarily used in Microsoft Windows environments", "Intended for voice and multimedia communication over IP networks", "Used to provide shared access to files, directories, and devices"], "correct": [2, 4], "exp": "SMB/CIFS is native to Windows and provides shared access to files/folders/devices.", "id": "t3q15"}, {"q": "Which Microsoft-proprietary protocol enables remote access and administration of another networked host through a graphical interface?", "type": "single", "options": ["VDI", "RDP", "SSH", "VNC"], "correct": [1], "exp": "RDP is Microsoft's proprietary protocol for remote graphical desktop access.", "id": "t3q16"}, {"q": "UDP is a connection-oriented protocol using a three-way handshake, which is a set of initial steps required for establishing a network connection. UDP supports error checking, flow control (managing the amount of data that is being sent), sequencing (rearranging packets that arrived out of order), and retransmission of lost packets. Example applications of UDP include the transmission of text and image data.", "type": "bool", "options": ["True", "False"], "correct": [1], "exp": "This describes TCP, not UDP. UDP is connectionless with no handshake or reliability features.", "id": "t3q17"}, {"q": "TCP is an example of a connectionless protocol. Since TCP does not use a three-way handshake to establish a network connection, it is considered an unreliable or best-effort protocol. Example applications of TCP include the transmission of video and audio streaming data.", "type": "bool", "options": ["True", "False"], "correct": [1], "exp": "This describes UDP, not TCP. TCP is connection-oriented and reliable.", "id": "t3q18"}, {"q": "Which port enables the FTP data connection for transferring file data?", "type": "single", "options": ["UDP port 20", "TCP port 20", "UDP port 21", "TCP port 21"], "correct": [1], "exp": "FTP data transfer uses TCP port 20.", "id": "t3q19"}, {"q": "The FTP control connection to administer a session is established through:", "type": "single", "options": ["TCP port 20", "UDP port 20", "TCP port 21", "UDP port 21"], "correct": [2], "exp": "FTP control/session commands use TCP port 21.", "id": "t3q20"}, {"q": "Which port does the SSH protocol use?", "type": "single", "options": ["TCP port 21", "UDP port 22", "TCP port 20", "TCP port 22"], "correct": [3], "exp": "SSH uses TCP port 22 by default.", "id": "t3q21"}, {"q": "Which TCP port is used by the Telnet protocol?", "type": "single", "options": ["Port 20", "Port 21", "Port 22", "Port 23"], "correct": [3], "exp": "Telnet uses TCP port 23 by default.", "id": "t3q22"}, {"q": "TCP port 25 is used by:", "type": "single", "options": ["SNMP", "Telnet", "FTP", "SMTP"], "correct": [3], "exp": "TCP port 25 is the standard port for SMTP.", "id": "t3q23"}, {"q": "Which TCP/UDP port is assigned to DNS?", "type": "single", "options": ["Port 53", "Port 67", "Port 110", "Port 389"], "correct": [0], "exp": "DNS uses port 53 for both TCP and UDP.", "id": "t3q24"}, {"q": "A DHCP server operates on UDP port:", "type": "single", "options": ["Port 66", "Port 67", "Port 68", "Port 69"], "correct": [1], "exp": "DHCP servers listen on UDP port 67; clients use port 68.", "id": "t3q25"}]}, {"id": "test4", "label": "Test 4", "questions": [{"q": "Which UDP port is used by a DHCP client to receive responses from a DHCP server?", "type": "single", "options": ["Port 66", "Port 67", "Port 68", "Port 69"], "correct": [2], "exp": "DHCP clients receive responses on UDP port 68.", "id": "t4q1"}, {"q": "Which protocol operates on TCP port 80?", "type": "single", "options": ["HTTP", "IMAP", "HTTPS", "LDAP"], "correct": [0], "exp": "HTTP uses TCP port 80.", "id": "t4q2"}, {"q": "What is the default port for POP3 communication?", "type": "single", "options": ["TCP port 110", "UDP port 123", "TCP port 143", "UDP port 161"], "correct": [0], "exp": "POP3 uses TCP port 110 by default.", "id": "t4q3"}, {"q": "Which of the port numbers listed below are assigned to NetBIOS services? (Select 3 answers)", "type": "multi", "options": ["Port 135", "Port 136", "Port 137", "Port 138", "Port 139"], "correct": [2, 3, 4], "exp": "NetBIOS uses ports 137, 138, and 139.", "id": "t4q4"}, {"q": "Which service operates on TCP port 389?", "type": "single", "options": ["RDP", "LDAP", "SMB", "LDAPS"], "correct": [1], "exp": "LDAP uses TCP port 389 (LDAPS uses 636).", "id": "t4q5"}, {"q": "What is the default TCP port used for HTTPS communication?", "type": "single", "options": ["Port 80", "Port 443", "Port 53", "Port 143"], "correct": [1], "exp": "HTTPS uses TCP port 443.", "id": "t4q6"}, {"q": "Which of the following services runs on TCP port 445?", "type": "single", "options": ["HTTPS", "SMB", "IMAP", "LDAPS"], "correct": [1], "exp": "SMB (direct over TCP) uses port 445.", "id": "t4q7"}, {"q": "Which TCP port is used for RDP?", "type": "single", "options": ["Port 514", "Port 3389", "Port 22", "Port 5900"], "correct": [1], "exp": "RDP uses TCP port 3389.", "id": "t4q8"}, {"q": "Which of the answers listed below describe the characteristics of the 2.4 GHz frequency range, when compared to higher-frequency bands like 5 GHz and 6 GHz? (Select 3 answers)", "type": "multi", "options": ["The longest range (better penetration through obstacles)", "A wider number of available channels with less overlap", "Higher susceptibility to interference due to device congestion", "The lowest number of non-overlapping channels", "Shorter range (weaker penetration through obstacles)", "Less interference due to fewer devices using the band"], "correct": [0, 2, 3], "exp": "2.4 GHz has the longest range, more interference from crowding, and the fewest non-overlapping channels.", "id": "t4q9"}, {"q": "Compared to the 2.4 GHz and 6 GHz frequency bands, the 5 GHz frequency range offers:", "type": "single", "options": ["The longest range among available Wi-Fi bands", "The best penetration through walls and obstacles", "The highest number of non-overlapping channels", "The fastest data speeds of all frequency bands", "None of the above"], "correct": [4], "exp": "5 GHz is a middle ground — it isn't the longest range, best penetration, most channels, or fastest of all bands, so \"none of the above\".", "id": "t4q10"}, {"q": "Which of the following answers does not refer to the 6 GHz frequency band?", "type": "single", "options": ["The longest range among available Wi-Fi bands", "The highest number of non-overlapping channels", "The lowest susceptibility to interference", "The fastest data speeds of all frequency bands"], "correct": [0], "exp": "6 GHz has the shortest range of the three bands, despite having the most channels, least interference, and fastest speeds.", "id": "t4q11"}, {"q": "Wireless networking channels are governed by country-specific regulations. These rules define which frequency bands can be used for wireless communication, whether they require licensing (such as cellular or satellite communication) or are unlicensed (such as Wi-Fi). They also specify the number and width of available channels within those bands and set limits on transmission power.", "type": "bool", "options": ["True", "False"], "correct": [0], "exp": "Country-specific regulatory bodies govern wireless bands, licensing, channels, and power limits.", "id": "t4q12"}, {"q": "In wireless networks, channel overlapping occurs when multiple channels share the same frequency band, causing interference and performance degradation for devices operating on channels that are too close to each other. A common example of channel overlapping is found in the 2.4 GHz band (2.400 to 2.4835 GHz) used in 802.11 networks, where the frequency range is divided into 11 channels (the number of channels may vary by region), each occupying a 22 MHz portion of the spectrum. Setting up a wireless network to operate on non-overlapping channels (typically 1, 6, and 11) allows multiple networks to coexist in the same area without causing interference.", "type": "bool", "options": ["True", "False"], "correct": [0], "exp": "2.4 GHz channel overlap is real, and channels 1, 6, 11 are the standard non-overlapping set.", "id": "t4q13"}, {"q": "Which of the statements listed below best describes the effect of increasing channel width in a wireless network?", "type": "single", "options": ["Extends the range of the wireless signal", "Increases data throughput but may cause more interference", "Minimizes latency for all connected devices", "Reduces interference from neighboring channels"], "correct": [1], "exp": "Wider channels boost throughput but increase the chance of overlap/interference with neighboring channels.", "id": "t4q14"}, {"q": "Which of the following answers refer(s) to Bluetooth? (Select all that apply)", "type": "multi", "options": ["Operates in the 2.4 GHz frequency band", "Requires line-of-sight for optimal performance", "Short-range wireless communication", "Optimized for creating PANs", "Used for peripheral, wearable and IoT devices"], "correct": [0, 2, 3, 4], "exp": "Bluetooth uses 2.4 GHz, is short-range, built for PANs, and common for peripherals/wearables/IoT — it doesn't need line-of-sight.", "id": "t4q15"}, {"q": "What are the main characteristics of 802.11 networks? (Select 3 answers)", "type": "multi", "options": ["Optimized for long-distance wireless communication", "Built to support infrastructure and ad-hoc network modes", "Engineered for high-speed wireless data transmission", "Standardized by IEEE for WLANs as an alternative to wired LANs", "Designed to operate in licensed frequency bands", "Structured around base stations for network coverage"], "correct": [1, 2, 3], "exp": "802.11 supports infrastructure/ad-hoc modes, is high-speed, and is IEEE's WLAN standard — it's short-range and uses unlicensed bands.", "id": "t4q16"}, {"q": "Which of the answers listed below refer(s) to NFC? (Select all that apply)", "type": "multi", "options": ["Dependent on clear line-of-sight for data transfer", "Standardized for operation in the 2.4 GHz frequency band", "Built for very short-range wireless communication (typically up to 4 cm)", "Used for secure transactions, such as contactless payments", "Designed to operate in licensed frequency bands", "Commonly found in smart cards, passports, and access control systems"], "correct": [2, 3, 5], "exp": "NFC is very short range, used for payments, and found in smart cards/passports/access control.", "id": "t4q17"}, {"q": "Which of the following statements does not describe RFID?", "type": "single", "options": ["Utilized in automatic identification and object tracking", "Used for communication between tags and readers via radio waves", "Implemented in supply chain, logistics, and access control systems", "Found in some contactless payment systems and smart cards", "Designed for short-range personal area networking"], "correct": [4], "exp": "RFID is for identification/tracking, not personal area networking (that's Bluetooth/NFC's domain).", "id": "t4q18"}, {"q": "When a web browser needs to access a website identified by its domain name, which type of server provides the IP address required for the connection?", "type": "single", "options": ["DNS server", "Proxy server", "DHCP server", "Web server"], "correct": [0], "exp": "A DNS server resolves the domain name to an IP address.", "id": "t4q19"}, {"q": "What is the primary function of a DHCP server?", "type": "single", "options": ["Mapping IP addresses to MAC addresses", "Assigning dynamic IP addresses to clients", "Monitoring IP address conflicts", "Logging IP address assignment history"], "correct": [1], "exp": "A DHCP server's core job is assigning dynamic IP addresses to clients.", "id": "t4q20"}, {"q": "A company wants its employees to access, store, and manage shared documents centrally over a network. Which type of server should they implement?", "type": "single", "options": ["Mail server", "File server", "Print server", "Database server"], "correct": [1], "exp": "A file server provides centralized storage and access to shared documents.", "id": "t4q21"}, {"q": "Which type of server does not primarily store files but facilitates document output?", "type": "single", "options": ["Web server", "Application server", "Print server", "Database server"], "correct": [2], "exp": "A print server manages and outputs print jobs rather than storing files.", "id": "t4q22"}, {"q": "A company requires a server that supports the SMTP and IMAP protocols for managing electronic messages. Which type of server should they implement?", "type": "single", "options": ["Chat server", "IM server", "Mail server", "VoIP server"], "correct": [2], "exp": "A mail server handles SMTP (sending) and IMAP (retrieval) for email.", "id": "t4q23"}, {"q": "Which type of server is primarily responsible for collecting diagnostic and monitoring data from networked devices?", "type": "single", "options": ["Jump server", "C2 server", "Syslog server", "ICS server"], "correct": [2], "exp": "A syslog server collects diagnostic and monitoring logs from network devices.", "id": "t4q24"}, {"q": "A company wants to expand beyond static content (such as HTML documents) and support interactive web applications. Which server type is best suited for this purpose?", "type": "single", "options": ["Remote access server", "Web server", "Media streaming server", "Game server"], "correct": [1], "exp": "A (modern/application-capable) web server supports interactive web apps beyond static HTML.", "id": "t4q25"}]}, {"id": "test5", "label": "Test 5", "questions": [{"q": "Which part of the AAA security architecture deals with the verification of the identity of a person or process?", "type": "single", "options": ["Auditing", "Authentication", "Authorization", "Accounting"], "correct": [1], "exp": "Authentication verifies identity.", "id": "t5q1"}, {"q": "In the AAA security architecture, the process of granting or denying access to resources is known as:", "type": "single", "options": ["Authorization", "Accounting", "Auditing", "Authentication"], "correct": [0], "exp": "Authorization determines what a verified identity is allowed to access.", "id": "t5q2"}, {"q": "In the AAA security architecture, the process of tracking accessed services and logging resource consumption is called:", "type": "single", "options": ["Authentication", "Auditing", "Accounting", "Authorization"], "correct": [2], "exp": "Accounting tracks resource usage and service access.", "id": "t5q3"}, {"q": "Which AAA solution uses UDP as its transport protocol, combines authentication and authorization, and is commonly deployed for network access control such as VPNs and Wi-Fi authentication?", "type": "single", "options": ["RADIUS", "LDAP", "TACACS+", "Kerberos"], "correct": [0], "exp": "RADIUS uses UDP, combines authN/authZ, and is common for VPN/Wi-Fi access control.", "id": "t5q4"}, {"q": "Which of the AAA solutions listed below relies on TCP, separates authentication, authorization, and accounting, and is commonly used for device administration in enterprise networks?", "type": "single", "options": ["OAuth", "TACACS+", "SAML", "RADIUS"], "correct": [1], "exp": "TACACS+ uses TCP and separates all three AAA functions, used for device admin.", "id": "t5q5"}, {"q": "What is the primary function of SQL Server?", "type": "single", "options": ["Application server", "Network protocol", "C2 server", "Database management system"], "correct": [3], "exp": "SQL Server is a database management system.", "id": "t5q6"}, {"q": "Which server type provides time synchronization services across devices within a network?", "type": "single", "options": ["NTP", "VTP", "NNTP", "RTP"], "correct": [0], "exp": "NTP (Network Time Protocol) synchronizes clocks across devices.", "id": "t5q7"}, {"q": "Which appliance monitors inbound electronic communication and applies filtering rules to block unwanted or malicious messages from entering the network?", "type": "single", "options": ["Content filter", "Mail server", "Antivirus software", "Spam gateway"], "correct": [3], "exp": "A spam gateway filters incoming mail for unwanted/malicious content.", "id": "t5q8"}, {"q": "Which of the following answers refers to a network security solution providing a single point of protection against various types of threats?", "type": "single", "options": ["IDP", "AV", "UTM", "NGFW"], "correct": [2], "exp": "UTM (Unified Threat Management) bundles multiple security functions into one appliance.", "id": "t5q9"}, {"q": "A network hardware or software solution designed for managing the optimal distribution of workloads across multiple computing resources is referred to as:", "type": "single", "options": ["Content filter", "Proxy server", "Load balancer", "Domain controller"], "correct": [2], "exp": "A load balancer distributes workloads across multiple resources.", "id": "t5q10"}, {"q": "Which of the answers listed below refers to a computer system or an application that acts as an intermediary between a client computer and the Internet by relaying and filtering requests?", "type": "single", "options": ["Network gateway", "Content filter", "Firewall", "Proxy server"], "correct": [3], "exp": "A proxy server relays/filters requests between clients and the Internet.", "id": "t5q11"}, {"q": "What is the primary purpose of a SCADA system?", "type": "single", "options": ["Managing and automating network infrastructure", "Implementing biometric access control for secure facilities", "Monitoring and controlling industrial processes remotely", "Controlling humidity, temperature, and air quality"], "correct": [2], "exp": "SCADA remotely monitors and controls industrial processes.", "id": "t5q12"}, {"q": "Which of the following answers refers to a network of interconnected devices equipped with sensors (such as wearable tech or home automation devices) that can interact with each other to perform various tasks and functions?", "type": "single", "options": ["ICS", "PAN", "IoT", "SoC"], "correct": [2], "exp": "IoT describes networked sensor-equipped devices interacting together.", "id": "t5q13"}, {"q": "Which DNS database record type returns a 32-bit IP address?", "type": "single", "options": ["MX", "AAAA", "CNAME", "A", "PTR"], "correct": [3], "exp": "An A record maps a hostname to a 32-bit (IPv4) address.", "id": "t5q14"}, {"q": "The DNS AAAA record maps a hostname to:", "type": "single", "options": ["IPv4 address", "Mail server", "IPv6 address", "Canonical name"], "correct": [2], "exp": "AAAA records map hostnames to IPv6 addresses.", "id": "t5q15"}, {"q": "Which DNS database record type allows multiple domain names to resolve to the same IP address?", "type": "single", "options": ["MX", "CNAME", "AAAA", "PTR"], "correct": [1], "exp": "CNAME records alias multiple domain names to the same target.", "id": "t5q16"}, {"q": "Which of the DNS database records listed below maps a domain name to a list of mail servers for that domain?", "type": "single", "options": ["SPF", "NS", "MX", "PTR"], "correct": [2], "exp": "MX records list the mail servers for a domain.", "id": "t5q17"}, {"q": "What is the function of a DNS TXT record? (Select 2 answers)", "type": "multi", "options": ["Resolves an IP address to a hostname for reverse lookups", "Maps a domain name to a list of mail servers for that domain", "Used to store text-based data associated with a domain", "Not used to direct any traffic", "Allows multiple domain names to resolve to the same IP address"], "correct": [2, 3], "exp": "TXT records store arbitrary text data (like SPF) and don't direct traffic themselves.", "id": "t5q18"}, {"q": "Which of the following is used to sign an outbound email message with a digital signature?", "type": "single", "options": ["SPF", "DKIM", "DMARC", "PEM"], "correct": [1], "exp": "DKIM digitally signs outbound email messages.", "id": "t5q19"}, {"q": "Which of the answers listed below refers to an email authentication mechanism that allows domain owners to specify, via DNS records, which IP addresses are authorized to send emails on behalf of their domain?", "type": "single", "options": ["DMARC", "PEM", "DKIM", "SPF"], "correct": [3], "exp": "SPF specifies authorized sending IPs for a domain via DNS.", "id": "t5q20"}, {"q": "Which of the following acronyms refers to a policy framework that allows domain owners to specify how email receivers should handle messages that fail authentication checks?", "type": "single", "options": ["DKIM", "SPF", "PEM", "DMARC"], "correct": [3], "exp": "DMARC tells receivers how to handle messages that fail SPF/DKIM checks.", "id": "t5q21"}, {"q": "The duration for which a DHCP client is authorized to use a dynamically assigned IP address from a DHCP server is known as:", "type": "single", "options": ["Allocation", "Lease", "Interval", "Reservation"], "correct": [1], "exp": "A DHCP lease is the time period a client may use an assigned IP.", "id": "t5q22"}, {"q": "What is the standard DHCP term for a permanent IP address assignment made by the server to a specific device?", "type": "single", "options": ["Binding", "Fixed lease", "Pinning", "Reservation"], "correct": [3], "exp": "A DHCP reservation permanently assigns an IP to a specific device.", "id": "t5q23"}, {"q": "What is the correct DHCP term for the defined pool of IP addresses that a DHCP server can assign to clients?", "type": "single", "options": ["Range", "Block", "Scope", "Group"], "correct": [2], "exp": "A DHCP scope is the defined pool of assignable addresses.", "id": "t5q24"}, {"q": "A DHCP server's IP exclusion configuration option allows network administrators to remove a single IP address or a range of IP addresses from the pool of addresses automatically assigned to requesting DHCP clients. IP exclusion prevents DHCP clients from receiving IP addresses that are statically assigned to critical network devices, such as servers or wireless printers.", "type": "bool", "options": ["True", "False"], "correct": [0], "exp": "IP exclusions keep statically-assigned addresses out of the DHCP pool so they're never handed out.", "id": "t5q25"}]}, {"id": "test6", "label": "Test 6", "questions": [{"q": "Which of the terms listed below refers to a logical grouping of computers that allows hosts to communicate as if they are on the same broadcast domain, regardless of their physical location?", "type": "single", "options": ["VPN", "Intranet", "Screened subnet", "VLAN"], "correct": [3], "exp": "A VLAN groups hosts into the same logical broadcast domain regardless of physical location.", "id": "t6q1"}, {"q": "A system that uses a public network (such as the Internet) to create secure, encrypted connections between remote locations is called:", "type": "single", "options": ["WWAN", "VPN", "PAN", "VLAN"], "correct": [1], "exp": "A VPN creates secure encrypted connections over a public network.", "id": "t6q2"}, {"q": "Which of the following answers describe the characteristics of a router? (Select 3 answers)", "type": "multi", "options": ["Operates at Layer 2 of the OSI model", "Connects multiple networks together", "Uses MAC addresses to forward data frames to the correct port", "Operates at Layer 3 of the OSI model", "Uses IP addresses to send data packets to their destination", "Connects multiple devices within a single network"], "correct": [1, 3, 4], "exp": "Routers connect multiple networks, operate at Layer 3, and forward by IP address.", "id": "t6q3"}, {"q": "Which of the answers listed below refer to a network switch? (Select 3 answers)", "type": "multi", "options": ["Connects multiple devices within a single network", "Operates at Layer 3 of the OSI model", "Uses MAC addresses to forward data frames to the correct port", "Connects multiple networks together", "Operates at Layer 2 of the OSI model", "Uses IP addresses to send data packets to their destination"], "correct": [0, 2, 4], "exp": "Switches connect devices within one network, forward by MAC address, and operate at Layer 2.", "id": "t6q4"}, {"q": "What are the characteristic features of a managed switch? (Select 3 answers)", "type": "multi", "options": ["Cannot be managed or adjusted remotely", "Operates on a simple plug-and-play basis without the need (or ability) for manual configuration", "Can be monitored and controlled remotely", "Includes integrated tools for real-time monitoring, diagnostics, and security features", "Simply forwards data without offering monitoring capabilities or advanced security measures", "Offers extensive configuration options"], "correct": [2, 3, 5], "exp": "Managed switches offer remote control, monitoring/diagnostics tools, and extensive configuration options.", "id": "t6q5"}, {"q": "An unmanaged switch: (Select 3 answers)", "type": "multi", "options": ["Offers extensive configuration options", "Includes built-in tools for real-time monitoring, diagnostics, and security features", "Allows remote access for monitoring and management", "Operates as a simple plug-and-play device, requiring no manual setup", "Forwards network traffic without providing monitoring features or advanced security functions", "Cannot be managed or reconfigured remotely"], "correct": [3, 4, 5], "exp": "Unmanaged switches are plug-and-play, offer no monitoring/security features, and can't be remotely managed.", "id": "t6q6"}, {"q": "A networking hardware device connecting wireless devices to a wired network is referred to as a(n):", "type": "single", "options": ["Wi-Fi extender", "Network bridge", "Access point", "Media converter"], "correct": [2], "exp": "An access point connects wireless devices to a wired network.", "id": "t6q7"}, {"q": "A simple device consisting of multiple connector blocks and ports used for copper cable management is known as:", "type": "single", "options": ["Cable splitter", "Patch panel", "Ethernet hub", "Cable distribution unit"], "correct": [1], "exp": "A patch panel organizes copper cable connections with connector blocks/ports.", "id": "t6q8"}, {"q": "Which of the following answers refers to a hardware security device or software application that monitors and controls both incoming and outgoing network traffic based on predetermined security rules?", "type": "single", "options": ["Proxy server", "Malware scanner", "Firewall", "Content filter"], "correct": [2], "exp": "A firewall monitors and controls traffic per configured security rules.", "id": "t6q9"}, {"q": "The IEEE 802.3 standards for Power over Ethernet (PoE) provide varying levels of power to support different types of devices based on their energy needs. IEEE 802.3af (PoE) delivers up to 15.4W per port, making it ideal for low-power devices such as basic IP phones, wireless access points, and standard security cameras. IEEE 802.3at (PoE+) increases power delivery to 25.5W per port, supporting devices like PTZ cameras and high-performance access points that require additional wattage for advanced features. The IEEE 802.3bt (PoE++) standard further expands power capabilities, where Type 3 supports up to 60W per port and Type 4 extends this to 100W per port, enabling support for higher-power devices such as LED lighting, building automation systems, and certain computing devices, all while transmitting both power and data over a single Ethernet cable.", "type": "bool", "options": ["True", "False"], "correct": [0], "exp": "These are the correct PoE/PoE+/PoE++ wattage tiers per the IEEE 802.3 standards.", "id": "t6q10"}, {"q": "Which device enables a network switch without built-in PoE support to deliver power over Ethernet?", "type": "single", "options": ["PoE converter", "PoE adapter", "PoE injector", "PoE extender"], "correct": [2], "exp": "A PoE injector adds power delivery to a switch that lacks native PoE support.", "id": "t6q11"}, {"q": "Which of the answers listed below refer to the characteristic features of cable modems? (Select 3 answers)", "type": "multi", "options": ["Cabling that carries TV signals", "Telephone lines", "Coaxial cabling", "Shared bandwidth", "Twisted-pair copper cabling", "Dedicated bandwidth"], "correct": [0, 2, 3], "exp": "Cable modems use TV-carrying coaxial cabling and share bandwidth among users.", "id": "t6q12"}, {"q": "Which term describes the use of cable modems for Internet access over a standard cable television infrastructure?", "type": "single", "options": ["Dial-up", "Cable broadband", "Frame relay", "Metro-Ethernet"], "correct": [1], "exp": "Cable broadband describes Internet delivered over cable TV infrastructure.", "id": "t6q13"}, {"q": "Which of the following characteristics apply to DSL modems? (Select 3 answers)", "type": "multi", "options": ["Dedicated bandwidth", "Cabling that carries TV signals", "Shared bandwidth", "Twisted-pair copper cabling", "Telephone lines", "Coaxial cabling"], "correct": [0, 3, 4], "exp": "DSL provides dedicated bandwidth over twisted-pair copper telephone lines.", "id": "t6q14"}, {"q": "Which type of fiber-optic equipment is typically located at a demarcation point?", "type": "single", "options": ["MDI", "IDF", "ONT", "MDF"], "correct": [2], "exp": "An ONT (Optical Network Terminal) sits at the fiber demarcation point.", "id": "t6q15"}, {"q": "Which of the answers listed below refers to a computer's hardware component designed for enabling network access?", "type": "single", "options": ["CPU", "PSU", "NIC", "GPU"], "correct": [2], "exp": "A NIC (Network Interface Card) enables network access.", "id": "t6q16"}, {"q": "Which of the following refers to a unique, 48-bit identifier used as a physical network address?", "type": "single", "options": ["SSID", "IP", "GUID", "MAC"], "correct": [3], "exp": "A MAC address is a unique 48-bit physical hardware address.", "id": "t6q17"}, {"q": "An IPv4 address consists of:", "type": "single", "options": ["32 bits", "48 bits", "64 bits", "128 bits"], "correct": [0], "exp": "IPv4 addresses are 32 bits long.", "id": "t6q18"}, {"q": "IPv4 addresses are expressed with the use of:", "type": "single", "options": ["Octagonal numbers", "Binary numbers", "Hexadecimal numbers", "Decimal numbers"], "correct": [3], "exp": "IPv4 addresses are written in dotted decimal notation.", "id": "t6q19"}, {"q": "Which of the answers listed below refer to private IP addresses? (Select 3 answers)", "type": "multi", "options": ["Assigned within a home or business network for internal communication", "Used for devices that need to communicate directly with the Internet and are routable through the global internet infrastructure", "Cannot be routed over the public Internet and are only valid within the confines of a local network", "Unique across the entire Internet, ensuring that devices can be identified and located globally", "Can be reused across different networks (i.e., they do not need to be unique globally)", "Assigned by ISPs to devices for communication over the Internet"], "correct": [0, 2, 4], "exp": "Private IPs are for internal use, non-routable on the public Internet, and reusable across networks.", "id": "t6q20"}, {"q": "Which of the following answers refer to the characteristic features of the 10.0.0.0 - 10.255.255.255 (10.0.0.0/8) IPv4 address space? (Select 2 answers)", "type": "multi", "options": ["Class A range", "Public IP address range", "Class B range", "Non-routable (private) IP address range", "Class C range"], "correct": [0, 3], "exp": "10.0.0.0/8 is a Class A private (non-routable) address range.", "id": "t6q21"}, {"q": "Which of the answers listed below refer to the 172.16.0.0 - 172.31.255.255 (172.16.0.0/12) IPv4 address space? (Select 2 answers)", "type": "multi", "options": ["Class A range", "Public IP address range", "Class B range", "Non-routable (private) IP address range", "Class C range"], "correct": [2, 3], "exp": "172.16.0.0/12 is a Class B private (non-routable) address range.", "id": "t6q22"}, {"q": "What are the characteristic features of the 192.168.0.0 - 192.168.255.255 (192.168.0.0/16) IPv4 address space? (Select 2 answers)", "type": "multi", "options": ["Class A range", "Public IP address range", "Class B range", "Non-routable (private) IP address range", "Class C range"], "correct": [3, 4], "exp": "192.168.0.0/16 is a Class C private (non-routable) address range.", "id": "t6q23"}, {"q": "Which of the following statements describe public IP addresses? (Select 3 answers)", "type": "multi", "options": ["Assigned by ISPs to devices for communication over the Internet", "Can be reused across different networks (i.e., they do not need to be unique globally)", "Unique across the entire Internet, ensuring that devices can be identified and located globally", "Cannot be routed over the public Internet and are only valid within the confines of a local network", "Used for devices that need to communicate directly with the Internet and are routable through the global internet infrastructure", "Assigned within a home or business network for internal communication"], "correct": [0, 2, 4], "exp": "Public IPs are ISP-assigned, globally unique, and directly routable on the Internet.", "id": "t6q24"}, {"q": "An IPv6 address consists of:", "type": "single", "options": ["32 bits", "48 bits", "64 bits", "128 bits"], "correct": [3], "exp": "IPv6 addresses are 128 bits long.", "id": "t6q25"}]}, {"id": "test7", "label": "Test 7", "questions": [{"q": "IPv6 addresses are expressed with the use of:", "type": "single", "options": ["Decimal numbers", "Hexadecimal numbers", "Binary numbers", "Octagonal numbers"], "correct": [1], "exp": "IPv6 addresses are written in hexadecimal.", "id": "t7q1"}, {"q": "IPv6 was primarily developed to mitigate the issue of:", "type": "single", "options": ["Address exhaustion", "Outdated protocols", "Routing limitations", "Network congestion"], "correct": [0], "exp": "IPv6 was created mainly to solve IPv4 address exhaustion.", "id": "t7q2"}, {"q": "APIPA allows a Windows host to self-configure an IPv4 address and subnet mask when a DHCP server is unavailable. APIPA uses the address block range from 169.254.0.0 to 169.254.255.255. APIPA-assigned addresses are valid only for communication within the network segment to which the host is connected. A host with an APIPA-assigned address cannot connect to the Internet.", "type": "bool", "options": ["True", "False"], "correct": [0], "exp": "APIPA self-assigns a 169.254.x.x address for local-only communication when DHCP is unreachable.", "id": "t7q3"}, {"q": "Which of the statements listed below describe static IP addresses? (Select 3 answers)", "type": "multi", "options": ["Provide a permanent address, essential for services requiring consistent reachability", "Assigned automatically by a DHCP server, minimizing user configuration", "Commonly used for consumer devices, prioritizing ease of use, security, and cost efficiency", "Must be manually assigned or reserved through administrative tools, requiring more management", "Ideal for servers, network devices needing a stable address, and remote access applications", "Change periodically, making them unsuitable for hosting services that require a fixed address"], "correct": [0, 3, 4], "exp": "Static IPs are permanent, manually configured, and ideal for servers/devices needing a stable address.", "id": "t7q4"}, {"q": "Which of the following answers refer to dynamic IP addresses? (Select 3 answers)", "type": "multi", "options": ["Must be manually assigned or reserved through administrative tools, requiring more management", "Provide a permanent address, essential for services requiring consistent reachability", "Ideal for servers, network devices needing a stable address, and remote access applications", "Change periodically, making them unsuitable for hosting services that require a fixed address", "Assigned automatically by a DHCP server, minimizing user configuration", "Commonly used for consumer devices, prioritizing ease of use, security, and cost efficiency"], "correct": [3, 4, 5], "exp": "Dynamic IPs change periodically, are auto-assigned by DHCP, and suit typical consumer devices.", "id": "t7q5"}, {"q": "A subnet mask is a 32-bit number that divides an IP address into network and host portions, determining the size of a network.", "type": "bool", "options": ["True", "False"], "correct": [0], "exp": "A subnet mask separates the network and host portions of an IPv4 address.", "id": "t7q6"}, {"q": "In a network using subnets, the term \"Default gateway\" refers to a network device (router) that enables exchange of data between hosts residing in different subnets.", "type": "bool", "options": ["True", "False"], "correct": [0], "exp": "The default gateway (router) routes traffic between different subnets.", "id": "t7q7"}, {"q": "What are the characteristic features of satellite Internet connections? (Select 3 answers)", "type": "multi", "options": ["High signal latency", "Lack of signal interference", "Cheaper in comparison to terrestrial links", "Interference (weather dependent)", "Low signal latency", "Relatively high cost in comparison to terrestrial links"], "correct": [0, 3, 5], "exp": "Satellite Internet has high latency, weather-related interference, and higher cost than terrestrial options.", "id": "t7q8"}, {"q": "What is a key advantage of fiber-optic Internet over other broadband types like DSL or cable?", "type": "single", "options": ["Offers higher bandwidth and faster speeds with minimal signal loss", "Easier to install in every type of building", "Significantly cheaper to deploy over short distances", "Immune to hacking and cyberattacks due to its physical properties", "Can be easily upgraded to higher speeds without any infrastructure changes"], "correct": [0], "exp": "Fiber's key advantage is high bandwidth/speed with minimal signal loss over distance.", "id": "t7q9"}, {"q": "Which of the statements listed below best describes cable Internet connectivity?", "type": "single", "options": ["Shared bandwidth among users", "Coaxial cabling infrastructure", "High-speed data transmission", "Not reliant on telephone lines", "Often bundled with cable TV", "All of the above"], "correct": [5], "exp": "Cable Internet is shared, uses coax, is high-speed, not phone-line based, and often bundled with TV — all true.", "id": "t7q10"}, {"q": "Which physical medium does DSL primarily use for Internet connectivity?", "type": "single", "options": ["Fiber-optic cabling", "Coaxial cabling", "Satellite dish", "Copper telephone line"], "correct": [3], "exp": "DSL runs over copper telephone lines.", "id": "t7q11"}, {"q": "How does DSL performance typically compare with other Internet connection types like cable and fiber?", "type": "single", "options": ["DSL typically provides symmetrical upload and download speeds", "DSL generally offers moderate speeds that decline over distance", "DSL offers higher download speeds than cable and fiber", "DSL is immune to network congestion and environmental factors"], "correct": [1], "exp": "DSL speeds are moderate and degrade the farther you are from the provider's equipment.", "id": "t7q12"}, {"q": "Which of the following is an advantage of using a cellular Internet connection over wired broadband o
