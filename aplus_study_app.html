ptions like fiber-optic or cable?", "type": "single", "options": ["Provides unlimited bandwidth for streaming and downloading", "Offers higher speeds than fiber-optic connections", "Requires no installation of physical cables or infrastructure", "Offers guaranteed, symmetrical upload and download speeds"], "correct": [2], "exp": "Cellular Internet needs no physical cabling/infrastructure at the user's location.", "id": "t7q13"}, {"q": "Which of the answers listed below best describes how a WISP network delivers Internet connectivity?", "type": "single", "options": ["Through the installation of underground fiber-optic cables", "By transmitting radio frequency signals wirelessly from a central tower to subscriber antennas", "Through coaxial cabling infrastructure", "By using satellite dishes to communicate with orbiting satellites"], "correct": [1], "exp": "A WISP delivers Internet via RF signals from a tower to subscriber antennas.", "id": "t7q14"}, {"q": "The common limitations of WISP-based connectivity include:", "type": "single", "options": ["Clear line-of-sight dependency", "Susceptibility to RF interference and environmental factors", "Limited bandwidth capacity relative to wired broadband", "Signal degradation over longer distances", "All of the above"], "correct": [4], "exp": "WISP connectivity faces line-of-sight needs, interference, bandwidth limits, and distance degradation — all of these.", "id": "t7q15"}, {"q": "A type of network connecting computers within a small geographical area such as a building or group of buildings is referred to as:", "type": "single", "options": ["PAN", "LAN", "MAN", "WAN"], "correct": [1], "exp": "A LAN covers a small geographic area like a building or campus.", "id": "t7q16"}, {"q": "A computer network connecting multiple smaller networks over very large geographical areas is known as:", "type": "single", "options": ["MAN", "LAN", "WMN", "WAN"], "correct": [3], "exp": "A WAN connects networks across large geographic areas.", "id": "t7q17"}, {"q": "The Internet is an example of a large public WAN.", "type": "bool", "options": ["True", "False"], "correct": [0], "exp": "The Internet is indeed a large public WAN.", "id": "t7q18"}, {"q": "A type of limited-range computer network used for data transmission among various types of personal devices is called:", "type": "single", "options": ["BAN", "PAN", "SAN", "CAN"], "correct": [1], "exp": "A PAN (Personal Area Network) connects personal devices over a limited range.", "id": "t7q19"}, {"q": "A computer network connecting multiple LANs over an area of a city is referred to as:", "type": "single", "options": ["WAN", "SAN", "MAN", "CAN"], "correct": [2], "exp": "A MAN spans a city, connecting multiple LANs.", "id": "t7q20"}, {"q": "Which of the following acronyms refers to a dedicated local network consisting of devices that provide centralized data access?", "type": "single", "options": ["SDN", "NAS", "iSCSI", "SAN"], "correct": [3], "exp": "A SAN (Storage Area Network) is a dedicated network for centralized data access.", "id": "t7q21"}, {"q": "Which term correctly describes a local network consisting of multiple computers and peripheral devices that communicate with each other using high-frequency radio waves across the area of a building or campus?", "type": "single", "options": ["WPAN", "WMAN", "WLAN", "WWAN"], "correct": [2], "exp": "A WLAN uses radio waves to network devices across a building/campus.", "id": "t7q22"}, {"q": "During the process of network cable termination, a crimper tool is used for attaching connectors onto cables by compressing the connector's metal contacts onto the exposed wires.", "type": "bool", "options": ["True", "False"], "correct": [0], "exp": "A crimper attaches connectors by compressing metal contacts onto exposed wires.", "id": "t7q23"}, {"q": "Which tool would be the most appropriate for removing electrical insulation cover from electric wires?", "type": "single", "options": ["Needle-nose pliers", "Crimper", "Snips", "Cable stripper"], "correct": [3], "exp": "A cable stripper removes insulation from wires.", "id": "t7q24"}, {"q": "A Wi-Fi analyzer is not designed for:", "type": "single", "options": ["Measuring the strength of the Wi-Fi signal", "Detecting interference from other devices or networks", "Capturing and inspecting network traffic data", "Analyzing wireless channel usage"], "correct": [2], "exp": "A Wi-Fi analyzer checks signal/channel/interference, not packet capture — that's a protocol analyzer's job.", "id": "t7q25"}]}, {"id": "test8", "label": "Test 8", "questions": [{"q": "Which hardware tool is specifically designed to trace and identify individual wires within a cable bundle?", "type": "single", "options": ["Cable certifier", "Line tester", "Toner & probe kit", "Wire mapper"], "correct": [2], "exp": "A toner & probe kit traces individual wires within a bundle.", "id": "t8q1"}, {"q": "Which of the tools listed below is used for attaching network cables to a patch panel?", "type": "single", "options": ["Cable crimper", "Punchdown tool", "Cable certifier", "Needle-nose pliers"], "correct": [1], "exp": "A punchdown tool attaches cable wires to a patch panel or keystone jack.", "id": "t8q2"}, {"q": "Which of the following answers refers to a hardware tool used to verify the integrity and connectivity of network cables?", "type": "single", "options": ["Cable tester", "Toner & probe kit", "Signal tracer", "Bandwidth tester"], "correct": [0], "exp": "A cable tester verifies cable integrity and connectivity.", "id": "t8q3"}, {"q": "Which hardware tool is used to test the functionality of a NIC?", "type": "single", "options": ["Signal tracer", "Continuity tester", "Multimeter", "Loopback plug"], "correct": [3], "exp": "A loopback plug tests NIC functionality.", "id": "t8q4"}, {"q": "Which device enables network traffic monitoring without interrupting the data flow?", "type": "single", "options": ["Transceiver", "Repeater", "Ethernet adapter", "Network tap"], "correct": [3], "exp": "A network tap monitors traffic passively without interrupting the flow.", "id": "t8q5"}, {"q": "Which of the answers listed below refers to a display technology most commonly used in modern computing devices?", "type": "single", "options": ["LCD", "OLED", "Plasma", "CRT"], "correct": [0], "exp": "LCD is the most common display technology in modern computing devices.", "id": "t8q6"}, {"q": "What are the characteristic features of IPS display technology? (Select 3 answers)", "type": "multi", "options": ["High color quality", "Fast response times", "Wide viewing angles", "Low color quality", "Slow response times", "Low viewing angles"], "correct": [0, 2, 4], "exp": "IPS panels offer high color quality and wide viewing angles, but slower response times.", "id": "t8q7"}, {"q": "Which of the following answers describe the TN display technology? (Select 3 answers)", "type": "multi", "options": ["Low viewing angles", "Fast response times", "Low color quality", "Slow response times", "High color quality", "Wide viewing angles"], "correct": [0, 1, 2], "exp": "TN panels are fast but have low color quality and narrow viewing angles.", "id": "t8q8"}, {"q": "The VA display technology can be characterized by: (Select 3 answers)", "type": "multi", "options": ["High contrast ratios", "Low color quality", "Good viewing angles", "Low contrast ratios", "Good color quality", "Low viewing angles"], "correct": [0, 2, 4], "exp": "VA panels offer high contrast ratios, good viewing angles, and good color quality.", "id": "t8q9"}, {"q": "What are the key features of an OLED display? (Select 3 answers)", "type": "multi", "options": ["Requires backlight to illuminate the screen", "Can reach greater brightness levels, especially in well-lit environments", "Enables lightweight, bendable, and ultra-slim screens", "Works without backlight", "Typically offers longer lifespan and is less vulnerable to burn-in", "Provides exceptional contrast ratio and black levels"], "correct": [2, 3, 5], "exp": "OLED is backlight-free, enables slim/flexible screens, and provides excellent contrast/black levels.", "id": "t8q10"}, {"q": "Which of the statements listed below refer to Mini-LED displays? (Select 3 answers)", "type": "multi", "options": ["Use a backlight system with smaller, more densely packed LEDs", "Offer excellent contrast due to refined backlight control", "Achieve high peak brightness suitable for bright environments", "Do not require a backlight to illuminate the screen", "Provide true black levels by turning off individual pixels", "Enable greater control of color accuracy due to self-emissive pixels"], "correct": [0, 1, 2], "exp": "Mini-LED uses a dense LED backlight for refined dimming control, better contrast, and high peak brightness — but still needs a backlight (unlike OLED).", "id": "t8q11"}, {"q": "IPS, TN, VA, and OLED are all implementations of LCD display technology.", "type": "bool", "options": ["True", "False"], "correct": [1], "exp": "IPS, TN, and VA are LCD panel types, but OLED is a distinct, non-LCD technology.", "id": "t8q12"}, {"q": "Which of the following devices is capable of performing both input and output functions?", "type": "single", "options": ["Game controller", "Barcode reader", "Touch screen", "Graphics tablet"], "correct": [2], "exp": "A touch screen both displays output and accepts touch input.", "id": "t8q13"}, {"q": "Which of the answers listed below refer to the function of digitizer? (Select 3 answers)", "type": "multi", "options": ["A mobile device component responsible for producing output", "A component of a mobile device's screen that allows control of the device with a stylus or fingertip", "A mobile device component responsible for taking input", "A component of a mobile device that handles the rendering of graphics on the display", "A mobile device component that translates analog data into a format suitable for computer processing"], "correct": [1, 2, 4], "exp": "A digitizer enables stylus/touch control, takes input, and converts analog touch data into digital signals.", "id": "t8q14"}, {"q": "Which of the following answers describe key functions of an inverter? (Select 3 answers)", "type": "multi", "options": ["Converts DC power into AC power", "Essential for operating DC-powered devices from AC sources", "Used for supplying voltage to backlights in older types of LCD panels", "Converts AC power into DC power", "Essential for operating AC-powered devices from DC sources", "Used for supplying voltage to backlights in OLED displays"], "correct": [0, 2, 4], "exp": "An inverter converts DC to AC, supplies older LCD backlights, and lets AC devices run from DC sources.", "id": "t8q15"}, {"q": "Pixel density — match to its description.", "type": "single", "options": ["The number of individual pixels packed into a given area of the screen", "The number of times the screen updates the image per second", "The total number of pixels displayed on the screen", "The range of colors a display can reproduce"], "correct": [0], "exp": "Pixel density is the number of pixels packed into a given screen area.", "id": "t8q16"}, {"q": "Refresh rate — match to its description.", "type": "single", "options": ["The number of individual pixels packed into a given area of the screen", "The number of times the screen updates the image per second", "The total number of pixels displayed on the screen", "The range of colors a display can reproduce"], "correct": [1], "exp": "Refresh rate is how many times per second the screen updates its image.", "id": "t8q17"}, {"q": "Screen resolution — match to its description.", "type": "single", "options": ["The number of individual pixels packed into a given area of the screen", "The number of times the screen updates the image per second", "The total number of pixels displayed on the screen", "The range of colors a display can reproduce"], "correct": [2], "exp": "Screen resolution is the total number of pixels displayed on the screen.", "id": "t8q18"}, {"q": "Color gamut — match to its description.", "type": "single", "options": ["The number of individual pixels packed into a given area of the screen", "The number of times the screen updates the image per second", "The total number of pixels displayed on the screen", "The range of colors a display can reproduce"], "correct": [3], "exp": "Color gamut is the range of colors a display can reproduce.", "id": "t8q19"}, {"q": "Which of the answers listed below refer(s) to T568A and T568B standards? (Select all that apply)", "type": "multi", "options": ["Specify the shielding requirements for twisted-pair cabling", "Define the pinout configuration for RJ45 connectors used in Ethernet cabling", "Specify the pin assignments for the eight wires contained in twisted-pair cables", "Control the twist rate of each pair in a twisted-pair cable", "Set the standards for plenum-rated cable coatings"], "correct": [1, 2], "exp": "T568A/B define RJ45 pinout and pin assignments for the eight twisted-pair wires.", "id": "t8q20"}, {"q": "Which of the following answers refer(s) to coaxial cabling? (Select all that apply)", "type": "multi", "options": ["Commonly used for cable television signals", "Features a single copper conductor surrounded by insulation and shielding", "Classified as a copper-based transmission medium", "Typically used in broadband cable Internet connections", "Contains multiple twisted pairs of copper wires in a single sheath"], "correct": [0, 1, 2, 3], "exp": "Coax has a single shielded copper conductor, is copper-based, and is used for cable TV/Internet.", "id": "t8q21"}, {"q": "Which type of twisted-pair copper cabling takes advantage of an additional protective cover reducing signal interference from outside sources?", "type": "single", "options": ["Coax", "STP", "UTP", "Twinax"], "correct": [1], "exp": "STP (Shielded Twisted Pair) has extra shielding to reduce interference.", "id": "t8q22"}, {"q": "Which of the answers listed below refer(s) to direct burial STP's features and applications? (Select all that apply)", "type": "multi", "options": ["Enhanced shielding", "Underground network infrastructure", "Plenum-rated outer jacket for fire resistance", "Water and chemical resistance", "Outdoor network infrastructure", "Durable outer jacket"], "correct": [0, 1, 3, 4, 5], "exp": "Direct burial STP has enhanced shielding, water/chemical resistance, a durable jacket, for underground/outdoor use — not plenum-rated (that's for indoor air spaces).", "id": "t8q23"}, {"q": "A key feature of all twisted-pair cabling types is that wires inside the cable are grouped into pairs, and the wires in each pair are twisted around each other to reduce signal interference from adjacent wire pairs.", "type": "bool", "options": ["True", "False"], "correct": [0], "exp": "Twisting wire pairs together reduces crosstalk/interference between pairs.", "id": "t8q24"}, {"q": "Which of the following answers does not refer to UTP cabling?", "type": "single", "options": ["Used in Ethernet networks and telephone systems", "Characterized by low cost and ease of installation", "Shielded to reduce external interference", "In Ethernet networks, installed with RJ45 connector type", "Classified as twisted-pair copper cabling"], "correct": [2], "exp": "UTP is unshielded by definition — shielding describes STP instead.", "id": "t8q25"}, {"q": "A type of enclosed space in a building, such as the one between a dropped ceiling and the structural ceiling, used for air handling, is commonly referred to as a plenum space. A special type of cabling with a fire-retardant jacket, designed for use in that space, is known as plenum-rated cabling.", "type": "bool", "options": ["True", "False"], "correct": [0], "exp": "Plenum spaces need fire-retardant plenum-rated cabling due to air circulation risks.", "id": "t8q26"}, {"q": "What are the key features of single-mode fiber optics? (Select 3 answers)", "type": "multi", "options": ["Supports transmission distances of up to 2 km", "Typically incurs a higher cost than multimode fiber optic systems", "Employs LED light sources for transmission", "Offers long-distance transmission capabilities, often exceeding 100 km", "Utilizes laser light as the source of transmission", "Typically incurs lower costs than multimode fiber optic systems"], "correct": [1, 3, 4], "exp": "Single-mode fiber is costlier, supports very long distances, and uses laser light sources.", "id": "t8q27"}, {"q": "Which of the answers listed below refer to the characteristics of multimode fiber optics? (Select 3 answers)", "type": "multi", "options": ["Utilizes laser light sources for transmission", "Supports transmission distances of up to 2 km", "Generally more expensive than single-mode fiber optics", "Capable of supporting transmission distances of up to 100 km or more", "Usually less expensive than single-mode fiber optics", "Employs LED light sources for transmission"], "correct": [1, 4, 5], "exp": "Multimode fiber supports shorter distances (~2 km), is cheaper than single-mode, and uses LED light sources.", "id": "t8q28"}]}, {"id": "test9", "label": "Test 9", "questions": [{"q": "USB 2.0 (a.k.a. Hi-Speed USB) specifies the maximum data transfer rate of:", "type": "single", "options": ["120 Mbps", "240 Mbps", "480 Mbps", "960 Mbps"], "correct": [2], "exp": "USB 2.0 (Hi-Speed) tops out at 480 Mbps.", "id": "t9q1"}, {"q": "What is the maximum allowable cable length for USB 2.0?", "type": "single", "options": ["3 meters", "4.5 meters", "5 meters", "10 meters"], "correct": [2], "exp": "USB 2.0 supports a max cable length of 5 meters.", "id": "t9q2"}, {"q": "Which of the following answers refer to the USB 3.0 standard? (Select 3 answers)", "type": "multi", "options": ["High Speed USB", "Backward compatibility with earlier USB versions", "3 Gbps data transfer rate", "Full Speed USB", "5 Gbps data transfer rate", "SuperSpeed USB", "10 Gbps data transfer rate", "No backward compatibility with earlier USB versions"], "correct": [1, 4, 5], "exp": "USB 3.0 (SuperSpeed) is backward compatible and transfers at 5 Gbps.", "id": "t9q3"}, {"q": "USB 3.1 improves over its predecessors by supporting a maximum data transfer rate of:", "type": "single", "options": ["6 Gbps", "10 Gbps", "12 Gbps", "20 Gbps"], "correct": [1], "exp": "USB 3.1 (Gen 2) supports up to 10 Gbps.", "id": "t9q4"}, {"q": "What is the maximum theoretical data transfer rate supported by USB 3.2?", "type": "single", "options": ["10 Gbps", "20 Gbps", "30 Gbps", "40 Gbps"], "correct": [1], "exp": "USB 3.2 tops out at 20 Gbps (2x2 configuration).", "id": "t9q5"}, {"q": "What is the maximum practical cable length for a typical USB 3.x connection?", "type": "single", "options": ["1 meter", "3 meters", "4.5 meters", "5 meters"], "correct": [1], "exp": "USB 3.x connections are practically limited to about 3 meters.", "id": "t9q6"}, {"q": "Which of the answers listed below refers to an older type of serial cable used to connect modems, printers, mice, and other peripheral devices?", "type": "single", "options": ["RJ11", "RG-6", "RS-232", "RG-59"], "correct": [2], "exp": "RS-232 is an older serial cable/interface standard for peripherals.", "id": "t9q7"}, {"q": "Thunderbolt 1 uses two separate 10 Gbps data channels, combined max 20 Gbps, but a single task is limited to 10 Gbps. Thunderbolt 2 bonds channels into one 20 Gbps connection. Thunderbolt 3 increases throughput to 40 Gbps.", "type": "bool", "options": ["True", "False"], "correct": [0], "exp": "This accurately describes the Thunderbolt 1/2/3 channel bonding and throughput progression.", "id": "t9q8"}, {"q": "What is the maximum allowable length for a Thunderbolt copper cable?", "type": "single", "options": ["Up to 3 meters", "Up to 6 meters", "Up to 10 meters", "Up to 15 meters"], "correct": [0], "exp": "Thunderbolt copper cables max out around 3 meters.", "id": "t9q9"}, {"q": "The fiber-optic Thunderbolt interface allows for a maximum cable length of:", "type": "single", "options": ["30 meters", "40 meters", "50 meters", "60 meters"], "correct": [3], "exp": "Thunderbolt fiber-optic cables can reach up to 60 meters.", "id": "t9q10"}, {"q": "Which of the following answers refer(s) to video connection standards? (Select all that apply)", "type": "multi", "options": ["SATA", "DVI", "DisplayPort", "USB", "eSATA", "HDMI", "VGA"], "correct": [1, 2, 5, 6], "exp": "DVI, DisplayPort, HDMI, and VGA are all video connection standards; SATA/USB/eSATA aren't dedicated video interfaces.", "id": "t9q11"}, {"q": "Which of the interfaces listed below provide the capability for transmission of both video and audio data? (Select 2 answers)", "type": "multi", "options": ["S/PDIF", "DVI", "VGA", "HDMI", "DisplayPort"], "correct": [3, 4], "exp": "HDMI and DisplayPort carry both video and audio; DVI/VGA are video-only, S/PDIF is audio-only.", "id": "t9q12"}, {"q": "What are the characteristic features of the signal that can be carried through an HDMI cable? (Select 2 answers)", "type": "multi", "options": ["Analog signal", "Video only", "Digital signal", "Audio only", "Video and audio"], "correct": [2, 4], "exp": "HDMI carries a digital signal with both video and audio.", "id": "t9q13"}, {"q": "Which of the following answers best describes the signal capabilities of DisplayPort?", "type": "single", "options": ["Analog video", "Audio only", "Digital audio/video", "Video only", "Analog audio"], "correct": [2], "exp": "DisplayPort carries digital audio and video.", "id": "t9q14"}, {"q": "Which of the DVI versions listed below does not provide support for digital signal transmission?", "type": "single", "options": ["DVI-D", "DVI-A", "DVI-I", "DVI-A/D"], "correct": [1], "exp": "DVI-A is analog-only, with no digital signal support.", "id": "t9q15"}, {"q": "Which DVI type does not provide support for analog signal transmission?", "type": "single", "options": ["DVI-D", "DVI-A", "DVI-I", "DVI-A/D"], "correct": [0], "exp": "DVI-D is digital-only, with no analog support.", "id": "t9q16"}, {"q": "DVI-I provides support for both digital and analog video signal transmission.", "type": "bool", "options": ["True", "False"], "correct": [0], "exp": "DVI-I (Integrated) supports both digital and analog signals.", "id": "t9q17"}, {"q": "Which of the answers listed below refer to the characteristic features of the signal that can be carried through a standard VGA cable? (Select 2 answers)", "type": "multi", "options": ["Audio", "Video and audio", "Digital", "Video", "Analog"], "correct": [3, 4], "exp": "VGA carries analog video only, no audio.", "id": "t9q18"}, {"q": "USB-C supports Alternate Mode (Alt Mode), which allows it to transmit video signals using protocols such as DisplayPort or HDMI. Through Alt Mode, USB-C can deliver video to external displays like monitors or TVs, offering the same functionality as dedicated video cables. To connect to most external displays, USB-C requires a compatible adapter or cable, such as USB-C to DisplayPort or USB-C to HDMI.", "type": "bool", "options": ["True", "False"], "correct": [0], "exp": "USB-C Alt Mode carries DisplayPort/HDMI video via a compatible adapter or cable.", "id": "t9q19"}, {"q": "What are the characteristic features of SATA revision 1.0 (SATA I)? (Select 2 answers)", "type": "multi", "options": ["1.5 Gbps data transfer rate", "Maximum cable length of 1 meter", "3 Gbps data transfer rate", "Maximum cable length of 2 meters", "6 Gbps data transfer rate", "Maximum cable length of 3 meters"], "correct": [0, 1], "exp": "SATA I runs at 1.5 Gbps with a 1-meter max cable length.", "id": "t9q20"}, {"q": "The SATA interface specification defines a power connector consisting of:", "type": "single", "options": ["12 pins", "15 pins", "20 pins", "24 pins"], "correct": [1], "exp": "The SATA power connector has 15 pins.", "id": "t9q21"}, {"q": "SATA revision 2.0 (SATA II) specifies: (Select 2 answers)", "type": "multi", "options": ["Maximum cable length of 3 meters", "6 Gbps data transfer rate", "Maximum cable length of 2 meters", "3 Gbps data transfer rate", "Maximum cable length of 1 meter", "1.5 Gbps data transfer rate"], "correct": [3, 4], "exp": "SATA II runs at 3 Gbps with a 1-meter max cable length.", "id": "t9q22"}, {"q": "A single SATA data cable can be used to connect a motherboard slot with:", "type": "single", "options": ["Up to 3 devices", "Up to 2 devices", "Only 1 device", "Up to 4 devices"], "correct": [2], "exp": "Each SATA data cable connects only a single device (point-to-point).", "id": "t9q23"}, {"q": "The characteristic features of SATA revision 3.0 (SATA III) include: (Select 2 answers)", "type": "multi", "options": ["32 Gbps data transfer rate", "Maximum cable length of 2 meters", "16 Gbps data transfer rate", "Maximum cable length of 1 meter", "6 Gbps data transfer rate", "Maximum cable length of 3 meters"], "correct": [3, 4], "exp": "SATA III runs at 6 Gbps with a 1-meter max cable length.", "id": "t9q24"}, {"q": "The SATA interface specification defines a data cable connector consisting of:", "type": "single", "options": ["4 pins", "6 pins", "7 pins", "8 pins"], "correct": [2], "exp": "The SATA data connector has 7 pins.", "id": "t9q25"}]}, {"id": "test10", "label": "Test 10", "questions": [{"q": "Which of the following answers refer(s) to eSATA? (Select all that apply)", "type": "multi", "options": ["Data transfer rate of up to 4 Gbps", "Maximum cable length of 1 meter", "Hot-swappable functionality", "A standard cable length of up to 2 meters", "External connection for storage", "Data transfer rate of up to 6 Gbps"], "correct": [2, 3, 4, 5], "exp": "eSATA is hot-swappable, external, cable length up to 2m, transfer rate up to 6 Gbps.", "id": "t10q1"}, {"q": "Which of the answers listed below describes the functionality offered by a cable adapter?", "type": "single", "options": ["Hot swap capability for connected devices", "Single-port-to-multi-port expansion", "Connector form factor adjustment", "Signal amplification for extended range"], "correct": [2], "exp": "A cable adapter changes connector form factor to allow mismatched connectors to join.", "id": "t10q2"}, {"q": "Which of the following answer choices describe typical applications of the RJ11 connector? (Select 3 answers)", "type": "multi", "options": ["Ethernet network cabling", "Telephone equipment", "Fiber-optic cabling", "Coaxial cabling", "Dial-up networking", "Twisted-pair copper cabling"], "correct": [1, 4, 5], "exp": "RJ11 is used for telephone equipment, dial-up networking, over twisted-pair copper.", "id": "t10q3"}, {"q": "The RJ45 connector is used with: (Select 2 answers)", "type": "multi", "options": ["Fiber-optic cabling", "Coaxial cabling", "Dial-up networking", "Twisted-pair copper cabling", "Telephone equipment", "Ethernet network cabling"], "correct": [3, 5], "exp": "RJ45 is used with twisted-pair copper cabling for Ethernet networking.", "id": "t10q4"}, {"q": "What are the characteristic features of the F-type connector? (Select 3 answers)", "type": "multi", "options": ["Threaded (screw-on) connector", "Satellite/cable TV, broadband Internet connections via cable modems", "Twisted-pair copper cabling", "Bayonet-style (twist-and-lock) connector", "Coaxial cabling", "Professional audio and video equipment, CCTV systems, laboratory, and testing equipment"], "correct": [0, 1, 4], "exp": "F-type connectors are screw-on, used with coaxial cabling for cable TV/broadband.", "id": "t10q5"}, {"q": "Examples of connector types used with fiber-optic cabling include: (Select all that apply)", "type": "multi", "options": ["LC", "RCA", "ST", "BNC", "SC", "XLR"], "correct": [0, 2, 4], "exp": "LC, ST, and SC are fiber-optic connector types; RCA/BNC/XLR are not.", "id": "t10q6"}, {"q": "A termination device (or module) that secures individual wires directly onto metal contacts to form permanent, solderless connections is known as:", "type": "single", "options": ["Punchdown block", "Keystone wall plate", "Patch panel", "Wire junction box"], "correct": [0], "exp": "A punchdown block secures wires onto metal contacts without soldering.", "id": "t10q7"}, {"q": "Which of the answers listed below refer(s) to (a) non-reversible connector type(s) used in older mobile devices? (Select all that apply)", "type": "multi", "options": ["USB Type-A", "MicroUSB", "USB-C", "MiniUSB", "USB Type-B"], "correct": [1, 3], "exp": "MicroUSB and MiniUSB are non-reversible connectors used in older mobile devices.", "id": "t10q8"}, {"q": "Which of the following answers applies to USB-C connector?", "type": "single", "options": ["Symmetrical connector design", "Bi-directional power and data transfer", "Video output capability (DisplayPort/HDMI over USB-C)", "High data transfer speeds", "All of the above"], "correct": [4], "exp": "USB-C offers a symmetrical design, bidirectional power/data, video output, and high speeds — all of these.", "id": "t10q9"}, {"q": "What is the name of the most common connector type used for providing power to various hardware components inside a computer case?", "type": "single", "options": ["D-sub connector", "Mini-DIN connector", "Berg connector", "Molex connector"], "correct": [3], "exp": "Molex connectors are commonly used for internal power distribution.", "id": "t10q10"}, {"q": "Which of the answers listed below refers to a proprietary 8-pin connector used for charging, data transfer, and audio output in iOS devices?", "type": "single", "options": ["FireWire", "Thunderbolt", "Doc Connector", "Lightning"], "correct": [3], "exp": "Lightning is Apple's proprietary 8-pin connector.", "id": "t10q11"}, {"q": "Which of the following answers refers to a serial communication copper connector often found on older PCs, networking equipment, and industrial hardware?", "type": "single", "options": ["RG-6", "PS/2", "RG-59", "DB-9"], "correct": [3], "exp": "DB-9 is a serial communication connector found on older PCs and equipment.", "id": "t10q12"}, {"q": "What is the most common memory module form factor used in laptops?", "type": "single", "options": ["ECC RAM", "DIMM", "SODIMM", "CRIMM"], "correct": [2], "exp": "SODIMM is the compact RAM module form factor used in laptops.", "id": "t10q13"}, {"q": "Which type of RAM features separate electrical contacts on each side of the module?", "type": "single", "options": ["SRAM", "DIMM", "DRAM", "SIMM"], "correct": [1], "exp": "DIMM modules have independent electrical contacts on each side.", "id": "t10q14"}, {"q": "The placement of a notch on the RAM module contact surface ensures proper alignment of the module with the memory bank on the motherboard and prevents the installation of incompatible memory types.", "type": "bool", "options": ["True", "False"], "correct": [0], "exp": "The notch position ensures proper alignment and prevents installing incompatible RAM.", "id": "t10q15"}, {"q": "Which of the answers listed below refer(s) to the characteristic feature(s) of Static Random-Access Memory (SRAM)? (Select all that apply)", "type": "multi", "options": ["Non-volatile storage media type", "Faster than Dynamic Random-Access Memory (DRAM)", "Widely used as the primary storage media (regular RAM modules installed in memory slots on the motherboard)", "More expensive in comparison to Dynamic Random-Access Memory (DRAM)", "Slower than Dynamic Random-Access Memory (DRAM)", "Volatile storage media type", "Utilized for CPU cache memory chips", "Less expensive in comparison to Dynamic Random-Access Memory (DRAM)"], "correct": [1, 3, 5, 6], "exp": "SRAM is faster and pricier than DRAM, volatile, and used for CPU cache.", "id": "t10q16"}, {"q": "Which of the following answers describes(s) the characteristics of Dynamic Random-Access Memory (DRAM)? (Select all that apply)", "type": "multi", "options": ["Volatile storage media type", "Utilized for CPU cache memory chips", "More expensive in comparison to Static Random-Access Memory (SRAM)", "Non-volatile storage media type", "Slower than Static Random-Access Memory (SRAM)", "Widely used as the primary storage media (regular RAM modules installed in memory slots on the motherboard)", "Faster than Static Random-Access Memory (SRAM)", "Less expensive in comparison to Static Random-Access Memory (SRAM)"], "correct": [0, 4, 5, 7], "exp": "DRAM is volatile, slower and cheaper than SRAM, and used as main system memory.", "id": "t10q17"}, {"q": "The term \"Synchronous Dynamic Random-Access Memory (SDRAM)\" refers to a broad category of DRAM modules that rely on the signal sent by the system clock in order to coordinate their functioning with other internal PC components.", "type": "bool", "options": ["True", "False"], "correct": [0], "exp": "SDRAM syncs its operation with the system clock, unlike asynchronous DRAM.", "id": "t10q18"}, {"q": "SDRAM's backward compatibility feature provides a convenient way to build PCs using different types of SDRAM modules.", "type": "bool", "options": ["True", "False"], "correct": [1], "exp": "SDRAM generations (DDR3/4/5) are NOT backward compatible with each other.", "id": "t10q19"}, {"q": "Which of the answers listed below refers to a valid SDRAM module combination that can be installed on a single PC motherboard?", "type": "single", "options": ["DDR3 + DDR2", "DDR4 + DDR3", "DDR5 + DDR4", "Any of the above", "None of the above"], "correct": [4], "exp": "DDR generations can't be mixed on the same motherboard — none of the listed combinations work.", "id": "t10q20"}, {"q": "Which of the following answers refer to the Double Data Rate 3 Synchronous Dynamic Random-Access Memory (DDR3 SDRAM)? (Select 3 answers)", "type": "multi", "options": ["16 GB maximum capacity per memory module", "240 contact pins", "A notch on the RAM module contact surface prevents the installation of incompatible memory types", "288 contact pins", "32 GB maximum capacity per memory module", "Backwards compatible with earlier DDR SDRAM versions"], "correct": [0, 1, 2], "exp": "DDR3 supports up to 16 GB per module, has 240 pins, and uses a notch to prevent incompatible installs.", "id": "t10q21"}, {"q": "What are the characteristic features of the Double Data Rate 4 Synchronous Dynamic Random-Access Memory (DDR4 SDRAM)? (Select 3 answers)", "type": "multi", "options": ["32 GB maximum capacity per memory module", "288 contact pins", "64 GB maximum capacity per memory module", "A notch on the RAM module contact surface prevents the installation of incompatible memory types", "240 contact pins", "Backwards compatible with earlier DDR SDRAM versions"], "correct": [0, 1, 3], "exp": "DDR4 supports up to 32 GB per module, has 288 pins, and uses a notch to prevent incompatible installs.", "id": "t10q22"}, {"q": "Which of the answers listed below refer to Double Data Rate 5 Synchronous Dynamic Random-Access Memory (DDR5 SDRAM)? (Select 3 answers)", "type": "multi", "options": ["Backwards compatible with earlier DDR SDRAM versions", "64 GB maximum capacity per memory module", "288 contact pins", "A notch on the RAM module contact surface prevents the installation of incompatible memory types", "240 contact pins", "32 GB maximum capacity per memory module"], "correct": [1, 2, 3], "exp": "DDR5 supports up to 64 GB per module, has 288 pins, and uses a notch to prevent incompatible installs.", "id": "t10q23"}, {"q": "Certain types of RAM use an additional bit to detect whether a data error has occurred. This extra bit stores information about the count of bits set to 1 in a given data string (typically one byte). Examining the value of this bit at different stages of processing allows for the detection of data corruption. What is the name of that extra bit?", "type": "single", "options": ["Checksum", "Digest", "CRC", "Parity bit"], "correct": [3], "exp": "That extra error-detection bit is called a parity bit.", "id": "t10q24"}, {"q": "ECC type RAM:", "type": "single", "options": ["Can only detect errors, but does not have the capability to correct them", "Refers to parity RAM (the two terms are interchangeable)", "Offers better performance in terms of speed when compared to a non-ECC type of RAM", "Can detect and correct errors"], "correct": [3], "exp": "ECC RAM can both detect and correct data errors.", "id": "t10q25"}]}, {"id": "test11", "label": "Test 11", "questions": [{"q": "ECC RAM finds extensive use in environments where data integrity is essential, such as in critical infrastructure, high-availability systems, and applications requiring precise error detection and correction. It prioritizes data integrity over cost and performance, making it more expensive and slightly slower than non-ECC RAM in most cases.", "type": "bool", "options": ["True", "False"], "correct": [0], "exp": "ECC RAM prioritizes data integrity, at the cost of higher price and slightly reduced speed.", "id": "t11q1"}, {"q": "Which of the following characteristics apply to the type of RAM most commonly used as the main system memory in desktop PCs? (Select 2 answers)", "type": "multi", "options": ["SODIMM", "Non-ECC memory", "Static RAM", "MicroDIMM", "Dynamic RAM", "ECC memory"], "correct": [1, 4], "exp": "Desktop main memory is typically non-ECC DRAM.", "id": "t11q2"}, {"q": "The color-coded memory slots on the motherboard indicate that a given motherboard provides support for the multi-channel memory architecture.", "type": "bool", "options": ["True", "False"], "correct": [0], "exp": "Color-coded slots indicate which pairs/sets support multi-channel memory.", "id": "t11q3"}, {"q": "Taking advantage of the performance benefits offered by the multi-channel memory architecture requires: (Select all that apply)", "type": "multi", "options": ["Memory modules of matching types", "Memory modules of matching speeds", "Installing memory modules in slots of opposite color on the motherboard", "Memory modules of the same capacity", "Installing modules in appropriate memory slots (slots of matching color) on the motherboard"], "correct": [0, 1, 3, 4], "exp": "Multi-channel needs matching type/speed/capacity modules installed in same-colored (matching) slots.", "id": "t11q4"}, {"q": "The platters in a magnetic hard drive spin at a rate measured in:", "type": "single", "options": ["Revolutions per second", "Iterations per minute", "Revolutions per minute", "Iterations per second"], "correct": [2], "exp": "HDD platter spin speed is measured in RPM.", "id": "t11q5"}, {"q": "What is the maximum RPM value available in modern HDDs?", "type": "single", "options": ["10000", "5400", "15000", "7200"], "correct": [2], "exp": "Modern HDDs can reach up to 15000 RPM (high-end enterprise drives).", "id": "t11q6"}, {"q": "Which of the answers listed below refers to a storage media drive form factor for laptop computers?", "type": "single", "options": ["1.8-inch", "2.5-inch", "3.5-inch", "5.25-inch"], "correct": [1], "exp": "2.5-inch is the standard laptop drive form factor.", "id": "t11q7"}, {"q": "Which of the following answers refers to an HDD form factor for desktops?", "type": "single", "options": ["1.8-inch", "2.5-inch", "3.5-inch", "5.25-inch"], "correct": [2], "exp": "3.5-inch is the standard desktop HDD form factor.", "id": "t11q8"}, {"q": "Which of the statements listed below can be used to describe the features of NVMe? (Select 2 answers)", "type": "multi", "options": ["Developed specifically for SSDs", "Uses the PCIe interface for data transfer", "Capped at a maximum data transfer rate of 6 Gbps", "Designed as a general-purpose interface for various hardware devices", "Optimized for multi-drive RAID configurations"], "correct": [0, 1], "exp": "NVMe was built specifically for SSDs and uses the PCIe interface.", "id": "t11q9"}, {"q": "Which of the following answers does not apply to the SATA interface?", "type": "single", "options": ["Common in 2.5-inch SSDs replacing traditional HDDs", "Widely used in consumer-grade laptops and desktops", "An older interface originally designed for mechanical hard drives", "Capped at a maximum data transfer rate of 6 Gbps", "All of the above statements accurately describe the SATA interface"], "correct": [4], "exp": "All of the listed statements do describe SATA, so \"all of the above\" is correct.", "id": "t11q10"}, {"q": "PCIe is a general-purpose, high-speed interface that serves as the backbone for NVMe SSDs and other high-performance hardware devices.", "type": "bool", "options": ["True", "False"], "correct": [0], "exp": "PCIe is the general-purpose high-speed bus underlying NVMe SSDs and other hardware.", "id": "t11q11"}, {"q": "What are the key features of SAS? (Select 3 answers)", "type": "multi", "options": ["Designed for systems requiring high redundancy, error correction, and uptime", "Optimized for multi-drive configurations in a daisy-chain topology", "Commonly implemented in mission-critical environments like servers and data centers", "Widely used in 2.5-inch SSDs replacing traditional HDDs", "Developed specifically for high-throughput, low-latency flash storage environments"], "correct": [0, 1, 2], "exp": "SAS emphasizes redundancy/error correction, daisy-chain multi-drive support, and enterprise/server use.", "id": "t11q12"}, {"q": "An M.2 key is a notch on the pin contact surface of an M.2 expansion card which prevents its insertion into an incompatible socket. The 12 available M.2 key IDs are letters from A to M which indicate the location of notched pins on the card's contact surface and designate the type of interface a given card is compatible with. M.2 expansion cards used for solid-state storage applications have key IDs of B and M. The B-keyed M.2 SSD cards take advantage of 2 lanes of a PCIe link (lower read/write speed), the M-keyed M.2 SSDs use 4 PCIe lanes (higher read/write speed). M.2 SSDs with 2 notches on the card's pin contact surface (B + M) increase their compatibility, as they can be installed in either of the two types of expansion slots on the motherboard.", "type": "bool", "options": ["True", "False"], "correct": [0], "exp": "M.2 keying (B, M, or B+M) determines lane count and slot compatibility as described.", "id": "t11q13"}, {"q": "Which of the answers listed below refers to an older, portable device SSD form factor superseded by M.2?", "type": "single", "options": ["mSATA", "NVMe", "SATA Express", "mPCIe"], "correct": [0], "exp": "mSATA was the older compact SSD form factor that M.2 replaced.", "id": "t11q14"}, {"q": "Which of the following answers refer(s) to a standard form factor for SSDs? (Select all that apply)", "type": "multi", "options": ["iSCSI", "M.2", "MicroSD", "PCI-X", "mSATA"], "correct": [1, 4], "exp": "M.2 and mSATA are standard SSD form factors.", "id": "t11q15"}, {"q": "Hardware RAID Level 0: (Select all that apply)", "type": "multi", "options": ["Requires a minimum of 2 drives to implement", "Is also known as disk striping", "Decreases reliability (failure of any disk in the array results in the loss of all data in the array)", "Is also referred to as disk mirroring", "Provides less usable capacity compared to RAID 1", "Requires at least 3 drives to implement", "Is suitable for systems where performance takes precedence over fault tolerance", "Enhances reliability by duplicating data across all drives (failure of one drive does not result in data loss)"], "correct": [0, 1, 2, 6], "exp": "RAID 0 (striping) needs 2+ drives, boosts performance but decreases reliability — any drive failure loses all data.", "id": "t11q16"}, {"q": "Hardware RAID Level 1: (Select 3 answers)", "type": "multi", "options": ["Requires at least 3 drives to implement", "Is also known as disk striping", "Offers better performance than RAID 0", "Requires at least 2 drives to implement", "Improves reliability by duplicating data on each drive (if one drive fails, data remains accessible)", "Is also referred to as disk mirroring"], "correct": [3, 4, 5], "exp": "RAID 1 (mirroring) needs 2+ drives and duplicates data for reliability.", "id": "t11q17"}, {"q": "Hardware RAID Level 5: (Select 3 answers)", "type": "multi", "options": ["Requires at least 2 drives to implement", "Can withstand the failure of more than one drive", "Is also known as disk striping with double parity", "Requires at least 3 drives to implement", "Offers both increased performance and fault tolerance (a single drive failure does not result in data loss; the array can rebuild the missing data)", "Requires at least 4 drives to implement", "Is also known as disk striping with parity"], "correct": [3, 4, 6], "exp": "RAID 5 (striping with parity) needs 3+ drives and tolerates a single drive failure.", "id": "t11q18"}, {"q": "Hardware RAID Level 6: (Select 3 answers)", "type": "multi", "options": ["Is also known as disk striping with parity", "Requires at least 4 drives to implement", "Offers increased performance and fault tolerance (up to 2 drive failures can be tolerated without data loss)", "Requires at least 3 drives to implement", "Is also known as disk striping with double parity", "Can continue operating after more than 2 drive failures", "Requires at least 5 drives to implement"], "correct": [1, 2, 4], "exp": "RAID 6 (striping with double parity) needs 4+ drives and tolerates up to 2 drive failures.", "id": "t11q19"}, {"q": "Hardware RAID Level 10 (a.k.a. RAID 1+0): (Select 3 answers)", "type": "multi", "options": ["Requires a minimum of 4 drives to implement", "Is known as a stripe of mirrors, combining RAID 1 (striping) with RAID 0 (mirroring)", "Requires a minimum of 5 drives to implement", "Offers increased performance and fault tolerance (the array can survive the failure of one drive in each mirrored pair)", "Requires a minimum of 3 drives to implement", "Can continue operating after more than 2 drive failures, regardless of which drives fail", "Is known as a stripe of mirrors, combining RAID 1 (mirroring) with RAID 0 (striping)"], "correct": [0, 3, 6], "exp": "RAID 10 needs 4+ drives, is a striped set of mirrors (RAID 1 mirrors + RAID 0 striping), tolerant to a failure in each pair.", "id": "t11q20"}, {"q": "Which of the RAID levels listed below does not provide fault tolerance?", "type": "single", "options": ["RAID 6", "RAID 10", "RAID 5", "RAID 0", "RAID 1"], "correct": [3], "exp": "RAID 0 offers no redundancy/fault tolerance — it's pure striping for performance.", "id": "t11q21"}, {"q": "In a configuration using the minimum required number of drives, which two of the following RAID levels provide the highest amount of usable storage space?", "type": "multi", "options": ["RAID 1", "RAID 0", "RAID 6", "RAID 10", "RAID 5"], "correct": [1, 4], "exp": "At minimum drive counts, RAID 0 and RAID 5 waste the least capacity to redundancy.", "id": "t11q22"}, {"q": "Which of the RAID levels listed below provides the greatest level of redundancy?", "type": "single", "options": ["RAID 5", "RAID 6", "RAID 10", "RAID 1", "RAID 0"], "correct": [1], "exp": "RAID 6 tolerates up to 2 simultaneous drive failures, the most redundancy of the listed levels.", "id": "t11q23"}, {"q": "Which of the following RAID levels offers the best performance?", "type": "single", "options": ["RAID 0", "RAID 5", "RAID 1", "RAID 6", "RAID 10"], "correct": [0], "exp": "RAID 0 offers the best raw performance since it has no redundancy overhead.", "id": "t11q24"}, {"q": "Which of the answers listed below accurately describe(s) the characteristics of flash drives? (Select all that apply)", "type": "multi", "options": ["Plug-and-play across most devices supporting USB", "Non-volatile, rewritable storage media type", "Solid-state memory technology (containing no mechanical moving parts)", "Primarily designed to expand storage capacity of compact electronics", "Designed for general purpose file transfer and storage", "Compatible with dedicated slots or card readers"], "correct": [0, 1, 2, 4], "exp": "Flash drives are plug-and-play, non-volatile/rewritable, solid-state, and general-purpose for file transfer.", "id": "t11q25"}]}, {"id": "test12", "label": "Test 12", "questions": [{"q": "Which of the following features differentiate memory cards from flash drives? (Select all that apply)", "type": "multi", "options": ["Compatible with dedicated slots or card readers", "Primarily designed to expand storage capacity of compact electronics", "Designed for general-purpose file transfer and storage", "Non-volatile, rewritable storage media type", "Solid-state memory technology (containing no mechanical moving parts)", "Plug-and-play across most devices supporting USB"], "correct": [0, 1], "exp": "Unlike flash drives, memory cards specifically use dedicated slots/readers and expand compact device storage.", "id": "t12q1"}, {"q": "Due to space limitations, the shift to digital content, and the rise of faster storage alternatives, modern laptops no longer include a built-in version of this storage medium.", "type": "single", "options": ["M.2 SATA drives", "Optical drives", "PCIe NVMe drives", "eSATA drives"], "correct": [1], "exp": "Optical drives have been dropped from modern laptops in favor of faster, smaller storage.", "id": "t12q2"}, {"q": "What is the most common motherboard form factor used in desktop PCs?", "type": "single", "options": ["ATX", "mATX", "ITX", "mITX"], "correct": [0], "exp": "ATX is the most common desktop motherboard form factor.", "id": "t12q3"}, {"q": "Which motherboard form factor would be the optimal choice for a compact or budget-friendly desktop build?", "type": "single", "options": ["LPX/NLX", "BTX", "E-ATX", "microATX"], "correct": [3], "exp": "microATX offers a smaller, budget-friendly footprint compared to full ATX.", "id": "t12q4"}, {"q": "Which of the answers listed below refers to a low-power consumption, small form factor motherboard type used in industrial and embedded PC applications?", "type": "single", "options": ["NLX", "ITX", "ATX", "LPX"], "correct": [1], "exp": "ITX is a low-power, small form factor board used in embedded/industrial systems.", "id": "t12q5"}, {"q": "Which of the following motherboard form factors is the smallest?", "type": "single", "options": ["ITX", "E-ATX", "EE-ATX", "microATX"], "correct": [0], "exp": "ITX is the smallest of the listed motherboard form factors.", "id": "t12q6"}, {"q": "PCIe is a high-speed, serial expansion bus designed as a replacement for:", "type": "single", "options": ["VGA", "PCI", "IDE", "ATA"], "correct": [1], "exp": "PCIe replaced the older PCI expansion bus.", "id": "t12q7"}, {"q": "In PCIe architecture, a lane is a single, full-duplex, point-to-point serial communication path composed of two pairs of differential signaling wires, where one pair is used for transmitting data and the other pair for receiving data. The PCIe labeling (x1, x4, x8, x12, x16, and x32) indicates the number of lanes available in an interface. The throughput of a single lane (as indicated by x1) is determined by the specific PCIe generation and is typically measured in terms of gigatransfers per second (GT/s) or its equivalent bandwidth in MB/s. The multiplier (x) then provides a straightforward way to calculate the maximum theoretical aggregate bandwidth for the interface.", "type": "bool", "options": ["True", "False"], "correct": [0], "exp": "This correctly describes PCIe lanes and how the x-multiplier relates to bandwidth.", "id": "t12q8"}, {"q": "Which of the answers listed below refers to the main power connector used in modern ATX power supplies?", "type": "single", "options": ["16-pin connector", "20-pin connector", "24-pin connector", "28-pin connector"], "correct": [2], "exp": "Modern ATX PSUs use a 24-pin main power connector.", "id": "t12q9"}, {"q": "Which of the following connectors provide(s) additional power to the CPU? (Select all that apply)", "type": "multi", "options": ["4-pin 12V connector", "8-pin PCIe connector", "4+4-pin 12V connector", "6-pin PCIe connector", "8-pin 12V connector"], "correct": [0, 2, 4], "exp": "CPU power uses 4-pin, 4+4-pin, or 8-pin 12V connectors — PCIe 6/8-pin connectors are for graphics cards.", "id": "t12q10"}, {"q": "Which of the answers listed below refer to auxiliary connector types most commonly used for supplying additional power to graphics cards? (Select 2 answers)", "type": "multi", "options": ["8-pin 12V connector", "6-pin PCIe connector", "4+4-pin 12V connector", "8-pin PCIe connector", "4-pin 12V connector"], "correct": [1, 3], "exp": "Graphics cards typically use 6-pin or 8-pin PCIe power connectors.", "id": "t12q11"}, {"q": "Which motherboard connector features an L-shape design that prevents its improper insertion?", "type": "single", "options": ["SATA", "M.2", "eSATA", "PCIe"], "correct": [0], "exp": "SATA connectors use an L-shape to prevent incorrect insertion.", "id": "t12q12"}, {"q": "Adding an eSATA device to a PC can be done either by attaching the device cable's connector directly to the motherboard's integrated I/O panel, plugging it in via eSATA port on a modular bracket, or attaching it directly to a dedicated slot on the motherboard.", "type": "bool", "options": ["True", "False"], "correct": [1], "exp": "eSATA is connected via I/O panel or bracket port — not attached to a dedicated internal motherboard slot.", "id": "t12q13"}, {"q": "Inside a PC case, connector cables from a power switch, reset switch, or LEDs on the front/top panel of the case attach to their corresponding slots located on the main power supply unit.", "type": "bool", "options": ["True", "False"], "correct": [1], "exp": "Front panel connectors attach to headers on the motherboard, not the power supply unit.", "id": "t12q14"}, {"q": "The installation of USB ports located on the front panel of a computer case requires plugging in internal USB cable connectors into compatible groupings of metal pins (a.k.a. headers) on the motherboard.", "type": "bool", "options": ["True", "False"], "correct": [0], "exp": "Front-panel USB ports connect via internal USB headers on the motherboard.", "id": "t12q15"}, {"q": "Which of the following slots/ports on the PC motherboard enable(s) the connection of an M.2 device? (Select all that apply)", "type": "multi", "options": ["B key slot", "SATA port", "M key slot", "USB slot", "PCIe slot", "B+M key slot"], "correct": [0, 2, 5], "exp": "M.2 devices connect via B-key, M-key, or B+M-key slots on the motherboard.", "id": "t12q16"}, {"q": "Motherboards used in laptops and mobile devices can be characterized by their proprietary design, which means that replacing a motherboard in such devices typically requires a part designed specifically for the make and model of the device.", "type": "bool", "options": ["True", "False"], "correct": [0], "exp": "Laptop motherboards are proprietary — replacements must match the specific make/model.", "id": "t12q17"}, {"q": "Which of the answers listed below refer to the main CPU manufacturers for personal computers? (Select 2 answers)", "type": "multi", "options": ["ASUS", "Nvidia", "AMD", "EVGA", "Intel"], "correct": [2, 4], "exp": "AMD and Intel are the two main PC CPU manufacturers.", "id": "t12q18"}, {"q": "High-end PC motherboards typically feature microprocessor sockets that are compatible with CPUs from different manufacturers.", "type": "bool", "options": ["True", "False"], "correct": [1], "exp": "CPU sockets are manufacturer/architecture-specific, not cross-compatible between AMD and Intel.", "id": "t12q19"}, {"q": "Which of the following answers refer to the characteristic features of a dedicated server motherboard? (Select 3 answers)", "type": "multi", "options": ["Supports ECC RAM", "Designed for tower case installation", "Supports multiple CPUs (multi-socket motherboard)", "Designed for limited space (rack-mount / blade)", "Typically features a single CPU socket", "Supports non-ECC RAM"], "correct": [0, 2, 3], "exp": "Server motherboards typically support ECC RAM, multiple CPU sockets, and rack-mount/blade form factors.", "id": "t12q20"}, {"q": "Which of the answers listed below can be used to describe the characteristics of a typical desktop motherboard? (Select 3 answers)", "type": "multi", "options": ["Supports non-ECC RAM", "Typically features a single CPU socket", "Designed for limited space (rack-mount / blade)", "Supports multiple CPUs (multi-socket motherboard)", "Designed for tower case installation", "Supports ECC RAM"], "correct": [0, 1, 4], "exp": "Desktop motherboards typically use non-ECC RAM, a single CPU socket, and a tower case form factor.", "id": "t12q21"}, {"q": "After completing initial diagnostics and allocating system resources, the startup BIOS program checks for information about secondary storage devices that might contain the OS. The list of these devices and the order in which they are checked can be found and configured in BIOS via:", "type": "single", "options": ["ACPI settings", "System Configuration utility", "Boot options", "Security tab/menu"], "correct": [2], "exp": "Boot options in BIOS/UEFI configure the boot device order.", "id": "t12q22"}, {"q": "Which BIOS configuration option helps mitigate a common vector for malware infection?", "type": "single", "options": ["User password", "Chassis intrusion detection", "Supervisor password", "USB permissions settings"], "correct": [3], "exp": "Restricting USB permissions helps prevent malware introduced via removable media.", "id": "t12q23"}, {"q": "The TPM functionality (if available) in the BIOS/UEFI setup interface provides which of the following features? (Select all that apply)", "type": "multi", "options": ["Allows only trusted boot files to run at startup", "Stores encryption keys in secure hardware for full-disk encryption", "Encrypts individual user accounts on the OS", "Logs boot processes to detect changes", "Safely creates and stores cryptographic keys", "Checks system integrity before granting network access"], "correct": [0, 1, 3, 4, 5], "exp": "TPM enables secure boot, hardware key storage/generation, boot logging, and integrity checks — not per-user account encryption.", "id": "t12q24"}, {"q": "Modern motherboards feature temperature sensors near key components like the CPU and chipset. The BIOS/UEFI firmware periodically polls these sensors to obtain current temperature readings and, according to the configured fan control settings (which can be automatic or user-defined), adjusts the speed of the system's cooling fans.", "type": "bool", "options": ["True", "False"], "correct": [0], "exp": "Firmware-controlled fan curves adjust cooling based on polled temperature sensor data.", "id": "t12q25"}]}, {"id": "test13", "label": "Test 13", "questions": [{"q": "Which of the following terms refers to the advanced security feature integrated into modern UEFI firmware that ensures only digitally signed, trusted software is allowed to run during the system's startup process?", "type": "single", "options": ["Secure Boot", "Trusted OS Loader", "Boot Guard", "Trusted Boot"], "correct": [0], "exp": "Secure Boot ensures only digitally signed, trusted software runs at startup.", "id": "t13q1"}, {"q": "Which of the answers listed below refer(s) to a boot password? (Select all that apply)", "type": "multi", "options": ["Required to access and modify BIOS/UEFI settings", "Primarily protects against unauthorized use of the device", "Activated only when entering the BIOS configuration menu", "Required before the OS loads to prevent unauthorized access", "Does not restrict access to BIOS/UEFI settings", "Prevents configuration changes to firmware settings"], "correct": [1, 3, 4], "exp": "A boot password protects device use and is required before OS load — it doesn't restrict BIOS/UEFI access itself.", "id": "t13q2"}, {"q": "Which of the following statements does not apply to a BIOS password?", "type": "single", "options": ["Activated only when entering the BIOS configuration menu", "Restricts access to the BIOS/UEFI setup interface", "Does not interfere with the actual boot process once configured", "Ensures that unauthorized users cannot start the system", "Prevents unauthorized modifications to firmware settings"], "correct": [3], "exp": "A BIOS (setup) password protects firmware settings access, not starting the system — that's the boot password's job.", "id": "t13q3"}, {"q": "A set of Intel CPU hardware enhancements that enable virtualization is known as:", "type": "single", "options": ["ESXi", "VT-x", "Xen", "Hyper-V"], "correct": [1], "exp": "VT-x is Intel's hardware virtualization extension.", "id": "t13q4"}, {"q": "Which of the answers listed below refers to AMD's CPU hardware virtualization enhancements?", "type": "single", "options": ["vSphere", "Zen", "AMD-V", "Catalyst"], "correct": [2], "exp": "AMD-V is AMD's hardware virtualization extension.", "id": "t13q5"}, {"q": "Which of the following answers refer to the characteristic features of TPM? (Select 3 answers)", "type": "multi", "options": ["Supports multiple devices, users, and systems across a network, not tied to a single device", "Can be a dedicated network-attached appliance, a PCIe card, or a USB device", "Typically embedded directly into consumer devices (e.g., motherboards in PCs and laptops)", "Designed for centralized cryptographic key management, supporting high volumes of cryptographic operations", "Provides security that is specifically tied to a single device", "Offers basic cryptographic functions, such as key storage and platform integrity support"], "correct": [2, 4, 5], "exp": "TPM is embedded in a single device, tied to that device, offering basic key storage/integrity functions.", "id": "t13q6"}, {"q": "Which of the answers listed below refer to HSM? (Select 3 answers)", "type": "multi", "options": ["Provides security that is specifically tied to a single device", "Offers basic cryptographic functions, such as key storage and platform integrity support", "Designed for centralized cryptographic key management, supporting high volumes of cryptographic operations", "Supports multiple devices, users, and systems across a network, not tied to a single device", "Typically embedded directly into consumer devices (e.g., motherboards in PCs and laptops)", "Can be a dedicated network-attached appliance, a PCIe card, or a USB device"], "correct": [2, 3, 5], "exp": "HSM provides centralized key management for many devices/users, and can be a dedicated appliance/card/USB device.", "id": "t13q7"}, {"q": "Which of the following terms refers to a 32-bit CPU architecture?", "type": "single", "options": ["x32", "x48", "x64", "x86"], "correct": [3], "exp": "x86 refers to the 32-bit CPU architecture family.", "id": "t13q8"}, {"q": "Which of the terms listed below describes a CPU designed for 64-bit processing?", "type": "single", "options": ["x32", "x48", "x64", "x86"], "correct": [2], "exp": "x64 describes 64-bit CPU processing.", "id": "t13q9"}, {"q": "The presence of the Program Files (x86) folder on the C drive in MS Windows indicates that the system uses a 32-bit architecture and a 32-bit OS version.", "type": "bool", "options": ["True", "False"], "correct": [1], "exp": "That folder actually indicates a 64-bit Windows system (which keeps a separate folder for 32-bit apps).", "id": "t13q10"}, {"q": "A CPU design based on an instruction set that tries to improve speed by utilizing relatively few and simple instructions is called:", "type": "single", "options": ["RISC", "IA-64", "EPIC", "CISC"], "correct": [0], "exp": "RISC uses a small set of simple instructions to improve speed.", "id": "t13q11"}, {"q": "Which of the following answers refer(s) to ARM-type CPU architecture? (Select all that apply)", "type": "multi", "options": ["Characterized by lowered power consumption", "Typically used in personal computers, laptops, and servers", "Focuses on simplifying the instruction set to enhance processing efficiency", "Employs complex instructions for efficient memory management and backward compatibility", "Commonly used in mobile devices and embedded systems", "Suitable for battery-powered devices"], "correct": [0, 2, 4, 5], "exp": "ARM is low-power, RISC-based, common in mobile/embedded/battery-powered devices.", "id": "t13q12"}, {"q": "A type of CPU architecture where a single physical CPU contains more than one physical processing unit on a single integrated circuit is referred to as:", "type": "single", "options": ["Multiprocessor system architecture", "Multicore architecture", "Modular processor design architecture", "Multithreading architecture"], "correct": [1], "exp": "Multicore architecture puts multiple processing units on a single chip.", "id": "t13q13"}, {"q": "The process of installing an expansion card should involve: (verifying compatibility, ESD protection, drivers, BIOS settings, etc.)", "type": "single", "options": ["Verifying hardware compatibility between the card and motherboard", "Following ESD protection procedures during installation", "Installing the latest drivers and software to ensure optimal functionality", "Accessing the BIOS/UEFI settings to disable conflicting onboard hardware if necessary", "Ensuring the system prioritizes the newly installed expansion card", "Performing all of the above"], "correct": [5], "exp": "Expansion card installation covers compatibility, ESD safety, drivers, and BIOS adjustments — all of these.", "id": "t13q14"}, {"q": "Which of the actions listed below should be performed before the installation of a dedicated graphics card? (Select 3 answers)", "type": "multi", "options": ["Check that the chassis has sufficient space and proper airflow for the GPU", "Verify that the PSU meets the GPU's power requirements (wattage and connector type)", "Confirm that the GPU is compatible with the motherboard's PCIe slot (typically PCIe x16)", "Ensure that the GPU drivers are pre-installed on the system", "Disable integrated graphics in the BIOS/UEFI settings before installation", "Check for any pre-installed GPU software that might conflict with new drivers"], "correct": [0, 1, 2], "exp": "Before installing a GPU: check chassis space/airflow, PSU capacity, and PCIe slot compatibility.", "id": "t13q15"}, {"q": "A capture card is used for: (Select all that apply)", "type": "multi", "options": ["Video input", "Audio output", "Audio input", "Video output"], "correct": [0, 2], "exp": "A capture card takes video and audio input from an external source.", "id": "t13q16"}, {"q": "Which type of adapter card enables Ethernet connectivity?", "type": "single", "options": ["SIM", "Wi-Fi", "NIC", "WWAN"], "correct": [2], "exp": "A NIC provides Ethernet connectivity.", "id": "t13q17"}, {"q": "Which of the following answers refer(s) to (a) solution(s) directly aimed at improving CPU heat dissipation? (Select all that apply)", "type": "multi", "options": ["CPU undervolting", "Thermal pad", "CPU fan", "Heat sink", "CPU throttling", "Thermal paste", "Liquid-based cooling"], "correct": [1, 2, 3, 5, 6], "exp": "Thermal pads, CPU fans, heat sinks, thermal paste, and liquid cooling directly dissipate CPU heat; undervolting/throttling reduce heat generation rather than dissipating it.", "id": "t13q18"}, {"q": "As opposed to active cooling components like cooling fans, heat sinks are considered passive cooling components because they do not require electrical power to operate.", "type": "bool", "options": ["True", "False"], "correct": [0], "exp": "Heat sinks work passively via conduction/convection, needing no electrical power.", "id": "t13q19"}, {"q": "In CPU cooling, thermal paste is applied to fill the narrow gap between the:", "type": "single", "options": ["CPU and heat sink", "Heat sink and thermal pad", "CPU and thermal pad", "Heat sink and CPU fan"], "correct": [0], "exp": "Thermal paste fills the microscopic gap between the CPU and the heat sink.", "id": "t13q20"}, {"q": "Which of the answers listed below refers to the standard voltage range for most residential and commercial power outlets in the United States?", "type": "single", "options": ["110-120 VAC", "120-140 VAC", "210-220 VAC", "220-240 VAC"], "correct": [0], "exp": "US outlets are standard at 110-120 VAC.", "id": "t13q21"}, {"q": "What is the standard voltage range used for power outlets in Europe?", "type": "single", "options": ["110-120 VAC", "120-140 VAC", "210-220 VAC", "220-240 VAC"], "correct": [3], "exp": "European outlets are standard at 220-240 VAC.", "id": "t13q22"}, {"q": "A PSU's operation can be adjusted to the supplied voltage either by using a manual voltage selector on the back of the unit or automatically by the device. PSUs equipped with a manual voltage selector are referred to as fixed-input devices, while PSUs offering automatic voltage adjustment are known as auto-switching PSUs.", "type": "bool", "options": ["True", "False"], "correct": [0], "exp": "Manual-selector PSUs are fixed-input, while auto-adjusting PSUs are auto-switching.", "id": "t13q23"}, {"q": "Which type of electric current is supplied to most of the internal PC components?", "type": "single", "options": ["AC", "HVDC", "DC", "PFC"], "correct": [2], "exp": "PC internal components run on DC power (converted by the PSU from AC).", "id": "t13q24"}, {"q": "Which of the following PC components use circuits that operate at voltages up to 3.3V? (Select 2 answers)", "type": "multi", "options": ["NVMe M.2 slots", "RAM slots", "Optical drives", "Case fans", "Graphics cards"], "correct": [0, 1], "exp": "NVMe M.2 slots and RAM slots operate at up to 3.3V.", "id": "t13q25"}]}, {"id": "test14", "label": "Test 14", "questions": [{"q": "Which of the PC components listed below operate on the 5V voltage rail?", "type": "single", "options": ["Graphics cards", "RAM slots", "CPUs", "USB ports and devices"], "correct": [3], "exp": "USB ports and devices run on the 5V rail.", "id": "t14q1"}, {"q": "Which of the following PC components typically draw power from the 12V voltage rail provided by the power supply? (Select 3 answers)", "type": "multi", "options": ["RAM slots", "Mechanical parts (e.g., case fans, motors, actuators)", "Graphics cards", "PCIe expansion cards", "Motherboard chipsets", "USB ports and devices"], "correct": [1, 2, 3], "exp": "Mechanical parts, graphics cards, and PCIe expansion cards draw from the 12V rail.", "id": "t14q2"}, {"q": "Modern ATX motherboards use a 24-pin power connector. Some power supplies feature a 20+4-pin connector to maintain compatibility with both 20-pin and 24-pin motherboards.", "type": "bool", "options": ["True", "False"], "correct": [0], "exp": "20+4-pin connectors let one PSU support both older 20-pin and newer 24-pin boards.", "id": "t14q3"}, {"q": "Which of the devices listed below would be required for a load-balancing setup where supplied power is split between multiple PSUs that automatically share the load and provide backup in case of a PSU failure?", "type": "single", "options": ["Standby UPS", "Redundant power supply", "Dual-power supply", "Managed PDU"], "correct": [1], "exp": "A redundant power supply setup splits load across PSUs with automatic failover.", "id": "t14q4"}, {"q": "In a modular power supply, the cables can be detached and reattached as needed, providing the flexibility to only use the cables required for the system, which helps reduce cable clutter and promotes better airflow within the computer case.", "type": "bool", "options": ["True", "False"], "correct": [0], "exp": "Modular PSUs let you use only the cables you need, reducing clutter and improving airflow.", "id": "t14q5"}, {"q": "The power output rating of a PSU is measured in a unit known as:", "type": "single", "options": ["Volt", "Hertz", "Amp", "Watt"], "correct": [3], "exp": "PSU output is rated in watts.", "id": "t14q6"}, {"q": "When selecting a PSU with energy efficiency in mind, the most important factor is the 80 PLUS certification, rating efficiency at various load levels. Higher ratings (Gold/Platinum/Titanium) mean better efficiency and lower long-term costs.", "type": "bool", "options": ["True", "False"], "correct": [0], "exp": "80 PLUS certification tiers indicate PSU efficiency, with higher tiers being more efficient.", "id": "t14q7"}, {"q": "Which of the following answers highlight key features that differentiate PCL from PostScript? (Select 3 answers)", "type": "multi", "options": ["Slower printing performance compared to PostScript due to complex processing", "Generally more efficient for high-volume, everyday printing tasks than PostScript", "Better suited for professional design, desktop publishing, and graphic arts than PostScript", "Less suited for professional graphics or highly detailed printing tasks than PostScript", "More resource-intensive than PostScript (requires more printer memory and processing power)", "Less demanding on printer memory and processing power than PostScript"], "correct": [1, 3, 5], "exp": "PCL is faster for everyday printing, less suited to detailed graphics, and less resource-intensive than PostScript.", "id": "t14q8"}, {"q": "Which of the answers listed below accurately describe PostScript? (Select 3 answers)", "type": "multi", "options": ["Less suited for professional graphics or highly detailed printing tasks than PCL", "Slower printing performance compared to PCL due to complex processing", "Better suited for professional design, desktop publishing, and graphic arts than PCL", "Generally more efficient for high-volume, everyday printing tasks than PCL", "Less demanding on printer memory and processing power than PCL", "More resource-intensive than PCL (requires more printer memory and processing power)"], "correct": [1, 2, 5], "exp": "PostScript is slower, better for professional graphics/design, and more resource-intensive than PCL.", "id": "t14q9"}, {"q": "Which of the following answers refers to software embedded within an MFD that provides basic instructions for its hardware to initialize and execute tasks?", "type": "single", "options": ["Device driver", "Middleware", "Print spooler", "Firmware"], "correct": [3], "exp": "Firmware provides the embedded instructions for MFD hardware initialization/operation.", "id": "t14q10"}, {"q": "Which of the options listed below would typically be used to set up a direct, wired connection between an MFD and a single computer host?", "type": "single", "options": ["PS/2", "RJ45", "USB", "PCIe"], "correct": [2], "exp": "USB is the standard direct wired connection between an MFD and a single host.", "id": "t14q11"}, {"q": "Which connectivity option would be the most suitable in a scenario where multiple users on a wired network need access to MFD functions?", "type": "single", "options": ["Serial port", "Ethernet", "Parallel port", "KVM switch"], "correct": [1], "exp": "Ethernet connects an MFD to the network, making it shareable by multiple wired users.", "id": "t14q12"}, {"q": "Which of the following answers refers to the most common wireless connectivity option for modern MFDs?", "type": "single", "options": ["4G/5G", "IR", "NFC", "802.11x", "RFID"], "correct": [3], "exp": "802.11x (Wi-Fi) is the most common wireless connectivity option for MFDs.", "id": "t14q13"}, {"q": "Which of the answers listed below does not describe a disadvantage related to a printer share?", "type": "single", "options": ["Each client computer needs to install the correct printer drivers for the shared printer", "Only available when the host computer is turned on and connected to the network", "Can become a bottleneck, especially with many users or large print jobs", "Typically involves a higher cost and setup complexity", "Offers limited control over user access, print quotas, and monitoring", "If the host computer crashes or has issues, the printer becomes unavailable to everyone"], "correct": [3], "exp": "A printer share is actually simple/low-cost to set up — its downsides are dependency on the host, bottlenecks, and limited control, not cost/complexity.", "id": "t14q14"}, {"q": "Which of the following solutions would ensure the highest availability of the network printing service?", "type": "single", "options": ["Printer share", "Print server", "Local network share", "Public folder"], "correct": [1], "exp": "A dedicated print server offers the highest availability compared to a simple printer share.", "id": "t14q15"}, {"q": "A printer's capability to print on both sides of a paper sheet is referred to as duplex printing.", "type": "bool", "options": ["True", "False"], "correct": [0], "exp": "Duplex printing is printing on both sides of the page.", "id": "t14q16"}, {"q": "Common printer configuration options include paper orientation settings that allow switching between Portrait mode (vertical layout) and Landscape mode (horizontal layout). Some printers may include additional orientation options, allowing the printout to be rotated by a specific degree. For most printers, the default paper orientation is Portrait mode.", "type": "bool", "options": ["True", "False"], "correct": [0], "exp": "Portrait/landscape orientation settings exist, and Portrait is the typical default.", "id": "t14q17"}, {"q": "Which printer setting allows configuration of a printout based on its paper size, type, or weight?", "type": "single", "options": ["Media type settings", "Print scaling settings", "Tray settings", "Paper orientation settings"], "correct": [2], "exp": "Tray settings configure paper size/type/weight for a given tray.", "id": "t14q18"}, {"q": "Which print quality setting typically offers the lowest resolution, fastest print speed, and most efficient toner or ink usage?", "type": "single", "options": ["Standard", "Default", "Automatic", "Draft"], "correct": [3], "exp": "Draft mode trades resolution for speed and lower ink/toner usage.", "id": "t14q19"}, {"q": "Examples of security measures that can be implemented on a multifunction device or printer include: (login auth, badging, audit logs, PIN printing)", "type": "single", "options": ["Login-based access via system software to ensure only authorized users can operate the device (user authentication)", "Integrated ID card readers requiring users to authenticate using company-issued badges (badging)", "Tracking of all printer activities, including user interactions, print jobs, and attempted access (audit logs)", "PIN printing, requiring users to enter a numeric passcode before releasing print jobs (secured prints)", "All of the above"], "correct": [4], "exp": "User authentication, badging, audit logs, and secured/PIN printing are all valid MFD security measures.", "id": "t14q20"}, {"q": "Which option allows an MFD to send a scanned document via an SMTP server?", "type": "single", "options": ["Email", "SMB", "Print from cloud", "Fax"], "correct": [0], "exp": "Scan-to-email uses SMTP to send scanned documents.", "id": "t14q21"}, {"q": "Which network scan service enables scanned documents to be saved directly to shared folders on a local network?", "type": "single", "options": ["FTP", "Local copy function", "LDAP", "SMB"], "correct": [3], "exp": "SMB (scan-to-folder) saves scanned documents to shared network folders.", "id": "t14q22"}, {"q": "A user wants to scan a document from a multifunction printer and access it remotely from a personal online storage account. Which feature should be configured?", "type": "single", "options": ["Web print service", "Scan to network folder", "Network file share", "Cloud service"], "correct": [3], "exp": "Scan-to-cloud service lets scans be accessed from a personal online storage account.", "id": "t14q23"}, {"q": "Which MFD/MFP component optimizes processing of multi-page documents?", "type": "single", "options": ["Feed assembly", "ADF", "Transfer roller", "System tray"], "correct": [1], "exp": "An ADF (Automatic Document Feeder) handles multi-page documents efficiently.", "id": "t14q24"}, {"q": "A flatbed scanner is a device that uses a flat glass surface on which documents, photos, or other materials are placed face down while a scanning mechanism moves underneath to capture the image.", "type": "bool", "options": ["True", "False"], "correct": [0], "exp": "That's an accurate description of how a flatbed scanner works.", "id": "t14q25"}]}, {"id": "test15", "label": "Test 15", "questio
