ns": [{"q": "A prepackaged set of laser printer spare parts, typically including components with a limited lifespan that must be replaced to maintain consistent performance and prevent failures, is commonly referred to as:", "type": "single", "options": ["Hardware replacement bundle", "Printer service set", "Maintenance kit", "Service component pack"], "correct": [2], "exp": "A maintenance kit bundles printer wear parts needing periodic replacement.", "id": "t15q1"}, {"q": "Before installing a new toner cartridge, it is recommended to gently rock it back and forth several times in a horizontal motion, to distribute toner powder evenly for consistent print density.", "type": "bool", "options": ["True", "False"], "correct": [0], "exp": "Rocking a new toner cartridge redistributes toner powder for even print density.", "id": "t15q2"}, {"q": "Which of the terms listed below refers to the process of adjusting a printer so that its output aligns accurately with the intended image or text and matches the expected color and print quality?", "type": "single", "options": ["Fine-tuning", "Validation", "Standardization", "Calibration"], "correct": [3], "exp": "Calibration aligns printer output with expected image, color, and quality.", "id": "t15q3"}, {"q": "Which of the following tools would be the most appropriate for cleaning the inside of a laser printer? (Select 3 answers)", "type": "multi", "options": ["Toner vacuum", "General household cleaners", "Can of compressed air", "Paper towels", "Regular vacuum", "Toner cleaning wipes", "Isopropyl alcohol"], "correct": [0, 5, 6], "exp": "Use a toner vacuum, toner cleaning wipes, and isopropyl alcohol — regular vacuums and household cleaners can damage components or spread toner.", "id": "t15q4"}, {"q": "In an inkjet printer, the replaceable component used in the process of applying color to the page is called:", "type": "single", "options": ["Thermal printhead", "Ink cartridge", "Drum unit", "Transfer ribbon"], "correct": [1], "exp": "The ink cartridge holds and applies color in an inkjet printer.", "id": "t15q5"}, {"q": "Which of the answers listed below refers to an inkjet printer component that sprays microscopic droplets of ink through nozzles to form text or images on paper?", "type": "single", "options": ["Imaging drum", "Corona wire", "Printhead", "Fuser assembly"], "correct": [2], "exp": "The printhead sprays ink droplets through nozzles onto the page.", "id": "t15q6"}, {"q": "A rubberized cylindrical component that grips and moves paper through the printing process in an inkjet printer is referred to as:", "type": "single", "options": ["Carriage", "Roller", "Feeder", "Input tray"], "correct": [1], "exp": "A roller grips and moves paper through the printer.", "id": "t15q7"}, {"q": "Which component of an inkjet printer is responsible for picking up individual sheets of paper from the input tray and feeding them into the print path?", "type": "single", "options": ["Output tray", "Feeder", "Carriage", "Transfer belt"], "correct": [1], "exp": "The feeder picks up individual sheets from the input tray.", "id": "t15q8"}, {"q": "Which of the following are valid methods for cleaning an inkjet printhead? (Select 2 answers)", "type": "multi", "options": ["Wiping the nozzles with a dry cotton swab to avoid introducing moisture", "Applying acetone to the printhead for cleaning", "Running a built-in cleaning function from the printer settings menu", "Wiping the nozzles with a lint-free cloth or swab dampened with distilled water or isopropyl alcohol", "Blowing compressed air into the nozzles at high pressure"], "correct": [2, 3], "exp": "Use the printer's built-in cleaning function or gently wipe nozzles with a dampened lint-free cloth/swab.", "id": "t15q9"}, {"q": "Most modern inkjet printers are designed to allow cartridge replacement while powered on, ensuring proper detection and alignment of new cartridges.", "type": "bool", "options": ["True", "False"], "correct": [0], "exp": "Most modern inkjets support hot-swapping ink cartridges while powered on.", "id": "t15q10"}, {"q": "What is the primary goal of inkjet calibration?", "type": "single", "options": ["To reduce ink consumption per page", "To correct color printing errors and misalignments", "To increase the speed of printing", "To ensure compatibility with third-party ink cartridges"], "correct": [1], "exp": "Calibration corrects color errors and print head alignment issues.", "id": "t15q11"}, {"q": "What should be checked for if an inkjet printer experiences frequent paper jams?", "type": "single", "options": ["Obstruction in the paper path caused by foreign objects", "Incorrect paper type or size", "Paper tray overloading", "Dirty, worn, or damaged paper feed rollers", "All of the above"], "correct": [4], "exp": "Obstructions, wrong paper, overloaded trays, and worn rollers can all cause jams — all of these.", "id": "t15q12"}, {"q": "Which of the answers listed below refers to a thermal printer's component responsible for moving paper through the printer during the printing process?", "type": "single", "options": ["Transfer belt", "Paper guide", "Feed assembly", "Platen roller"], "correct": [2], "exp": "The feed assembly moves paper through a thermal printer.", "id": "t15q13"}, {"q": "Which of the following steps are part of the feed assembly maintenance procedure? (Select 3 answers)", "type": "multi", "options": ["Replace the thermal paper roll", "Clean the heating element with isopropyl alcohol", "Reset the printer settings to factory defaults", "Inspect the feed assembly for worn-out or misaligned rollers", "Clean the rollers with a lint-free cloth and isopropyl alcohol to remove dust and debris", "If paper feeding issues persist, consider replacing the feed rollers"], "correct": [3, 4, 5], "exp": "Feed assembly maintenance includes inspecting/cleaning rollers and replacing them if problems persist.", "id": "t15q14"}, {"q": "Thermal printers use a special type of paper coated with a heat-sensitive layer that responds to the heat of the printhead. When heated, this layer darkens, enabling the printer to produce text or images without using ink or toner.", "type": "bool", "options": ["True", "False"], "correct": [0], "exp": "Thermal paper darkens with heat, needing no ink or toner.", "id": "t15q15"}, {"q": "Maintaining a thermal printer involves storing paper away from heat/sunlight, cleaning the heating element with isopropyl alcohol, and removing dust/debris from rollers and feed areas.", "type": "bool", "options": ["True", "False"], "correct": [0], "exp": "These are all valid thermal printer maintenance practices.", "id": "t15q16"}, {"q": "Which printer type uses an inked ribbon to create text or images on paper?", "type": "single", "options": ["Inkjet", "Thermal", "Impact", "Laser"], "correct": [2], "exp": "Impact printers strike an inked ribbon against paper to create images.", "id": "t15q17"}, {"q": "Which type of printing paper is designed to create duplicate copies during the printing process?", "type": "single", "options": ["Thermal", "Duplex", "Multipart", "None of the above"], "correct": [2], "exp": "Multipart paper creates duplicate copies during impact printing.", "id": "t15q18"}, {"q": "Which of the signs listed below may indicate that a printer ribbon needs replacement? (Select 2 answers)", "type": "multi", "options": ["Faded or light print output", "Repetitive smudging of characters", "Frequent paper jams", "Characters appearing incomplete", "Paper feeding too slowly"], "correct": [0, 3], "exp": "A worn ribbon typically causes faded print and incomplete characters.", "id": "t15q19"}, {"q": "Which of the following symptoms may indicate a failing impact printer printhead? (Select 3 answers)", "type": "multi", "options": ["Vertical lines or dots are missing in printouts", "Misaligned printed output due to incorrect paper feed", "Printed characters or images appear faint or with inconsistent darkness", "Horizontal lines or dots are missing in printouts", "Excessive noise during printer operation"], "correct": [0, 2, 3], "exp": "A failing printhead shows missing lines/dots (vertical or horizontal) and inconsistent print darkness.", "id": "t15q20"}, {"q": "Which best practices should be followed when handling paper for an impact printer? (Select 2 answers)", "type": "multi", "options": ["Adjust the printhead tension to optimize paper feeding", "Ensure perforated edges are properly positioned for continuous feeding", "Align paper correctly in the tractor feed mechanism", "Ensure the ribbon is well-saturated with ink before loading paper", "Remove the perforated edges before printing to ensure smooth paper feeding"], "correct": [1, 2], "exp": "Impact printer paper handling: align perforated edges correctly and use the tractor feed mechanism properly.", "id": "t15q21"}, {"q": "What are the primary benefits of using a sandboxed environment in virtualization? (Select 2 answers)", "type": "multi", "options": ["Enabling cross-platform application development", "Sharing resources between multiple virtual machines", "Isolating untrusted software or code to prevent damage to the host system", "Analyzing malware in a controlled environment", "Running multiple operating systems on a single physical machine"], "correct": [2, 3], "exp": "Sandboxing isolates untrusted code and enables safe malware analysis.", "id": "t15q22"}, {"q": "A software developer needs to test a new application feature that might introduce instability. Using virtualization, what is the most appropriate way to isolate this task?", "type": "single", "options": ["Create a virtual machine as a sandbox specifically for testing this feature", "Use a dual-boot system to test the feature on a separate partition", "Host the application on a networked virtual machine shared by multiple users", "Create a snapshot of the production environment and test the feature within it"], "correct": [0], "exp": "A dedicated sandbox VM isolates instability risk from the rest of the system.", "id": "t15q23"}, {"q": "Which features make virtual machines well-suited for testing new software? (Select 2 answers)", "type": "multi", "options": ["Ability to revert to a previous state using snapshots", "Support for software compatibility checks across multiple OS setups", "Real-time monitoring of system resource usage", "Scaling of computing resources for better performance", "Automatic reduction of software licensing costs"], "correct": [0, 1], "exp": "Snapshots (revert capability) and multi-OS compatibility testing make VMs great for software testing.", "id": "t15q24"}, {"q": "What is the primary purpose of application virtualization?", "type": "single", "options": ["To emulate computer hardware for running different operating systems", "To remove all hardware limitations from software execution", "To permanently reduce software licensing costs", "To run software without installing it directly on the host operating system"], "correct": [3], "exp": "Application virtualization lets software run without being directly installed on the host OS.", "id": "t15q25"}]}, {"id": "test16", "label": "Test 16", "questions": [{"q": "A company needs to run accounting software designed for Windows XP on a Windows 11 host. What would be the most practical modern solution?", "type": "single", "options": ["Enable compatibility mode for Windows XP within Windows 11", "Replace the legacy app with a modern accounting software package", "Run Windows XP in a dual-boot configuration alongside Windows 11", "Install Windows XP in a virtual machine on the current system"], "correct": [3], "exp": "Running legacy Windows XP in a VM is the most practical modern solution.", "id": "t16q1"}, {"q": "What is the primary advantage of using cross-platform virtualization?", "type": "single", "options": ["Running multiple operating systems simultaneously", "Enabling software to run on an unsupported operating system", "Allowing virtual machines to run without a host OS", "Providing direct hardware access for legacy applications"], "correct": [1], "exp": "Cross-platform virtualization lets software run on an OS it wasn't originally built for.", "id": "t16q2"}, {"q": "Which of the answers listed below refer to common examples of cross-platform virtualization in practice? (Select 3 answers)", "type": "multi", "options": ["Running macOS in a virtual machine on a Windows host", "Using virtualized Android environment on a Windows or macOS host", "Accessing cloud-hosted Windows desktops from a macOS system", "Running a web application in a browser on different operating systems", "Accessing cloud-hosted macOS desktops from a Windows system", "Running Windows in a virtual machine on a macOS host"], "correct": [0, 1, 5], "exp": "Cross-platform virtualization examples: macOS-on-Windows VM, Android emulation, and Windows-on-macOS VM.", "id": "t16q3"}, {"q": "What security practice helps to limit the potential impact of a compromised virtual machine on other VMs and the host?", "type": "single", "options": ["Using multi-factor authentication for hypervisor access", "Ensuring proper isolation between virtual machines", "Conducting regular vulnerability scans of the virtual machines", "Implementing intrusion detection systems on the network"], "correct": [1], "exp": "Proper VM isolation limits how far a compromise can spread.", "id": "t16q4"}, {"q": "What is a common method for managing access and permissions within a virtualized infrastructure?", "type": "single", "options": ["Deploying a host-based firewall on each virtual machine", "Installing antivirus software on all virtual machines", "Utilizing the access control features of the hypervisor", "Encrypting data in transit between virtual machines"], "correct": [2], "exp": "Hypervisor-level access controls manage permissions across the virtualized infrastructure.", "id": "t16q5"}, {"q": "Enforcing strong password protection on the hypervisor management interface is less critical than applying the same level of password security to individual virtual machines.", "type": "bool", "options": ["True", "False"], "correct": [1], "exp": "Hypervisor management access is more critical to secure — it controls every VM underneath it.", "id": "t16q6"}, {"q": "Keeping the hypervisor software up to date primarily helps to protect against:", "type": "single", "options": ["Accidental data loss within virtual machines", "Performance bottlenecks within virtual machines", "Known security vulnerabilities", "Unauthorized access to guest operating systems"], "correct": [2], "exp": "Hypervisor updates primarily patch known security vulnerabilities.", "id": "t16q7"}, {"q": "Which of the following answers refer to a virtual machine in a bridged networking configuration? (Select 3 answers)", "type": "multi", "options": ["The VM receives its TCP/IP configuration settings from a virtual DHCP server managed by the hypervisor", "The VM's network adapter is connected directly to the physical network through the host's network interface", "The VM's private address is not advertised on the LAN preventing direct inbound connections", "The VM can communicate directly with all other devices on the physical network and the Internet, just like any other physical machine", "The VM obtains its TCP/IP configuration settings directly from the DHCP server on the physical network", "The VM uses the IP address of the host machine for outbound communication via NAT"], "correct": [1, 3, 4], "exp": "Bridged mode connects the VM directly to the physical network, getting its own IP from the real DHCP server, acting like a physical machine.", "id": "t16q8"}, {"q": "Which of the answers listed below refer to a virtual machine in a shared networking configuration? (Select 3 answers)", "type": "multi", "options": ["The VM's network adapter is connected directly to the physical network through the host's network interface", "The VM receives its TCP/IP configuration settings from a virtual DHCP server managed by the hypervisor", "The VM can communicate directly with all other devices on the physical network and the Internet, just like any other physical machine", "The VM uses the IP address of the host machine for outbound communication via NAT", "The VM's private address is not advertised on the LAN preventing direct inbound connections", "The VM obtains its TCP/IP configuration settings directly from the DHCP server on the physical network"], "correct": [1, 3, 4], "exp": "Shared (NAT) mode uses a virtual DHCP server, routes outbound via the host's IP through NAT, and hides the VM from direct inbound LAN access.", "id": "t16q9"}, {"q": "Which of the following are critical factors for storage performance in a virtualized environment? (Select 2 answers)", "type": "multi", "options": ["High IOPS", "Low CPU utilization", "File system type", "Low latency", "Hypervisor type"], "correct": [0, 3], "exp": "High IOPS and low latency are the key storage performance factors in virtualization.", "id": "t16q10"}, {"q": "What is the key benefit of using SSDs in virtualized environments?", "type": "single", "options": ["Compact form factor", "Fast read/write speeds", "High capacity", "Low cost per terabyte of storage"], "correct": [1], "exp": "SSDs' fast read/write speeds are the key benefit in virtualized environments.", "id": "t16q11"}, {"q": "Which of the answers listed below refers to a virtualization platform used to deliver virtual desktops to multiple users?", "type": "single", "options": ["VDE", "VNC", "VDI", "RDP"], "correct": [2], "exp": "VDI (Virtual Desktop Infrastructure) delivers virtual desktops to multiple users.", "id": "t16q12"}, {"q": "What is a container in virtualization?", "type": "single", "options": ["A dedicated partition used to store virtual machines", "A virtualized environment that runs operating systems and applications", "A security feature that prevents unauthorized users from accessing virtual machines", "A portable package containing an app and everything it needs to run"], "correct": [3], "exp": "A container packages an app with everything needed to run, portably.", "id": "t16q13"}, {"q": "Which of the following answers best describes a Type 1 hypervisor?", "type": "single", "options": ["A hypervisor that requires an OS to run virtual machines", "A hypervisor that runs as an application on a host OS", "A hypervisor type commonly used in personal desktop environments", "A hypervisor that runs directly on the hardware"], "correct": [3], "exp": "A Type 1 (bare-metal) hypervisor runs directly on the hardware, no host OS needed.", "id": "t16q14"}, {"q": "What potential performance limitation might a Type 2 hypervisor experience compared to a Type 1 hypervisor?", "type": "single", "options": ["Inability to run multiple virtual machines", "Restriction on the amount of RAM allocated to VMs", "Overhead from the host operating system consuming resources", "Lack of support for certain types of hardware"], "correct": [2], "exp": "Type 2 hypervisors run atop a host OS, which adds resource overhead compared to bare-metal Type 1.", "id": "t16q15"}, {"q": "Which of the answers listed below best describes a private cloud?", "type": "single", "options": ["A cloud infrastructure that is exclusively used by a single organization", "A cloud environment where several organizations collaborate and share resources", "A cloud computing model that blends internal resources with public services", "A cloud platform that offers on-demand access for various organizations"], "correct": [0], "exp": "A private cloud is dedicated exclusively to one organization.", "id": "t16q16"}, {"q": "What type of entities would typically use a private cloud?", "type": "single", "options": ["Small businesses looking to reduce costs", "Public service providers", "Organizations with strict compliance and security requirements", "Anyone seeking to make use of cloud storage"], "correct": [2], "exp": "Organizations needing strict compliance/security control typically prefer private cloud.", "id": "t16q17"}, {"q": "Which of the following answers refers to a cloud deployment model where computing resources (such as servers, storage, and applications) are owned and operated by a third-party cloud service provider and shared across multiple organizations or tenants?", "type": "single", "options": ["Hybrid cloud", "Private cloud", "Community cloud", "Public cloud"], "correct": [3], "exp": "Public cloud resources are third-party owned and shared across tenants.", "id": "t16q18"}, {"q": "Which of the answers listed below best defines a hybrid cloud?", "type": "single", "options": ["A model that offers on-demand access to shared public resources", "A model that pools resources exclusively among organizations with shared interests", "A model that integrates both private and public cloud resources", "A model that dedicates the entire infrastructure to one organization"], "correct": [2], "exp": "A hybrid cloud integrates both private and public cloud resources.", "id": "t16q19"}, {"q": "What is the primary advantage of a hybrid cloud?", "type": "single", "options": ["Allows for shared infrastructure between organizations", "Combines the benefits of private and public cloud deployment models", "Offers dedicated infrastructure for a single organization", "Provides enhanced control over security and privacy"], "correct": [1], "exp": "Hybrid cloud combines the strengths of both private and public cloud models.", "id": "t16q20"}, {"q": "A type of cloud infrastructure shared by several organizations with similar security, compliance, or industry requirements is known as:", "type": "single", "options": ["Federated cloud", "Distributed cloud", "Shared cloud", "Community cloud"], "correct": [3], "exp": "A community cloud is shared by organizations with similar requirements.", "id": "t16q21"}, {"q": "Which of the following answers refer to example implementations of the community cloud deployment model? (Select 3 answers)", "type": "multi", "options": ["A federated cloud infrastructure connecting multiple independent providers", "A cloud environment developed for universities conducting joint research projects", "A shared cloud used by several government agencies", "A cloud-based solution for public safety organizations with similar data handling policies", "A multinational cloud infrastructure using separate private clouds in each region"], "correct": [1, 2, 3], "exp": "Universities collaborating, government agencies sharing infrastructure, and public safety orgs with similar policies are all community cloud examples.", "id": "t16q22"}, {"q": "Which of the answers listed below refers to a cloud computing service model where clients, instead of buying hardware and software, access computing infrastructure as an outsourced service from suppliers who own and maintain all the necessary equipment and software?", "type": "single", "options": ["SaaS", "DaaS", "PaaS", "IaaS"], "correct": [3], "exp": "IaaS provides outsourced computing infrastructure as a service.", "id": "t16q23"}, {"q": "A cloud computing service model that provides users with remote access to applications over the Internet on a subscription basis is called:", "type": "single", "options": ["PaaS", "SaaS", "IaaS", "DaaS"], "correct": [1], "exp": "SaaS provides subscription-based remote access to applications.", "id": "t16q24"}, {"q": "Which cloud computing service model would provide the best solution for a web developer intending to create a web app?", "type": "single", "options": ["DaaS", "SaaS", "PaaS", "IaaS"], "correct": [2], "exp": "PaaS gives developers a platform to build and deploy web apps without managing underlying infrastructure.", "id": "t16q25"}]}, {"id": "test17", "label": "Test 17", "questions": [{"q": "Which cloud deployment model primarily relies on the concept of shared resources?", "type": "single", "options": ["Private cloud", "Hybrid cloud", "Dedicated cloud", "Public cloud"], "correct": [3], "exp": "Public cloud relies on shared, multi-tenant resources.", "id": "t17q1"}, {"q": "Which of the following is a key benefit of utilizing shared resources in cloud computing?", "type": "single", "options": ["Enhanced security through isolation", "Full control over the physical infrastructure", "Lower costs due to economies of scale", "Predictable and consistent performance"], "correct": [2], "exp": "Shared resources lower costs via economies of scale.", "id": "t17q2"}, {"q": "What is a potential drawback of using shared resources in a cloud environment?", "type": "single", "options": ["Possible performance degradation during high demand periods", "Difficulty in managing multiple cloud instances simultaneously", "Inability to scale resources up or down based on demand", "More complex management of the underlying infrastructure for the user"], "correct": [0], "exp": "Shared resources can suffer performance degradation during peak demand from other tenants.", "id": "t17q3"}, {"q": "Which of the answers listed below describe effects of using dedicated resources in cloud computing? (Select 3 answers)", "type": "multi", "options": ["Performance degradation during peak usage", "Consistent and reliable performance", "Higher, fixed costs regardless of resource use", "Cost-effective pay-as-you-go pricing", "Reliance on provider's security controls", "Greater control and stronger data isolation"], "correct": [1, 2, 5], "exp": "Dedicated resources bring consistent performance, higher fixed costs, and greater control/isolation.", "id": "t17q4"}, {"q": "Which cloud deployment model most commonly relies on dedicated resources?", "type": "single", "options": ["Public cloud", "Community cloud", "Hybrid cloud", "Private cloud"], "correct": [3], "exp": "Private cloud typically relies on dedicated resources for one organization.", "id": "t17q5"}, {"q": "In cloud computing, metered utilization refers to a billing model where customers are charged based on actual resource consumption.", "type": "bool", "options": ["True", "False"], "correct": [0], "exp": "Metered billing charges based on actual usage, like a utility.", "id": "t17q6"}, {"q": "Which of the following are the core components of metered billing in cloud services? (Select 2 answers)", "type": "multi", "options": ["Volume of ingress data", "The number of API calls made to the service", "Power consumption levels", "Volume of egress data", "Number of database transactions processed"], "correct": [0, 3], "exp": "Metered billing commonly tracks ingress and egress data volume.", "id": "t17q7"}, {"q": "In the context of metered utilization, what does the term egress refer to?", "type": "single", "options": ["Data download speed", "Data upload speed", "Data leaving cloud", "Data entering cloud"], "correct": [2], "exp": "Egress is data leaving the cloud environment.", "id": "t17q8"}, {"q": "Under a metered utilization model, ingress is defined as:", "type": "single", "options": ["Data transfer speed into the cloud", "Data entering the cloud environment", "Data transfer speed from the cloud", "Data leaving the cloud environment"], "correct": [1], "exp": "Ingress is data entering the cloud environment.", "id": "t17q9"}, {"q": "Elasticity in cloud computing ensures that resource allocation adjusts automatically based on demand, increasing resources when usage spikes and scaling down during periods of low demand, minimizing over- or under-provisioning.", "type": "bool", "options": ["True", "False"], "correct": [0], "exp": "Elasticity auto-scales resources up/down with demand to avoid over/under-provisioning.", "id": "t17q10"}, {"q": "What is the goal of availability in cloud computing?", "type": "single", "options": ["Synchronizing data across multiple user devices in real time", "Allowing multiple users to share the same resources", "Dynamically scaling resources based on demand", "Ensuring services are accessible with minimal interruption"], "correct": [3], "exp": "Availability aims to keep services accessible with minimal downtime.", "id": "t17q11"}, {"q": "Which metric is most commonly used to represent the availability of a cloud service?", "type": "single", "options": ["Outage duration", "Error rate percentage", "Network packet loss rate", "Uptime percentage"], "correct": [3], "exp": "Uptime percentage is the standard metric for cloud service availability.", "id": "t17q12"}, {"q": "Which term refers to the formal agreement specifying availability guarantees between a cloud service provider and a customer?", "type": "single", "options": ["BPA", "EULA", "SLA", "MSA"], "correct": [2], "exp": "An SLA (Service Level Agreement) specifies availability guarantees.", "id": "t17q13"}, {"q": "Which of the answers listed below best describes file synchronization in a cloud environment?", "type": "single", "options": ["Maintaining a version history for documents stored online", "Reflecting file edits made on one device across all other connected devices", "Allowing multiple users to simultaneously edit different sections of a shared online document", "Transferring file documents between different cloud service providers"], "correct": [1], "exp": "File sync propagates edits made on one device to all other connected devices.", "id": "t17q14"}, {"q": "Which cloud computing feature enables several customers to share a single software deployment without accessing each other's data?", "type": "single", "options": ["Multitenancy", "Elasticity", "Dynamic provisioning", "Load balancing"], "correct": [0], "exp": "Multitenancy lets multiple customers share one deployment while keeping their data isolated.", "id": "t17q15"}, {"q": "A Power-On Self-Test (POST) is a diagnostic sequence run by a computer's BIOS or UEFI when the system is powered on. It checks whether essential hardware components are functioning correctly before attempting to load the operating system. If an issue is detected during POST, the BIOS typically reports the error through a series of audible beeps. Since beep code meanings are highly specific to each BIOS manufacturer, there is no universal standard across vendors. Troubleshooting POST beeps begins by identifying the motherboard's BIOS manufacturer. This information is usually displayed briefly on the screen during the initial startup phase (it can also be found in the motherboard manual or by looking up the motherboard model online). Once the appropriate beep code chart is located, the pattern of beeps (such as the number, duration, and spacing) can help identify the faulty component for targeted troubleshooting.", "type": "bool", "options": ["True", "False"], "correct": [0], "exp": "POST beep codes are indeed manufacturer-specific, so ID the BIOS vendor first when troubleshooting.", "id": "t17q16"}, {"q": "BSoD appears when Windows hits a critical unrecoverable error. Earlier versions showed error code/memory address/driver name; Windows 8+ shows a simplified message, stop code, URL, and QR code. Recovery requires a restart.", "type": "bool", "options": ["True", "False"], "correct": [0], "exp": "This accurately describes BSoD behavior/evolution and the need for a restart to recover.", "id": "t17q17"}, {"q": "When a blank screen appears after startup, check power/monitor connections first, then reseat RAM/GPU, confirm CPU install, and clear CMOS if needed.", "type": "bool", "options": ["True", "False"], "correct": [0], "exp": "That's the correct blank-screen troubleshooting sequence: power/connections first, then hardware reseating/CMOS reset.", "id": "t17q18"}, {"q": "Which of these external checks would be useful when troubleshooting a PC that shows no signs of receiving power?", "type": "single", "options": ["Ensure that the power cord is securely connected to both the wall outlet and the PSU", "Confirm that the outlet is delivering power by testing it with another device or using a circuit tester", "Examine the power cord for physical damage or fraying", "Verify that any surge protector or power strip is turned on and functioning properly", "Plug the system directly into the wall outlet to eliminate the surge protector as a factor", "All of the above"], "correct": [5], "exp": "All these external power checks are valid first steps — all of the above.", "id": "t17q19"}, {"q": "Which of the following actions might be of help when troubleshooting a PSU that fails to power on?", "type": "single", "options": ["Confirming that the PSU's power switch (usually located on the back of the unit) is turned on", "Inspecting the PSU for any signs of physical damage, burning smells, or unusual noises", "Performing a paperclip test (ATX jumper test) to verify PSU fan activation", "Testing the PSU with a PSU tester or replacing it temporarily with a known-good unit", "All of the above"], "correct": [4], "exp": "All these PSU checks are valid troubleshooting steps — all of the above.", "id": "t17q20"}, {"q": "Which internal power delivery checks would be useful when troubleshooting a PC that is not powering on?", "type": "single", "options": ["Performing a visual inspection of internal components for signs of damage, such as burnt components or leaking capacitors", "Ensuring that the motherboard is installed correctly with no grounding issues (e.g., misplaced standoffs)", "Confirming that the CPU is properly aligned, securely locked, free from damage and debris, and in optimal contact with the cooling solution", "Ensuring that all internal power connectors (main ATX, CPU, GPU, and any additional connectors) are firmly seated on the motherboard", "Verifying that the power button cable from the case is correctly connected to the appropriate motherboard header", "Trying a minimal boot configuration (CPU, GPU, and a single RAM module) to determine if any additional component is causing a conflict that prevents power from being delivered or recognized", "All of the above"], "correct": [6], "exp": "All these internal checks are valid troubleshooting steps for a non-powering PC — all of the above.", "id": "t17q21"}, {"q": "Which motherboard-related issue can result in degraded performance without triggering errors or shutdowns?", "type": "single", "options": ["Corrupted BIOS/UEFI firmware", "Swollen/leaking capacitors", "Improperly seated CPU", "Disconnected ATX power cable"], "correct": [1], "exp": "Swollen/leaking capacitors can quietly degrade performance without triggering obvious errors.", "id": "t17q22"}, {"q": "During heavy multitasking, disk activity light stays lit constantly, apps load slowly, system feels sluggish, and monitoring shows heavy paging (frequent disk swaps). What is the most likely cause?", "type": "single", "options": ["Overheating of the CPU", "Background antivirus scan", "Faulty disk controller", "Insufficient amount of RAM"], "correct": [3], "exp": "Heavy paging to disk points to insufficient RAM, forcing the system to swap constantly.", "id": "t17q23"}, {"q": "What are the likely effects of mixing RAM modules of different sizes and speeds on system performance? (Select 2 answers)", "type": "multi", "options": ["The system will use the total combined memory size of all installed RAM modules", "The system will automatically downgrade performance to the speed of the slowest RAM module", "The system will use only the fastest RAM module to compensate for slower performance", "The system will prioritize the RAM module with the highest capacity", "The result of mixing RAM modules of different sizes will not affect system performance"], "correct": [0, 1], "exp": "Mixed RAM: total capacity is combined, but all modules run at the speed of the slowest one.", "id": "t17q24"}, {"q": "A CPU is operating well below its advertised speed, resulting in slow system response. The BIOS displays the correct CPU model but reports a lower frequency than expected. Which setting could cause this behavior?", "type": "single", "options": ["Incorrect fan speed control settings", "Enabled power-saving mode", "Disabled CPU temperature monitoring", "Enabled CPU thermal throttling protection"], "correct": [1], "exp": "A power-saving mode can intentionally clock the CPU down below its rated speed.", "id": "t17q25"}]}, {"id": "test18", "label": "Test 18", "questions": [{"q": "After upgrading a gaming PC with a high-performance GPU, the user notices sluggish in-game performance, system instability, unexpected shutdowns, and random reboots under heavy load. What is the most likely cause?", "type": "single", "options": ["Overheating CPU", "Faulty GPU", "Overloaded PSU", "Insufficient RAM"], "correct": [2], "exp": "A new higher-draw GPU can overload an underrated PSU, causing instability under load.", "id": "t18q1"}, {"q": "Task Manager's Performance tab identifies hardware bottlenecks; the Processes tab identifies compute-intensive apps causing sluggish performance.", "type": "bool", "options": ["True", "False"], "correct": [0], "exp": "Task Manager's Performance and Processes tabs are used exactly this way to diagnose slowdowns.", "id": "t18q2"}, {"q": "Excessive dust buildup inside the computer case might be the cause of overheating, which in turn may lead to:", "type": "single", "options": ["Sluggish performance", "Frequent system crashes", "Unexpected shutdowns", "Irreversible hardware damage", "All of the above"], "correct": [4], "exp": "Overheating from dust buildup can cause all of these symptoms — all of the above.", "id": "t18q3"}, {"q": "Which of the symptoms listed below is most likely a direct result of overheating?", "type": "single", "options": ["Reduced cooling efficiency", "Application crashes", "Random system shutdowns", "Blank screen during boot"], "correct": [2], "exp": "Random shutdowns are a classic direct symptom of thermal protection kicking in.", "id": "t18q4"}, {"q": "What is thermal throttling in relation to CPU overheating?", "type": "single", "options": ["The CPU increasing fan speed to cool down", "The CPU reducing its operating speed to avoid damage", "The PSU reducing voltage to the CPU", "The CPU entering a low-power state to reduce energy consumption"], "correct": [1], "exp": "Thermal throttling reduces CPU speed to prevent heat damage.", "id": "t18q5"}, {"q": "What is the most appropriate immediate action when a burning smell is detected coming from a computer case?", "type": "single", "options": ["Disconnect all external devices and peripherals", "Inspect physical components for burn marks or discoloration", "Disable performance-boosting features in the OS to mitigate heat", "Shut down the system and unplug it from a power source"], "correct": [3], "exp": "A burning smell calls for immediately shutting down and unplugging the system for safety.", "id": "t18q6"}, {"q": "Which of the following could lead to unexpected shutdowns in a computer system?", "type": "single", "options": ["Dust buildup restricting airflow", "Overheating CPU/GPU", "Memory errors or failing RAM modules", "Failing or underpowered PSU", "Software corruption or misconfiguration", "All of the above"], "correct": [5], "exp": "All of these can trigger unexpected shutdowns — all of the above.", "id": "t18q7"}, {"q": "Which of the actions listed below can help maintain system stability and prevent hardware-related crashes?", "type": "single", "options": ["Cleaning internal components with compressed air to remove dust buildup", "Replacing or reapplying CPU thermal paste as needed", "Conducting memory diagnostics tests", "Installing a PSU that meets or exceeds power requirements", "All of the above"], "correct": [4], "exp": "Cleaning, reapplying thermal paste, memory diagnostics, and a properly sized PSU all help — all of the above.", "id": "t18q8"}, {"q": "Which of the following tools in Windows can help troubleshoot unresponsive apps and identify potential causes of application crashes?", "type": "single", "options": ["Event Viewer", "Task Manager", "Reliability Monitor", "All of the above"], "correct": [3], "exp": "Event Viewer, Task Manager, and Reliability Monitor all help diagnose app crashes — all of the above.", "id": "t18q9"}, {"q": "A user reports a popping sound from their computer, followed by it shutting down. What is the most probable cause?", "type": "single", "options": ["Failing hard drive", "Power surge from the wall outlet", "Static electricity discharge", "Blown capacitor"], "correct": [3], "exp": "A pop followed by shutdown is a classic sign of a blown capacitor.", "id": "t18q10"}, {"q": "A visual inspection of a motherboard reveals a capacitor with a rounded top. What is the best course of action?", "type": "single", "options": ["Use a voltage meter to test the capacitor's charge", "Gently press down on the top of the capacitor", "Ignore it unless the system starts showing problems", "Replace the motherboard or affected component"], "correct": [3], "exp": "A bulging/rounded capacitor is failing — replace the affected component or motherboard.", "id": "t18q11"}, {"q": "What should be done if a computer's system date and time reset every time it is powered off, despite being set correctly in the OS?", "type": "single", "options": ["Verify CMOS jumper settings", "Enable automatic time synchronization", "Update the system BIOS firmware", "Replace the CMOS battery"], "correct": [3], "exp": "A dying CMOS battery causes the date/time to reset on power-off.", "id": "t18q12"}, {"q": "Solid green — match to its common meaning (RAID drive LED state).", "type": "single", "options": ["Drive is powered and operating normally", "Drive is actively reading, writing, or rebuilding data", "Drive requires attention (typically indicates a warning, degraded state, or pending failure)", "Drive has failed or encountered a critical error", "Drive is unpowered, missing, or not properly connected"], "correct": [0], "exp": "Solid green means the drive is powered and operating normally.", "id": "t18q13"}, {"q": "Blinking green — match to its common meaning (RAID drive LED state).", "type": "single", "options": ["Drive is powered and operating normally", "Drive is actively reading, writing, or rebuilding data", "Drive requires attention (typically indicates a warning, degraded state, or pending failure)", "Drive has failed or encountered a critical error", "Drive is unpowered, missing, or not properly connected"], "correct": [1], "exp": "Blinking green means the drive is actively reading, writing, or rebuilding.", "id": "t18q14"}, {"q": "Solid amber/orange — match to its common meaning (RAID drive LED state).", "type": "single", "options": ["Drive is powered and operating normally", "Drive is actively reading, writing, or rebuilding data", "Drive requires attention (typically indicates a warning, degraded state, or pending failure)", "Drive has failed or encountered a critical error", "Drive is unpowered, missing, or not properly connected"], "correct": [2], "exp": "Solid amber/orange means the drive needs attention — a warning or degraded state.", "id": "t18q15"}, {"q": "Solid red — match to its common meaning (RAID drive LED state).", "type": "single", "options": ["Drive is powered and operating normally", "Drive is actively reading, writing, or rebuilding data", "Drive requires attention (typically indicates a warning, degraded state, or pending failure)", "Drive has failed or encountered a critical error", "Drive is unpowered, missing, or not properly connected"], "correct": [3], "exp": "Solid red means the drive has failed or hit a critical error.", "id": "t18q16"}, {"q": "No LED activity — match to its common meaning (RAID drive LED state).", "type": "single", "options": ["Drive is powered and operating normally", "Drive is actively reading, writing, or rebuilding data", "Drive requires attention (typically indicates a warning, degraded state, or pending failure)", "Drive has failed or encountered a critical error", "Drive is unpowered, missing, or not properly connected"], "correct": [4], "exp": "No LED activity means the drive is unpowered, missing, or not properly connected.", "id": "t18q17"}, {"q": "Grinding noises usually indicate mechanical wear/damage; clicking sounds often signal read/write head failures. In both cases, back up data and replace the drive.", "type": "bool", "options": ["True", "False"], "correct": [0], "exp": "Grinding/clicking are serious mechanical symptoms — back up data immediately and plan a drive replacement.", "id": "t18q18"}, {"q": "Grinding noises and clicking sounds are problem symptoms exclusive to:", "type": "single", "options": ["RAM drives", "SSD drives", "HDD drives", "USB drives"], "correct": [2], "exp": "Grinding/clicking noises are exclusive to mechanical HDDs (moving parts).", "id": "t18q19"}, {"q": "Which troubleshooting actions would be advisable when the system reports that it cannot find a bootable drive? (Select all that apply)", "type": "multi", "options": ["Confirm the drive is visible within the system setup interface", "Examine the physical connections and cables to the drive", "Disconnect any removable external drives (e.g., USB thumb drives)", "Reconfigure the system to use the correct drive as the first boot option", "Disable unused USB ports in the BIOS/UEFI settings"], "correct": [0, 1, 2, 3], "exp": "Check BIOS drive visibility, cabling, remove external drives, and correct the boot order.", "id": "t18q20"}, {"q": "During startup, a computer displays a \"No bootable devices found\" message. Troubleshooting reveals a misconfigured boot sequence. Where can a technician adjust the boot device order?", "type": "single", "options": ["Disk Management utility", "BIOS/UEFI settings", "OS boot loader", "Windows Command Prompt"], "correct": [1], "exp": "Boot device order is configured in BIOS/UEFI settings.", "id": "t18q21"}, {"q": "Which proactive measure helps minimize data loss due to drive corruption?", "type": "single", "options": ["Daily system restore points", "Automated file integrity checks", "Periodic disk defragmentation", "Scheduled full disk backups"], "correct": [3], "exp": "Scheduled full backups are the most reliable protection against data loss from drive corruption.", "id": "t18q22"}, {"q": "A technician discovers that critical files in a RAID configuration are becoming corrupted and some data is missing. Which troubleshooting action should be performed first to determine if the drives are failing?", "type": "single", "options": ["Check the RAID controller firmware for updates and compatibility", "Review operating system logs for disk-related errors", "Evaluate the storage devices' self-monitoring diagnostic data for anomalies", "Back up all data before initiating any troubleshooting steps"], "correct": [2], "exp": "Checking S.M.A.R.T. diagnostic data is the direct way to determine if drives are failing.", "id": "t18q23"}, {"q": "Which of the steps listed below are not considered best practice when addressing a RAID array that has failed? (Select 2 answers)", "type": "multi", "options": ["Access the RAID controller utility to review logs of events, errors, and drive status", "Check power and data cables to ensure no drive appears failed due to a loose or disconnected cable", "Verify the integrity of existing backups before attempting any repairs or rebuilds", "Replace the faulty drive with a component of the same or greater capacity and compatible specifications", "Force the RAID configuration to auto-rebuild by cycling power repeatedly", "Delete the current RAID configuration and rebuild the array from scratch"], "correct": [4, 5], "exp": "Power-cycling to force a rebuild or deleting/rebuilding from scratch are bad practices that risk further data loss.", "id": "t18q24"}, {"q": "Restoring a RAID array after physical failure of one of the drives may involve replacing the failed drive. This method applies to most RAID configurations except for:", "type": "single", "options": ["RAID 0", "RAID 1", "RAID 5", "RAID 6", "RAID 10"], "correct": [0], "exp": "RAID 0 has no redundancy, so a failed drive means total data loss — simple replacement doesn't recover it.", "id": "t18q25"}, {"q": "What is the primary purpose of S.M.A.R.T. in a storage media drive?", "type": "single", "options": ["Automatic correction of detected drive errors", "Real-time monitoring and regulation of power consumption", "Prediction and reporting of impending drive failures", "Optimization of drive read/write speeds"], "correct": [2], "exp": "S.M.A.R.T. predicts and reports impending drive failures.", "id": "t18q26"}, {"q": "What should be the recommended course of action after receiving a S.M.A.R.T. failure prediction error message? (Select 2 answers)", "type": "multi", "options": ["Rebuilding the RAID array", "Backing up data", "Rolling back to the last system restore point", "Clearing system logs to verify if the error persists", "Replacing the drive"], "correct": [1, 4], "exp": "On a S.M.A.R.T. warning, back up data immediately and plan to replace the drive.", "id": "t18q27"}, {"q": "A technician notices longer than normal file transfer times on a system using a mechanical hard drive. What is the first diagnostic action they should consider?", "type": "single", "options": ["Run disk cleanup utility", "Check network adapter settings", "Perform disk defragmentation", "Adjust paging file size"], "correct": [2], "exp": "Defragmentation is a first diagnostic/remedial step for slow HDD file transfers.", "id": "t18q28"}, {"q": "Which of the following metrics plays a role in diagnosing the declining performance of a storage drive?", "type": "single", "options": ["RPM", "I/O", "LBA", "IOPS"], "correct": [3], "exp": "IOPS (I/O operations per second) is a key metric for diagnosing drive performance decline.", "id": "t18q29"}]}, {"id": "test19", "label": "Test 19", "questions": [{"q": "A computer's internal storage drive is not detected in the BIOS/UEFI or within the operating system's Disk Management utility. What is the most likely first troubleshooting step to resolve this issue?", "type": "single", "options": ["Initialize the drive", "Examine system logs for errors", "Inspect the drive's power and data cable connections", "Format the drive"], "correct": [2], "exp": "Check the physical power/data cable connections first — the simplest likely cause.", "id": "t19q1"}, {"q": "If a storage drive does not appear in the OS, one possible cause is that the drive has been disabled at the firmware level.", "type": "bool", "options": ["True", "False"], "correct": [0], "exp": "A drive disabled in BIOS/UEFI firmware won't appear in the OS.", "id": "t19q2"}, {"q": "What action should be taken if a drive is missing in the OS but appears in Disk Management as \"Unallocated\"?", "type": "single", "options": ["Modify OS settings to show hidden items", "Initialize and format the drive", "Change device access permissions for the current user", "Enable the drive in BIOS/UEFI settings"], "correct": [1], "exp": "An unallocated drive needs to be initialized and formatted before it can be used.", "id": "t19q3"}, {"q": "Which of the following is the most likely cause of a missing RAID array?", "type": "single", "options": ["Failed drive in the array", "Incorrect RAID controller settings", "Disconnected or loose cable", "All of the above"], "correct": [3], "exp": "A missing RAID array could stem from any of these causes — all of the above.", "id": "t19q4"}, {"q": "What should be the initial troubleshooting steps when a RAID array is missing from the system? (Select 2 answers)", "type": "multi", "options": ["Examine whether other non-RAID drives are functioning normally", "Check for loose/disconnected cables or a poorly seated RAID controller card", "Verify that the system has adequate power supply wattage", "Ensure the RAID controller is recognized and enabled in the BIOS/UEFI settings", "Confirm if the RAID array is visible in the OS Disk Management tool"], "correct": [1, 3], "exp": "Check for loose cabling/controller seating, and confirm the RAID controller is recognized/enabled in BIOS/UEFI.", "id": "t19q5"}, {"q": "If a RAID array is producing audible alarms, what does this typically indicate? (Select 2 answers)", "type": "multi", "options": ["System overheating", "Pending reboot request", "Drive failure", "Insufficient power supply", "Array degradation"], "correct": [2, 4], "exp": "RAID controller alarms typically signal drive failure or array degradation.", "id": "t19q6"}, {"q": "What is the most common cause when a display shows No Signal even though the device is powered on?", "type": "single", "options": ["Outdated display driver", "Faulty GPU", "Loose power cable", "Incorrect input source"], "correct": [3], "exp": "An incorrect input source selection is the most common cause of a \"No Signal\" message.", "id": "t19q7"}, {"q": "A user connects their laptop to an external monitor with an HDMI cable, but the monitor displays a distorted image. What should be done first to solve this problem?", "type": "single", "options": ["Verify correct input selection using the display's menu", "Update the monitor's firmware to the latest version", "Restart the connected device to reset display configuration", "Ensure the HDMI cable is not damaged or loose"], "correct": [3], "exp": "Check the physical HDMI cable for damage/looseness first — the simplest likely cause.", "id": "t19q8"}, {"q": "Which standard troubleshooting steps can help identify physical cabling issues with a display? (Select 3 answers)", "type": "multi", "options": ["Adjust the cable length to improve signal quality", "Inspect the cable for visible damage", "Ensure the cable is securely connected to both the device and the display", "Test the connection with a different cable", "Verify the cable's bend radius is within specifications"], "correct": [1, 2, 3], "exp": "Inspect for damage, confirm secure connections, and test with a different cable.", "id": "t19q9"}, {"q": "What is the most common symptom of a burnt-out projector bulb?", "type": "single", "options": ["The projector powers on, but no image is displayed", "The projector displays a dim or distorted image", "The projector fails to detect any input sources", "The projector shuts down immediately after powering on"], "correct": [0], "exp": "A burnt-out bulb typically means the projector powers on but shows no image.", "id": "t19q10"}, {"q": "What types of misuse can shorten the life of a projector bulb? (Select 2 answers)", "type": "multi", "options": ["Setting the projector to the highest refresh rate", "Powering off the projector without allowing it to cool down", "Using the projector in a brightly lit room", "Allowing frequent overheating due to poor ventilation", "Bypassing lamp replacement warnings through manual reset"], "correct": [1, 3], "exp": "Powering off without cooldown and frequent overheating both shorten projector bulb life.", "id": "t19q11"}, {"q": "A user reports that their monitor's image appears blurry or unfocused, even after brightness and contrast have been properly adjusted. The text and icons look indistinct. What is the most likely cause of this problem?", "type": "single", "options": ["Outdated monitor firmware", "Incorrect display resolution setting", "Monitor backlight issue", "Video screen burn-in"], "correct": [1], "exp": "An incorrect (non-native) resolution setting is the most common cause of blurry text/icons.", "id": "t19q12"}, {"q": "A computer monitor used in a retail store's point-of-sale system constantly shows a static application interface with a prominent logo. Over time, a faint ghost of that logo becomes visible even when other applications are open. What is the most likely cause of this persistent image?", "type": "single", "options": ["Damaged inverter", "Backlight bleed", "Afterimage effect", "Display burn-in"], "correct": [3], "exp": "A persistent, permanent ghost image from static content over time is display burn-in.", "id": "t19q13"}, {"q": "Persistent image retention occurs when static images remain on a screen for extended periods, causing uneven pixel degradation over time. This happens because the same pixels are repeatedly used to display identical visual elements, leading them to wear out faster than surrounding pixels. The key to preventing this issue is to avoid prolonged static content. Regularly changing on-screen elements, using dynamic screensavers, rotating interface layouts, or scheduling periods where the display is turned off or blanked out allow pixels to rest and recover. These preventive measures help minimize uneven wear and reduce the risk of permanent image retention.", "type": "bool", "options": ["True", "False"], "correct": [0], "exp": "Rotating content and periodic screen-off time reduce uneven pixel wear that causes burn-in.", "id": "t19q14"}, {"q": "A technician is diagnosing an LCD panel where one pixel remains black at all times and never changes color. Which troubleshooting step should be attempted first?", "type": "single", "options": ["Switch the monitor off and unplug it for an extended period", "Apply light, localized pressure to the affected pixel area", "Use an app that flashes primary colors or high-contrast patterns", "Tap the screen around the affected pixel with a soft object", "None of the above"], "correct": [4], "exp": "A permanently black (dead) pixel isn't fixable by these methods — none of the above.", "id": "t19q15"}, {"q": "A user reports their monitor's display intermittently goes black for brief periods before returning, resulting in a flashing effect. What are the recommended troubleshooting steps to resolve this problem? (Select 2 answers)", "type": "multi", "options": ["Reboot the system to clear any temporary software glitches", "Cycle through available input selections to rule out signal source errors", "Test the connection with a different port if present", "Examine the area for electromagnetic interference that might affect the display", "Check for loose or damaged video cable"], "correct": [2, 4], "exp": "Test with a different port and check for a loose/damaged cable — the most likely physical causes.", "id": "t19q16"}, {"q": "Which of the troubleshooting steps listed below would not address a monitor displaying washed-out or incorrect colors?", "type": "single", "options": ["Update graphics and display drivers", "Verify cable connection integrity", "Adjust the monitor brightness level", "Check color calibration settings", "Reset monitor to factory defaults"], "correct": [2], "exp": "Brightness affects intensity, not color accuracy — it won't fix washed-out/incorrect colors.", "id": "t19q17"}, {"q": "Which digital display interfaces provide the capability for transmission of audio data? (Select 2 answers)", "type": "multi", "options": ["HDMI", "DVI", "S-Video", "DisplayPort", "VGA"], "correct": [0, 3], "exp": "HDMI and DisplayPort both carry audio; DVI, S-Video, and VGA are video-only.", "id": "t19q18"}, {"q": "If a monitor with built-in speakers is not producing sound, the common issue could be that:", "type": "single", "options": ["The system's microphone is interfering with speaker output", "The sound output in the OS is routed to a different audio playback device", "The audio effects and enhancements settings cause driver conflicts", "The monitor's audio output is blocked by an incompatible audio format"], "correct": [1], "exp": "Audio output routed to a different device in OS settings is a common cause of no monitor sound.", "id": "t19q19"}, {"q": "Which of the following actions would help resolve an issue where audio plays through laptop speakers instead of an intended external display? (Select 2 answers)", "type": "multi", "options": ["Turn off automatic audio device switching in system preferences", "Adjust the equalizer settings in the audio control panel", "Verify that the monitor supports audio over the selected input", "Set the external display as the default audio device", "Disable the laptop's internal speakers in the operating system settings"], "correct": [2, 3], "exp": "Confirm the monitor supports audio over that input, and set it as the default audio output device.", "id": "t19q20"}, {"q": "Which hardware component is most likely to cause a dim image on an LCD monitor?", "type": "single", "options": ["Malfunctioning backlight", "Damaged inverter board", "Loose monitor power cable", "Overheating video adapter"], "correct": [0], "exp": "A malfunctioning backlight is the most likely cause of a dim LCD image.", "id": "t19q21"}, {"q": "A user complains that the image displayed on their monitor is dim. What should be the initial troubleshooting steps? (Select 3 answers)", "type": "multi", "options": ["Enable the monitor's dynamic contrast feature", "Check the brightness and contrast settings on the monitor", "Adjust the saturation levels in the display settings", "Verify the monitor's power-saving or eco mode is disabled", "Inspect the video and power cable connections"], "correct": [1, 3, 4], "exp": "Check brightness/contrast settings, disable power-saving/eco mode, and inspect cable connections.", "id": "t19q22"}, {"q": "A laptop display appears dim when running on battery power but brightens when plugged into AC power. What is the most probable cause?", "type": "single", "options": ["The AC adapter overrides adaptive brightness features", "The laptop's battery is undercharged and affecting the display", "The laptop is in power-saving mode with reduced brightness", "The display inverter is misconfigured for battery use"], "correct": [2], "exp": "Power-saving mode commonly dims the display when running on battery.", "id": "t19q23"}, {"q": "Which of the issues listed below is least likely to cause an intermittent shutdown in a projector?", "type": "single", "options": ["Insufficient voltage supply", "Malfunctioning cooling fan", "Improperly seated video cable", "Dust buildup in air filters"], "correct": [2], "exp": "A loose video cable would cause a display issue, not a power shutdown — power/cooling/airflow issues are more likely culprits.", "id": "t19q24"}, {"q": "Which of the following actions can help prevent intermittent projector shutdowns? (Select 2 answers)", "type": "multi", "options": ["Using a surge protector in the power connection", "Disabling auto-shutdown features in projector settings", "Regularly cleaning or replacing air filters", "Keeping ventilation openings clear of obstructions", "Decreasing the projector's lamp brightness"], "correct": [2, 3], "exp": "Clean air filters and clear ventilation prevent overheating-related shutdowns.", "id": "t19q25"}]}, {"id": "test20", "label": "Test 20", "questions": [{"q": "A display area on a user's monitor appears significantly smaller than the physical screen size, with black borders on all four sides. Which of the steps listed below would be relevant in troubleshooting this problem? (Select 2 answers)", "type": "multi", "options": ["Adjust the scale and layout options in the OS display settings", "Verify if the resolution is set to the monitor's native resolution", "Modify display scaling in the monitor's built-in on-screen menu", "Extend the monitor's viewable area in the OS display settings", "Set the scaling in the OS display settings to a higher percentage value"], "correct": [1, 2], "exp": "Check that resolution matches native resolution, and adjust scaling via the monitor's own on-screen menu.", "id": "t20q1"}, {"q": "A technician installs a new widescreen monitor. The image appears stretched and blurry. Which action should they take first?", "type": "single", "options": ["Modify the contrast ratio to enhance display sharpness", "Decrease the screen scaling percentage in the OS display settings", "Adjust the display resolution to match the monitor's native resolution", "Update the monitor's firmware to the latest version"], "correct": [2], "exp": "Setting the display to the monitor's native resolution fixes stretched/blurry images.", "id": "t20q2"}, {"q": "A user reports that their monitor displays random artifacts and flickering colored pixels. What is a common hardware cause for this type of distortion?", "type": "single", "options": ["Overheating or failing graphics card", "Faulty monitor power supply", "Damaged backlight in the monitor", "Outdated or corrupted display driver"], "correct": [0], "exp": "Random artifacts/flickering pixels commonly point to an overheating or failing graphics card.", "id": "t20q3"}, {"q": "A monitor intermittently displays a distorted, garbled image with misaligned colors and jagged text. Which step should a technician take first?", "type": "single", "options": ["Update the monitor's firmware", "Test the monitor with a different power cable", "Switch to an alternate video input port", "Reseat or replace the video cable"], "correct": [3], "exp": "Reseating/replacing the video cable is the first step for garbled/misaligned display symptoms.", "id": "t20q4"}, {"q": "A user reports that their mobile phone's battery drains very quickly, even when not in heavy use. The phone is also noticeably warm to the touch. Which of the following is the most likely initial step a technician should try to troubleshoot this problem?", "type": "single", "options": ["Adjust the device's display timeout settings", "Calibrate the battery by fully discharging and recharging", "Inspect the phone's charging port for physical damage", "Check for excessive background application activity"], "correct": [3], "exp": "Excessive background app activity is the most likely cause of fast drain + warmth, and the natural first check.", "id": "t20q5"}, {"q": "If a mobile device's battery shows slight swelling but the device is still functioning, it is safe to continue using it until the swelling becomes more pronounced. The swelling occurs due to gas buildup inside the battery, often caused by internal chemical reactions resulting from age, damage, or overcharging. A possible solution to address this issue is to carefully puncture the battery to release the gas, preventing further expansion.", "type": "bool", "options": ["True", "False"], "correct": [1], "exp": "A swollen battery should be treated as a hazard and never punctured — stop using it and replace it.", "id": "t20q6"}, {"q": "Backing up a mobile device's data is always recommended before replacing a broken screen, even if the device appears to be functioning normally.", "type": "bool", "options": ["True", "False"], "correct": [0], "exp": "Always back up data before any hardware repair in case something goes wrong.", "id": "t20q7"}, {"q": "What is the first step to take when troubleshooting a mobile device that is not charging properly?", "type": "single", "options": ["Remove the battery and reinsert it before charging", "Check the charging cable and adapter for physical damage", "Verify the wall outlet is providing power", "Consult the device's user manual for charging tips"], "correct": [1], "exp": "Check the cable/adapter for damage first — the simplest likely cause of a charging issue.", "id": "t20q8"}, {"q": "Which tool is best suited to check for power delivery issues when a mobile device is not charging properly?", "type": "single", "options": ["Voltage tester", "Diagnostic software", "Cable continuity tester", "USB multimeter"], "correct": [3], "exp": "A USB multimeter checks actual voltage/current delivery through a USB connection.", "id": "t20q9"}, {"q": "To preserve the lifespan of a mobile device's battery, it is best to regularly allow the battery to fully discharge before recharging it back to 100%.", "type": "bool", "options": ["True", "False"], "correct": [1], "exp": "Modern Li-ion batteries actually prefer partial charge cycles — full discharges shorten their lifespan.", "id": "t20q10"}, {"q": "A user reports their mobile device frequently loses Wi-Fi connection or cannot connect to any networks. What is the best first troubleshooting step?", "type": "single", "options": ["Remove and reinsert the device's SIM card", "Perform a hard reboot (forced restart) of the device", "Forget all networks from the device's saved Wi-Fi list and try to reconnect", "Restart the device's Wi-Fi adapter to reset the connection"], "correct": [3], "exp": "Restarting the Wi-Fi adapter is a quick, low-impact first step for connectivity drops.", "id": "t20q11"}, {"q": "If a mobile device intermittently loses Wi-Fi connection, which action will have no effect on improving its stability?", "type": "single", "options": ["Move closer to the Wi-Fi router or access point", "Restart the Wi-Fi adapter on the device", "Check for and reduce Wi-Fi interference from other devices", "Forget and reconnect to the Wi-Fi network", "Disable mobile data to prioritize Wi-Fi connection"], "correct": [4], "exp": "Disabling mobile data doesn't affect Wi-Fi stability — it's unrelated to the Wi-Fi connection itself.", "id": "t20q12"}, {"q": "A user reports their mobile phone has no cellular signal (no bars) and cannot make or receive calls or texts. What is the most common initial step a technician should try?", "type": "single", "options": ["Perform a network settings reset on the device", "Clear the device's cached data related to cellular services", "Toggle airplane mode on and off to reestablish signal", "Verify that the cellular data plan is active and not exhausted"], "correct": [2], "exp": "Toggling airplane mode is a quick, common first step to re-establish cellular signal.", "id": "t20q13"}, {"q": "A user accidentally spills water on their smartphone. What actions should the user take to minimize the damage? (Select all that apply)", "type": "multi", "options": ["Leave the device powered off until it dries", "Remove the battery if possible (after disconnecting power)", "Disconnect any external accessories or cables", "Remove the SIM card and memory card if accessible", "Use a direct heat source (e.g., a hairdryer) to dry the device"], "correct": [0, 1, 2, 3], "exp": "Power off, remove battery if possible, disconnect accessories, and remove SIM/memory cards — never apply direct heat.", "id": "t20q14"}, {"q": "What are the best practices for drying a smartphone that has been exposed to liquid? (Select 3 answers)", "type": "multi", "options": ["Apply desiccant-based drying methods to remove moisture", "Use direct heat source (oven, microwave, direct sunlight) to dry the device", "Keep the device turned off for at least 24–48 hours before testing", "Submerge the device in uncooked rice to absorb moisture", "Blow compressed air into charging ports or speakers to remove liquid", "Place the device in a sealed bag with silica gel packets"], "correct": [0, 2, 5], "exp": "Use desiccant methods, keep it powered off for 24–48 hours, and use silica gel packets — never direct heat.", "id": "t20q15"}, {"q": "Which of the actions listed below would have little to no impact on preventing a mobile device from overheating?", "type": "single", "options": ["Keeping the device out of intense heat sources", "Using an original or certified device charger", "Closing unused background applications", "Reducing screen brightness", "Enabling built-in power-saving features", "Keeping the device's operating system and installed apps up to date", "Activating dark mode to reduce screen glare"], "correct": [6], "exp": "Dark mode reduces glare but has negligible effect on preventing device overheating.", "id": "t20q16"}, {"q": "Which of the following measures reduce the risk of digitizer issues on a mobile device? (Select 3 answers)", "type": "multi", "options": ["Avoid dropping the device or applying excessive pressure to the screen", "Use a high-quality case and screen guard for impact resistance", "Keep the device away from moisture and extreme temperatures", "Limit the use of the stylus to prevent unnecessary wear on the touchscreen", "Use a thicker screen protector to shield against extreme impacts"], "correct": [0, 1, 2], "exp": "Avoiding drops/pressure, using a quality case/screen guard, and avoiding moisture/heat all protect the digitizer.", "id": "t20q17"}, {"q": "After dropping their tablet, a user notices that a section of the touchscreen no longer registers any input. What is the first troubleshooting step they should take?", "type": "single", "options": ["Check if the device is overheating", "Apply light, localized pressure to the affected area", "Power cycle the device", "Remove the screen protector and test the touch response"], "correct": [2], "exp": "Power cycling the device is the simple first step after a physical shock affects touch input.", "id": "t20q18"}, {"q": "Which of the actions listed below would be of help while troubleshooting a non-responsive touchscreen on a mobile device?", "type": "single", "options": ["Perform a soft reset (restart the device using a key combination)", "Remove screen protector and clean the touchscreen surface", "Boot into safe mode to check for app conflicts", "Perform a factory reset to restore default settings (after backing up data)", "All of the above"], "correct": [4], "exp": "Soft reset, cleaning the screen, safe mode, and factory reset can all help — all of the above.", "id": "t20q19"}, {"q": "A technician suspects a mobile device's USB-C port is physically damaged because it only charges when the cable is held at a specific angle. What is the most appropriate next step?", "type": "single", "options": ["Replace the charging port", "Test with a known working cable", "Retry plugging in after removing the device case", "Switch to a wireless charger"], "correct": [1], "exp": "First rule out a faulty cable by testing with a known-good one before assuming the port is damaged.", "id": "t20q20"}, {"q": "Which of the following symptoms may indicate that a mobile device has been compromised by malicious software? (Select 3 answers)", "type": "multi", "options": ["Frequent pop-ups or intrusive ads", "Unauthorized activity (messages, calls, or data usage)", "Device failing to recognize a SIM card", "Unusual performance issues (slowdown, crashes, freezing, battery drain)", "Intermittent loss of cellular signal"], "correct": [0, 1, 3], "exp": "Frequent pop-ups, unauthorized activity, and unusual performance issues point to malware compromise.", "id": "t20q21"}, {"q": "Which approach works best for eliminating persistent malware from a mobile device?", "type": "single", "options": ["Uninstalling suspicious or unknown apps", "Performing a hard reset of the device", "Troubleshooting in safe mode", "Running a reputable anti-malware scan", "Performing a factory reset of the device"], "correct": [4], "exp": "A factory reset is the most thorough way to eliminate persistent malware.", "id": "t20q22"}, {"q": "Installing mobile apps from sources such as Apple's App Store or Google Play significantly reduces the risk of malware infections.", "type": "bool", "options": ["True", "False"], "correct": [0], "exp": "Official app stores vet apps, significantly reducing (though not eliminating) malware risk.", "id": "t20q23"}, {"q": "Which of the answers listed below refers to a common fix for cursor drift?", "type": "single", "options": ["Modify touch sensitivity settings", "Restart the touchscreen driver service", "Test the device with a stylus (if applicable)", "Calibrate the touchscreen"], "correct": [3], "exp": "Calibrating the touchscreen is the standard fix for cursor drift.", "id": "t20q24"}, {"q": "A user is unable to install a new app on their mobile phone. Which option should be considered first when attempting to resolve this problem?", "type": "single", "options": ["Verify app store login status", "Clear the app store cache and data", "Update the OS to the latest version", "Check available storage space"], "correct": [3], "exp": "Insufficient storage space is the most common and simplest cause to check first.", "id": "t20q25"}]}, {"id": "test21", "label": "Test 21", "questions": [{"q": "While sideloading an app onto an Android phone for testing purposes, a user receives a notification that the installation has been blocked due to security settings. What must be changed to proceed with the installation?", "type": "single", "options": ["Grant administrator privileges to the app", "Disable app verification in Google Play settings", "Enable the \"Install unknown apps\" or \"Unknown sources\" setting", "Turn on developer options in system settings"], "correct": [2], "exp": "Sideloading requires enabling \"Install unknown apps\"/\"Unknown sources\" in security settings.", "id": "t21q1"}, {"q": "A company's MDM administrator receives multiple tickets from users stating that they cannot install updates for existing apps or download new ones. Which of the following is the most likely reason?", "type": "single", "options": ["App store outage", "Pending security updates", "Compatibility issues", "Policy enforcement"], "correct": [3], "exp": "MDM policy enforcement is the most likely reason app installs/updates are being blocked org-wide.", "id": "t21q2"}, {"q": "A user reports the stylus has stopped responding on their touchscreen device. What is the first practical troubleshooting step a technician should try?", "type": "single", "options": ["Reboot the device to reset touch inputs", "Clean the screen protector with a soft cloth", "Reset the device's Wi-Fi connection", "Verify the stylus battery status"], "correct": [3], "exp": "Check the stylus's battery status first — a dead battery is the simplest likely cause.", "id": "t21q3"}, {"q": "A device's stylus functions intermittently, while the touchscreen responds normally to finger input. Which troubleshooting action should be considered first?", "type": "single", "options": ["Attempt to reconnect the stylus to the device", "Recalibrate the touchscreen for proper alignment", "Inspect the stylus tip for damage or wear", "Test the input after removing the screen protector"], "correct": [2], "exp": "Since finger input works fine, check the stylus tip itself first for damage/wear.", "id": "t21q4"}, {"q": "A user attempts to connect a Bluetooth stylus to their tablet but it does not appear in the device's Bluetooth list. What device mode should the user confirm the stylus is in?", "type": "single", "options": ["Input mode", "Discovery mode", "Sync mode", "Pairing mode"], "correct": [3], "exp": "The stylus needs to be in pairing mode to appear in the Bluetooth device list.", "id": "t21q5"}, {"q": "What factor(s) can contribute to unexpected performance drops on a mobile device? (Select all that apply)", "type": "multi", "options": ["Outdated operating system software", "Too many background applications", "Enabled battery saver mode", "Malware consuming system resources", "Excessive app data and cache buildup"], "correct": [0, 1, 3, 4], "exp": "Outdated OS, too many background apps, malware, and cache buildup all contribute to slowdowns; battery saver mode actually reduces resource use.", "id": "t21q6"}, {"q": "A user complains their mobile phone has become increasingly slow, with apps taking a long time to open and frequently freezing. Which steps should a technician try first when troubleshooting this issue? (Select 2 answers)", "type": "multi", "options": ["Review battery usage by apps", "Clear cached data", "Run a benchmark test on the device", "Uninstall unused apps", "Enable power-saving mode"], "correct": [1, 3], "exp": "Clearing cached data and uninstalling unused apps are good first steps for general slowness.", "id": "t21q7"}, {"q": "A mobile device experiences a sudden, significant drop in performance, accompanied by unusual pop-ups and battery drain. What is the most likely cause of the problem?", "type": "single", "options": ["Low battery health", "Excessive push notifications", "Disabled pop-up blocker", "Malware infection"], "correct": [3], "exp": "Sudden performance drop + pop-ups + battery drain is a classic malware infection pattern.", "id": "t21q8"}, {"q": "When applications take an unusually long time to launch on a mobile device, which factors are typically the most immediate and direct causes of this issue? (Select 2 answers)", "type": "multi", "options": ["Device overheating from prolonged use", "Heavy load on the CPU", "Real-time encryption and decryption of
