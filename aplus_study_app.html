very options"], "correct": [2], "exp": "Disabling System Restore prevents malware from persisting via infected restore points.", "id": "c2t22q10"}, {"q": "A technician suspects a Windows 11 host is infected with persistent malware that prevents standard removal tools from running effectively. Which solution provides a minimal Windows environment that enables malware scanning and removal with reduced risk of interference?", "type": "single", "options": ["Clean Boot", "Windows Sandbox", "Recovery Console", "Safe Mode"], "correct": [3], "exp": "Safe Mode provides a minimal environment for malware scanning with reduced interference.", "id": "c2t22q11"}, {"q": "Windows Preinstallation Environment (WinPE) is a lightweight version of Windows that can be booted from removable media. When used for malware removal, WinPE runs entirely outside the installed operating system, providing a minimal, trusted environment for offline scanning and remediation. Because it does not load the host OS's services, drivers, or resident processes, the ability of in-OS malware to execute or interfere with removal is greatly reduced. This isolation makes WinPE especially effective for addressing persistent infections that can evade standard removal tools while Windows is running.", "type": "bool", "options": ["True", "False"], "correct": [0], "exp": "WinPE's isolation from the host OS is exactly why it's effective against persistent infections.", "id": "c2t22q12"}, {"q": "Which scenario best justifies performing a full OS reinstall or system reimage?", "type": "single", "options": ["Slow operating system performance", "Failed major OS upgrades or feature updates", "Corrupted user profiles", "Persistent malware surviving multiple scans"], "correct": [3], "exp": "Malware that survives repeated scans justifies a full OS reinstall/reimage.", "id": "c2t22q13"}, {"q": "Which of the steps listed below are part of the remediation phase in the malware removal process? (Select 3 answers)", "type": "multi", "options": ["Quarantining the infected system", "Malware scanning and removal", "Updating the anti-malware software", "Disabling system restore points", "Reimaging/reinstalling the system"], "correct": [1, 2, 4], "exp": "Remediation includes updating AV, scanning/removing malware, and reimaging if needed.", "id": "c2t22q14"}, {"q": "After successfully removing malware from a client's Windows PC, which step should a technician perform next to maintain ongoing system protection?", "type": "single", "options": ["Reimage the system", "Create a restore point", "Schedule scans and run updates", "Educate the user"], "correct": [2], "exp": "Scheduling ongoing scans/updates maintains protection going forward.", "id": "c2t22q15"}, {"q": "In the malware removal process, delaying System Restore re-enabling until after security updates are applied ensures the new restore point is clean and patched against known vulnerabilities.", "type": "bool", "options": ["True", "False"], "correct": [0], "exp": "Waiting to re-enable System Restore ensures the saved restore point is clean, not reinfected.", "id": "c2t22q16"}, {"q": "According to CompTIA's best practice procedures for malware removal, the last step of the malware removal process should be:", "type": "single", "options": ["Implementing preventive measures", "Documenting findings, actions, outcomes, and conclusions", "Verifying full system functionality", "Educating the user"], "correct": [3], "exp": "CompTIA's malware removal process ends with educating the end user.", "id": "c2t22q17"}, {"q": "Which Microsoft Windows feature(s) provide(s) data-at-rest encryption? (Select all that apply)", "type": "multi", "options": ["FDE", "BitLocker", "SED", "BitLocker-To-Go", "EFS"], "correct": [1, 3, 4], "exp": "BitLocker, BitLocker To Go, and EFS are Windows features providing data-at-rest encryption.", "id": "c2t22q18"}, {"q": "The two factors that are considered important for creating strong passwords are: (Select 2 answers)", "type": "multi", "options": ["Password length", "Minimum password age", "Password history", "Maximum password age", "Password complexity"], "correct": [0, 4], "exp": "Length and complexity are the two key factors in strong password creation.", "id": "c2t22q19"}, {"q": "A technician is configuring a new Windows image for an organization. A primary security requirement is to maximize protection against brute-force attacks on user accounts. Which password policy setting should be set to the highest practical value to meet this requirement?", "type": "single", "options": ["Minimum password age", "Password history", "Minimum password length", "Account lockout duration"], "correct": [2], "exp": "A longer minimum password length is the most effective defense against brute-force attacks.", "id": "c2t22q20"}, {"q": "A strong password that meets the password complexity requirement should contain: (Select the best answer)", "type": "single", "options": ["Uppercase letters (A–Z)", "Digits (0–9)", "Non-alphanumeric characters if permitted (e.g., !, @, #, $)", "Lowercase letters (a–z)", "A combination of characters from at least 3 character groups"], "correct": [4], "exp": "Complexity requirements typically call for combining at least 3 of the different character groups.", "id": "c2t22q21"}, {"q": "A password history policy is typically configured to a high value (e.g., 24 passwords) to enforce which primary security consideration?", "type": "single", "options": ["Complexity", "Expiration", "Length", "Uniqueness"], "correct": [3], "exp": "Password history enforces uniqueness by preventing password reuse.", "id": "c2t22q22"}, {"q": "Which of the following passwords is the most complex?", "type": "single", "options": ["T$7C52WL4#SA", "GdL3tUa8wxYz", "@TxB*L$nW@Xt", "G$L3tU8KwY@m"], "correct": [3], "exp": "G$L3tU8KwY@m mixes uppercase, lowercase, digits, and symbols in a balanced, non-repetitive way, making it most complex among the options.", "id": "c2t22q23"}, {"q": "Which password policy enforces a mandatory password change after a specific time?", "type": "single", "options": ["Password history policy", "Minimum password age policy", "Password expiration policy", "Password reuse policy"], "correct": [2], "exp": "Password expiration policy forces a change after a set time period.", "id": "c2t22q24"}, {"q": "The minimum password age policy setting determines the period of time that a password can be used before the system requires the user to change it.", "type": "bool", "options": ["True", "False"], "correct": [1], "exp": "That describes maximum password age / expiration, not minimum password age (which sets how soon a password CAN be changed again).", "id": "c2t22q25"}]}, {"id": "test23", "label": "Test 23", "questions": [{"q": "The maximum password age policy setting determines the period of time that a password must be used before the user can change it.", "type": "bool", "options": ["True", "False"], "correct": [1], "exp": "That describes minimum password age. Maximum password age is how long a password can be used before it must be changed.", "id": "c2t23q1"}, {"q": "BIOS/UEFI passwords improve host security by preventing unauthorized boot (User password) or restricting BIOS/UEFI setting changes (Supervisor/Administrator password).", "type": "bool", "options": ["True", "False"], "correct": [0], "exp": "User and Supervisor/Admin passwords serve these two distinct BIOS/UEFI security roles.", "id": "c2t23q2"}, {"q": "A user is working on a complex document and needs to step away from their workstation for a few minutes to attend a brief, unscheduled meeting. Which security best practice should the user employ to protect their data from unauthorized access while ensuring their open work remains immediately accessible upon return?", "type": "single", "options": ["Apply a privacy filter", "Set the system to standby mode", "Use a screensaver lock", "Log off the system"], "correct": [2], "exp": "A screensaver lock secures the session quickly while keeping open work accessible upon return.", "id": "c2t23q3"}, {"q": "Which security best practice most effectively reduces the risk of unauthorized access to the user's session and data when a workstation that is in use must be left unattended for an extended period of time?", "type": "single", "options": ["Log off when not in use", "Use a screensaver lock", "Set the system to standby mode", "Apply a privacy filter"], "correct": [0], "exp": "For extended absences, fully logging off is the most secure option.", "id": "c2t23q4"}, {"q": "Which of the answers listed below refers to a physical security measure against laptop theft?", "type": "single", "options": ["Geolocation", "Tracking software", "Cable lock", "Remote wipe"], "correct": [2], "exp": "A cable lock is a physical theft deterrent for laptops.", "id": "c2t23q5"}, {"q": "A sticky note with a password kept on sight in user's cubicle would be a violation of:", "type": "single", "options": ["Data labeling policy", "Physical security policy", "Clean desk policy", "Acceptable use policy"], "correct": [2], "exp": "A visible password note violates a clean desk policy.", "id": "c2t23q6"}, {"q": "Which of the following answers refers to an end-user software tool specifically designed to store and manage login credentials?", "type": "single", "options": ["Credential Guard", "Authenticator app", "SSO service", "Password manager"], "correct": [3], "exp": "A password manager stores/manages login credentials.", "id": "c2t23q7"}, {"q": "Account management best practices include restricting admin privileges based on user duties, using user groups with different permissions to simplify managing multiple accounts.", "type": "bool", "options": ["True", "False"], "correct": [0], "exp": "Role-based privilege restriction via groups is a core account management best practice.", "id": "c2t23q8"}, {"q": "Which of the answers listed below refers to an account management security measure that narrows down a user's computer access to specified hours?", "type": "single", "options": ["Account lockout policy", "Session timeout configuration", "Login time restrictions", "Just-in-time permissions"], "correct": [2], "exp": "Login time restrictions limit access to specified hours.", "id": "c2t23q9"}, {"q": "An auditor reports that several PCs allow anonymous users to log in. What should the administrator do first to correct this issue?", "type": "single", "options": ["Enable account lockout", "Require multifactor authentication", "Configure login time restrictions", "Disable the guest account"], "correct": [3], "exp": "Disabling the guest account is the direct fix for anonymous login access.", "id": "c2t23q10"}, {"q": "An account lockout policy, which disables a user account after a configurable number of consecutive failed authentication attempts, is primarily applied to reduce the risk of:", "type": "single", "options": ["Credential stuffing", "Password reuse", "Unauthorized physical access", "Brute-force attacks"], "correct": [3], "exp": "Account lockout after failed attempts primarily defends against brute-force attacks.", "id": "c2t23q11"}, {"q": "Which of the following is a recommended best practice for securing sensitive information on a workstation when temporarily unattended?", "type": "single", "options": ["Login time restriction", "Privacy filter", "Screen timeout lock", "Account lockout policy"], "correct": [2], "exp": "A screen timeout lock automatically secures an unattended workstation.", "id": "c2t23q12"}, {"q": "Setting account expiration dates is a security control primarily used for:", "type": "single", "options": ["Guest accounts", "Shared user accounts", "Temporary accounts", "Service accounts"], "correct": [2], "exp": "Account expiration dates are primarily used for temporary accounts.", "id": "c2t23q13"}, {"q": "Changing the default administrator's account/password replaces factory-set credentials with unique secure values, preventing reuse of well-known, publicly documented vendor-supplied admin credentials.", "type": "bool", "options": ["True", "False"], "correct": [0], "exp": "Changing default admin credentials closes off a well-known, easily exploited attack vector.", "id": "c2t23q14"}, {"q": "A USB stick containing a malicious script is inserted into a Windows workstation. Which security measure would prevent the automatic execution of malicious code from the newly inserted storage media?", "type": "single", "options": ["Disable AutoPlay", "Enable SmartScreen", "Disable AutoRun", "Enable AppLocker"], "correct": [2], "exp": "Disabling AutoRun prevents automatic code execution from inserted media.", "id": "c2t23q15"}, {"q": "A workstation is configured to automatically start remote desktop and print spooler services, even though neither is needed. Which best practice should be applied to reduce attack surface and improve performance?", "type": "single", "options": ["Block service ports in Windows Firewall", "Set both services to Manual startup", "Disable unused services", "Stop unneeded processes in Task Manager"], "correct": [2], "exp": "Disabling unused services directly reduces attack surface and resource use.", "id": "c2t23q16"}, {"q": "Which method of protecting mobile devices ensures that all data on the device is rendered unreadable without proper authentication?", "type": "single", "options": ["Password protection", "Data hashing", "Remote wipe", "Device encryption"], "correct": [3], "exp": "Device encryption renders all data unreadable without proper authentication.", "id": "c2t23q17"}, {"q": "Which biometric screen lock implementations are commonly used on mobile devices? (Select 2 answers)", "type": "multi", "options": ["Keystroke dynamics", "Fingerprint", "Signature recognition", "Hand geometry", "Facial recognition"], "correct": [1, 4], "exp": "Fingerprint and facial recognition are the common mobile biometric screen lock methods.", "id": "c2t23q18"}, {"q": "Which of the answers listed below refers to a knowledge-based authentication factor used with screen locks?", "type": "single", "options": ["Geolocation", "Digital signature", "PIN code", "Software token"], "correct": [2], "exp": "A PIN code is a knowledge-based (\"something you know\") authentication factor.", "id": "c2t23q19"}, {"q": "What is the typical, primary fallback authentication method when enabling biometrics on a mobile device?", "type": "single", "options": ["QR code scan", "Security question", "PIN or passcode", "Pattern unlock"], "correct": [2], "exp": "A PIN/passcode is the standard fallback when biometrics fail or are unavailable.", "id": "c2t23q20"}, {"q": "Which screen lock method requires tracing a specific design on the screen to unlock an Android device?", "type": "single", "options": ["Fingerprint scan", "Touch ID", "Swipe gesture", "Pattern unlock"], "correct": [3], "exp": "Pattern unlock requires tracing a specific design/shape.", "id": "c2t23q21"}, {"q": "Which mobile screen lock implementation, while providing no authentication, allows the user to unlock the device with a single, continuous gesture across the screen?", "type": "single", "options": ["Pattern unlock", "NFC tap-to-unlock", "Proximity sensor lock", "Swipe unlock"], "correct": [3], "exp": "Swipe unlock uses a simple continuous gesture with no real authentication.", "id": "c2t23q22"}, {"q": "Which of the following answers refers to a type of file commonly deployed through MDM or similar systems to enforce specific settings and restrictions on mobile devices?", "type": "single", "options": ["Security template", "Manifest file", "Configuration profile", "Automation script"], "correct": [2], "exp": "A configuration profile is deployed via MDM to enforce settings/restrictions.", "id": "c2t23q23"}, {"q": "A company wants to ensure all mobile devices automatically receive the latest operating system and application security updates. Which process should be implemented?", "type": "single", "options": ["Malware signature update", "Vulnerability assessment", "Patch management", "Group policy enforcement"], "correct": [2], "exp": "Patch management ensures devices automatically get the latest OS/app security updates.", "id": "c2t23q24"}, {"q": "Endpoint security software on mobile devices encompasses a range of applications designed to protect the device from security threats. Common examples of endpoint security applications include: (Select all that apply)", "type": "multi", "options": ["Antivirus software", "Content filters", "Anti-malware software", "Password managers"], "correct": [0, 1, 2], "exp": "Antivirus, content filters, and anti-malware are all mobile endpoint security applications — password managers are a separate credential tool.", "id": "c2t23q25"}]}, {"id": "test24", "label": "Test 24", "questions": [{"q": "Which of the answers listed below refers to a dedicated software type that uses positional telemetry for geofencing and remote device recovery?", "type": "single", "options": ["Asset inventory software", "Stalkerware", "Locator application", "Mobile telemetry app"], "correct": [2], "exp": "A locator application uses positional telemetry for geofencing and recovery.", "id": "c2t24q1"}, {"q": "What is the primary security reason for using an MDM to enforce remote wipe capability on a mobile device?", "type": "single", "options": ["Minimizing the impact of malicious software", "Preventing unauthorized access to corporate data", "Restoring device to its default configuration", "Protecting the privacy of user's personal data"], "correct": [1], "exp": "Remote wipe primarily prevents unauthorized access to corporate data on a lost/stolen device.", "id": "c2t24q2"}, {"q": "A mobile device security administrator needs to ensure that a user's corporate data can be restored to a replacement device after the original device is permanently lost. Which solution provides this capability?", "type": "single", "options": ["Configuration profiles", "Device provisioning", "Containerization", "Remote backup applications"], "correct": [3], "exp": "Remote backup applications allow corporate data restoration to a replacement device.", "id": "c2t24q3"}, {"q": "Failed log-in attempt restrictions are mobile device security controls that limit the number of consecutive unsuccessful authentication attempts. When the limit is reached, the device may lock temporarily, extend delay intervals between attempts, or trigger protective actions such as data wipe or account suspension. Failed log-in attempt restrictions are used to mitigate brute-force attacks and unauthorized access.", "type": "bool", "options": ["True", "False"], "correct": [0], "exp": "Failed login restrictions do exactly this to mitigate brute-force/unauthorized access.", "id": "c2t24q4"}, {"q": "A security administrator uses MDM software to restrict camera use and prevent file transfers over USB on company-issued smartphones. What type of control is being applied?", "type": "single", "options": ["Hardware access control", "Device policy enforcement", "Configuration profile deployment", "Device provisioning"], "correct": [1], "exp": "Restricting device features via MDM policy is device policy enforcement.", "id": "c2t24q5"}, {"q": "What are the organizational and administrative advantages of a corporate-owned mobile device deployment model over a BYOD policy? (Select 3 answers)", "type": "multi", "options": ["Full administrative control over the entire device", "Separation of personal and corporate data via containerization", "Less restrictive usage policies for non-work activities", "Standardization of hardware, software, and configuration", "Centralized device policy enforcement through MDM"], "correct": [0, 3, 4], "exp": "Corporate-owned devices offer full admin control, standardization, and centralized MDM policy enforcement.", "id": "c2t24q6"}, {"q": "Profile security requirements are predefined rules/configs applied to mobile devices via configuration profiles, typically MDM-managed, ensuring compliance with org standards for auth/data protection/access control.", "type": "bool", "options": ["True", "False"], "correct": [0], "exp": "That's an accurate description of MDM-managed profile security requirements.", "id": "c2t24q7"}, {"q": "Which of the following answers can be used to describe degaussing when used as a data sanitization method? (Select 2 answers)", "type": "multi", "options": ["Effective on all storage media types", "Mechanical destruction method", "Effective only on HDDs, tapes, and legacy storage media", "Relies on heat to render the drive inoperable", "Magnetic data erasure technique"], "correct": [2, 4], "exp": "Degaussing is a magnetic erasure technique effective only on magnetic media (HDDs, tapes) — not SSDs.", "id": "c2t24q8"}, {"q": "Shredding — match to its disposal mechanism.", "type": "single", "options": ["Mechanical", "Thermal", "Magnetic"], "correct": [0], "exp": "Shredding is a mechanical destruction method.", "id": "c2t24q9"}, {"q": "Incineration — match to its disposal mechanism.", "type": "single", "options": ["Mechanical", "Thermal", "Magnetic"], "correct": [1], "exp": "Incineration is a thermal destruction method.", "id": "c2t24q10"}, {"q": "Drilling — match to its disposal mechanism.", "type": "single", "options": ["Mechanical", "Thermal", "Magnetic"], "correct": [0], "exp": "Drilling is a mechanical destruction method.", "id": "c2t24q11"}, {"q": "Degaussing — match to its disposal mechanism.", "type": "single", "options": ["Mechanical", "Thermal", "Magnetic"], "correct": [2], "exp": "Degaussing is a magnetic erasure method.", "id": "c2t24q12"}, {"q": "Which data sanitization method securely removes all recoverable information from a storage device while keeping the device operational for future use?", "type": "single", "options": ["Standard format", "Degaussing", "Low-level format", "Erasing/wiping"], "correct": [3], "exp": "Erasing/wiping removes recoverable data while keeping the drive usable afterward.", "id": "c2t24q13"}, {"q": "Which of the answers listed below refers to a process that reinitializes the physical sector structure of a drive and returns the device to a factory-like state, preparing it for reinstallation or repurposing?", "type": "single", "options": ["Low-level format", "Erasing/wiping", "Full format", "Standard format"], "correct": [0], "exp": "A low-level format reinitializes the physical sector structure to a factory-like state.", "id": "c2t24q14"}, {"q": "Which formatting type applies a new file system structure to a storage device, leaving the existing data intact and easily recoverable by data recovery tools?", "type": "single", "options": ["Standard format", "Full format", "Erasing/wiping", "Low-level format"], "correct": [0], "exp": "A standard (quick) format only rewrites the file system structure, leaving old data recoverable.", "id": "c2t24q15"}, {"q": "A technician is arranging the disposal of decommissioned laptops through a certified third-party recycling vendor. What should be requested from the vendor to confirm proper disposal?", "type": "single", "options": ["Hardware inventory manifest", "Chain-of-custody record", "Asset disposal log", "Certificate of destruction"], "correct": [3], "exp": "A certificate of destruction confirms proper, verified disposal from the vendor.", "id": "c2t24q16"}, {"q": "Regulatory requirements (GDPR, HIPAA) mandate secure destruction of data-bearing devices, while environmental regulations require hazardous components (batteries, CRTs, ink/toner, PCBs) to be recycled through certified facilities rather than discarded as general e-waste.", "type": "bool", "options": ["True", "False"], "correct": [0], "exp": "This accurately describes both data-protection and environmental disposal regulations.", "id": "c2t24q17"}, {"q": "A technician is setting up a new SOHO router. After connecting with the factory default credentials, what is the most important first step to secure the device?", "type": "single", "options": ["Disable unused ports", "Update the router firmware", "Change admin credentials", "Turn off SSID broadcast"], "correct": [2], "exp": "Changing default admin credentials is the most critical first security step on a new router.", "id": "c2t24q18"}, {"q": "Which of the following are direct use cases for IP filtering on a SOHO router? (Select 2 answers)", "type": "multi", "options": ["Blocking websites containing inappropriate content", "Allowing only specific internal devices to access the internet", "Preventing users from downloading and installing unauthorized applications", "Allowing external hosts to connect to a specific internal service", "Blocking traffic from specific external IP addresses"], "correct": [1, 4], "exp": "IP filtering can restrict internet access to specific internal devices and block traffic from specific external IPs.", "id": "c2t24q19"}, {"q": "Firmware is permanent software programmed into a hardware device (like a SOHO router) providing low-level hardware control. Firmware updates fix security vulnerabilities, bugs, and occasionally add features — a critical maintenance task.", "type": "bool", "options": ["True", "False"], "correct": [0], "exp": "Firmware updates are indeed a critical security/maintenance task for network devices.", "id": "c2t24q20"}, {"q": "Which of the answers listed below refers to a router feature that inspects data streams for specific criteria, such as keywords, file types, or patterns, and blocks traffic that indicates inappropriate, harmful, or malicious payload?", "type": "single", "options": ["Malware inspection", "Packet filtering", "Traffic shaping", "Content filtering"], "correct": [3], "exp": "Content filtering inspects data for specific criteria and blocks matching traffic.", "id": "c2t24q21"}, {"q": "A SOHO router is positioned directly against a wall that separates the office from a public hallway. This placement primarily increases the risk of: (Select 2 answers)", "type": "multi", "options": ["Excessive signal reflection", "SSID broadcast suppression", "Wireless signal leakage", "Reduced signal range within the office", "Unauthorized wireless access"], "correct": [2, 4], "exp": "A router near an exterior/hallway wall risks signal leakage outside and unauthorized wireless access.", "id": "c2t24q22"}, {"q": "Which of the following are valid reasons to leave UPnP disabled on a SOHO router? (Select 2 answers)", "type": "multi", "options": ["To reduce the risk of external access to internal devices", "To minimize the chance of a successful port scanning attack", "To prevent the router from broadcasting its external WAN IP address", "To reduce the number of connected clients on the network", "To prevent automatic port forwarding by unknown applications"], "correct": [0, 4], "exp": "Disabling UPnP reduces external access risk and prevents automatic, uncontrolled port forwarding by apps.", "id": "c2t24q23"}, {"q": "A screened subnet is an example of a semi-trusted network segment that acts as a buffer zone between the trusted internal network and untrusted external networks.", "type": "bool", "options": ["True", "False"], "correct": [0], "exp": "A screened subnet (DMZ) is exactly this kind of semi-trusted buffer zone.", "id": "c2t24q24"}, {"q": "Which of the actions listed below is not considered a security best practice for access management on a SOHO router?", "type": "single", "options": ["Disabling remote access when not needed", "Enforcing strong authentication for administrative access", "Using encrypted protocols (e.g., HTTPS or SSH)", "Limiting access to trusted IP ranges", "Changing the default SSID to hide network identity"], "correct": [4], "exp": "Changing the SSID is a general obscurity measure, not specifically an access management best practice like the others.", "id": "c2t24q25"}, {"q": "A service set identifier (SSID) is the public name assigned to a wireless network that distinguishes it from other nearby networks. Since the default SSID is often a manufacturer-specific name (e.g., \"Linksys\", \"TP-Link\") followed by a suffix, changing it to a unique name helps to obscure the router's identity.", "type": "bool", "options": ["True", "False"], "correct": [0], "exp": "Changing a default SSID does help obscure device/vendor identity.", "id": "c2t24q26"}, {"q": "Which of the following would hide the wireless network name from casual scanning?", "type": "single", "options": ["Enabling encryption", "Disabling unused services/ports", "Enabling firewall rules for inbound traffic", "Disabling SSID broadcast"], "correct": [3], "exp": "Disabling SSID broadcast hides the network name from casual scans.", "id": "c2t24q27"}, {"q": "A technician is configuring encryption settings on a new SOHO wireless router and wants to ensure the strongest possible security levels for wireless communications. Which option should be selected?", "type": "single", "options": ["WPA-TKIP", "WPA2-AES", "WPA3-SAE", "WPA3-Enterprise"], "correct": [2], "exp": "WPA3-SAE offers the strongest encryption for typical SOHO wireless setups among these options.", "id": "c2t24q28"}]}, {"id": "test25", "label": "Test 25", "questions": [{"q": "Which of the answers listed below refer to the typical characteristics of a SOHO guest wireless network? (Select 3 answers)", "type": "multi", "options": ["Shared encryption and authentication settings", "Access to internal LAN devices", "Separate SSID", "Guest network isolation from the main LAN", "Open access or shared passphrase different from the main LAN", "SSID shared with the main network"], "correct": [2, 3, 4], "exp": "A guest network has its own SSID, is isolated from the main LAN, and often uses different/open access credentials.", "id": "c2t25q1"}, {"q": "A network technician wants to secure a SOHO network by disabling unused TCP/UDP ports. Where should this configuration be applied?", "type": "single", "options": ["Content filtering settings on the SOHO router", "Port configuration settings on a network switch", "Firewall settings on the SOHO router", "TCP/IP configuration settings on client devices"], "correct": [2], "exp": "Firewall settings on the router are where unused TCP/UDP ports are disabled.", "id": "c2t25q2"}, {"q": "A network admin has been tasked with configuring a SOHO router to allow users from the public internet to connect to a web server that resides on the private internal network. Which router setting is required to map incoming requests from the public interface to the specific private IP address of the web server?", "type": "single", "options": ["Port labeling", "Port bonding", "Port forwarding", "Port mirroring"], "correct": [2], "exp": "Port forwarding maps external requests to a specific internal IP/port.", "id": "c2t25q3"}, {"q": "Hashing generates a unique fixed-length string (checksum) from a file as its digital fingerprint. Comparing a downloaded file's hash to the vendor's trusted hash verifies integrity/authenticity.", "type": "bool", "options": ["True", "False"], "correct": [0], "exp": "Hash comparison is a standard way to verify file integrity/authenticity.", "id": "c2t25q4"}, {"q": "Browser patching keeps browsers updated with security patches/bug fixes/performance improvements. Regular patching closes vulnerabilities exploitable via malicious sites/extensions/scripts.", "type": "bool", "options": ["True", "False"], "correct": [0], "exp": "Browser patching is a standard security practice to close known vulnerabilities.", "id": "c2t25q5"}, {"q": "Browser extensions/plug-ins add functionality (ad blocking, password mgmt, media handling). Best practice: install from trusted sources, update regularly, remove unneeded/unsafe ones.", "type": "bool", "options": ["True", "False"], "correct": [0], "exp": "These are standard extension/plug-in security best practices.", "id": "c2t25q6"}, {"q": "A technician is reviewing web browser security configuration. Which setting should be modified to enable secure password storage?", "type": "single", "options": ["Disable saving form data", "Enable password manager", "Disable autofill", "Clear saved credentials on exit"], "correct": [1], "exp": "Enabling the browser's password manager provides secure password storage.", "id": "c2t25q7"}, {"q": "Which network protocol ensures that all data exchanged between a web browser and a server is encrypted and protected from interception?", "type": "single", "options": ["SFTP", "IPsec", "SSH", "HTTPS"], "correct": [3], "exp": "HTTPS encrypts data exchanged between browser and server.", "id": "c2t25q8"}, {"q": "What is the standard method for viewing a website's certificate details in most modern browsers?", "type": "single", "options": ["Right-clicking the web page and selecting the \"Inspect\" option", "Hovering the mouse cursor over the website's favicon in the tab header", "Finding the relevant section in the browser's settings menu", "Clicking the padlock or security icon in the browser's address bar"], "correct": [3], "exp": "Clicking the address bar's padlock/security icon shows certificate details.", "id": "c2t25q9"}, {"q": "A user complains that multiple advertising windows open automatically when visiting websites. Which browser feature should be enabled to prevent this behavior?", "type": "single", "options": ["Tracking prevention", "Pop-up blocker", "Ad blocker", "Private-browsing mode"], "correct": [1], "exp": "A pop-up blocker prevents automatically-opening ad windows.", "id": "c2t25q10"}, {"q": "A user is attempting to complete a secured transaction on a trusted e-commerce site, but the necessary third-party payment gateway window fails to load after clicking the checkout button. Which browser setting should be adjusted to resolve the issue?", "type": "single", "options": ["Add the site to the pop-up blocker's allowed list", "Complete the transaction using the browser's private/incognito mode", "Disable the browser's ad blocker extension", "Enable compatibility view in the browser's settings"], "correct": [0], "exp": "The pop-up blocker is likely blocking the payment gateway window — whitelist the site.", "id": "c2t25q11"}, {"q": "A user reports that a website automatically signs in under a previous user's account on a shared workstation. Which browser maintenance task will prevent this issue from recurring?", "type": "single", "options": ["Clear autofill form data", "Clear browsing data", "Clear saved passwords", "Clear the browser cache"], "correct": [2], "exp": "Clearing saved passwords stops auto-login under a previous user's saved credentials.", "id": "c2t25q12"}, {"q": "A support technician suspects a web application is loading outdated scripts stored locally. What is the most appropriate step to resolve this issue?", "type": "single", "options": ["Update the application", "Reset the browser to default settings", "Clear the browser cache", "Reinstall the browser"], "correct": [2], "exp": "Clearing the cache removes outdated cached scripts.", "id": "c2t25q13"}, {"q": "By default, private-browsing mode:", "type": "single", "options": ["Blocks ads or third-party trackers", "Encrypts network traffic", "Prevents the local storage of browsing history and session data", "Hides user activity from websites or ISPs"], "correct": [2], "exp": "Private browsing's core default function is to avoid locally storing history/session data.", "id": "c2t25q14"}, {"q": "Which feature allows a user to maintain consistent browser preferences, extensions, and login credentials across multiple devices?", "type": "single", "options": ["Domain-based login", "Sign-in/browser data synchronization", "Roaming user profile", "Single sign-on authentication"], "correct": [1], "exp": "Browser sign-in/data sync keeps preferences/extensions/credentials consistent across devices.", "id": "c2t25q15"}, {"q": "Which of the following web browser features reduces bandwidth usage and improves page load performance by stopping embedded advertising media content?", "type": "single", "options": ["Pop-up blocker", "Ad blocker", "Private-browsing mode", "Proxy server"], "correct": [1], "exp": "An ad blocker stops embedded ad content, reducing bandwidth use and improving load times.", "id": "c2t25q16"}, {"q": "A technician needs to configure a user's web browser to route traffic through a corporate content filter. Which feature should be used to accomplish this task?", "type": "single", "options": ["VPN connection", "Proxy server", "Web content filter extension", "Firewall rule"], "correct": [1], "exp": "A proxy server routes browser traffic through a corporate content filter.", "id": "c2t25q17"}, {"q": "Which protocols are used by Secure DNS implementations to encrypt and protect DNS queries? (Select 2 answers)", "type": "multi", "options": ["IPsec", "TLS", "SFTP", "VPN", "HTTPS"], "correct": [1, 4], "exp": "Secure DNS uses TLS (DoT) and HTTPS (DoH) to encrypt DNS queries.", "id": "c2t25q18"}, {"q": "Which web browser feature helps prevent ISPs and other intermediaries from viewing which websites are being accessed?", "type": "single", "options": ["Proxy settings", "Private-browsing mode", "Do Not Track setting", "Secure DNS"], "correct": [3], "exp": "Secure DNS (DoH/DoT) encrypts DNS queries, hiding site lookups from ISPs/intermediaries.", "id": "c2t25q19"}, {"q": "Web browser feature management is administrative control over browser functionality (plug-ins, extensions, password managers, sync, geolocation) — critical for security policy, attack surface, resource use, and consistent UX in managed environments.", "type": "bool", "options": ["True", "False"], "correct": [0], "exp": "This accurately describes browser feature management in managed/enterprise environments.", "id": "c2t25q20"}, {"q": "The Blue Screen of Death (BSoD), also known as a stop error screen, appears in Microsoft Windows when the system encounters a critical error it cannot recover from without risking further instability. The BSoD typically displays technical details that may help advanced users diagnose the underlying cause of the error. In earlier versions of Windows, the BSoD included elements such as an error code, the memory address where the fault occurred, and the name of the driver that caused it. Beginning with Windows 8, the screen was redesigned to present a simplified message, along with a stop code, a URL, and a QR code linking to online troubleshooting resources. For Windows to recover from a BSoD, a system restart is required, which may occur automatically or be triggered manually using the computer's power button.", "type": "bool", "options": ["True", "False"], "correct": [0], "exp": "This accurately describes BSoD behavior and evolution across Windows versions.", "id": "c2t25q21"}, {"q": "Which of the tools listed below can be used to identify resource-intensive applications that cause degraded performance in Microsoft Windows?", "type": "single", "options": ["Event Viewer", "Windows Memory Diagnostic", "System Information", "Task Manager"], "correct": [3], "exp": "Task Manager identifies resource-intensive apps causing degraded performance.", "id": "c2t25q22"}, {"q": "Which actions are most likely to resolve a Windows boot issue caused by the system attempting to start from an incorrect device? (Select 2 answers)", "type": "multi", "options": ["Disabling Secure Boot in the UEFI firmware", "Updating the boot order in BIOS", "Running Startup Repair from the Windows Recovery Environment", "Booting into Safe Mode", "Disconnecting any removable drives"], "correct": [1, 4], "exp": "Fixing the boot order and removing removable drives addresses booting from the wrong device.", "id": "c2t25q23"}, {"q": "Which of the following Windows Recovery Environment (WinRE) tools is specifically designed to automatically recover from operating system boot failures?", "type": "single", "options": ["System Restore", "Safe Mode", "System Image Recovery", "Startup Repair"], "correct": [3], "exp": "Startup Repair is specifically designed to auto-fix OS boot failures.", "id": "c2t25q24"}, {"q": "During system boot, a user receives \"Windows Boot Configuration Data file is missing some required information\" error message. Which command-line command should a technician use to troubleshoot this error?", "type": "single", "options": ["bootrec /scanos", "bootrec /rebuildbcd", "bootrec /fixmbr", "bootrec /fixboot"], "correct": [1], "exp": "bootrec /rebuildbcd rebuilds the Boot Configuration Data when it's missing/corrupted.", "id": "c2t25q25"}]}, {"id": "test26", "label": "Test 26", "questions": [{"q": "A technician is troubleshooting a Windows system that powers off unexpectedly after a GPU driver update. Which Windows utility should the technician use to manually roll back the specific driver?", "type": "single", "options": ["System Restore", "Windows Update", "Control Panel", "Device Manager"], "correct": [3], "exp": "Device Manager lets you roll back a specific driver directly.", "id": "c2t26q1"}, {"q": "A Windows desktop restarts several times a day without displaying a blue screen. Which system utility can a technician use to review detailed system logs and determine the cause?", "type": "single", "options": ["Event Viewer", "Reliability Monitor", "System Information", "Windows Registry"], "correct": [0], "exp": "Event Viewer provides detailed system logs to investigate unexpected restarts.", "id": "c2t26q2"}, {"q": "A user reports that a Windows 11 computer restarts randomly during normal operation. A technician suspects the issue is caused by corrupted system files. Which built-in command-line tool should be run to verify and repair these files?", "type": "single", "options": ["diskpart /rescan", "chkdsk /f", "sfc /scannow", "bootrec /rebuildbcd"], "correct": [2], "exp": "sfc /scannow verifies and repairs corrupted protected system files.", "id": "c2t26q3"}, {"q": "A Windows desktop powers off randomly only when non-Microsoft services are loaded. The issue does not occur in Safe Mode. Which step should be taken to isolate the cause?", "type": "single", "options": ["Run a full antivirus scan", "End background processes in Task Manager", "Roll back the latest Windows update", "Perform a clean boot"], "correct": [3], "exp": "A clean boot isolates the problem by loading only essential Microsoft services/drivers.", "id": "c2t26q4"}, {"q": "Which Windows diagnostic tool provides a timeline of system events and failures, including unexpected shutdowns?", "type": "single", "options": ["Reliability Monitor", "Event Viewer", "Performance Monitor", "Resource Monitor"], "correct": [0], "exp": "Reliability Monitor shows a timeline of system events/failures, including shutdowns.", "id": "c2t26q5"}, {"q": "The \"Disable automatic restart on system failure\" option in Windows is specifically used to prevent a computer from immediately rebooting after a blue screen error, allowing time to view the stop error code and other critical information needed for troubleshooting.", "type": "bool", "options": ["True", "False"], "correct": [0], "exp": "This setting keeps the BSoD on screen instead of auto-rebooting, for troubleshooting purposes.", "id": "c2t26q6"}, {"q": "In MS Windows, Services (services.msc) is a system applet used for managing background applications and processes. The applet interface can be accessed by pressing Windows logo + R key combination, typing services.msc in the Run dialog box and pressing Enter. Inside the interface, double-clicking on a service opens its Properties menu, which can also be displayed by right-clicking on the service and selecting Properties from the context menu. The General tab of the Properties menu contains all the basic controls necessary for manual service management such as Start, Stop, Pause, and Resume buttons. If a service fails to start, automatic system response can be set on the Recovery tab. Troubleshooting can also involve checking the Dependencies tab to determine which services are required by the selected service and which services depend on it.", "type": "bool", "options": ["True", "False"], "correct": [0], "exp": "This accurately describes the services.msc interface and its tabs.", "id": "c2t26q7"}, {"q": "Which system utility in Windows is the primary source for reviewing detailed information regarding application crashes?", "type": "single", "options": ["Resource Monitor", "Task Manager", "Performance Monitor", "Event Viewer"], "correct": [3], "exp": "Event Viewer is the primary source for detailed application crash information.", "id": "c2t26q8"}, {"q": "While troubleshooting a persistent application crash, a technician determines the application must be completely reinstalled. Which Windows utility would provide access to the procedure for performing this action?", "type": "single", "options": ["Windows Troubleshooter", "System Configuration", "Registry Editor", "Programs and Features"], "correct": [3], "exp": "Programs and Features provides uninstall/reinstall access for applications.", "id": "c2t26q9"}, {"q": "In Microsoft Windows, a reserved portion of the storage drive used for data that cannot be stored in RAM due to insufficient memory space is called:", "type": "single", "options": ["Memory buffer", "System cache", "Paging file", "Swap partition"], "correct": [2], "exp": "The paging file is disk space used as overflow when RAM is insufficient.", "id": "c2t26q10"}, {"q": "A Windows workstation frequently displays low memory warnings while multiple applications are running. Which Windows utilities can a technician use to identify the processes consuming the most memory? (Select 2 answers)", "type": "multi", "options": ["Reliability Monitor", "Task Manager", "Windows Memory Diagnostic", "Event Viewer", "Resource Monitor"], "correct": [1, 4], "exp": "Task Manager and Resource Monitor both show per-process memory consumption.", "id": "c2t26q11"}, {"q": "Recommended methods for resolving or preventing low memory warnings on a Windows-based system include: (Select all that apply)", "type": "multi", "options": ["Increasing the storage drive's cache size", "Upgrading system memory", "Defragmenting the main system drive", "Closing unnecessary background applications", "Increasing the size of the paging file"], "correct": [1, 3, 4], "exp": "Upgrading RAM, closing unneeded apps, and increasing paging file size all help with low memory warnings.", "id": "c2t26q12"}, {"q": "The common causes of USB controller resource warnings include exceeding endpoints or drawing too much power. Troubleshooting solutions include: (Select 2 answers)", "type": "multi", "options": ["Enabling hardware virtualization in the BIOS/UEFI firmware", "Unplugging USB devices that are not in use", "Setting the affected USB device to a lower process priority in Task Manager", "Moving devices to ports linked to a different USB controller", "Changing the Windows power plan to High Performance"], "correct": [1, 3], "exp": "Unplugging unused USB devices and spreading devices across different controllers both address resource exhaustion.", "id": "c2t26q13"}, {"q": "Windows system instability is commonly caused by hardware failures, driver conflicts, corrupted system files, overheating, insufficient power, or incompatible software. The condition is typically manifested as unpredictable behavior such as random freezes, crashes, reboots, or system hangs. Troubleshooting involves isolating faulty components, verifying system integrity, and restoring stability through updates, diagnostics, and repairs. Common tools include Event Viewer for error analysis, Safe Mode for driver and startup isolation, Windows Memory Diagnostic for testing RAM, and the SFC utility for repairing corrupted system files.", "type": "bool", "options": ["True", "False"], "correct": [0], "exp": "This accurately lists common causes of instability and the standard diagnostic toolset.", "id": "c2t26q14"}, {"q": "A Windows user reports that their PC displays \"Operating system not found\" error immediately after the POST sequence. Assuming the physical storage drive is functional, which options are the most likely causes of the OS detection failure? (Select 2 answers)", "type": "multi", "options": ["Expired Windows license key", "Corrupted user profiles in Windows", "Incorrect BIOS/UEFI boot order", "Missing device drivers", "Corrupted boot records/files"], "correct": [2, 4], "exp": "Wrong boot order or corrupted boot records/files are the likely causes of \"OS not found\" errors.", "id": "c2t26q15"}, {"q": "A Windows domain user experiences long delays during login, and the profile takes several minutes to load. What is a common solution to this issue?", "type": "single", "options": ["Modifying login script", "Disabling SSO authentication", "Rebuilding Windows profiles", "Applying system updates"], "correct": [2], "exp": "Rebuilding a corrupted user profile commonly fixes slow login/profile load delays.", "id": "c2t26q16"}, {"q": "Which of the following are valid causes of time drift in Windows? (Select 3 answers)", "type": "multi", "options": ["Incorrect system time zone settings", "Disabled Windows Time (W32Time) service", "CMOS battery failure", "Unreachable or misconfigured NTP server", "Disabled Task Scheduler service"], "correct": [1, 2, 3], "exp": "Time drift stems from a disabled W32Time service, a failing CMOS battery, or an unreachable/bad NTP server — not time zone settings or Task Scheduler.", "id": "c2t26q17"}, {"q": "Time synchronization settings in Windows 10 and Windows 11 can be accessed via:", "type": "single", "options": ["Windows Start > Settings > Time & Language > Date & time", "Windows Control Panel (icon view) > Date and Time > Internet Time tab > Change settings…", "Windows Control Panel (category view) > Clock and Region > Set the time and date > Internet Time tab > Change settings…", "Any of the above navigation paths"], "correct": [3], "exp": "Time sync settings are reachable via any of these three navigation paths.", "id": "c2t26q18"}, {"q": "What is the most common initial troubleshooting step used to resolve general mobile OS and application issues?", "type": "single", "options": ["Performing factory reset", "Applying system updates", "Clearing cached data", "Power cycling the device"], "correct": [3], "exp": "Power cycling is the simplest, most common first step for general mobile issues.", "id": "c2t26q19"}, {"q": "A user reports that a mobile app fails to launch on their smartphone. Which of the options listed below is the best initial troubleshooting step to resolve this issue?", "type": "single", "options": ["Free up storage space", "Clear the app cache/data", "Restart the device", "Verify app permissions"], "correct": [2], "exp": "Restarting the device is the simplest first step for an app that won't launch.", "id": "c2t26q20"}, {"q": "To force stop a mobile app means to: (Select all that apply)", "type": "multi", "options": ["Terminate all processes related to the app", "Stop the app from running in the foreground", "Disable the app until it is manually re-enabled", "Revoke permissions granted to the app", "Stop the app from running in the background"], "correct": [0, 1, 4], "exp": "Force stop terminates all the app's processes, stopping it from running in both foreground and background.", "id": "c2t26q21"}, {"q": "Reinstall the app — which root cause does this action primarily resolve?", "type": "single", "options": ["Core application files are corrupted, incomplete, mismatched, or fail integrity checks", "Crashes or misbehavior are caused by corrupted temporary files, cached data, or user-specific settings", "Known bugs or compatibility issues have been fixed in a newer version of the app", "Crashes are caused by temporary memory conflicts, hung processes, or system resource issues", "An app is unresponsive, frozen, or stuck in a loop"], "correct": [0], "exp": "Reinstalling addresses corrupted or mismatched core application files.", "id": "c2t26q22"}, {"q": "Clear the app cache/data — which root cause does this action primarily resolve?", "type": "single", "options": ["Core application files are corrupted, incomplete, mismatched, or fail integrity checks", "Crashes or misbehavior are caused by corrupted temporary files, cached data, or user-specific settings", "Known bugs or compatibility issues have been fixed in a newer version of the app", "Crashes are caused by temporary memory conflicts, hung processes, or system resource issues", "An app is unresponsive, frozen, or stuck in a loop"], "correct": [1], "exp": "Clearing cache/data resolves issues from corrupted temp files or user-specific settings.", "id": "c2t26q23"}, {"q": "Update the app — which root cause does this action primarily resolve?", "type": "single", "options": ["Core application files are corrupted, incomplete, mismatched, or fail integrity checks", "Crashes or misbehavior are caused by corrupted temporary files, cached data, or user-specific settings", "Known bugs or compatibility issues have been fixed in a newer version of the app", "Crashes are caused by temporary memory conflicts, hung processes, or system resource issues", "An app is unresponsive, frozen, or stuck in a loop"], "correct": [2], "exp": "Updating resolves known bugs/compatibility issues already fixed in a newer version.", "id": "c2t26q24"}, {"q": "Restart the device — which root cause does this action primarily resolve?", "type": "single", "options": ["Core application files are corrupted, incomplete, mismatched, or fail integrity checks", "Crashes or misbehavior are caused by corrupted temporary files, cached data, or user-specific settings", "Known bugs or compatibility issues have been fixed in a newer version of the app", "Crashes are caused by temporary memory conflicts, hung processes, or system resource issues", "An app is unresponsive, frozen, or stuck in a loop"], "correct": [3], "exp": "Restarting clears temporary memory conflicts, hung processes, or resource exhaustion.", "id": "c2t26q25"}, {"q": "Force close the app — which root cause does this action primarily resolve?", "type": "single", "options": ["Core application files are corrupted, incomplete, mismatched, or fail integrity checks", "Crashes or misbehavior are caused by corrupted temporary files, cached data, or user-specific settings", "Known bugs or compatibility issues have been fixed in a newer version of the app", "Crashes are caused by temporary memory conflicts, hung processes, or system resource issues", "An app is unresponsive, frozen, or stuck in a loop"], "correct": [4], "exp": "Force closing addresses an app that is unresponsive, frozen, or stuck in a loop.", "id": "c2t26q26"}, {"q": "A mobile device cannot update an app, and the system displays an error related to account authentication. What is the most likely cause?", "type": "single", "options": ["Expired app store credentials", "Two-factor authentication timeout", "App store access restricted by firewall", "Failed device compliance check"], "correct": [0], "exp": "Expired app store account credentials would trigger an authentication-related update error.", "id": "c2t26q27"}, {"q": "A user reports that a mobile app from the official app store will not install on a company-managed smartphone. What is the most likely reason for this issue?", "type": "single", "options": ["Corrupted installation files", "Pending system updates", "MDM policy restrictions", "Disabled sideloading option"], "correct": [2], "exp": "MDM policy restrictions on a company-managed device are the most likely blocker.", "id": "c2t26q28"}, {"q": "Which of the following actions would be of help while troubleshooting a mobile app that becomes slow to respond?", "type": "single", "options": ["Restart the device", "Force stop and relaunch the app", "Update the app", "Clear the app cache/data", "All of the above"], "correct": [4], "exp": "Restarting, force-stopping, updating, and clearing cache can all help with a slow-responding app — all of the above.", "id": "c2t26q29"}]}, {"id": "test27", "label": "Test 27", "questions": [{"q": "Most mobile OS updates require a minimum battery percentage or a charging status to prevent the device from shutting down during the update process.", "type": "bool", "options": ["True", "False"], "correct": [0], "exp": "OS updates typically require sufficient battery/charging to avoid a mid-update shutdown.", "id": "c2t27q1"}, {"q": "An OS update installation begins on a mobile device but consistently stops and reverses the process at 75% complete. The device has plenty of free space and is on a fast network. What does this behavior most strongly suggest?", "type": "single", "options": ["Corrupted update package", "Insufficient amount of RAM", "Battery charge below threshold", "Exceeded data usage limit"], "correct": [0], "exp": "Consistently failing/reverting at the same point suggests a corrupted update package.", "id": "c2t27q2"}, {"q": "A user is troubleshooting a personally-owned mobile device that repeatedly fails to initiate an operating system update. The device is currently connected to a known good home office Wi-Fi network, plugged into a charger, and the update package is confirmed to be available for download. Which of the following is the most likely cause of the update failure?", "type": "single", "options": ["Operating system incompatibility", "Corrupted installation files", "MDM policy restrictions", "Insufficient free storage space"], "correct": [3], "exp": "With network/charging ruled out and no MDM (personal device), insufficient storage is the likely cause.", "id": "c2t27q3"}, {"q": "A tablet's battery drains unusually fast even when the device is idle. Which of the actions listed below will most likely resolve the issue?", "type": "single", "options": ["Reduce the screen brightness to its minimum", "Check for physical damage to the battery", "Identify and restrict background applications", "Update the device's operating system"], "correct": [2], "exp": "Idle drain is commonly caused by background apps consuming power — restricting them is the fix.", "id": "c2t27q4"}, {"q": "A mobile device repeatedly loses battery charge in areas with no reliable cellular coverage. Which action can most effectively reduce the battery drain?", "type": "single", "options": ["Enable battery saver mode", "Reset the device's network settings", "Turn off location services", "Enable airplane mode"], "correct": [3], "exp": "Airplane mode stops the constant signal-searching in weak coverage areas that drains the battery.", "id": "c2t27q5"}, {"q": "A corrupted OS installation has been isolated as the most likely cause of persistent random reboots on a user's mobile device. After backing up all user data and charging the device, what is the next troubleshooting step a technician should take?", "type": "single", "options": ["Check for and install the latest OS update", "Reboot into diagnostic startup mode", "Downgrade the OS to the previous stable version", "Perform a factory reset of the device"], "correct": [3], "exp": "A factory reset addresses a corrupted OS installation after data is backed up.", "id": "c2t27q6"}, {"q": "A technician observes that a mobile device reboots randomly during high CPU/GPU load. Which of the following is the most probable cause?", "type": "single", "options": ["Outdated firmware", "Degraded battery", "Malware infection", "Device overheating"], "correct": [3], "exp": "Reboots correlated with high load point to overheating triggering a thermal protective shutdown.", "id": "c2t27q7"}, {"q": "Bluetooth connectivity issues on a mobile device can be resolved by: (Select all that apply)", "type": "multi", "options": ["Moving the device closer to an access point", "Ensuring the connecting devices are adequately close to each other", "Turning Bluetooth off and then turning it on again", "Restarting the connected devices", "Unpairing and then re-pairing the device"], "correct": [1, 2, 3, 4], "exp": "Proximity, toggling Bluetooth, restarting devices, and re-pairing are all valid Bluetooth fixes — access points are Wi-Fi related, not Bluetooth.", "id": "c2t27q8"}, {"q": "Which of the actions listed below will have no effect on resolving Wi-Fi connectivity issues on a mobile device?", "type": "single", "options": ["Move the device closer to the wireless router", "Disable airplane mode", "Reseat the mobile device's SIM card", "Forget the network and reconnect", "Restart the wireless router", "Verify the correctness of Wi-Fi credentials"], "correct": [2], "exp": "The SIM card relates to cellular service, not Wi-Fi — reseating it won't affect Wi-Fi connectivity.", "id": "c2t27q9"}, {"q": "Which of the following is not a valid troubleshooting step for resolving problems with contactless payment transactions on a mobile device?", "type": "single", "options": ["Ensure the phone is awake and unlocked", "If used, remove the device's EMF/RFID protective case", "Enable NFC in phone settings", "Verify payment card details in the mobile wallet app", "Maintain very close proximity between the phone and the terminal", "Enable airplane mode to reduce wireless interference"], "correct": [5], "exp": "Airplane mode disables NFC/wireless functions entirely — it would break, not fix, contactless payment.", "id": "c2t27q10"}, {"q": "Modern mobile devices auto-rotate portrait/landscape based on orientation. If auto-rotate fails, the easiest fix is disabling Portrait Orientation Lock (Apple) or enabling Auto-rotate (Android).", "type": "bool", "options": ["True", "False"], "correct": [0], "exp": "Checking/toggling the orientation lock setting is the standard fix for auto-rotate failures.", "id": "c2t27q11"}, {"q": "What is the name of the package file format used by the Android OS for the distribution and installation of mobile applications?", "type": "single", "options": ["xap", "apk", "ipa", "exe"], "correct": [1], "exp": "APK is Android's app package file format.", "id": "c2t27q12"}, {"q": "The practice of installing mobile apps from untrusted sources (i.e., websites and app stores other than the official marketplaces) is referred to as:", "type": "single", "options": ["Sandboxing", "Jailbreaking", "Rooting", "Sideloading"], "correct": [3], "exp": "Installing apps from unofficial sources is sideloading.", "id": "c2t27q13"}, {"q": "Sideloading via APK is the primary method for installing unverified apps from third-party sites on:", "type": "single", "options": ["iOS", "Android", "Windows Mobile", "Other"], "correct": [1], "exp": "APK sideloading is Android's method for installing apps from third-party sources.", "id": "c2t27q14"}, {"q": "Installing mobile apps from the official, trusted sources such as Apple's App Store or Google Play significantly reduces malware-related security risks.", "type": "bool", "options": ["True", "False"], "correct": [0], "exp": "Official app store vetting significantly reduces (though doesn't eliminate) malware risk.", "id": "c2t27q15"}, {"q": "What is the name of an iOS/Android feature that provides access to advanced system settings hidden by default from regular users?", "type": "single", "options": ["Recovery mode", "Safe Mode", "Kernel mode", "Developer Mode/options"], "correct": [3], "exp": "Developer Mode/options exposes advanced hidden settings on iOS/Android.", "id": "c2t27q16"}, {"q": "Which of the answers listed below refers to the process of granting a regular user elevated privileges on an Android-based mobile device?", "type": "single", "options": ["Sideloading", "Rooting", "Carrier unlocking", "Jailbreaking"], "correct": [1], "exp": "Rooting grants elevated privileges on Android devices.", "id": "c2t27q17"}, {"q": "The process of bypassing Apple's built-in software restrictions on iOS/iPadOS devices is known as:", "type": "single", "options": ["Sideloading", "Carrier unlocking", "Rooting", "Jailbreaking"], "correct": [3], "exp": "Jailbreaking bypasses Apple's built-in iOS/iPadOS restrictions.", "id": "c2t27q18"}, {"q": "Which of the following enables installation of software that is not available through the official Apple App Store?", "type": "single", "options": ["Jailbreaking", "Rooting", "Sideloading", "Carrier unlocking"], "correct": [0], "exp": "Jailbreaking is what enables installing software outside the App Store on iOS.", "id": "c2t27q19"}, {"q": "Which of the answers listed below best describes the concept of application spoofing?", "type": "single", "options": ["A situation in which a web form field accepts data other than expected (e.g., server commands)", "A type of attack aimed at exploiting an unknown vulnerability in already released software", "A mobile app performing unwanted and harmful actions in disguise of a legitimate and useful program", "A method for gaining unauthorized root access to a mobile device's operating system"], "correct": [2], "exp": "Application spoofing is a malicious app disguised as a legitimate/useful one.", "id": "c2t27q20"}, {"q": "Which of the following actions would be the best initial diagnostic step to identify the source of excessive traffic on a mobile device?", "type": "single", "options": ["Force stop background applications", "Perform a network speed benchmark", "Review per-app data usage logs", "Contact the mobile service provider"], "correct": [2], "exp": "Reviewing per-app data usage logs directly identifies which app is causing excessive traffic.", "id": "c2t27q21"}, {"q": "Which of the actions listed below would most likely improve degraded response times on a mobile device? (Select 3 answers)", "type": "multi", "options": ["Installing operating system or application updates", "Reviewing CPU, RAM, or storage usage for resource-heavy apps", "Closing unnecessary background applications", "Enabling developer options to generate more detailed system logs", "Restarting the device to clear temporary processes"], "correct": [0, 2, 4], "exp": "Updates, closing background apps, and restarting the device are the direct fixes for degraded response times.", "id": "c2t27q22"}, {"q": "A mobile device repeatedly displays data-usage limit notifications despite minimal user activity. Which condition is most likely the direct cause of this symptom?", "type": "single", "options": ["Outdated OS", "Enabled developer options", "Malicious app", "Faulty SIM card"], "correct": [2], "exp": "A malicious app secretly consuming data would explain excess usage despite minimal user activity.", "id": "c2t27q23"}, {"q": "A user reports their mobile device frequently loses Wi-Fi connection or cannot connect to any networks. Which of the following would be the most targeted and least disruptive troubleshooting step to resolve this problem?", "type": "single", "options": ["Remove and reinsert the device's SIM card", "Perform a hard reboot (forced restart) of the device", "Forget all networks from the device's saved Wi-Fi list and try to reconnect", "Restart the device's Wi-Fi adapter to reset the connection"], "correct": [3], "exp": "Restarting the Wi-Fi adapter is targeted and minimally disruptive compared to other options.", "id": "c2t27q24"}, {"q": "If a mobile device intermittently loses Wi-Fi connection, which action will have no effect on improving its stability?", "type": "single", "options": ["Forget and reconnect to the Wi-Fi network", "Move closer to the Wi-Fi router or access point", "Restart the Wi-Fi adapter on the device", "Check for and reduce Wi-Fi interference from other devices", "Remove and reinsert the device's SIM card"], "correct": [4], "exp": "The SIM card is unrelated to Wi-Fi connectivity — it won't affect Wi-Fi stability.", "id": "c2t27q25"}]}, {"id": "test28", "label": "Test 28", "questions": [{"q": "A technician is troubleshooting a mobile device with no internet connectivity. They notice the device is also experiencing rapid battery drain and high data usage alerts. After isolating the device from the network, what should the technician do next?", "type": "single", "options": ["Replace the device battery", "Factory reset the device", "Perform a malware scan", "Contact the cellular provider"], "correct": [2], "exp": "Battery drain + high data usage + connectivity issues suggest malware — scan next after isolating.", "id": "c2t28q1"}, {"q": "After installing an application from outside the Google Play Store, an Android user notices that the device is displaying an excessive number of advertisements, including pop-ups appearing outside of the web browser. What is the most likely explanation for this issue?", "type": "single", "options": ["Outdated operating system", "Disabled pop-up blocker", "Unverified apps containing adware", "Disabled Google Play Protect"], "correct": [2], "exp": "Sideloaded/unverified apps commonly contain adware causing excessive ads.", "id": "c2t28q2"}, {"q": "The primary goal of delivering a fake security warning to a mobile device user is to:", "type": "single", "options": ["Mislead the user into disabling real security features", "Trick the user into installing malicious software", "Misinform the user about the device's actual security status", "Pressure the user into buying a legitimate third-party app"], "correct": [1], "exp": "Fake security warnings (scareware) aim to trick users into installing malware.", "id": "c2t28q3"}, {"q": "An Android user reports that several system settings change back to default automatically and the device frequently reboots. A technician discovers Developer Mode was enabled and an application was sideloaded from a third-party website. What is the most effective method to completely remove the threat and restore the device to normal operation?", "type": "single", "options": ["Disable Developer Mode", "Force stop the suspicious application", "Perform a factory reset of the device", "Uninstall the application"], "correct": [2], "exp": "A factory reset is the most thorough way to fully remove this kind of persistent threat.", "id": "c2t28q4"}, {"q": "An employee notices their private photos and contacts have been posted to a public social media site without their consent. A technician inspects the device and finds apps with administrative privileges that the user does not remember installing. What is the best course of action to fully remediate the device and remove unauthorized access?", "type": "single", "options": ["Uninstall the suspicious apps", "Perform a full malware scan", "Reset the device to factory defaults", "Quarantine the device via MDM"], "correct": [2], "exp": "With unauthorized admin-privileged apps and confirmed data theft, a factory reset fully remediates the device.", "id": "c2t28q5"}, {"q": "A technician is troubleshooting a Windows PC that suddenly cannot access network shares or the internet. The network adapter shows connectivity, and other devices on the same switch port are working fine. The technician suspects malware has altered a system file to prevent network access. Which system file, if modified by malware, is most likely responsible for redirecting domain names to incorrect IP addresses or blocking name resolution?", "type": "single", "options": ["tcpip.sys", "win.ini", "hosts", "system.ini"], "correct": [2], "exp": "A maliciously modified hosts file can redirect domain names or block name resolution.", "id": "c2t28q6"}, {"q": "A user's PC displays repeated desktop alerts claiming the antivirus subscription has expired, but the antivirus dashboard shows it is active. What is the most appropriate troubleshooting step?", "type": "single", "options": ["Turn the app notifications off", "Perform a full malware scan", "Ignore the alerts", "Reinstall the antivirus software"], "correct": [1], "exp": "Fake alerts contradicting the actual AV status suggest malware — run a full scan.", "id": "c2t28q7"}, {"q": "A PC user reports that many personal files have suddenly been renamed with unfamiliar extensions, and several folders appear to be missing. The user can no longer open any of the affected files. After disconnecting the PC from the network, what should the technician do next to identify the cause of the issue?", "type": "single", "options": ["Restore the files from backup", "Perform a full malware scan", "Adjust user permissions", "Attempt to repair the file system"], "correct": [1], "exp": "Renamed files with unfamiliar extensions is classic ransomware behavior — scan to confirm/identify.", "id": "c2t28q8"}, {"q": "A user's Windows PC displays frequent alerts requesting activation of an unknown system protection tool. What step should be taken to address this symptom?", "type": "single", "options": ["Disable OS notifications", "Ignore the alerts", "Update Windows", "Run a full malware scan"], "correct": [3], "exp": "Unknown \"protection tool\" alerts are a common scareware/malware symptom — scan the system.", "id": "c2t28q9"}, {"q": "A technician is troubleshooting a PC that cannot connect to Microsoft Update servers. The technician wants to use a built-in automated tool to diagnose common update problems. Which utility should the technician use?", "type": "single", "options": ["Windows Update service", "System File Checker", "Windows Update Troubleshooter", "Network Troubleshooter"], "correct": [2], "exp": "Windows Update Troubleshooter is the built-in automated tool for diagnosing update issues.", "id": "c2t28q10"}, {"q": "Which troubleshooting steps would help resolve random or frequent pop-ups displayed in a web browser? (Select 3 answers)", "type": "multi", "options": ["Remove suspicious browser extensions", "Perform a malware removal scan", "Reset the browser to its default settings", "Use Task Manager to end browser processes", "Disable the browser's JavaScript engine"], "correct": [0, 1, 2], "exp": "Removing suspicious extensions, scanning for malware, and resetting the browser address persistent pop-ups.", "id": "c2t28q11"}, {"q": "A user notices that their web browser displays a warning indicating the website's SSL/TLS certificate is not trusted. What is the most likely cause?", "type": "single", "options": ["The website contains malware", "The browser's proxy settings are incorrect", "The website uses HTTP instead of HTTPS", "The certificate has expired"], "correct": [3], "exp": "An expired certificate is the most common cause of an untrusted certificate warning.", "id": "c2t28q12"}, {"q": "A web browser redirecting the user to a website other than intended might indicate a security issue related to:", "type": "single", "options": ["TLS", "HTTP", "NAT", "DNS"], "correct": [3], "exp": "Unexpected redirects often point to DNS hijacking/poisoning.", "id": "c2t28q13"}, {"q": "Which of the actions listed below is least likely to improve degraded web browser performance?", "type": "single", "options": ["Resetting the browser to its defaults", "Closing unnecessary browser tabs", "Emptying the browser's cache", "Removing suspicious browser extensions", "Updating the browser", "Adjusting the virtual memory settings"], "correct": [5], "exp": "Virtual memory settings are a system-wide OS setting, not something that specifically fixes browser performance.", "id": "c2t28q14"}, {"q": "When creating a new help desk ticket in a ticketing system, which basic information is typically required during the initial data collection phase? (Select 3 answers)", "type": "multi", "options": ["User information", "Expected resolution date", "Device information", "Escalation levels required", "Problem description"], "correct": [0, 2, 4], "exp": "User info, device info, and problem description are the basic initial ticket fields.", "id": "c2t28q15"}, {"q": "A technician is logging a new support ticket. Which item is primarily used to ensure that future reporting can track the frequency of specific, recurring problems?", "type": "single", "options": ["Issue description", "Category", "Severity level of the issue", "Escalation level"], "correct": [1], "exp": "Ticket category enables tracking frequency of recurring problem types in reports.", "id": "c2t28q16"}, {"q": "A support ticket regarding a system memory failure has been moved from Level 1 to a Level 2 hardware specialist. This action is documented using which specific ticketing system field?", "type": "single", "options": ["Issue description", "Ticket status", "Resolution summary", "Escalation level"], "correct": [3], "exp": "Moving a ticket to a higher support tier is recorded in the escalation level field.", "id": "c2t28q17"}, {"q": "A desktop technician is updating a support ticket with the steps performed to troubleshoot a network printer. Which field should contain a factual, concise summary of these steps?", "type": "single", "options": ["Issue description", "Progress notes", "Resolution summary", "Escalation level"], "correct": [1], "exp": "Progress notes capture the concise, factual troubleshooting steps performed.", "id": "c2t28q18"}, {"q": "A type of structured record used in IT asset management to track hardware, software, and peripheral devices within an organization is referred to as:", "type": "single", "options": ["Maintenance log", "System configuration baseline", "Onboarding checklist", "Inventory list"], "correct": [3], "exp": "An inventory list tracks hardware/software/peripherals across an organization.", "id": "c2t28q19"}, {"q": "Which of the following answers refer to valid examples of items tracked in a CMDB? (Select 2 answers)", "type": "multi", "options": ["Server hardware", "Log data", "Asset disposal records", "Installed applications", "User passwords"], "correct": [0, 3], "exp": "A CMDB tracks assets like server hardware and installed applications.", "id": "c2t28q20"}, {"q": "The primary difference between a simple inventory list and a CMDB is that a CMDB contains the same raw asset data as an inventory list, but also tracks the dependencies and relationships between the assets.", "type": "bool", "options": ["True", "False"], "correct": [0], "exp": "A CMDB extends inventory data by adding relationship/dependency tracking between assets.", "id": "c2t28q21"}, {"q": "In IT asset management, a physical label (typically a sticker, barcode, QR code, or RFID tag) affixed to a device is known as:", "type": "single", "options": ["Service tag", "Asset ID", "Tracking label", "Asset tag"], "correct": [3], "exp": "An asset tag is the physical label affixed to a device.", "id": "c2t28q22"}, {"q": "Which of the terms listed below describes a unique alphanumeric string or number assigned to an asset within an inventory system or CMDB?", "type": "single", "options": ["Product key", "Asset ID", "Serial number", "Asset tag"], "correct": [1], "exp": "An Asset ID is the unique identifier assigned within an inventory system/CMDB.", "id": "c2t28q23"}, {"q": "A technician is attempting to locate an unassigned network switch in a storage room. The inventory list provides only a physical description and an internal asset ID. Which identifier on the device should the technician use to match the physical item to the documentation?", "type": "single", "options": ["Device model number", "Manufacturer serial number", "Device MAC address", "Physical asset tag"], "correct": [3], "exp": "The physical asset tag on the device matches the internal asset ID in the inventory record.", "id": "c2t28q24"}, {"q": "Which of the following terms is used to describe a structured process organizations follow to acquire goods, services, or equipment from external suppliers?", "type": "single", "options": ["Asset management process", "Resource scheduling framework", "Procurement life cycle", "Inventory management plan"], "correct": [2], "exp": "The procurement life cycle describes the structured process of acquiring goods/services/equipment.", "id": "c2t28q25"}]}, {"id": "test29", "label": "Test 29", "questions": [{"q": "A technician reviews an asset record before submitting a hardware repair request. Which detail confirms whether the vendor will provide free replacement parts?", "type": "single", "options": ["Maintenance window schedule", "Vendor support escalation path", "Asset procurement date", "Warranty coverage status"], "correct": [3], "exp": "Warranty coverage status determines
