h of the following refers to a documented set of instructions used to ensure consistent execution of routine operational or procedural tasks?", "type": "single", "options": ["AUP", "SOW", "TOS", "SOP"], "correct": [3], "exp": "An SOP documents consistent routine task execution.", "id": "c2aq1q21"}, {"q": "Which type of software enables centralized control over the configuration, monitoring, and security of mobile devices used within an organization?", "type": "single", "options": ["MDR", "IAM", "SIEM", "MDM"], "correct": [3], "exp": "MDM centrally manages/monitors/secures mobile devices.", "id": "c2aq1q22"}, {"q": "Antistatic bags, antistatic wrist straps, and ground mats are all countermeasures used to protect computer and communications equipment components against:", "type": "single", "options": ["RFI", "ESD", "EFT", "EMI"], "correct": [1], "exp": "These are all ESD protection measures.", "id": "c2aq1q23"}, {"q": "A Layer 3 protocol responsible for addressing and forwarding packets across a network is known as:", "type": "single", "options": ["UDP", "IP", "TCP", "NetBIOS"], "correct": [1], "exp": "IP handles addressing/forwarding at Layer 3.", "id": "c2aq1q24"}, {"q": "Which of the acronyms listed below refers to a software- or hardware-based security solution designed to detect and prevent the unauthorized use or transmission of confidential information?", "type": "single", "options": ["EDR", "DEP", "XDR", "DLP"], "correct": [3], "exp": "DLP detects/prevents unauthorized transmission of confidential data.", "id": "c2aq1q25"}]}, {"id": "quiz2", "label": "Quiz 2", "questions": [{"q": "An authentication subsystem that enables a user to access multiple, connected system components (such as separate hosts on a network) after a single login on only one of the components is referred to as:", "type": "single", "options": ["NAC", "SSO", "AAA", "MFA"], "correct": [1], "exp": "SSO lets one login grant access to multiple connected systems.", "id": "c2aq2q1"}, {"q": "Which of the following terms refers to a solution that allows MSPs to remotely monitor, manage, and maintain client systems?", "type": "single", "options": ["RMM", "SSH", "VNC", "RDP"], "correct": [0], "exp": "RMM lets MSPs remotely monitor/manage client systems.", "id": "c2aq2q2"}, {"q": "Which of the acronyms listed below refers to a Microsoft-developed file system that provides advanced features including file and folder permissions, encryption, compression, and the ability to handle very large files/partitions?", "type": "single", "options": ["FAT32", "HFS+", "exFAT", "NTFS"], "correct": [3], "exp": "NTFS provides permissions/encryption/compression and large file support.", "id": "c2aq2q3"}, {"q": "For a wireless client to connect to a secured Wi-Fi network, its configured security settings (e.g., WPA2/WPA3) must match the corresponding settings on the WAP.", "type": "bool", "options": ["True", "False"], "correct": [0], "exp": "Security settings must match between client and WAP to connect.", "id": "c2aq2q4"}, {"q": "Which cyberattack involves impersonating a legitimate business contact via email to trick employees into harmful actions such as transferring funds or sharing sensitive information?", "type": "single", "options": ["XSS", "CSRF", "APT", "BEC"], "correct": [3], "exp": "BEC impersonates a trusted contact to trick employees into harmful actions.", "id": "c2aq2q5"}, {"q": "Which of the following refers to a suite of networking protocols that enables devices on a local network to automatically discover each other and establish network services without manual configuration?", "type": "single", "options": ["WPS", "UPnP", "PXE", "BOOTP"], "correct": [1], "exp": "UPnP enables automatic device discovery/service establishment on a LAN.", "id": "c2aq2q6"}, {"q": "A hardware-based cryptographic module integrated into a computer that supports security features such as secure boot, disk encryption, and system integrity verification is known as:", "type": "single", "options": ["TPM", "SoC", "UEFI", "HSM"], "correct": [0], "exp": "TPM provides secure boot/disk encryption/integrity verification.", "id": "c2aq2q7"}, {"q": "Which WAN technology takes advantage of cell towers that provide wireless signal coverage for mobile devices?", "type": "single", "options": ["WiMAX", "WMN", "ATM", "WWAN"], "correct": [3], "exp": "WWAN uses cell towers for wireless WAN coverage.", "id": "c2aq2q8"}, {"q": "Which of the terms listed below refers to an agreement that specifies performance requirements for a vendor?", "type": "single", "options": ["MSA", "SLA", "MOU", "SOW"], "correct": [1], "exp": "An SLA specifies performance requirements for a vendor.", "id": "c2aq2q9"}, {"q": "An agreement granting the right to use a software application in a manner determined by the software vendor is called:", "type": "single", "options": ["AUP", "ToS", "EULA", "SLA"], "correct": [2], "exp": "A EULA governs terms of software use set by the vendor.", "id": "c2aq2q10"}, {"q": "Which of the following acronyms refers to a comprehensive framework for managing access to digital resources?", "type": "single", "options": ["PAM", "SSO", "IAM", "MFA"], "correct": [2], "exp": "IAM is the comprehensive framework for managing digital resource access.", "id": "c2aq2q11"}, {"q": "Which of the answers listed below refers to the management of users with elevated privileges on critical systems?", "type": "single", "options": ["OAuth", "IAM", "RBAC", "PAM"], "correct": [3], "exp": "PAM manages users with elevated privileges.", "id": "c2aq2q12"}, {"q": "Which Microsoft protocol enables remote command-line management and automation of tasks on Windows-based systems?", "type": "single", "options": ["RDP", "VNC", "WinRM", "ICS"], "correct": [2], "exp": "WinRM enables remote command-line management/automation on Windows.", "id": "c2aq2q13"}, {"q": "Which interim encryption method was introduced with WPA as a stop-gap replacement for WEP?", "type": "single", "options": ["AES", "TKIP", "CCMP", "EAP"], "correct": [1], "exp": "TKIP was the stop-gap encryption introduced with WPA.", "id": "c2aq2q14"}, {"q": "Which of the following acronyms refers to a non-proprietary protocol that enables remote GUI-based control of another computer on the network?", "type": "single", "options": ["VTP", "VRF", "VTC", "VNC"], "correct": [3], "exp": "VNC is the non-proprietary GUI remote control protocol.", "id": "c2aq2q15"}, {"q": "Which of the terms listed below refers to a credential type that is valid for only a single authentication session or transaction?", "type": "single", "options": ["OTP", "CAPTCHA", "SSO", "HMAC"], "correct": [0], "exp": "OTP is a single-use authentication credential.", "id": "c2aq2q16"}, {"q": "Which of the following answers refers to a markup language for exchanging authentication and authorization data?", "type": "single", "options": ["SAML", "XML", "SOAP", "XHTML"], "correct": [0], "exp": "SAML exchanges authentication/authorization data.", "id": "c2aq2q17"}, {"q": "An MS Windows stop error is informally referred to as:", "type": "single", "options": ["BYOD", "JBOD", "BSoD", "DDoS"], "correct": [2], "exp": "A Windows stop error is informally called the BSoD.", "id": "c2aq2q18"}, {"q": "Which of the answers listed below refers to the network name visible to users when they look for available Wi-Fi networks?", "type": "single", "options": ["ESS", "SSID", "BSS", "BSSID"], "correct": [1], "exp": "SSID is the visible Wi-Fi network name.", "id": "c2aq2q19"}, {"q": "Which of the following is the most common external interface used to connect a wide variety of peripheral devices to a PC via PnP technology?", "type": "single", "options": ["PS/2", "DisplayPort", "eSATA", "USB"], "correct": [3], "exp": "USB is the most common PnP peripheral interface.", "id": "c2aq2q20"}, {"q": "Which of the acronyms listed below refers to a secure replacement for Telnet?", "type": "single", "options": ["RDP", "RSH", "SSH", "VNC"], "correct": [2], "exp": "SSH is the secure replacement for Telnet.", "id": "c2aq2q21"}, {"q": "A type of centralized repository that stores information about an organization's IT assets and the relationships between them is known as:", "type": "single", "options": ["CMDB", "NoSQL", "LDAP", "DBMS"], "correct": [0], "exp": "A CMDB stores IT assets and their relationships.", "id": "c2aq2q22"}, {"q": "Which of the following is a security feature used in Bluetooth device pairing?", "type": "single", "options": ["TLS", "PIN", "OTP", "ACL"], "correct": [1], "exp": "A PIN is used as a shared secret during Bluetooth pairing.", "id": "c2aq2q23"}, {"q": "Which of the answers listed below refers to a legacy firmware type used to perform initial hardware checks after the computer is powered on?", "type": "single", "options": ["CMOS", "ROM", "BIOS", "EPROM"], "correct": [2], "exp": "BIOS performs POST checks after power-on.", "id": "c2aq2q24"}, {"q": "A device designed to provide emergency power during an unexpected main power source outage is called:", "type": "single", "options": ["UPS", "PoE", "SVC", "PSU"], "correct": [0], "exp": "A UPS provides emergency backup power during outages.", "id": "c2aq2q25"}]}, {"id": "quiz3", "label": "Quiz 3", "questions": [{"q": "A legal contract between the holder of confidential information and another person to whom that information is disclosed restricting that other person from disclosing the confidential information to any other party is referred to as:", "type": "single", "options": ["MOU", "SLA", "BPA", "NDA"], "correct": [3], "exp": "An NDA restricts disclosure of confidential information.", "id": "c2aq3q1"}, {"q": "Which of the following file systems is known for its 4 GB maximum file size and 2 TB maximum volume size limitations?", "type": "single", "options": ["NTFS", "FAT32", "NFS", "exFAT"], "correct": [1], "exp": "FAT32 has a 4 GB max file size and 2 TB max volume limitation.", "id": "c2aq3q2"}, {"q": "What is the name of a firmware interface designed as a replacement for traditional BIOS?", "type": "single", "options": ["UEFI", "PXE", "ACPI", "CMOS"], "correct": [0], "exp": "UEFI is the modern replacement for traditional BIOS.", "id": "c2aq3q3"}, {"q": "Which AAA solution uses UDP as its transport protocol and is commonly deployed for network access control such as VPN and Wi-Fi authentication?", "type": "single", "options": ["RADIUS", "LDAP", "TACACS+", "Kerberos"], "correct": [0], "exp": "RADIUS uses UDP for VPN/Wi-Fi access control.", "id": "c2aq3q4"}, {"q": "Which of the AAA solutions listed below relies on TCP, separates authentication, authorization, and accounting, and is commonly used for device administration in enterprise networks?", "type": "single", "options": ["OAuth", "TACACS+", "SAML", "RADIUS"], "correct": [1], "exp": "TACACS+ uses TCP and separates all three AAA functions.", "id": "c2aq3q5"}, {"q": "Which main computer hardware component is responsible for executing instructions and processing data?", "type": "single", "options": ["GPU", "ALU", "CPU", "FPU"], "correct": [2], "exp": "The CPU executes instructions and processes data.", "id": "c2aq3q6"}, {"q": "Which of the following answers refers to a cybersecurity approach that combines data from multiple security tools to provide comprehensive threat detection and response across endpoints, networks, and cloud environments?", "type": "single", "options": ["EDR", "SIEM", "XDR", "NDR"], "correct": [2], "exp": "XDR correlates data across endpoints/network/cloud for unified detection.", "id": "c2aq3q7"}, {"q": "A system that uses a public network (such as the internet) as a means for creating private encrypted connections between remote locations is known as:", "type": "single", "options": ["VLAN", "TLS", "IPsec", "VPN"], "correct": [3], "exp": "A VPN creates private encrypted connections over a public network.", "id": "c2aq3q8"}, {"q": "Which of the answers listed below refers to a software or hardware-based system specifically designed to control access to and usage of copyrighted digital content?", "type": "single", "options": ["DLP", "PGP", "DRM", "TPM"], "correct": [2], "exp": "DRM controls access to/usage of copyrighted digital content.", "id": "c2aq3q9"}, {"q": "What is the name of an MS Windows component that enables encryption of individual files?", "type": "single", "options": ["DFS", "AES", "TPM", "EFS"], "correct": [3], "exp": "EFS encrypts individual files in Windows.", "id": "c2aq3q10"}, {"q": "Which Microsoft file system was specifically designed for maximum resilience, data integrity, and large-scale storage deployments in enterprise environments?", "type": "single", "options": ["XFS", "Btrfs", "ZFS", "ReFS"], "correct": [3], "exp": "ReFS is Microsoft's resilience-focused enterprise file system.", "id": "c2aq3q11"}, {"q": "Which of the following acronyms refers to a security vulnerability that allows attackers to inject malicious scripts into web pages viewed by other users?", "type": "single", "options": ["CSRF", "XSS", "SQLi", "XSRF"], "correct": [1], "exp": "XSS injects malicious scripts into web pages.", "id": "c2aq3q12"}, {"q": "Which of the answers listed below refers to a high-performance file system commonly used in UNIX-like operating systems such as Linux to handle very large files and storage volumes?", "type": "single", "options": ["ReFS", "DFS", "XFS", "exFAT"], "correct": [2], "exp": "XFS handles very large files/volumes on Linux/UNIX.", "id": "c2aq3q13"}, {"q": "Which type of cybersecurity service provides continuous monitoring, threat detection, and incident response delivered as a fully managed service by an external security provider?", "type": "single", "options": ["EDR", "MDR", "SIEM", "XDR"], "correct": [1], "exp": "MDR is a fully managed continuous monitoring/response service.", "id": "c2aq3q14"}, {"q": "A type of document stipulating rules of behavior to be followed by users of computers, networks, and associated resources is called:", "type": "single", "options": ["SLA", "EULA", "AUP", "BPA"], "correct": [2], "exp": "An AUP stipulates rules for using computers/networks.", "id": "c2aq3q15"}, {"q": "Which of the following answers refers to a hierarchical and decentralized naming system containing mappings of domain names to various types of data, such as numerical IP addresses?", "type": "single", "options": ["WINS", "DNS", "NetBIOS", "ARP"], "correct": [1], "exp": "DNS is the hierarchical decentralized naming/mapping system.", "id": "c2aq3q16"}, {"q": "A mobile device deployment model in which employees use their personally owned devices to access company data and applications is referred to as:", "type": "single", "options": ["COPE", "CYOD", "COBO", "BYOD"], "correct": [3], "exp": "BYOD lets employees use personal devices for company access.", "id": "c2aq3q17"}, {"q": "Which part of the AAA security architecture ensures that users are who they claim to be, typically through credentials like passwords or biometrics?", "type": "single", "options": ["Auditing", "Authentication", "Authorization", "Accounting"], "correct": [1], "exp": "Authentication verifies identity claims.", "id": "c2aq3q18"}, {"q": "An eSIM is a modern alternative to the traditional SIM card. Unlike traditional SIMs, an eSIM is an embedded chip built into the device (not a physical card).", "type": "bool", "options": ["True", "False"], "correct": [0], "exp": "eSIMs are built-in embedded chips rather than physical cards.", "id": "c2aq3q19"}, {"q": "Which of the answers listed below refers to an open-source remote desktop protocol designed for virtual machine access?", "type": "single", "options": ["WinRM", "VNC", "DaaS", "SPICE"], "correct": [3], "exp": "SPICE is an open-source protocol for VM access.", "id": "c2aq3q20"}, {"q": "A Microsoft-developed file system designed for flash storage and large removable drives is known as:", "type": "single", "options": ["FAT32", "NFS", "exFAT", "CDFS"], "correct": [2], "exp": "exFAT is designed for flash storage/large removable drives.", "id": "c2aq3q21"}, {"q": "Which of the following computer security solutions is used for defining and enforcing network access policies?", "type": "single", "options": ["NAT", "NIDS", "NAC", "NDR"], "correct": [2], "exp": "NAC defines/enforces network access policies.", "id": "c2aq3q22"}, {"q": "A cyberattack focused on making a website, service, or network unavailable to users by overloading it with traffic or malicious requests is called:", "type": "single", "options": ["SQLi", "XSS", "CSRF", "DoS"], "correct": [3], "exp": "A DoS attack overwhelms a target to make it unavailable.", "id": "c2aq3q23"}, {"q": "Which file system is the default choice for many modern Linux distributions?", "type": "single", "options": ["APFS", "ext4", "HFS+", "exFAT"], "correct": [1], "exp": "ext4 is the default file system for many modern Linux distros.", "id": "c2aq3q24"}, {"q": "Which of the answers listed below refers to an interim wireless security standard introduced to address the vulnerabilities found in WEP?", "type": "single", "options": ["WPS", "EAP", "WPA", "AES"], "correct": [2], "exp": "WPA was introduced to address WEP's vulnerabilities.", "id": "c2aq3q25"}]}, {"id": "quiz4", "label": "Quiz 4", "questions": [{"q": "Which of the following terms is used to describe a company that manufactures components, parts, or systems that are then integrated into another company's finished product or sold under that company's brand name?", "type": "single", "options": ["IDM", "VAR", "OEM", "MSP"], "correct": [2], "exp": "OEM makes components integrated into another company's finished product/brand.", "id": "c2aq4q1"}, {"q": "What is the function of FTP?", "type": "single", "options": ["Email service", "Directory access", "Serving of web pages", "File exchange"], "correct": [3], "exp": "FTP is used for file exchange.", "id": "c2aq4q2"}, {"q": "Which protocol is used to synchronize the real-time clocks of devices across a network?", "type": "single", "options": ["NTP", "VTP", "NNTP", "RTP"], "correct": [0], "exp": "NTP synchronizes clocks across a network.", "id": "c2aq4q3"}, {"q": "What is the primary purpose of S.M.A.R.T. in a storage media drive?", "type": "single", "options": ["Automatic correction of detected drive errors", "Real-time monitoring and regulation of power consumption", "Prediction and reporting of impending drive failures", "Optimization of drive read/write speeds"], "correct": [2], "exp": "S.M.A.R.T. predicts/reports impending drive failures.", "id": "c2aq4q4"}, {"q": "Which type of network is used for connecting computers within a small geographical area such as a building or group of buildings?", "type": "single", "options": ["PAN", "LAN", "MAN", "WAN"], "correct": [1], "exp": "A LAN covers a small geographic area like a building.", "id": "c2aq4q5"}, {"q": "APIPA allows a Windows host to self-configure an IPv4 address and subnet mask when a DHCP server is unavailable. APIPA uses the address block range from 169.254.0.0 to 169.254.255.255. APIPA-assigned addresses are valid only for communication within the network segment to which the host is connected. A host with an APIPA-assigned address cannot connect to the Internet.", "type": "bool", "options": ["True", "False"], "correct": [0], "exp": "APIPA self-assigns a local-only 169.254.x.x address when DHCP is unreachable.", "id": "c2aq4q6"}, {"q": "Which of the answers listed below refers to a unique string of characters used to identify hardware, software, and data?", "type": "single", "options": ["OID", "GUID", "URI", "OUI"], "correct": [1], "exp": "A GUID uniquely identifies hardware/software/data.", "id": "c2aq4q7"}, {"q": "A type of small-scale business network environment is commonly referred to as:", "type": "single", "options": ["VLAN", "SME", "WMN", "SOHO"], "correct": [3], "exp": "SOHO describes a small-scale business network environment.", "id": "c2aq4q8"}, {"q": "What is a PUP? (Select 3 answers)", "type": "multi", "options": ["Computer program installed with user's consent, but often lacking fully informed agreement", "Software downloaded and installed entirely without user knowledge or consent", "Free utility software that is legitimately bundled as a feature of a paid application", "Computer program not explicitly classified as malware by AV software", "Application that may degrade system performance, compromise privacy, or inject unsolicited ads", "Malicious code that is explicitly classified and blocked as malware by AV software"], "correct": [0, 3, 4], "exp": "A PUP is installed with (uninformed) consent, not classified as outright malware, and may harm privacy/performance with unsolicited ads.", "id": "c2aq4q9"}, {"q": "Which MFD/MFP feature optimizes the processing of multi-page documents?", "type": "single", "options": ["PCL", "IPP", "ASIC", "ADF"], "correct": [3], "exp": "ADF handles multi-page document processing.", "id": "c2aq4q10"}, {"q": "Which of the following enables OS installation over a network interface?", "type": "single", "options": ["NFS", "MMC", "PXE", "RDP"], "correct": [2], "exp": "PXE enables network-based OS installation.", "id": "c2aq4q11"}, {"q": "A dedicated network consisting of storage devices that provide data access is called:", "type": "single", "options": ["SDN", "NAS", "iSCSI", "SAN"], "correct": [3], "exp": "A SAN is a dedicated network for centralized data access.", "id": "c2aq4q12"}, {"q": "Which of the answers listed below refers to a network protocol for secure file transfer over SSH?", "type": "single", "options": ["FTPS", "SFTP", "FTP", "TFTP"], "correct": [1], "exp": "SFTP transfers files securely over SSH.", "id": "c2aq4q13"}, {"q": "Which cloud computing service model allows developers to run individual pieces of code in response to events without managing servers or underlying infrastructure?", "type": "single", "options": ["SaaS", "PaaS", "IaaS", "FaaS"], "correct": [3], "exp": "FaaS (Function as a Service) runs event-triggered code without server management.", "id": "c2aq4q14"}, {"q": "Which of the following acronyms refers to a networking hardware device that provides wireless clients with access to a wired network?", "type": "single", "options": ["NAS", "ONT", "NIC", "WAP"], "correct": [3], "exp": "A WAP connects wireless clients to a wired network.", "id": "c2aq4q15"}, {"q": "A computer network connecting multiple LANs over an area of a city is referred to as:", "type": "single", "options": ["PAN", "SAN", "MAN", "CAN"], "correct": [2], "exp": "A MAN spans a city, connecting multiple LANs.", "id": "c2aq4q16"}, {"q": "Which of the acronyms listed below refers to a logical security rule set that controls access to objects and specifies the operations allowed on a given object?", "type": "single", "options": ["AUP", "SSO", "ACL", "OTP"], "correct": [2], "exp": "An ACL controls access to objects and allowed operations.", "id": "c2aq4q17"}, {"q": "Which type of software acts as an intermediary between users and computer hardware, enabling both system operations and application execution?", "type": "single", "options": ["API", "BIOS", "OS", "GUI"], "correct": [2], "exp": "The OS is the intermediary between users/apps and hardware.", "id": "c2aq4q18"}, {"q": "Which of the following combinations uses two different authentication factors and therefore qualifies as MFA?", "type": "single", "options": ["Smart card and mobile digital key", "Password and biometric scan", "Username and pattern lock (on a device screen)", "Retina scan and fingerprint"], "correct": [1], "exp": "Password (knowledge) + biometric (inherence) uses two distinct factor categories — true MFA.", "id": "c2aq4q19"}, {"q": "TCP is a connection-oriented protocol using a three-way handshake which is a set of initial steps required for establishing network connection. TCP supports retransmission of lost packets, flow control (managing the amount of data that is being sent), and sequencing (rearranging packets that arrived out of order). Example applications of TCP include transmission of text and image data.", "type": "bool", "options": ["True", "False"], "correct": [0], "exp": "This correctly describes TCP's connection-oriented, reliable behavior.", "id": "c2aq4q20"}, {"q": "A mobile device's built-in functionality enabling the usage of locator applications is known as:", "type": "single", "options": ["IMSI", "GSM", "IMEI", "GPS"], "correct": [3], "exp": "GPS enables locator app functionality.", "id": "c2aq4q21"}, {"q": "Which wireless security protocol has been officially deprecated in favor of newer standards due to its known cryptographic design flaws?", "type": "single", "options": ["WPA2", "EAP", "WEP", "CCMP"], "correct": [2], "exp": "WEP was deprecated due to serious cryptographic flaws.", "id": "c2aq4q22"}, {"q": "When comparing two otherwise identical RAM modules, which specification indicates how many clock cycles the memory takes to begin returning data, with lower values generally providing faster response times?", "type": "single", "options": ["SPD", "ECC", "MT/s", "CAS"], "correct": [3], "exp": "CAS latency indicates clock cycles before data is returned.", "id": "c2aq4q23"}, {"q": "In the AAA security architecture, the process of tracking user activity and resource usage for reporting or billing is called:", "type": "single", "options": ["Authentication", "Auditing", "Accounting", "Authorization"], "correct": [2], "exp": "Accounting tracks resource usage/activity for reporting/billing.", "id": "c2aq4q24"}, {"q": "What is the name of a network protocol that secures web traffic via SSL/TLS encryption?", "type": "single", "options": ["IPSec", "SSH", "HTTPS", "VPN"], "correct": [2], "exp": "HTTPS secures web traffic via SSL/TLS.", "id": "c2aq4q25"}]}, {"id": "quiz5", "label": "Quiz 5", "questions": [{"q": "What is the common term for a group of protocols used to carry voice data over a packet-switched network?", "type": "single", "options": ["ISDN", "PBX", "VoIP", "PSTN"], "correct": [2], "exp": "VoIP carries voice over packet-switched (IP) networks.", "id": "c2aq5q1"}, {"q": "Which of the following answers refers to a network security solution that integrates multiple security services such as firewall, antivirus, intrusion prevention, and web filtering into a single appliance?", "type": "single", "options": ["SWG", "IDS", "UTM", "WAF"], "correct": [2], "exp": "UTM bundles multiple security functions into one appliance.", "id": "c2aq5q2"}, {"q": "Which network protocol is used to retrieve content from a web server?", "type": "single", "options": ["CIFS", "FTP", "SSH", "HTTP"], "correct": [3], "exp": "HTTP retrieves web content from a server.", "id": "c2aq5q3"}, {"q": "Which of the answers listed below refers to one of the major CPU manufacturers for PCs?", "type": "single", "options": ["ASUS", "NVIDIA", "AMD", "EVGA"], "correct": [2], "exp": "AMD is one of the two major PC CPU manufacturers.", "id": "c2aq5q4"}, {"q": "Which device authenticates and manages remote user connection requests before granting access to a network?", "type": "single", "options": ["NAS", "ONT", "NGFW", "NID"], "correct": [0], "exp": "Note: in RAS context, a remote access server authenticates/manages remote connections (closest listed match is NAS in this quiz's answer key).", "id": "c2aq5q5"}, {"q": "A type of limited-range computer network used for data transmission among various types of personal devices is referred to as:", "type": "single", "options": ["PAN", "LAN", "SAN", "MAN"], "correct": [0], "exp": "A PAN connects personal devices over a limited range.", "id": "c2aq5q6"}, {"q": "Which of the following solutions provide the AAA functionality? (Select 2 answers)", "type": "multi", "options": ["PEAP", "TACACS+", "SAML", "RADIUS", "MS-CHAP"], "correct": [1, 3], "exp": "TACACS+ and RADIUS both provide full AAA functionality.", "id": "c2aq5q7"}, {"q": "What are the characteristic features of SMB/CIFS? (Select 2 answers)", "type": "multi", "options": ["Optimized for secure file sharing over the Internet", "Used to provide shared access to files, directories, and devices", "Designed for Linux-based environments", "Intended for voice and multimedia communication over IP networks", "Primarily used in Microsoft Windows environments"], "correct": [1, 4], "exp": "SMB/CIFS is native to Windows and provides shared access to files/directories/devices.", "id": "c2aq5q8"}, {"q": "Which of the answers listed below refers to a cloud computing service model in which clients, instead of buying all the hardware and software, purchase computing resources as an outsourced service from suppliers who own and maintain all the necessary equipment and software?", "type": "single", "options": ["SaaS", "DaaS", "IaaS", "PaaS"], "correct": [2], "exp": "IaaS provides outsourced computing infrastructure.", "id": "c2aq5q9"}, {"q": "Which type of system RAM transfers data on both the rising and falling edges of the clock signal?", "type": "single", "options": ["SDR", "DDR", "QDR", "ODR"], "correct": [1], "exp": "DDR transfers on both clock edges.", "id": "c2aq5q10"}, {"q": "The SMTP protocol is used for: (Select 2 answers)", "type": "multi", "options": ["Synchronizing email folders across multiple devices", "Forwarding email between mail servers", "Downloading email to a local client from a remote server", "Routing inbound mail to the correct mailbox", "Sending email from a client to a mail server"], "correct": [1, 4], "exp": "SMTP handles server-to-server forwarding and client-to-server sending.", "id": "c2aq5q11"}, {"q": "Which technology allows a physical network to be divided into multiple logical broadcast domains for better segmentation and management?", "type": "single", "options": ["VPN", "DMZ", "VLAN", "WAN"], "correct": [2], "exp": "VLANs divide a physical network into logical broadcast domains.", "id": "c2aq5q12"}, {"q": "A technology that combines multiple physical disk drives into a single logical unit to improve capacity, performance, or fault tolerance is known as:", "type": "single", "options": ["SAN", "RAID", "NAS", "JBOD"], "correct": [1], "exp": "RAID combines multiple disks into one logical unit for capacity/performance/redundancy.", "id": "c2aq5q13"}, {"q": "Which of the following answers refers to a solution that allows network administrators to prioritize certain types of network traffic?", "type": "single", "options": ["NAC", "QoS", "NAT", "UTM"], "correct": [1], "exp": "QoS prioritizes certain network traffic types.", "id": "c2aq5q14"}, {"q": "LDAP is an example of:", "type": "single", "options": ["Data encryption protocol", "Address resolution protocol", "Directory access protocol", "File exchange protocol"], "correct": [2], "exp": "LDAP is a directory access protocol.", "id": "c2aq5q15"}, {"q": "Which DNS record type specifies the mail servers responsible for accepting email on behalf of a domain?", "type": "single", "options": ["SPF", "NS", "MX", "PTR"], "correct": [2], "exp": "MX records list a domain's mail servers.", "id": "c2aq5q16"}, {"q": "Which technology uses infrared light waves to enable short-range wireless communication, often found in remote controls?", "type": "single", "options": ["NFC", "IR", "Wi-Fi", "RF"], "correct": [1], "exp": "IR is used in remote controls for short-range wireless communication.", "id": "c2aq5q17"}, {"q": "A network protocol providing an alternative solution to the manual allocation of IP addresses is called:", "type": "single", "options": ["DNS", "SNMP", "NAT", "DHCP"], "correct": [3], "exp": "DHCP automates IP address allocation.", "id": "c2aq5q18"}, {"q": "Which of the answers listed below refers to Apple's mechanism for deploying time-sensitive security patches for iOS, iPadOS, and macOS independently of major OS updates?", "type": "single", "options": ["OTA", "APT", "RSR", "MDM"], "correct": [2], "exp": "RSR deploys urgent Apple patches independently of major updates.", "id": "c2aq5q19"}, {"q": "Which fiber-optic device is typically installed at the customer premises to terminate a fiber connection from the ISP?", "type": "single", "options": ["MDI", "IDF", "ONT", "MDF"], "correct": [2], "exp": "An ONT terminates the fiber connection at the customer premises.", "id": "c2aq5q20"}, {"q": "UDP is an example of a connectionless protocol. Because UDP does not support three-way handshake while establishing a network connection, it is referred to as unreliable or best-effort protocol. Example applications of UDP include transmission of video and audio streaming data.", "type": "bool", "options": ["True", "False"], "correct": [0], "exp": "UDP is indeed connectionless, best-effort, and used for streaming applications.", "id": "c2aq5q21"}, {"q": "Which DNS record type creates an alias that maps one domain name to another domain name?", "type": "single", "options": ["MX", "CNAME", "AAAA", "PTR"], "correct": [1], "exp": "CNAME records alias one domain name to another.", "id": "c2aq5q22"}, {"q": "Which of the following terms describes a visual interface that allows users to interact with an operating system through graphical elements such as windows, icons, and menus rather than text-based commands?", "type": "single", "options": ["HMI", "CLI", "VDI", "GUI"], "correct": [3], "exp": "GUI describes graphical, non-text-based interaction with an OS.", "id": "c2aq5q23"}, {"q": "Which motherboard form factor has historically been the standard full-size design used in desktop PCs?", "type": "single", "options": ["ATX", "mATX", "ITX", "mITX"], "correct": [0], "exp": "ATX is the historical standard full-size desktop motherboard form factor.", "id": "c2aq5q24"}, {"q": "Which of the answers listed below refers to the global industry standard for 4G mobile broadband?", "type": "single", "options": ["WiMAX", "LTE", "UMTS", "HSPA+"], "correct": [1], "exp": "LTE is the global standard for 4G mobile broadband.", "id": "c2aq5q25"}]}, {"id": "quiz6", "label": "Quiz 6", "questions": [{"q": "Which of the following answers refers to a unique 48-bit address assigned to a NIC?", "type": "single", "options": ["OUI", "UAA", "IMEI", "MAC"], "correct": [3], "exp": "A MAC address is the unique 48-bit hardware address of a NIC.", "id": "c2aq6q1"}, {"q": "What is the name of a hardware device that enables the administration of multiple hosts with the use of a single mouse, keyboard, and computer screen?", "type": "single", "options": ["MFD", "KVM", "MMC", "USB"], "correct": [1], "exp": "A KVM switch lets one keyboard/video/mouse control multiple hosts.", "id": "c2aq6q2"}, {"q": "An eSATA device can be added to a PC by attaching the device directly into an internal slot on the motherboard.", "type": "bool", "options": ["True", "False"], "correct": [1], "exp": "eSATA connects via I/O panel or bracket port, not a dedicated internal motherboard slot.", "id": "c2aq6q3"}, {"q": "Which of the answers listed below refer to physical form factors for SSDs? (Select 2 answers)", "type": "multi", "options": ["SCSI", "M.2", "PCIe", "mSATA", "NVMe"], "correct": [1, 3], "exp": "M.2 and mSATA are SSD form factors (PCIe/NVMe/SCSI are interfaces, not form factors).", "id": "c2aq6q4"}, {"q": "A specialized hardware component that accelerates visual rendering is referred to as:", "type": "single", "options": ["TPU", "GPU", "DSP", "CPU"], "correct": [1], "exp": "The GPU accelerates visual/graphics rendering.", "id": "c2aq6q5"}, {"q": "Which of the following answers refers to a global standard development organization composed of different national standards bodies?", "type": "single", "options": ["NIST", "ISO", "IEEE", "ANSI"], "correct": [1], "exp": "ISO is the global standards body composed of national standards organizations.", "id": "c2aq6q6"}, {"q": "ECC type RAM:", "type": "single", "options": ["Can only detect errors, but does not have the capability to correct them", "Refers to parity RAM (the two terms are interchangeable)", "Offers better performance in terms of speed when compared to a non-ECC type of RAM", "Can detect and correct errors"], "correct": [3], "exp": "ECC RAM can both detect and correct data errors.", "id": "c2aq6q7"}, {"q": "Which performance metric is used to measure the number of read and write operations a storage drive can perform per second?", "type": "single", "options": ["LBA", "S.M.A.R.T.", "RPM", "IOPS"], "correct": [3], "exp": "IOPS measures read/write operations per second.", "id": "c2aq6q8"}, {"q": "Which of the answers listed below refers to a primary color model used in electronic displays, digital imaging, and screen-based color reproduction?", "type": "single", "options": ["HSV", "RGB", "CMYK", "LAB"], "correct": [1], "exp": "RGB is the primary color model for electronic displays.", "id": "c2aq6q9"}, {"q": "Which wireless technology enables identification and tracking of tags attached to objects?", "type": "single", "options": ["WTLS", "GPS", "RFID", "NFC"], "correct": [2], "exp": "RFID identifies/tracks tags attached to objects.", "id": "c2aq6q10"}, {"q": "In the AAA security architecture, the process of granting or denying access to resources is known as:", "type": "single", "options": ["Authorization", "Accounting", "Auditing", "Authentication"], "correct": [0], "exp": "Authorization grants or denies access to resources.", "id": "c2aq6q11"}, {"q": "Which of the following terms refers to the measurement of the rotational speed of a mechanical component, such as platters in magnetic storage drives or optical discs?", "type": "single", "options": ["PPM", "RPS", "BPS", "RPM"], "correct": [3], "exp": "RPM measures rotational speed of mechanical drive/disc components.", "id": "c2aq6q12"}, {"q": "The DNS TXT record is used for: (Select 2 answers)", "type": "multi", "options": ["Resolving an IP address to a hostname for reverse lookups", "Mapping a domain name to a list of mail servers for that domain", "Specifying the authoritative name servers for a domain", "Providing verification and email security policy information", "Storing arbitrary text-based data associated with a domain"], "correct": [3, 4], "exp": "TXT records store arbitrary text data, often used for verification/email security policies (e.g., SPF).", "id": "c2aq6q13"}, {"q": "A system administrator needs to execute a PowerShell script on multiple remote Windows workstations without opening a GUI session on each machine. Which protocol should be used?", "type": "single", "options": ["PCoIP", "SSH", "WinRM", "Telnet"], "correct": [2], "exp": "WinRM enables remote PowerShell execution without a GUI session.", "id": "c2aq6q14"}, {"q": "Which cloud service model would provide the best solution for a web developer intending to create a web app?", "type": "single", "options": ["XaaS", "SaaS", "PaaS", "IaaS"], "correct": [2], "exp": "PaaS provides a platform for developers to build/deploy web apps.", "id": "c2aq6q15"}, {"q": "Which of the answers listed below refers to a legacy network API that allows applications on different computers to communicate over a LAN?", "type": "single", "options": ["IPX/SPX", "NWLink", "LLMNR", "NetBIOS"], "correct": [3], "exp": "NetBIOS is the legacy API for LAN application communication.", "id": "c2aq6q16"}, {"q": "A type of ISP offering internet access to subscribers via fixed wireless radio link is called:", "type": "single", "options": ["NSP", "WISP", "TSP", "NaaS"], "correct": [1], "exp": "A WISP delivers Internet via fixed wireless radio links.", "id": "c2aq6q17"}, {"q": "Which motherboard component uses battery-backed volatile memory to store the real-time clock and legacy BIOS configuration data?", "type": "single", "options": ["SRAM", "ROM", "CMOS RAM", "EEPROM"], "correct": [2], "exp": "CMOS RAM (battery-backed) stores the real-time clock and BIOS settings.", "id": "c2aq6q18"}, {"q": "Which of the following answers refers to a policy framework that allows domain owners to specify how email receivers should handle emails that fail authentication checks?", "type": "single", "options": ["DKIM", "SPF", "PGP", "DMARC"], "correct": [3], "exp": "DMARC tells receivers how to handle m var CERTS = {
  comptia_aplus: { label: "CompTIA A+", cores: ["core1","core2"] }
};

var MASTERY_TARGET = 2;
var EXAM_QUESTION_COUNT = 90;
var EXAM_SECONDS = 90 * 60;

// nav: {screen: 'cert'|'certmenu'|'category'|'testlist'|'learn'|'examsetup'|'exam'|'examresult', cert, core, category, testId}
var nav = {screen: 'cert'};
var progress = {};   // id -> {streak, seen}  (in-memory only, resets each load)
var queue = [];
var current = null;
var picked = new Set();
var answered = false;
var activeQuestions = [];
var activeLabel = "";

// exam-mode state
var examQuestions = [];
var examAnswers = [];   // array of Set, index-aligned with examQuestions
var examIndex = 0;
var examSecondsLeft = EXAM_SECONDS;
var examTimerId = null;
var examSubmitted = false;
var examScore = 0;

// custom practice set state
var CUSTOM_QUESTION_COUNT = 50;
var customSelected = new Set(); // test ids currently checked on the setup screen

function shuffle(arr){
  var a = arr.slice();
  for(var i=a.length-1;i>0;i--){
    var j = Math.floor(Math.random()*(i+1));
    var tmp=a[i]; a[i]=a[j]; a[j]=tmp;
  }
  return a;
}

function getCategoryList(core, category){
  return category === 'practice_tests' ? BANK[core].practice_tests : BANK[core].acronym_quizzes;
}

function goCustomSetup(cert, core){ clearExamTimer(); customSelected = new Set(); nav = {screen:'customsetup', cert:cert, core:core}; render(); }

function toggleCustomTest(testId){
  if(customSelected.has(testId)) customSelected.delete(testId);
  else customSelected.add(testId);
  render();
}

function startCustomTest(){
  var pool = [];
  BANK[nav.core].practice_tests.forEach(function(t){
    if(customSelected.has(t.id)){
      t.questions.forEach(function(q){ pool.push(q); });
    }
  });
  var count = Math.min(CUSTOM_QUESTION_COUNT, pool.length);
  activeQuestions = shuffle(pool).slice(0, count);
  activeLabel = "Custom Mix (" + customSelected.size + " test" + (customSelected.size===1?"":"s") + ")";
  progress = {};
  activeQuestions.forEach(function(q){ progress[q.id] = {streak:0, seen:0}; });
  nav = {screen:'learn', cert:nav.cert, core:nav.core, category:'custom'};
  buildQueue();
  nextQuestion();
}

function startTest(core, category, testId){
  var list = getCategoryList(core, category);
  var found = list.filter(function(t){ return t.id === testId; })[0];
  activeQuestions = found.questions;
  activeLabel = found.label;
  progress = {};
  activeQuestions.forEach(function(q){ progress[q.id] = {streak:0, seen:0}; });
  nav = {screen:'learn', cert:nav.cert, core:core, category:category, testId:testId};
  buildQueue();
  nextQuestion();
}

function buildQueue(){
  var remaining = activeQuestions.filter(function(q){ return progress[q.id].streak < MASTERY_TARGET; });
  queue = shuffle(remaining).map(function(q){ return q.id; });
}

function masteredCount(){
  return activeQuestions.filter(function(q){ return progress[q.id].streak >= MASTERY_TARGET; }).length;
}

function nextQuestion(){
  answered = false;
  picked = new Set();
  if(queue.length === 0){ buildQueue(); }
  if(queue.length === 0){ current = null; render(); return; }
  var id = queue.shift();
  current = activeQuestions.filter(function(q){ return q.id === id; })[0];
  render();
}

function toggleOption(idx){
  if(answered) return;
  if(current.type === "single" || current.type === "bool"){
    picked = new Set([idx]);
  } else {
    if(picked.has(idx)) picked.delete(idx); else picked.add(idx);
  }
  render();
}

function setsEqual(a,b){
  if(a.size !== b.size) return false;
  var ok = true;
  a.forEach(function(x){ if(!b.has(x)) ok = false; });
  return ok;
}

function submit(){
  if(picked.size===0 || answered) return;
  answered = true;
  var correctSet = new Set(current.correct);
  var isRight = setsEqual(picked, correctSet);
  var p = progress[current.id];
  p.seen++;
  if(isRight){
    p.streak++;
  } else {
    p.streak = 0;
    var insertAt = Math.min(queue.length, 3);
    queue.splice(insertAt, 0, current.id);
  }
  render();
}

function markUnknown(){
  if(answered) return;
  answered = true;
  picked = new Set();
  var p = progress[current.id];
  p.seen++;
  p.streak = 0;
  var insertAt = Math.min(queue.length, 3);
  queue.splice(insertAt, 0, current.id);
  render();
}

function resetProgress(){
  activeQuestions.forEach(function(q){ progress[q.id] = {streak:0, seen:0}; });
  buildQueue();
  nextQuestion();
}

function optClasses(idx){
  var cls = ["opt"];
  if(current.type==="single" || current.type==="bool") cls.push("radio");
  if(!answered){
    if(picked.has(idx)) cls.push("picked");
    return cls.join(" ");
  }
  cls.push("disabled");
  var isCorrect = current.correct.indexOf(idx) !== -1;
  var wasPicked = picked.has(idx);
  if(isCorrect) cls.push("correct");
  else if(wasPicked) cls.push("incorrect");
  return cls.join(" ");
}

/* ---------- Practice Exam mode ---------- */

function clearExamTimer(){
  if(examTimerId !== null){ clearInterval(examTimerId); examTimerId = null; }
}

function startExam(){
  var pool = [];
  BANK[nav.core].practice_tests.forEach(function(t){
    t.questions.forEach(function(q){ pool.push(q); });
  });
  examQuestions = shuffle(pool).slice(0, Math.min(EXAM_QUESTION_COUNT, pool.length));
  examAnswers = examQuestions.map(function(){ return new Set(); });
  examIndex = 0;
  examSecondsLeft = EXAM_SECONDS;
  examSubmitted = false;
  examScore = 0;
  clearExamTimer();
  examTimerId = setInterval(function(){
    examSecondsLeft--;
    if(examSecondsLeft <= 0){
      examSecondsLeft = 0;
      submitExam();
      return;
    }
    render();
  }, 1000);
  nav = {screen:'exam', cert:nav.cert, core:nav.core};
  render();
}

function examToggleOption(idx){
  var q = examQuestions[examIndex];
  var picked = examAnswers[examIndex];
  if(q.type === "single" || q.type === "bool"){
    examAnswers[examIndex] = new Set([idx]);
  } else {
    if(picked.has(idx)) picked.delete(idx); else picked.add(idx);
  }
  render();
}

function examGoto(i){
  if(i < 0 || i >= examQuestions.length) return;
  examIndex = i;
  render();
}

function submitExam(){
  clearExamTimer();
  var score = 0;
  examQuestions.forEach(function(q, i){
    var correctSet = new Set(q.correct);
    if(setsEqual(examAnswers[i], correctSet)) score++;
  });
  examScore = score;
  examSubmitted = true;
  nav = {screen:'examresult', cert:nav.cert, core:nav.core};
  render();
}

  examQuestions.forEach(function(q, i){
    var correctSet = new Set(q.correct);
    if(!setsEqual(examAnswers[i], correctSet)){
      var yourAnswer = examAnswers[i].size===0 ? "No answer" : Array.from(examAnswers[i]).map(function(idx){ return q.options[idx]; }).join(", ");
      var correctAnswer = q.correct.map(function(idx){ return q.options[idx]; }).join(", ");
      missed.push('<div class="review-item">'+
        '<div class="rq">'+(i+1)+'. '+q.q+'</div>'+
        '<div class="ra">Your answer: '+yourAnswer+'</div>'+
        '<div class="rc">Correct answer: '+correctAnswer+'</div>'+
        '<div>'+q.exp+'</div>'+
      '</div>');
    }
  });

  root.innerHTML =
    '<div class="wrap">'+
      '<div class="topbar"><span class="brand" id="brandHome">A+ Learn</span></div>'+
      crumbsHtml()+
      '<div class="card">'+
        '<div class="score-big">'+examScore+'/'+total+'</div>'+
        '<div class="score-sub">'+pct+'% correct</div>'+
        '<div class="btnrow" style="justify-content:center">'+
          '<button class="primary" id="retakeBtn">Take another exam</button>'+
          '<button id="menuBtn">Back to menu</button>'+
        '</div>'+
        (missed.length ? '<div style="margin-top:26px"><div class="menu-title" style="font-size:15px">Missed questions ('+missed.length+')</div>'+missed.join('')+'</div>' : '')+
      '</div>'+
    '</div>';

  wireCrumbs();
  document.getElementById('brandHome').onclick = goHome;
  document.getElementById('retakeBtn').onclick = function(){ goExamSetup(nav.cert, nav.core); };
  document.getElementById('menuBtn').onclick = function(){ goCertMenu(nav.cert); };
}

function render(){
  if(nav.screen === 'cert') renderCertScreen();
  else if(nav.screen === 'certmenu') renderCertMenuScreen();
  else if(nav.screen === 'category') renderCategoryScreen();
  else if(nav.screen === 'testlist') renderTestlistScreen();
  else if(nav.screen === 'customsetup') renderCustomSetupScreen();
  else if(nav.screen === 'learn') renderLearnScreen();
  else if(nav.screen === 'examchoice') renderExamChoiceScreen();
  else if(nav.screen === 'examsetup') renderExamSetupScreen();
  else if(nav.screen === 'exam') renderExamScreen();
  else if(nav.screen === 'examresult') renderExamResultScreen();
}

render();

})();
</script>

</body>
</html>
