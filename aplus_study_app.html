ure, and discover each other.", "id": "aq8q2"}, {"q": "Which of the answers listed below refers to a non-volatile mass storage media type that uses flash memory and has no moving parts, offering faster access than spinning disk drives?", "type": "single", "options": ["SATA", "SD", "SCSI", "SSD"], "correct": [3], "exp": "An SSD uses flash memory with no moving parts, faster than HDDs.", "id": "aq8q3"}, {"q": "Which of the following answers refer(s) to ARM-type CPU architecture? (Select all that apply)", "type": "multi", "options": ["Characterized by lowered power consumption", "Typically used in personal computers, laptops, and servers", "Focuses on simplifying the instruction set to enhance processing efficiency", "Employs complex instructions for efficient memory management and backward compatibility", "Commonly used in mobile devices and embedded systems", "Suitable for battery-powered devices"], "correct": [0, 2, 4, 5], "exp": "ARM is low-power, RISC-based, common in mobile/embedded/battery-powered devices.", "id": "aq8q4"}, {"q": "Which of the terms listed below refer to SSD form factors? (Select 2 answers)", "type": "multi", "options": ["PCIe", "M.2", "mSATA", "NVMe", "SATA"], "correct": [1, 2], "exp": "M.2 and mSATA are SSD form factors (PCIe/NVMe/SATA are interfaces, not form factors).", "id": "aq8q5"}, {"q": "Which of the following systems is specifically designed for remote, wide-area monitoring and supervisory control of industrial processes across multiple geographically dispersed sites?", "type": "single", "options": ["DCS", "SCADA", "PLC", "RTOS"], "correct": [1], "exp": "SCADA is designed for wide-area remote industrial process monitoring/control.", "id": "aq8q6"}, {"q": "What is the name of an authentication method that enables the signing of an outbound email message with a digital signature?", "type": "single", "options": ["SPF", "DKIM", "SRV", "DMARC"], "correct": [1], "exp": "DKIM digitally signs outbound email messages.", "id": "aq8q7"}, {"q": "Which of the acronyms listed below refers to a security solution that provides the capability for detection, analysis, response, and real-time monitoring of cyber threats at the device level?", "type": "single", "options": ["SWG", "CASB", "EDR", "NGFW"], "correct": [2], "exp": "EDR (Endpoint Detection and Response) monitors/responds to threats at the device level.", "id": "aq8q8"}, {"q": "What are the characteristic features of the TN display technology? (Select 3 answers)", "type": "multi", "options": ["Low viewing angles", "Fast response times", "Low color quality", "High color quality", "Slow response times", "Wide viewing angles"], "correct": [0, 1, 2], "exp": "TN panels are fast but have low color quality and narrow viewing angles.", "id": "aq8q9"}, {"q": "A logical device interface used for accessing non-volatile memory storage devices attached via PCIe is known as:", "type": "single", "options": ["GDI", "NVMe", "SLI", "MAPI"], "correct": [1], "exp": "NVMe is the logical interface for PCIe-attached non-volatile storage.", "id": "aq8q10"}, {"q": "Which of the following provides granular control over user access to specific network segments and resources based on their assigned roles and permissions?", "type": "single", "options": ["EDR", "IAM", "AAA", "IPS"], "correct": [1], "exp": "IAM provides granular, role-based access control to resources.", "id": "aq8q11"}, {"q": "Which of the answers listed below refers to virtualization platform for delivering virtual desktops to a community of users?", "type": "single", "options": ["VDE", "VNC", "VDI", "RDP"], "correct": [2], "exp": "VDI delivers virtual desktops to a community of users.", "id": "aq8q12"}, {"q": "Which of the following describes a CPU architecture focused on a simplified set of instructions to enhance speed and efficiency?", "type": "single", "options": ["CISC", "RISC", "x86", "EPIC"], "correct": [1], "exp": "RISC uses a simplified instruction set for speed/efficiency.", "id": "aq8q13"}, {"q": "A type of USB connection method commonly used in modern mobile devices due to its reversible design, fast data transfer, and power capabilities is called:", "type": "single", "options": ["USB Type-B", "MiniUSB", "USB-C", "MicroUSB", "USB Type-A"], "correct": [2], "exp": "USB-C's reversible design and fast transfer/power make it standard on modern devices.", "id": "aq8q14"}, {"q": "Which of the terms listed below refers to a smart card issued by the U.S. Department of Defense for secure identification, authentication, and access to both physical locations and information systems?", "type": "single", "options": ["eSIM", "PIV", "CAC", "EMV"], "correct": [2], "exp": "The CAC (Common Access Card) is the DoD-issued smart card for identification/access.", "id": "aq8q15"}, {"q": "Which of the following refers to a documented set of instructions designed to ensure consistent execution of routine tasks?", "type": "single", "options": ["AUP", "SOW", "TOS", "SOP"], "correct": [3], "exp": "An SOP (Standard Operating Procedure) documents consistent task execution.", "id": "aq8q16"}, {"q": "Which acronym refers to a cybersecurity approach that combines data from multiple security tools to provide comprehensive threat detection and response across endpoints, networks, and cloud environments?", "type": "single", "options": ["EDR", "SIEM", "XDR", "NDR"], "correct": [2], "exp": "XDR combines data across endpoints/network/cloud for comprehensive threat detection.", "id": "aq8q17"}, {"q": "Which of the answers listed below refers to any type of information pertaining to an individual that can be used to uniquely identify that person?", "type": "single", "options": ["PHI", "PIV", "PII", "PKI"], "correct": [2], "exp": "PII (Personally Identifiable Information) uniquely identifies an individual.", "id": "aq8q18"}, {"q": "What is the name of a security feature used in Bluetooth device pairing?", "type": "single", "options": ["TLS", "PIN", "OTP", "ACL"], "correct": [1], "exp": "A PIN is used as a shared secret during Bluetooth pairing.", "id": "aq8q19"}, {"q": "Which of the following enables operating system installation over a network interface?", "type": "single", "options": ["NFS", "MMC", "PXE", "WDS"], "correct": [2], "exp": "PXE enables booting/OS installation over the network.", "id": "aq8q20"}, {"q": "Which of the acronyms listed below refers to a markup language for exchanging authentication and authorization data?", "type": "single", "options": ["SAML", "XML", "SOAP", "XHTML"], "correct": [0], "exp": "SAML is the markup language for exchanging authentication/authorization data.", "id": "aq8q21"}, {"q": "An Apple-exclusive mechanism for deploying time-sensitive security patches independently of major OS updates is referred to as:", "type": "single", "options": ["YUM", "RSR", "APT", "RPM"], "correct": [1], "exp": "RSR (Rapid Security Response) is Apple's mechanism for fast, independent security patches.", "id": "aq8q22"}, {"q": "Which of the following refers to a solution that allows IT professionals to remotely supervise and maintain client systems, including monitoring performance, deploying updates, and resolving issues without physical access?", "type": "single", "options": ["RMM", "SSH", "VNC", "RDP"], "correct": [0], "exp": "RMM (Remote Monitoring and Management) supervises/maintains client systems remotely.", "id": "aq8q23"}, {"q": "Which of the answers listed below refers to a standardized method employed by the U.S. federal government to authenticate the identities of employees and contractors via smart card-based credentials?", "type": "single", "options": ["PIV", "MFA", "SAE", "PKI"], "correct": [0], "exp": "PIV (Personal Identity Verification) is the federal smart-card authentication standard.", "id": "aq8q24"}, {"q": "Which of the following refers to a framework for evaluating and improving software development processes?", "type": "single", "options": ["SPICE", "QA", "ISO", "SDLC"], "correct": [0], "exp": "SPICE is a framework for evaluating/improving software development processes.", "id": "aq8q25"}]}]}, "core2": {"label": "Core 2", "practice_tests": [{"id": "test1", "label": "Test 1", "questions": [{"q": "Which workstation operating system is most widely adopted in business environments due to its strong compatibility with enterprise applications, management tools, and network infrastructure?", "type": "single", "options": ["Windows", "Linux", "macOS", "Chrome OS"], "correct": [0], "exp": "Windows is the most widely adopted business OS due to strong enterprise app/tool/network compatibility.", "id": "c2t1q1"}, {"q": "A software development company is setting up new workstations for programmers who frequently use command-line tools, need extensive system configuration capabilities, and prefer a fully open-source platform for building and testing applications. Which OS is best suited for their needs?", "type": "single", "options": ["Chrome OS", "macOS", "Linux", "Windows"], "correct": [2], "exp": "Linux fits best: open-source, strong CLI tools, and deep configurability.", "id": "c2t1q2"}, {"q": "Which workstation OS runs natively only on Apple hardware?", "type": "single", "options": ["CentOS", "macOS", "ReactOS", "Chrome OS"], "correct": [1], "exp": "macOS runs natively only on Apple hardware.", "id": "c2t1q3"}, {"q": "Which of the answers listed below refers to an operating system designed for lightweight, low-cost laptops optimized for web-based applications?", "type": "single", "options": ["Chrome OS", "Linux", "macOS", "Windows"], "correct": [0], "exp": "Chrome OS is built for lightweight, low-cost laptops centered on web apps.", "id": "c2t1q4"}, {"q": "Which mobile operating system restricts app installation strictly to the App Store unless the device is modified?", "type": "single", "options": ["iOS", "Android", "Chrome OS", "macOS"], "correct": [0], "exp": "iOS restricts installs to the App Store unless jailbroken.", "id": "c2t1q5"}, {"q": "Which of the following answers refers to a mobile OS widely adopted by device manufacturers for its open-source base and flexible customization options?", "type": "single", "options": ["Symbian", "webOS", "Chrome OS", "Android"], "correct": [3], "exp": "Android's open-source base and customization make it widely adopted by manufacturers.", "id": "c2t1q6"}, {"q": "Which device type is iPadOS specifically developed for?", "type": "single", "options": ["Tablet", "Smartphone", "Laptop", "Smartwatch"], "correct": [0], "exp": "iPadOS is specifically developed for tablets (iPads).", "id": "c2t1q7"}, {"q": "Which mobile OS is exclusive to Apple's iPhones?", "type": "single", "options": ["iPadOS", "macOS", "iOS", "watchOS"], "correct": [2], "exp": "iOS is exclusive to iPhones.", "id": "c2t1q8"}, {"q": "A digital artist needs a mobile operating system that supports advanced stylus features. Which OS is the best fit?", "type": "single", "options": ["iPadOS", "iOS", "macOS", "Chrome OS"], "correct": [0], "exp": "iPadOS supports advanced stylus (Apple Pencil) features for digital art.", "id": "c2t1q9"}, {"q": "What are the key characteristics of Android OS? (Select 3 answers)", "type": "multi", "options": ["Closed ecosystem", "Limited customization options", "Apps installable from third-party sources (if enabled)", "Open-source platform", "Apps limited only to official App Store", "High level of customization"], "correct": [2, 3, 5], "exp": "Android is open-source, highly customizable, and allows third-party app installs if enabled.", "id": "c2t1q10"}, {"q": "Which of the answers listed below refers to a Microsoft-developed file system that provides advanced features such as file and folder permissions, encryption, compression, and support for very large files and partitions?", "type": "single", "options": ["FAT32", "HFS+", "exFAT", "NTFS"], "correct": [3], "exp": "NTFS provides permissions, encryption, compression, and large file/partition support.", "id": "c2t1q11"}, {"q": "Which Microsoft file system was specifically designed for maximum resilience, data integrity, and large-scale storage deployments in enterprise environments?", "type": "single", "options": ["XFS", "Btrfs", "ZFS", "ReFS"], "correct": [3], "exp": "ReFS is Microsoft's resilience-focused enterprise file system.", "id": "c2t1q12"}, {"q": "Which of the following file systems is known for its 4 GB maximum file size and 2 TB maximum volume size limitations?", "type": "single", "options": ["NTFS", "FAT32", "NFS", "exFAT"], "correct": [1], "exp": "FAT32 has a 4 GB max file size and 2 TB max volume limitation.", "id": "c2t1q13"}, {"q": "Which file system is the default choice for many modern Linux distributions?", "type": "single", "options": ["APFS", "ext4", "HFS+", "exFAT"], "correct": [1], "exp": "ext4 is the default file system for many modern Linux distros.", "id": "c2t1q14"}, {"q": "Which Linux file system is widely used in enterprise environments due to its support for very large files, scalability, and high performance?", "type": "single", "options": ["EFS", "XFS", "UFS", "NFS"], "correct": [1], "exp": "XFS is used in enterprise Linux for large files, scalability, and performance.", "id": "c2t1q15"}, {"q": "Which of the answers listed below refers to a Microsoft-developed proprietary file system optimized for flash drives and external storage devices?", "type": "single", "options": ["ReFS", "FAT32", "NTFS", "exFAT"], "correct": [3], "exp": "exFAT is Microsoft's file system optimized for flash/external drives.", "id": "c2t1q16"}, {"q": "Which of the following answers refers to the default macOS file system optimized for solid-state drives and encryption?", "type": "single", "options": ["ReFS", "HFS+", "EFS", "APFS"], "correct": [3], "exp": "APFS is the default macOS file system optimized for SSDs and encryption.", "id": "c2t1q17"}, {"q": "Which file systems offer the broadest cross-platform compatibility across Windows, macOS, and Linux systems? (Select 2 answers)", "type": "multi", "options": ["FAT32", "ext4", "NTFS", "exFAT", "APFS"], "correct": [0, 3], "exp": "FAT32 and exFAT offer the broadest cross-platform compatibility.", "id": "c2t1q18"}, {"q": "Which term describes the final phase in a product's life cycle when it is no longer developed, sold, or officially supported by its vendor? (Select the best answer)", "type": "single", "options": ["EOS", "EOM", "EOL", "EOA"], "correct": [2], "exp": "EOL (End of Life) is the final phase when a product is no longer developed/sold/supported.", "id": "c2t1q19"}, {"q": "Which factor is a common limitation preventing a very old desktop computer from upgrading to the newest version of an operating system?", "type": "single", "options": ["Insufficient privileges on the user account", "Default boot device set to external media", "Hardware not meeting minimum system requirements", "Missing required operating system license key"], "correct": [2], "exp": "Outdated hardware failing to meet minimum system requirements is the common blocker.", "id": "c2t1q20"}, {"q": "Vendors might limit updates or discontinue support for an operating system to:", "type": "single", "options": ["Encourage users to upgrade to newer versions", "Reduce development and support costs for older systems", "Focus development and support resources on newer OS versions", "Phase out legacy technology", "All of the above"], "correct": [4], "exp": "Vendors end support for a mix of reasons — cost, focus, upgrade incentives, and phasing out legacy tech — all of the above.", "id": "c2t1q21"}, {"q": "Which factor is the primary cause of compatibility issues when sharing data between different operating systems?", "type": "single", "options": ["Variations in hardware requirements", "Inconsistent file naming conventions", "Lack of support for proprietary software", "Differences in file system formats"], "correct": [3], "exp": "Differences in file system formats are the primary cause of cross-OS data compatibility issues.", "id": "c2t1q22"}, {"q": "Common methods used to mitigate compatibility issues between operating systems include using virtual machines, running cross-platform applications, accessing software through web-based apps, setting up remote desktop solutions, and creating dual-boot configurations to switch between OS environments as needed.", "type": "bool", "options": ["True", "False"], "correct": [0], "exp": "VMs, cross-platform apps, web apps, remote desktop, and dual-boot are all valid mitigation methods.", "id": "c2t1q23"}, {"q": "Which of the actions listed below is not required when preparing a USB drive to serve as bootable installation media for an operating system?", "type": "single", "options": ["Formatting the USB drive with a supported file system", "Creating a bootable partition on the USB drive", "Writing the operating system installation image to the USB", "Installing the operating system onto the USB drive"], "correct": [3], "exp": "You write the installer image to the USB — you don't install the OS onto the USB itself.", "id": "c2t1q24"}, {"q": "Which of the following answers refers to a solution widely used in enterprise environments for deploying operating systems at scale, particularly when the use of physical media is not feasible?", "type": "single", "options": ["NAS", "RDP", "PXE", "SAN"], "correct": [2], "exp": "PXE enables network-based OS deployment at scale without physical media.", "id": "c2t1q25"}]}, {"id": "test2", "label": "Test 2", "questions": [{"q": "What are the advantages of using SSDs for OS installations compared to traditional hard drives? (Select 3 answers)", "type": "multi", "options": ["Lower cost per gigabyte", "Improved file transfer speeds", "Much quicker boot times", "Faster application loading", "Higher storage capacity"], "correct": [1, 2, 3], "exp": "SSDs offer faster file transfers, quicker boot times, and faster app loading than HDDs.", "id": "c2t2q1"}, {"q": "Which of the answers listed below describe characteristics of an internet-based OS installation method? (Select 2 answers)", "type": "multi", "options": ["Optimized for mass deployment with standardized configuration across multiple systems", "Uses internal servers to deploy OS images over the local network", "Primarily suited for single users, remote workers, or when local network infrastructure is not available", "Commonly deployed via PXE/DHCP/TFTP protocols", "Relies on external servers, cloud services, or vendor websites for installation files"], "correct": [2, 4], "exp": "Internet-based installs suit single users/remote workers and rely on external/cloud/vendor sources for install files.", "id": "c2t2q2"}, {"q": "For an internet-based OS installation, what should a technician consider regarding data integrity and security of the downloaded files?", "type": "single", "options": ["Antivirus signature updates", "Local security settings", "Software licensing keys", "Cryptographic hash values"], "correct": [3], "exp": "Verifying cryptographic hash values confirms downloaded install files weren't corrupted or tampered with.", "id": "c2t2q3"}, {"q": "A technician is preparing an external storage drive to serve as a bootable OS installation medium. What is the primary requirement for the computer to recognize and boot from this drive?", "type": "single", "options": ["The operating system must support plug and play detection", "The computer's internal storage drives must be disabled through BIOS/UEFI", "The BIOS/UEFI boot order must prioritize the external drive", "The external drive must be formatted using the exFAT file system"], "correct": [2], "exp": "The BIOS/UEFI boot order must be set to prioritize the external drive for it to boot.", "id": "c2t2q4"}, {"q": "Which of the following allows a storage drive to be safely removed and replaced while the system remains powered on and operational?", "type": "single", "options": ["Cold-plugging", "Hot spare", "Stand-by drive", "Hot-swapping"], "correct": [3], "exp": "Hot-swapping allows safe drive removal/replacement while the system stays powered on.", "id": "c2t2q5"}, {"q": "If an operating system partition on an internal storage drive becomes corrupted and unbootable, the immediate challenge in recovering personal files (if they are not on a separate data partition) is that they become inaccessible through normal means, requiring specialized recovery methods like booting from external media or using data recovery tools.", "type": "bool", "options": ["True", "False"], "correct": [0], "exp": "A corrupted OS partition can make co-located personal files inaccessible without specialized recovery methods.", "id": "c2t2q6"}, {"q": "A technician has physically installed a brand-new internal storage drive inside the computer case, but it is not yet recognized as usable storage. What should be the first configuration step to make the drive accessible for OS installation?", "type": "single", "options": ["Format the drive", "Partition the drive", "Initialize the drive", "Assign drive letter"], "correct": [2], "exp": "A brand-new drive must first be initialized before it can be partitioned or formatted.", "id": "c2t2q7"}, {"q": "What is the most common use case for a multiboot configuration?", "type": "single", "options": ["Running multiple operating systems simultaneously", "Keeping legacy software operational in a controlled environment", "Isolating potentially harmful software away from the main OS", "Utilizing different operating systems for specific tasks"], "correct": [3], "exp": "Multiboot setups let a user choose the right OS for a specific task at boot time.", "id": "c2t2q8"}, {"q": "In a multiboot environment, each operating system must reside on a separate partition or drive to prevent file system conflicts and data corruption between the different OS installations.", "type": "bool", "options": ["True", "False"], "correct": [0], "exp": "Each OS in a multiboot setup needs its own partition/drive to avoid conflicts and corruption.", "id": "c2t2q9"}, {"q": "A user wants to add a Linux distribution to an existing Windows 11 installation to create a multiboot system. Which of the actions listed below should typically be the next logical step after shrinking the Windows partition to create unallocated space for Linux?", "type": "single", "options": ["Creating a Windows restore point", "Performing a full system backup", "Installing the Linux distribution", "Reformatting the entire storage drive"], "correct": [2], "exp": "After freeing unallocated space, the next step is installing Linux into that space.", "id": "c2t2q10"}, {"q": "Which OS installation method removes all existing data on the selected target partition?", "type": "single", "options": ["Live OS installation", "In-place upgrade", "Clean installation", "Repair installation"], "correct": [2], "exp": "A clean installation wipes the target partition before installing the OS.", "id": "c2t2q11"}, {"q": "Which of the answers listed below refers to a method that installs a newer OS version over an existing, older version without erasing user data, applications, and settings?", "type": "single", "options": ["Image deployment", "Remote network installation", "In-place upgrade", "Repair installation"], "correct": [2], "exp": "An in-place upgrade updates the OS while preserving data/apps/settings.", "id": "c2t2q12"}, {"q": "In enterprise environments, the process of setting up operating systems across many devices using a single, consistent configuration template is referred to as:", "type": "single", "options": ["In-place upgrade", "Remote network installation", "Image deployment", "Unattended installation"], "correct": [2], "exp": "Image deployment applies one standardized configuration template across many devices.", "id": "c2t2q13"}, {"q": "An IT team is deploying a batch of newly purchased desktops across multiple office locations. The devices have no pre-installed operating systems or removable media, and physical access is limited. To install the OS remotely, the department has already set up a server with a centralized OS image and uses DHCP and TFTP to deliver boot instructions. Which installation method should they use?", "type": "single", "options": ["Internet-based installation", "Unattended installation", "Image deployment", "Remote network installation"], "correct": [3], "exp": "Remote network installation (PXE/DHCP/TFTP-based) fits deploying to devices with no local media or physical access.", "id": "c2t2q14"}, {"q": "An organization wants to automate the deployment of operating systems on dozens of diskless workstations that do not have any local storage. The workstations must boot directly from the network every time they power on, retrieving the OS image from a central server without any local media involved. Which technology allows this network boot and OS loading process?", "type": "single", "options": ["NFS", "SMB", "WDS", "PXE"], "correct": [3], "exp": "PXE enables network boot and OS image loading for diskless workstations.", "id": "c2t2q15"}, {"q": "Which installation method requires no manual input at any stage, fully automating OS deployment across multiple systems?", "type": "single", "options": ["Zero-touch deployment", "Remote network installation", "Image-based deployment", "Lite-touch installation"], "correct": [0], "exp": "Zero-touch deployment fully automates OS installation with no manual input.", "id": "c2t2q16"}, {"q": "Which of the following answers refers to a built-in solution for restoring an operating system to its factory settings without the use of external media?", "type": "single", "options": ["Disk imaging", "System restore", "Recovery partition", "Shadow copy"], "correct": [2], "exp": "A recovery partition restores factory settings without needing external media.", "id": "c2t2q17"}, {"q": "Which statement best describes the outcome of a typical Windows repair installation?", "type": "single", "options": ["User applications are removed", "User data is deleted", "User application settings are reset", "User data is preserved"], "correct": [3], "exp": "A Windows repair install preserves user data while fixing the OS.", "id": "c2t2q18"}, {"q": "During the installation of a new operating system on a custom-built PC, the installer fails to detect the RAID array configured on the system. What is the most appropriate action to resolve this issue?", "type": "single", "options": ["Restart the installation and select a different drive", "Update the BIOS firmware to the latest version", "Load the appropriate third-party RAID drivers from external media", "Replace the RAID controller with a compatible model"], "correct": [2], "exp": "Loading third-party RAID drivers during install lets the installer recognize the RAID array.", "id": "c2t2q19"}, {"q": "A technician is attempting to install a new operating system on a recently assembled custom workstation. During the installation process, the installer fails to detect the installed NVMe solid-state drive, preventing the installation from proceeding. All physical connections to the NVMe drive have been verified as secure. What should the technician do to resolve this problem?", "type": "single", "options": ["Update the workstation's BIOS/UEFI firmware", "Restart the installation and select a different drive", "Load the appropriate third-party NVMe drivers from external media", "Verify the boot order in the system's BIOS/UEFI settings"], "correct": [2], "exp": "Loading third-party NVMe drivers lets the installer recognize an undetected NVMe drive.", "id": "c2t2q20"}, {"q": "What are the key benefits of dividing a storage drive into multiple partitions? (Select 3 answers)", "type": "multi", "options": ["Improved data organization", "Support for multiboot environments", "Larger physical disk capacity utilization", "Simplified backup and recovery", "Faster data transfer speeds"], "correct": [0, 1, 3], "exp": "Partitioning improves organization, supports multiboot setups, and simplifies backup/recovery.", "id": "c2t2q21"}, {"q": "A 128-bit number used by computer systems and software to uniquely identify hardware instances, software components, or configuration data is known as:", "type": "single", "options": ["OID", "GUID", "URI", "OUI"], "correct": [1], "exp": "A GUID is a 128-bit unique identifier for hardware/software/configuration data.", "id": "c2t2q22"}, {"q": "Which of the following characteristics apply to the standard GPT partitioning scheme in Windows? (Select 3 answers)", "type": "multi", "options": ["Support for disks larger than 2 TB", "Overall number of partitions limited to 4", "Native UEFI compatibility", "Support for up to 128 partitions", "Native compatibility with Legacy BIOS", "Maximum disk size limit of 2 TB"], "correct": [0, 2, 3], "exp": "GPT supports disks over 2 TB, is natively UEFI-compatible, and supports up to 128 partitions.", "id": "c2t2q23"}, {"q": "Which of the answers listed below describe the characteristics of the MBR partition style? (Select 3 answers)", "type": "multi", "options": ["Legacy BIOS", "Up to 128 primary partitions", "Maximum disk size limit of 2 TB", "Overall number of partitions limited to 4", "Support for disks larger than 2 TB", "UEFI firmware"], "correct": [0, 2, 3], "exp": "MBR pairs with legacy BIOS, is capped at 2 TB disks, and limited to 4 partitions.", "id": "c2t2q24"}, {"q": "In GPT disk architecture, each partition is labeled with a unique identifier known as GUID.", "type": "bool", "options": ["True", "False"], "correct": [0], "exp": "GPT labels each partition with a unique GUID.", "id": "c2t2q25"}]}, {"id": "test3", "label": "Test 3", "questions": [{"q": "Which of the following statements refer to a quick format? (Select 3 answers)", "type": "multi", "options": ["Deletes file system references but does not erase actual data", "Checks the drive for bad sectors", "Suitable for quickly preparing a healthy drive for reuse or OS installation", "Erases all data, making it very difficult to recover", "Suitable for preparing a drive for resale/disposal by securely erasing data", "Does not check the drive for bad sectors"], "correct": [0, 2, 5], "exp": "A quick format removes file system references without erasing data, skips bad sector checks, and is fast for preparing a healthy drive.", "id": "c2t3q1"}, {"q": "What are the characteristics of a full format? (Select 3 answers)", "type": "multi", "options": ["Does not check the drive for bad sectors", "Suitable for quickly preparing a healthy drive for reuse or OS installation", "Overwrites data, reducing chances of recovery", "Checks the drive for bad sectors", "Significantly slower than a quick format", "Deletes file system references but does not erase actual data"], "correct": [2, 3, 4], "exp": "A full format overwrites data, checks for bad sectors, and takes significantly longer than a quick format.", "id": "c2t3q2"}, {"q": "What are the key considerations when planning an upgrade to a newer version of an operating system? (Select 3 answers)", "type": "multi", "options": ["Removing temporary files or uninstalling old apps before upgrading", "Ensuring that important user data and settings are backed up", "Confirming that existing applications and drivers are compatible with the upgraded system", "Running disk cleanup or defragmentation before upgrade", "Verifying that the system hardware meets the requirements for the OS upgrade"], "correct": [1, 2, 4], "exp": "Key upgrade prep steps: back up data/settings, confirm app/driver compatibility, and verify hardware meets requirements.", "id": "c2t3q3"}, {"q": "The product life cycle for an operating system is the period during which the manufacturer provides updates and support. For systems like Microsoft Windows, the official public release of the OS version starts the mainstream support phase, during which the OS receives full support, including regular feature and security updates. This phase typically lasts a set number of months and, in the case of Microsoft operating systems, is followed by extended support, which primarily includes security patches. Once an OS version reaches its end-of-life phase, it no longer receives updates or patches. An operating system at its end of life will continue to function, but it is highly vulnerable to new security threats and is not recommended for use in any environment, especially one connected to the internet.", "type": "bool", "options": ["True", "False"], "correct": [0], "exp": "This accurately describes the mainstream → extended → end-of-life support lifecycle.", "id": "c2t3q4"}, {"q": "Which of the statements listed below apply to Windows domains? (Select 3 answers)", "type": "multi", "options": ["Each computer on a Windows domain is governed by its own security policy", "Logging into any computer on a Windows domain requires a single set of credentials", "Windows domains are based on P2P networking architecture", "Security policies and permissions on a Windows domain are administered centrally", "All members of a Windows domain must be on the same local network or subnet", "Windows domains are based on client-server networking architecture"], "correct": [1, 3, 5], "exp": "Windows domains use single sign-on credentials, centralized policy administration, and client-server architecture.", "id": "c2t3q5"}, {"q": "Which of the following answers apply to Windows workgroups? (Select 3 answers)", "type": "multi", "options": ["Security policies and permissions in workgroups are administered centrally", "Logging into any computer on a workgroup requires a single account (single sign-on feature)", "Workgroups are typically recommended for small networks of fewer than twenty computers", "There is no limit on the number of hosts that can become a part of a single workgroup", "Logging into any computer in a workgroup requires an account on that computer", "Each computer in a workgroup has its own security policy"], "correct": [2, 4, 5], "exp": "Workgroups suit small networks (<20 computers), require per-computer accounts, and have independent security policies per machine.", "id": "c2t3q6"}, {"q": "Which of the statements listed below are true? (Select 3 answers)", "type": "multi", "options": ["Windows-based computers on home networks must be part of a HomeGroup", "Windows-based computers on a network must be part of a workgroup or a domain", "Windows-based computers on workplace networks are usually part of a domain", "Windows-based computers on workplace networks are usually part of a workgroup", "Windows-based computers on home networks are usually part of a workgroup", "Windows-based computers on home networks are usually part of a domain"], "correct": [1, 2, 4], "exp": "Windows computers belong to either a workgroup or domain; workplaces usually use domains, homes usually use workgroups.", "id": "c2t3q7"}, {"q": "Which of the following tools, available in the premium editions of Microsoft Windows, enables administrative control of desktop and user interface settings for all users on a device?", "type": "single", "options": ["Control Panel", "System Configuration", "Group Policy Editor", "Registry Editor"], "correct": [2], "exp": "The Group Policy Editor lets admins control desktop/UI settings for all users.", "id": "c2t3q8"}, {"q": "Which Microsoft-proprietary protocol enables remote access and administration of another networked host through a graphical user interface?", "type": "single", "options": ["VDI", "RDP", "SSH", "VNC"], "correct": [1], "exp": "RDP is Microsoft's proprietary protocol for remote graphical access.", "id": "c2t3q9"}, {"q": "Most client editions of 32-bit Microsoft Windows are limited to 4 GB of usable RAM, regardless of the version or edition.", "type": "bool", "options": ["True", "False"], "correct": [0], "exp": "32-bit Windows editions are capped at 4 GB of usable RAM (often less due to addressing overhead).", "id": "c2t3q10"}, {"q": "What is the name of a Microsoft Windows feature that enables encryption of entire drives?", "type": "single", "options": ["FileVault", "DriveCrypt", "BitLocker", "TrueCrypt"], "correct": [2], "exp": "BitLocker is Windows' full-drive encryption feature.", "id": "c2t3q11"}, {"q": "A Microsoft Windows MMC snap-in that allows local administrators to manage system and user configuration policies is called:", "type": "single", "options": ["gpedit.msc", "compmgmt.msc", "gpmc.msc", "lusrmgr.msc"], "correct": [0], "exp": "gpedit.msc is the local Group Policy Editor snap-in.", "id": "c2t3q12"}, {"q": "Which of the answers listed below refers to an embedded microcontroller used for secure boot, disk encryption, and system integrity verification?", "type": "single", "options": ["TPM", "SoC", "UEFI", "HSM"], "correct": [0], "exp": "TPM handles secure boot, disk encryption keys, and integrity verification.", "id": "c2t3q13"}, {"q": "Which of the following answers refers to a system firmware standard that replaces traditional BIOS and is required for installing and running newer Windows editions?", "type": "single", "options": ["UEFI", "GPT", "ACPI", "TPM"], "correct": [0], "exp": "UEFI is the modern firmware standard replacing BIOS, required for newer Windows.", "id": "c2t3q14"}, {"q": "Windows 10/11 N editions are regional (European) versions, identical in core functionality but excluding Windows Media Player and related multimedia components.", "type": "bool", "options": ["True", "False"], "correct": [0], "exp": "N editions are the same as standard Windows but omit Media Player/multimedia components for EU regulatory reasons.", "id": "c2t3q15"}, {"q": "The Home editions for Windows 10 and Windows 11 support participation in workgroups, but do not support joining Active Directory domains.", "type": "bool", "options": ["True", "False"], "correct": [0], "exp": "Windows Home editions can join workgroups but cannot join AD domains.", "id": "c2t3q16"}, {"q": "Premium editions of Windows 10/11 allow IT admins to customize/restrict/lock down UI elements (disable settings, hide Start Menu items, enforce backgrounds), unlike Home editions which offer only basic personalization.", "type": "bool", "options": ["True", "False"], "correct": [0], "exp": "Premium editions support Group Policy-based UI lockdown that Home editions lack.", "id": "c2t3q17"}, {"q": "Which edition of Windows 10 and Windows 11 by default cannot function as an RDP host (i.e., allow incoming remote desktop connections)?", "type": "single", "options": ["Home", "Pro", "Pro for Workstations", "Enterprise"], "correct": [0], "exp": "Windows Home cannot act as an RDP host by default; Pro/Enterprise editions can.", "id": "c2t3q18"}, {"q": "All editions of Windows 10 and Windows 11, including their respective N versions, come with the preinstalled RDP client software.", "type": "bool", "options": ["True", "False"], "correct": [0], "exp": "All Windows 10/11 editions (including N versions) include the RDP client for outgoing connections.", "id": "c2t3q19"}, {"q": "Which of the 32-bit editions of Windows 10 has a physical memory limit of 4 GB?", "type": "single", "options": ["Home", "Pro", "Pro for Workstations", "Enterprise", "All of the above"], "correct": [4], "exp": "All 32-bit Windows 10 editions are capped at 4 GB physical memory — all of the above.", "id": "c2t3q20"}, {"q": "Which 64-bit editions of Windows 10 and Windows 11 have a maximum RAM limit of 128 GB?", "type": "single", "options": ["Home", "Pro", "Pro for Workstations", "Enterprise"], "correct": [0], "exp": "64-bit Windows Home is capped at 128 GB RAM.", "id": "c2t3q21"}, {"q": "What is the maximum physical memory supported by the 64-bit Pro editions of Windows 10 and Windows 11?", "type": "single", "options": ["2 TB", "4 TB", "6 TB", "8 TB"], "correct": [0], "exp": "64-bit Windows Pro supports up to 2 TB of RAM.", "id": "c2t3q22"}, {"q": "Which of the answers listed below refers to the physical memory limit for Windows 10 Pro for Workstations?", "type": "single", "options": ["2 TB", "4 TB", "6 TB", "8 TB"], "correct": [2], "exp": "Windows 10 Pro for Workstations supports up to 6 TB of RAM.", "id": "c2t3q23"}, {"q": "What is the maximum physical memory supported by the 64-bit Enterprise editions of Windows 10 and Windows 11?", "type": "single", "options": ["2 TB", "4 TB", "6 TB", "8 TB"], "correct": [2], "exp": "64-bit Windows Enterprise supports up to 6 TB of RAM.", "id": "c2t3q24"}, {"q": "Which edition(s) of Microsoft Windows 10 include(s) the BitLocker Drive Encryption feature? (Select all that apply)", "type": "multi", "options": ["Home", "Pro", "Pro for Workstations", "Enterprise"], "correct": [1, 2, 3], "exp": "BitLocker is included in Pro, Pro for Workstations, and Enterprise editions — not Home.", "id": "c2t3q25"}]}, {"id": "test4", "label": "Test 4", "questions": [{"q": "Which edition of Windows 11 does not include the built-in BitLocker encryption feature?", "type": "single", "options": ["Home", "Pro", "Pro for Workstations", "Enterprise"], "correct": [0], "exp": "Windows 11 Home lacks built-in BitLocker; Pro/Enterprise editions include it.", "id": "c2t4q1"}, {"q": "Which edition of Windows 10 does not include the gpedit.msc administrative tool?", "type": "single", "options": ["Home", "Pro", "Pro for Workstations", "Enterprise"], "correct": [0], "exp": "Windows 10 Home lacks the Group Policy Editor (gpedit.msc).", "id": "c2t4q2"}, {"q": "Windows 11 Home, Pro, and Enterprise editions include the Group Policy Editor component by default.", "type": "bool", "options": ["True", "False"], "correct": [1], "exp": "Home edition does NOT include Group Policy Editor by default — only Pro/Enterprise do.", "id": "c2t4q3"}, {"q": "Which of the following are minimum requirements for installing Windows 11? (Select 3 answers)", "type": "multi", "options": ["UEFI firmware with Secure Boot", "TPM version 2.0 support", "64-bit processor listed on Microsoft's Windows 11 compatibility list", "At least 2 GB of system memory", "A minimum of 32 GB of available storage space"], "correct": [0, 1, 2], "exp": "Windows 11 requires UEFI/Secure Boot, TPM 2.0, and a compatible 64-bit CPU (RAM min is 4GB, storage min is 64GB, not the listed values).", "id": "c2t4q4"}, {"q": "Which of the answers listed below describe(s) the function of Task Manager (taskmgr.exe) in Windows 10 and Windows 11? (Select all that apply)", "type": "multi", "options": ["Displays information on programs, processes, and services that are currently running on the computer", "Provides access to administrative tools for managing network traffic", "Allows users to schedule the launch of programs or scripts at pre-defined times or after specified time intervals", "Provides access to startup applications that can be enabled or disabled to launch automatically at sign-in", "Allows system administrators to modify user account permissions for currently logged-in users", "Provides real-time reports on how a Windows-based computer is using system resources, such as CPU, RAM, Disk, Network, and GPU", "Allows users to close a non-responsive application in Windows"], "correct": [0, 3, 5, 6], "exp": "Task Manager shows running processes/services, manages startup apps, reports resource usage, and can close unresponsive apps.", "id": "c2t4q5"}, {"q": "Windows Task Manager can be launched by: (Select all that apply)", "type": "multi", "options": ["Using the Ctrl+Shift+Esc key combination", "Double-clicking on the applet's icon shortcut in the Administrative Tools folder", "Pressing Ctrl+Alt+Delete and selecting the Task Manager option from the menu screen", "Selecting the Task Manager applet in Windows Control Panel", "Right-clicking on the Windows Taskbar and selecting Task Manager", "Typing taskmgr (or taskmgr.exe) in the Command Prompt (cmd.exe) and pressing Enter", "Pressing the Windows key + R, typing taskmgr (or taskmgr.exe) in the Run window, and pressing Enter", "Right-clicking on the Windows Start button and selecting Task Manager"], "correct": [0, 2, 4, 5, 6, 7], "exp": "Task Manager launches via Ctrl+Shift+Esc, Ctrl+Alt+Delete menu, taskbar right-click, cmd, Run dialog, or Start button right-click.", "id": "c2t4q6"}, {"q": "Which tab of the Windows Task Manager provides an interface to manually start, stop, or restart system applications that typically run without a user interface?", "type": "single", "options": ["Processes", "Performance", "Startup", "Users", "Services"], "correct": [4], "exp": "The Services tab manages background system services without a UI.", "id": "c2t4q7"}, {"q": "Which Task Manager tab in Windows allows users to enable or disable apps that run automatically at sign-in?", "type": "single", "options": ["Services", "Startup", "Performance", "Processes", "Users"], "correct": [1], "exp": "The Startup tab controls apps that launch automatically at sign-in.", "id": "c2t4q8"}, {"q": "Which tab in Windows Task Manager displays real-time graphs of CPU, memory, disk, network, and GPU resource usage?", "type": "single", "options": ["Services", "Startup", "Performance", "Processes", "Users", "None of the above"], "correct": [2], "exp": "The Performance tab shows real-time resource usage graphs.", "id": "c2t4q9"}, {"q": "Which Task Manager tab in Windows provides real-time information about system resources used by running applications and background processes?", "type": "single", "options": ["Processes", "Performance", "Startup", "Users", "Services"], "correct": [0], "exp": "The Processes tab shows per-app/process resource usage in real time.", "id": "c2t4q10"}, {"q": "The Task Manager's Users tab in Windows lists all signed-in user accounts along with details on applications and system resources used by each account. This tab also allows system administrators to close user applications, disconnect the user (lock the user session), or sign them off (force the user to log off).", "type": "bool", "options": ["True", "False"], "correct": [0], "exp": "The Users tab lists signed-in accounts and lets admins manage/disconnect/log off sessions.", "id": "c2t4q11"}, {"q": "A customizable framework providing access to a collection of system utilities (called snap-ins) designed to manage networks, computers, services, and other system components in Microsoft Windows is known as:", "type": "single", "options": ["PowerShell", "MMC", "Administrative Tools", ".NET"], "correct": [1], "exp": "MMC (Microsoft Management Console) is the customizable snap-in framework.", "id": "c2t4q12"}, {"q": "Event Viewer (eventvwr.msc) is a Windows administrative utility for monitoring system health and troubleshooting problems with applications, the OS, and hardware. Event Viewer allows browsing and managing event logs, of which the most common include Application, System, and Security logs. Application and System logs categorize events into Information, Warning, and Error types. Information events indicate normal system operations (such as service startups and successful completion of routine tasks), Warning events highlight non-critical issues (for example, low disk space or driver compatibility warnings), and Error events indicate serious problems (e.g., application failures or unexpected service interruptions). Security logs record audit events that report the success or failure of security-related actions.", "type": "bool", "options": ["True", "False"], "correct": [0], "exp": "This accurately describes Event Viewer's log types and event categories.", "id": "c2t4q13"}, {"q": "Which of the following commands in Windows launches the standalone graphical utility used specifically for managing storage devices?", "type": "single", "options": ["devmgmt.msc", "diskpart.exe", "compmgmt.msc", "diskmgmt.msc"], "correct": [3], "exp": "diskmgmt.msc opens the standalone Disk Management graphical utility.", "id": "c2t4q14"}, {"q": "Which of the answers listed below refers to a Windows administrative tool used to schedule the launch of programs or scripts at pre-defined times or after specified time intervals?", "type": "single", "options": ["taskmgr.exe", "resmon.exe", "taskschd.msc", "perfmon.msc"], "correct": [2], "exp": "taskschd.msc (Task Scheduler) schedules programs/scripts to run at set times.", "id": "c2t4q15"}, {"q": "Which Microsoft Windows OS feature allows users to view and manage installed hardware and device drivers?", "type": "single", "options": ["msconfig.exe", "devmgmt.msc", "appwiz.cpl", "compmgmt.msc"], "correct": [1], "exp": "devmgmt.msc (Device Manager) manages hardware and drivers.", "id": "c2t4q16"}, {"q": "A Windows snap-in used to view, export, import, and delete digital certificates for the current user is called:", "type": "single", "options": ["lusrmgr.msc", "secpol.msc", "msconfig.exe", "certmgr.msc"], "correct": [3], "exp": "certmgr.msc manages digital certificates for the current user.", "id": "c2t4q17"}, {"q": "Local Users and Groups (lusrmgr.msc) is an MMC snap-in for adding/removing users and managing group membership. It is not included in Home editions of Windows 10/11.", "type": "bool", "options": ["True", "False"], "correct": [0], "exp": "lusrmgr.msc manages local users/groups and is absent from Windows Home editions.", "id": "c2t4q18"}, {"q": "Which of the following administrative tools in MS Windows is used to monitor (both in real time and through logged data) how running programs affect a computer's performance?", "type": "single", "options": ["resmon.exe", "compmgmt.msc", "perfmon.exe", "taskmgr.exe"], "correct": [2], "exp": "perfmon.exe (Performance Monitor) tracks real-time and logged performance data.", "id": "c2t4q19"}, {"q": "Which of the tools listed below allows administrators to configure policies that control system and user settings on a Windows computer?", "type": "single", "options": ["msconfig.exe", "gpedit.msc", "lusrmgr.msc", "compmgmt.msc"], "correct": [1], "exp": "gpedit.msc (Group Policy Editor) configures system/user policy settings.", "id": "c2t4q20"}, {"q": "A Microsoft Windows application utility used for displaying details about a computer's hardware resources, components, and software environment is known as:", "type": "single", "options": ["msconfig.exe", "winver.exe", "msinfo32.exe", "control.exe"], "correct": [2], "exp": "msinfo32.exe (System Information) displays hardware/software environment details.", "id": "c2t4q21"}, {"q": "Which administrative tool in MS Windows provides detailed graphs of hardware activity (CPU, Memory, Disk, and Network) along with real-time, per-process breakdowns of system resource usage?", "type": "single", "options": ["resmon.exe", "compmgmt.msc", "perfmon.exe", "eventvwr.msc"], "correct": [0], "exp": "resmon.exe (Resource Monitor) gives detailed hardware graphs and per-process resource breakdowns.", "id": "c2t4q22"}, {"q": "Which of the following refers to a Microsoft Windows tool designed for troubleshooting system startup problems?", "type": "single", "options": ["eventvwr.msc", "sysdm.cpl", "compmgmt.msc", "msconfig.exe"], "correct": [3], "exp": "msconfig.exe (System Configuration) troubleshoots startup problems.", "id": "c2t4q23"}, {"q": "Which tab of the System Configuration utility in MS Windows includes the option for normal, diagnostic, and selective system startup modes?", "type": "single", "options": ["General", "Boot", "Services", "Startup", "Tools"], "correct": [0], "exp": "The General tab in msconfig includes normal/diagnostic/selective startup mode options.", "id": "c2t4q24"}, {"q": "Which of the settings listed below can be managed through the Boot tab of the System Configuration utility in Windows? (Select all that apply)", "type": "multi", "options": ["Safe boot, including an option to load minimal drivers and services for troubleshooting during system startup", "Boot logging, which collects detailed information about the startup process for diagnostic purposes", "Selecting the default operating system to load in a multiboot environment", "Limits on hardware resources, such as maximum RAM, allocated to the selected OS in a multiboot environment", "Startup items, including programs and services set to launch automatically during system boot"], "correct": [0, 1, 2, 3], "exp": "The Boot tab manages safe boot, boot logging, default OS selection, and resource limits (RAM) — startup items are on the Startup tab instead.", "id": "c2t4q25"}]}, {"id": "test5", "label": "Test 5", "questions": [{"q": "Which of the Microsoft Windows utilities helps recover storage space by deleting unnecessary files and temporary data?", "type": "single", "options": ["cleanmgr.exe", "dfrgui.exe", "compmgmt.msc", "diskmgmt.msc"], "correct": [0], "exp": "cleanmgr.exe (Disk Cleanup) removes unnecessary/temp files to reclaim storage.", "id": "c2t5q1"}, {"q": "Which of the following tools can be used to optimize drive performance in Windows?", "type": "single", "options": ["diskmgmt.msc", "cleanmgr.exe", "dfrgui.exe", "compmgmt.msc"], "correct": [2], "exp": "dfrgui.exe (Optimize Drives/Defragment) optimizes drive performance.", "id": "c2t5q2"}, {"q": "Which of the system utilities in Windows provides access to a hierarchical database that stores low-level system configuration data?", "type": "single", "options": ["msconfig.exe", "sysdm.cpl", "regedit.exe", "msinfo32.exe"], "correct": [2], "exp": "regedit.exe opens the Registry, the hierarchical low-level config database.", "id": "c2t5q3"}, {"q": "Which of the answers listed below refers to Windows command-line command used for directory traversal?", "type": "single", "options": ["pwd", "dir", "cd", "path"], "correct": [2], "exp": "cd changes/traverses directories in the Windows command line.", "id": "c2t5q4"}, {"q": "Which of the following Windows command-line commands can be used to list all files and subdirectories in the current directory?", "type": "single", "options": ["dir /all", "dir", "dir /list", "dir /?"], "correct": [1], "exp": "dir (with no switches) lists files and subdirectories in the current directory.", "id": "c2t5q5"}, {"q": "What is the name of a Windows command-line utility that can be used to display TCP/IP configuration settings?", "type": "single", "options": ["ifconfig", "nslookup", "ipconfig", "netstat"], "correct": [2], "exp": "ipconfig displays TCP/IP configuration settings on Windows.", "id": "c2t5q6"}, {"q": "A Windows command-line utility used for checking the reachability of a remote network host is called:", "type": "single", "options": ["ping", "tracert", "dig", "netstat"], "correct": [0], "exp": "ping checks reachability of a remote host.", "id": "c2t5q7"}, {"q": "The netstat command-line utility is used for: (Select 2 answers)", "type": "multi", "options": ["Displaying active TCP/IP connections", "Testing the reachability of a remote host", "Displaying intermediary points on the packet route", "Viewing the TCP/IP configuration details", "Displaying network protocol statistics"], "correct": [0, 4], "exp": "netstat displays active TCP/IP connections and network protocol statistics.", "id": "c2t5q8"}, {"q": "Which of the network command-line tools listed below resolves a domain name to an IP address?", "type": "single", "options": ["netstat", "nslookup", "tracert", "pathping"], "correct": [1], "exp": "nslookup resolves domain names to IP addresses.", "id": "c2t5q9"}, {"q": "Which of the Windows command-line commands is used to manage connections to network resources?", "type": "single", "options": ["net map", "net share", "net use", "net mount"], "correct": [2], "exp": "net use manages connections to shared network resources.", "id": "c2t5q10"}, {"q": "A network command-line utility in Windows that tracks and displays the route taken by IP packets on their way to another host is known as:", "type": "single", "options": ["ping", "traceroute", "nslookup", "tracert"], "correct": [3], "exp": "tracert (Windows' traceroute) tracks the route packets take to a host.", "id": "c2t5q11"}, {"q": "Which network command-line utility in Windows combines the features of ping and traceroute?", "type": "single", "options": ["pathping", "netcfg", "dig", "rpcping"], "correct": [0], "exp": "pathping combines ping and traceroute functionality.", "id": "c2t5q12"}, {"q": "Which of the following command-line utilities in Windows is used to verify file system integrity and fix logical file system errors?", "type": "single", "options": ["grep", "chkdsk", "sfc", "dism"], "correct": [1], "exp": "chkdsk checks/fixes file system integrity errors.", "id": "c2t5q13"}, {"q": "Which command-line tool in Windows initializes a drive by setting it up with a structure that supports file storage?", "type": "single", "options": ["gpart", "sfdisk", "mount", "format"], "correct": [3], "exp": "format initializes a drive with a file system structure.", "id": "c2t5q14"}, {"q": "Which of the commands in Windows launches a text-based, command-line partitioning utility?", "type": "single", "options": ["sfdisk", "diskutil", "gpart", "diskpart"], "correct": [3], "exp": "diskpart launches the text-based command-line partitioning utility.", "id": "c2t5q15"}, {"q": "Which of the answers listed below refers to a Windows command-line command used to create a directory or subdirectory?", "type": "single", "options": ["md", "mkd", "mdir", "mkdr"], "correct": [0], "exp": "md (make directory) creates a directory/subdirectory.", "id": "c2t5q16"}, {"q": "Which of the following command-line commands in Windows can be used to delete a directory?", "type": "single", "options": ["del", "rmdir", "dir /d", "popd"], "correct": [1], "exp": "rmdir deletes a directory.", "id": "c2t5q17"}, {"q": "Which copying utility accessible via Windows command line interface offers the widest range of options?", "type": "single", "options": ["xcopy", "move", "robocopy", "copy"], "correct": [2], "exp": "robocopy offers the widest range of copy options in Windows CLI.", "id": "c2t5q18"}, {"q": "Which command-line command in Windows displays the name of the current computer a user is connected to?", "type": "single", "options": ["host", "hosts", "hostname", "localhost"], "correct": [2], "exp": "hostname displays the current computer's name.", "id": "c2t5q19"}, {"q": "Which of the Windows command-line commands, when run on a Windows computer without additional parameters, lists all local user accounts configured on that specific computer?", "type": "single", "options": ["net view", "net session", "net user", "net accounts"], "correct": [2], "exp": "net user (no parameters) lists local user accounts.", "id": "c2t5q20"}, {"q": "Which of the command-line commands in Windows launches a pop-up window containing a brief summary of the installed operating system?", "type": "single", "options": ["winver", "msinfo32", "systeminfo", "msconfig"], "correct": [0], "exp": "winver shows a pop-up summary of the installed OS version.", "id": "c2t5q21"}, {"q": "Which command-line utility provides information about the currently logged-on Windows user?", "type": "single", "options": ["hostname", "whoami", "id", "logname"], "correct": [1], "exp": "whoami shows info about the currently logged-on user.", "id": "c2t5q22"}, {"q": "What is the standard syntax in Windows command line for displaying help or usage information related to a specific utility?", "type": "single", "options": ["[command name] info", "[command name] man", "[command name] /?", "[command name] help"], "correct": [2], "exp": "[command] /? is the standard Windows syntax for help/usage info.", "id": "c2t5q23"}, {"q": "A Windows command-line utility that refreshes Group Policy settings on a local computer without requiring a restart or logoff is called:", "type": "single", "options": ["net user", "gpupdate", "bcdedit", "gpresult"], "correct": [1], "exp": "gpupdate refreshes Group Policy settings without a restart.", "id": "c2t5q24"}, {"q": "Which of the answers listed below refers to a command-line tool in Windows that can be used to display current Group Policy settings for a user or computer?", "type": "single", "options": ["gpresult", "net view", "verify", "gpupdate"], "correct": [0], "exp": "gpresult displays current Group Policy settings for a user/computer.", "id": "c2t5q25"}]}, {"id": "test6", "label": "Test 6", "questions": [{"q": "The sfc command-line utility in Windows: (Select 2 answers)", "type": "multi", "options": ["Scans disk volumes for file system errors", "Identifies and recovers readable data from bad sectors on a drive", "Encrypts files to prevent unauthorized access to sensitive data", "Replaces incorrect system file versions with correct Microsoft versions", "Scans the integrity of all protected system files"], "correct": [3, 4], "exp": "sfc scans protected system files for integrity and replaces incorrect versions with correct Microsoft copies.", "id": "c2t6q1"}, {"q": "Which command-line command in MS Windows moves the command-line prompt one folder up in the directory tree (sets the prompt at the parent folder of the current folder)?", "type": "single", "options": ["cd \\", "cd .", "cd /^", "cd .."], "correct": [3], "exp": "cd .. moves up one level to the parent folder.", "id": "c2t6q2"}, {"q": "Which of the following Windows command-line commands changes the current directory to the root directory?", "type": "single", "options": ["cd /^", "cd ..", "cd /r", "cd \\"], "correct": [3], "exp": "cd \\ changes to the root directory.", "id": "c2t6q3"}, {"q": "A Windows technician needs to locate all .exe files within a directory, including those in its subdirectories. Which command should they use?", "type": "single", "options": ["dir *.exe /a:s", "dir v *.exe", "dir *.exe", "dir /s *.exe"], "correct": [3], "exp": "dir /s *.exe searches the directory and all subdirectories for .exe files.", "id": "c2t6q4"}, {"q": "Which of the answers listed below refers to an ipconfig parameter used for displaying the full TCP/IP configuration information for all adapters?", "type": "single", "options": ["-a", "/?", "/all", "/-a"], "correct": [2], "exp": "ipconfig /all shows full TCP/IP configuration for all adapters.", "id": "c2t6q5"}, {"q": "Which command-line commands in MS Windows are used to refresh the DHCP configuration for all network adapters? (Select 2 answers)", "type": "multi", "options": ["ipconfig /flush", "ifconfig eth0 down", "ipconfig /release", "ipconfig /renew", "ifconfig eth0 up", "ipconfig /register"], "correct": [2, 3], "exp": "ipconfig /release followed by /renew refreshes the DHCP-assigned configuration.", "id": "c2t6q6"}, {"q": "A user reports an inability to access any websites or network shares. As the first troubleshooting step, a technician needs to verify whether the TCP/IP stack on the local Windows machine is functioning correctly. Which ping command should they use for this initial test?", "type": "single", "options": ["ping 8.8.8.8", "ping 192.168.1.1", "ping 1.1.1.1", "ping 127.0.0.1"], "correct": [3], "exp": "Pinging the loopback address 127.0.0.1 verifies the local TCP/IP stack works before testing further out.", "id": "c2t6q7"}, {"q": "Which netstat parameter is used to display all active TCP/UDP connections and listening ports?", "type": "single", "options": ["-a", "-p", "-e", "-r"], "correct": [0], "exp": "netstat -a displays all active connections and listening ports.", "id": "c2t6q8"}, {"q": "The -b netstat parameter in Microsoft Windows allows users to view the name of the application associated with each active connection or listening port.", "type": "bool", "options": ["True", "False"], "correct": [0], "exp": "netstat -b shows the executable/application behind each connection or listening port.", "id": "c2t6q9"}, {"q": "Which parameter, when used with the netstat command, displays addresses and port numbers in numerical form?", "type": "single", "options": ["-b", "-n", "-q", "-r"], "correct": [1], "exp": "netstat -n shows addresses and ports numerically instead of resolving names.", "id": "c2t6q10"}, {"q": "Which of the command-line tools listed below can be used for troubleshooting DNS-related problems?", "type": "single", "options": ["pathping", "tracert", "arp", "nslookup"], "correct": [3], "exp": "nslookup is the standard DNS troubleshooting tool.", "id": "c2t6q11"}, {"q": "A technician needs to map a network share located at \\\\SERVER\\Data to the drive letter Z: on a user's computer. Which of the following commands should the technician use?", "type": "single", "options": ["net share Z: \\\\SERVER\\Data", "net use Z: \\\\SERVER\\Data", "map drive Z: \\\\SERVER\\Data", "net use \\\\SERVER\\Data Z:"], "correct": [1], "exp": "net use Z: \\\\SERVER\\Data maps a share to a drive letter.", "id": "c2t6q12"}, {"q": "The output of the Windows tracert command-line utility primarily displays a list of all intermediate routers (hops) that an IP packet traverses to reach a specified destination, along with the round-trip time (latency) to each of those hops. This information is useful for identifying network bottlenecks, diagnosing where delays or packet loss are occurring, and determining whether a routing issue is within the local network, the ISP, or further along the internet path.", "type": "bool", "options": ["True", "False"], "correct": [0], "exp": "tracert lists hop-by-hop latency to help pinpoint where routing delays/issues occur.", "id": "c2t6q13"}, {"q": "What are the most important functionalities provided by the pathping utility? (Select 2 answers)", "type": "multi", "options": ["Tests connectivity to a specific port", "Displays network statistics", "Traces the path to the destination", "Sends broadcast messages over the network", "Measures latency and packet loss"], "correct": [2, 4], "exp": "pathping traces the route to a destination and measures latency/packet loss along the way.", "id": "c2t6q14"}, {"q": "The /f switch of the chkdsk command-line utility in MS Windows instructs the utility to:", "type": "single", "options": ["Scan the system for corrupted or missing system files", "Automatically repair detected file system errors on the disk", "Identify bad sectors on the disk and attempt to recover any readable data from them", "Optimize disk usage by consolidating fragmented file data"], "correct": [1], "exp": "chkdsk /f automatically fixes detected file system errors.", "id": "c2t6q15"}, {"q": "The chkdsk /r command in Windows: (Select 2 answers)", "type": "multi", "options": ["Compresses files on the disk to save space", "Attempts to recover any readable data from bad sectors", "Optimizes disk usage by consolidating fragmented file data", "Scans for and repairs corrupted system files", "Identifies bad sectors on the disk"], "correct": [1, 4], "exp": "chkdsk /r identifies bad sectors and attempts to recover readable data from them.", "id": "c2t6q16"}, {"q": "A technician is preparing to reinstall Windows on a user's PC. They want to quickly prepare the D: drive by removing all file system references to existing data without performing a thorough overwrite. Which variant of the format command in the Windows command-line interface should they use to achieve that goal?", "type": "single", "options": ["format d: /p", "format d: /f", "format d: /q", "format d: /d"], "correct": [2], "exp": "format d: /q performs a quick format, removing file system references without a full overwrite.", "id": "c2t6q17"}, {"q": "A user is trying to clean and repartition a disk with the diskpart command-line utility in Windows, but encounters an \"Access is denied\" error. What is the most likely cause of this problem?", "type": "single", "options": ["The drive is offline and needs to be brought online first", "The utility is trying to access a non-existent drive", "The drive is currently in use by another application and is locked", "The utility was not launched with administrative privileges"], "correct": [3], "exp": "diskpart requires administrative privileges — lacking them causes \"Access is denied\" errors.", "id": "c2t6q18"}, {"q": "What is the difference between md and mkdir command-line commands in MS Windows?", "type": "single", "options": ["The md command supports creating multiple directories at once, while mkdir does not", "The mkdir command requires administrative privileges, while md does not", "The md command is specific to older MS DOS versions, mkdir is for modern Windows", "There is no difference, as both commands provide the same functionality"], "correct": [3], "exp": "md and mkdir are functionally identical in Windows — no real difference.", "id": "c2t6q19"}, {"q": "A user wants to delete the entire directory named Data located at C:\\Files\\Data along with all its subdirectories and files using the Windows command-line. Which variant of the rmdir command should they run?", "type": "single", "options": ["rmdir C:\\Files /s", "rmdir C:\\Files /q", "rmdir C:\\Files /r", "None of the above"], "correct": [3], "exp": "None of the listed options correctly targets C:\\Files\\Data with the right syntax (rmdir C:\\Files\\Data /s /q would be correct).", "id": "c2t6q20"}, {"q": "A Windows technician is setting up an automated nightly task to copy an entire folder tree, including all subdirectories and empty folders, from a network drive to a local backup location. The process must retry failed copies automatically. Which command-line utility should they use?", "type": "single", "options": ["move", "xcopy", "robocopy", "copy"], "correct": [2], "exp": "robocopy supports full tree copying (including empty folders) with automatic retry.", "id": "c2t6q21"}, {"q": "A user needs to copy a very large volume of files from one Windows host to another. The task must resume automatically if interrupted due to network issues. Which command-line tool is best suited for this task?", "type": "single", "options": ["copy", "robocopy", "move", "xcopy"], "correct": [1], "exp": "robocopy can resume interrupted large-scale file copies automatically.", "id": "c2t6q22"}, {"q": "A technician suspects that a Windows user account named guest has been locked out or disabled due to multiple failed login attempts. The technician also needs to check when the account last logged in and whether it requires a password. Which of the following commands will provide this information?", "type": "single", "options": ["net view guest", "whoami /user", "net user guest", "net accounts guest"], "correct": [2], "exp": "net user guest shows account status, last login, and password requirements for that account.", "id": "c2t6q23"}, {"q": "A support technician is remotely connected to multiple Windows machines and needs to confirm the network identity of the computer they are currently operating on. Which command should they use to verify this?", "type": "single", "options": ["hostname", "winver", "localhost", "msconfig"], "correct": [0], "exp": "hostname confirms the network identity (computer name) of the current machine.", "id": "c2t6q24"}, {"q": "An IT technician needs to confirm the Windows OS version and build number to verify its compatibility with an upcoming system patch. Which command-line command should they run?", "type": "single", "options": ["msconfig", "whoami", "hostname", "winver"], "correct": [3], "exp": "winver displays the Windows OS version and build number.", "id": "c2t6q25"}]}, {"id": "test7", "label": "Test 7", "questions": [{"q": "A Windows technician wants to view a comprehensive snapshot of the current user's security context, including its privileges, group memberships, logon ID, and security identifiers. Which whoami parameter should they use?", "type": "single", "options": ["/groups", "/user", "/logonid", "/all"], "correct": [3], "exp": "whoami /all shows a full snapshot: privileges, groups, logon ID, and SIDs.", "id": "c2t7q1"}, {"q": "In the Windows command line environment, which common syntax can be used as an alternative to appending /? after a command name to display help?", "type": "single", "options": ["[command name] help", "man [command name]", "[command name] about", "help [command name]"], "correct": [3], "exp": "help [command name] is the alternative syntax for command help in Windows.", "id": "c2t7q2"}, {"q": "Used without any parameters, the help command in MS Windows displays a list of available system commands along with a brief description of each command.", "type": "bool", "options": ["True", "False"], "correct": [0], "exp": "Running help alone lists available commands with brief descriptions.", "id": "c2t7q3"}, {"q": "What is the default behavior of the gpupdate command-line command in Windows if no parameters are specified?", "type": "single", "options": ["It refreshes only computer policies", "It does not refresh any policies", "It refreshes both user and computer policies", "It refreshes only user policies"], "correct": [2], "exp": "gpupdate with no parameters refreshes both user and computer policies by default.", "id": "c2t7q4"}, {"q": "During a routine audit, an IT technician needs a concise report of all Group Policy settings that have been applied to a specific host. Which gpresult parameter in Windows command line instructs the utility to provide this summary?", "type": "single", "options": ["/s", "/u", "/p", "/r"], "correct": [3], "exp": "gpresult /r gives a concise summary of applied Group Policy settings.", "id": "c2t7q5"}, {"q": "Which parameter of the sfc command in Windows command line enables a file check that scans integrity of all protected system files and attempts to repair corrupted files?", "type": "single", "options": ["/scannow", "/verify", "/scanfile", "/verifyfile"], "correct": [0], "exp": "sfc /scannow scans and repairs all protected system files.", "id": "c2t7q6"}, {"q": "The \"View by: Category\" option in the Microsoft Windows Control Panel displays the entire contents of the Control Panel in a single window, enabling quick access to each Control Panel applet.", "type": "bool", "options": ["True", "False"], "correct": [1], "exp": "Category view actually groups applets into categories — the single-window \"all items\" view is Large/Small Icons view instead.", "id": "c2t7q7"}, {"q": "Which locations in Windows 10 and Windows 11 provide access to the Internet Properties system utility? (Select 3 answers)", "type": "multi", "options": ["Internet Options applet in Windows Control Panel", "Network and Sharing Center applet in Windows Control Panel", "Ease of Access applet in Windows Control Panel", "Windows Run dialog box (after typing inetcpl.cpl, and pressing Enter)", "Internet Options menu item in Microsoft Edge Tools menu"], "correct": [0, 1, 3], "exp": "Internet Properties is accessible via the Internet Options Control Panel applet, Network and Sharing Center, and running inetcpl.cpl.", "id": "c2t7q8"}, {"q": "Which tab of the Windows Internet Properties applet provides an option for deleting temporary Internet files, cookies, web browsing and download history, saved passwords, and data typed into web forms?", "type": "single", "options": ["General", "Security", "Privacy", "Content", "Connections", "Programs", "Advanced"], "correct": [0], "exp": "The General tab includes the option to delete browsing history/temp files/cookies/passwords.", "id": "c2t7q9"}, {"q": "The Security tab of the Internet Properties applet in MS Windows allows users to configure zone-based restrictions for websites and control the type of content that can be accessed through the system's built-in web components.", "type": "bool", "options": ["True", "False"], "correct": [0], "exp": "The Security tab manages zone-based site restrictions and content access controls.", "id": "c2t7q10"}, {"q": "Which of the answers listed below refers to a Windows Internet Properties applet tab that provides settings for a built-in pop-up blocker?", "type": "single", "options": ["General", "Security", "Privacy", "Content", "Connections", "Programs", "Advanced"], "correct": [2], "exp": "The Privacy tab includes pop-up blocker settings.", "id": "c2t7q11"}, {"q": "Which tab of the Internet Properties applet in Windows provides access to advanced cookie management options?", "type": "single", "options": ["General", "Security", "Privacy", "Content", "Connections", "Programs", "Advanced"], "correct": [2], "exp": "The Privacy tab provides advanced cookie management options.", "id": "c2t7q12"}, {"q": "Which of the Windows Internet Properties applet tabs enables the management of digital certificates, the AutoComplete functionality, and RSS feeds?", "type": "single", "options": ["General", "Security", "Privacy", "Content", "Connections", "Programs", "Advanced"], "correct": [3], "exp": "The Content tab manages certificates, AutoComplete, and RSS feeds.", "id": "c2t7q13"}, {"q": "Which of the following answers refer to network settings accessible through the Connections tab of the Internet Properties applet in Windows? (Select 3 answers)", "type": "multi", "options": ["Network adapter settings", "Internet security zone settings", "LAN settings", "Dial-up and VPN settings", "Proxy server settings"], "correct": [2, 3, 4], "exp": "The Connections tab covers LAN settings, dial-up/VPN settings, and proxy server settings.", "id": "c2t7q14"}, {"q": "Which of the Windows Internet Properties applet tabs provides options for managing web browser extensions and setting default applications?", "type": "single", "options": ["General", "Security", "Privacy", "Content", "Connections", "Programs", "Advanced"], "correct": [5], "exp": "The Programs tab manages browser extensions/add-ons and default apps.", "id": "c2t7q15"}, {"q": "Which tab of the Windows Internet Properties applet provides access to detailed settings for customizing the built-in web browser's behavior, including options for resetting browser configurations, managing accessibility, browsing, security, and multimedia features?", "type": "single", "options": ["General", "Security", "Privacy", "Content", "Connections", "Programs", "Advanced"], "correct": [6], "exp": "The Advanced tab holds detailed browser behavior/customization/reset settings.", "id": "c2t7q16"}, {"q": "Which of the answers listed below refer to features of the Windows Devices and Printers Control Panel applet? (Select 3 answers)", "type": "multi", "options": ["Allows users to add/remove wired and wireless devices", "Does not include troubleshooting features", "Provides a simplified view of all connected devices", "Allows users to restore a device driver to the previously installed version", "Provides a detailed view of all connected devices", "Allows users to troubleshoot a device that is not working properly"], "correct": [0, 2, 5], "exp": "Devices and Printers lets you add/remove devices, view them in a simplified list, and troubleshoot problem devices.", "id": "c2t7q17"}, {"q": "The Programs and Features Control Panel applet in Windows enables: (Select all that apply)", "type": "multi", "options": ["Repairing a malfunctioning program", "Accessing an option for enabling or disabling Windows features", "Creating or deleting system restore points", "Accessing an option to view installed updates", "Uninstalling applications"], "correct": [0, 1, 3, 4], "exp": "Programs and Features covers repairing/uninstalling apps, toggling Windows features, and viewing installed updates.", "id": "c2t7q18"}, {"q": "The Network and Sharing Center Control Panel applet in Windows allows users to: (Select 3 answers)", "type": "multi", "options": ["Configure firewall settings", "View active networks", "Set up a new connection or network", "Configure proxy server settings", "Troubleshoot network problems"], "correct": [1, 2, 4], "exp": "Network and Sharing Center lets you view active networks, set up new connections, and troubleshoot issues.", "id": "c2t7q19"}, {"q": "The Network and Sharing Center Control Panel applet in Windows provides access to: (Select 3 answers)", "type": "multi", "options": ["Network adapter settings", "Advanced sharing settings", "Internet security zone settings", "Physical location settings", "Media streaming options"], "correct": [0, 1, 4], "exp": "Network and Sharing Center provides access to adapter settings, advanced sharing settings, and media streaming options.", "id": "c2t7q20"}, {"q": "In newer versions of Microsoft Windows,
