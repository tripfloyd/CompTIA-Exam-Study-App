free replacement eligibility.", "id": "c2t29q1"}, {"q": "Which asset record detail helps verify software compliance during an audit?", "type": "single", "options": ["Assigned user information", "Software usage logs", "Asset procurement date", "License entitlement count"], "correct": [3], "exp": "License entitlement count verifies software compliance against purchased licenses.", "id": "c2t29q2"}, {"q": "A technician is reviewing CMDB entries after a department reorganization. Several laptops were redistributed, and support tickets are now being misrouted. Which asset field should be updated to fix this issue?", "type": "single", "options": ["Asset tag", "Last login timestamp", "Device physical location", "Assigned user"], "correct": [3], "exp": "Updating the assigned user field fixes ticket misrouting after redistribution.", "id": "c2t29q3"}, {"q": "A technician documents a malware infection that caused a system outage. Which document should be completed to formally record what occurred?", "type": "single", "options": ["Forensic analysis summary", "Vulnerability assessment report", "Incident report", "Malware remediation worksheet"], "correct": [2], "exp": "An incident report formally records what occurred during the outage.", "id": "c2t29q4"}, {"q": "Which of the terms listed below refers to a documented set of step-by-step instructions designed to ensure consistent execution of routine tasks?", "type": "single", "options": ["AUP", "SOW", "TOS", "SOP"], "correct": [3], "exp": "An SOP (Standard Operating Procedure) documents consistent step-by-step task execution.", "id": "c2t29q5"}, {"q": "A new user/onboarding setup checklist ensures required provisioning steps (account creation, device prep) are completed. A user off-boarding checklist ensures the reversal of this process.", "type": "bool", "options": ["True", "False"], "correct": [0], "exp": "Onboarding/off-boarding checklists standardize provisioning and de-provisioning steps respectively.", "id": "c2t29q6"}, {"q": "Which of the following terms refers to a formal agreement that sets out specific, measurable performance requirements for a service provider or vendor?", "type": "single", "options": ["MSA", "SLA", "MOU", "SOW"], "correct": [1], "exp": "An SLA sets measurable performance requirements for a vendor/service.", "id": "c2t29q7"}, {"q": "A type of centralized repository of documented solutions, procedures, troubleshooting steps, and technical information used by support teams to resolve issues is commonly referred to as:", "type": "single", "options": ["Maintenance log", "Configuration baseline", "Troubleshooting playbook", "Knowledge base"], "correct": [3], "exp": "A knowledge base centralizes documented solutions/procedures for support teams.", "id": "c2t29q8"}, {"q": "Which of the answers listed below refers to a documented procedure that reverses a change and restores the system to its previous known-good configuration if the change fails?", "type": "single", "options": ["Rollback plan", "System restore point", "Failover procedure", "Backup plan"], "correct": [0], "exp": "A rollback plan reverses a failed change back to a known-good state.", "id": "c2t29q9"}, {"q": "A documented process for creating and storing copies of data so that the data can be restored if it becomes lost, corrupted, or damaged is known as:", "type": "single", "options": ["Backup plan", "Data retention policy", "Version control", "Rollback plan"], "correct": [0], "exp": "A backup plan documents processes for creating/storing recoverable data copies.", "id": "c2t29q10"}, {"q": "Which of the following terms describes the practice of implementing and verifying a change in an isolated, non-production environment specifically designed to prevent any impact on live systems?", "type": "single", "options": ["Containerization", "User acceptance testing", "Virtualization", "Sandbox testing"], "correct": [3], "exp": "Sandbox testing verifies changes in isolation, preventing impact on live/production systems.", "id": "c2t29q11"}, {"q": "To ensure accountability, a documented business process must identify the specific staff members responsible for each stage of its execution.", "type": "bool", "options": ["True", "False"], "correct": [0], "exp": "Documented accountability requires naming responsible staff at each process stage.", "id": "c2t29q12"}, {"q": "A technician needs to upgrade the firmware on all backbone switches in the data center. Which document must be submitted first to initiate the formal change management process?", "type": "single", "options": ["Risk assessment report", "Change request form", "Firmware compatibility checklist", "Implementation plan"], "correct": [1], "exp": "A change request form is the first document that initiates formal change management.", "id": "c2t29q13"}, {"q": "An administrator is requesting to replace an aging file server with a new high-performance storage array. In the change request, the administrator justifies the replacement by noting that the current server is out of warranty and experiencing frequent hardware timeouts. Which part of the change management process does this detail satisfy?", "type": "single", "options": ["Change type", "Identification of affected systems", "Purpose of the change", "Risk analysis"], "correct": [2], "exp": "Explaining WHY the change is needed satisfies the \"purpose of the change\" section.", "id": "c2t29q14"}, {"q": "An IT team is migrating a local file share to a cloud-based storage provider. The request form lists the specific folders to be moved and identifies several archive folders that will remain on-premises. What part of the change management process is being detailed?", "type": "single", "options": ["Scope of the change", "Purpose of the change", "Change type", "Implementation plan"], "correct": [0], "exp": "Defining exactly what's included/excluded is the scope of the change.", "id": "c2t29q15"}, {"q": "A technician is performing a monthly update of antivirus definitions on all corporate workstations. This process is documented, low risk, and follows a pre-approved procedure. How should this request be classified within the formal change management process?", "type": "single", "options": ["Standard change", "Normal change", "Routine change", "Emergency change"], "correct": [0], "exp": "A pre-approved, low-risk, documented procedure is classified as a standard change.", "id": "c2t29q16"}, {"q": "An organization plans to move its entire on-premises email system to a cloud-based provider. This process requires formal approval and risk assessment. According to change management procedures, which change type does this represent?", "type": "single", "options": ["Standard change", "Normal change", "High-impact change", "Emergency change"], "correct": [1], "exp": "A major change requiring formal approval/risk assessment is a normal change.", "id": "c2t29q17"}, {"q": "A critical security vulnerability is discovered that allows unauthorized remote access to the primary file server. An immediate patch must be applied outside the regular maintenance window. Which formal change category should the technician select on the change request form?", "type": "single", "options": ["Standard change", "Normal change", "High-priority change", "Emergency change"], "correct": [3], "exp": "An urgent, out-of-window critical fix is classified as an emergency change.", "id": "c2t29q18"}, {"q": "A technician's request to perform a non-urgent database optimization is denied because the organization is currently performing a fiscal year-end audit. Which formal change management concept is being applied to this request?", "type": "single", "options": ["Scheduled outage", "Maintenance window", "Change freeze", "Operational hold"], "correct": [2], "exp": "Denying non-urgent changes during a critical period reflects a change freeze.", "id": "c2t29q19"}, {"q": "An organization has a policy that all non-emergency software patches must be deployed on Tuesday nights between 11:00 PM and 3:00 AM. This type of authorized timeframe is officially classified as:", "type": "single", "options": ["Controlled downtime", "Scheduled outage", "Maintenance window", "Policy-driven delay"], "correct": [2], "exp": "A designated authorized timeframe for changes is a maintenance window.", "id": "c2t29q20"}, {"q": "An administrator is preparing a change request to update the firmware on a core network switch. The request includes a list of all VLANs and servers that will lose connectivity during the reboot. Which part of the change request form should contain this information?", "type": "single", "options": ["Request justification", "Implementation plan", "Affected systems/impact", "Scope of the change"], "correct": [2], "exp": "Listing what will lose connectivity belongs in the affected systems/impact section.", "id": "c2t29q21"}, {"q": "A proposed firmware update could cause temporary outages for several departments. The change request form includes a dedicated section for documenting the assessed likelihood of potential negative outcomes. Which section should record this information?", "type": "single", "options": ["Impact analysis", "Vulnerability assessment", "Downtime estimate", "Risk level"], "correct": [3], "exp": "The likelihood of negative outcomes is recorded in the risk level section.", "id": "c2t29q22"}, {"q": "A technician submits a normal change request to upgrade the operating system on all production servers. Which element of the change management process ensures that the change is formally authorized?", "type": "single", "options": ["Request justification", "Managerial sign-off", "Assignment of responsible staff members", "Change board approvals"], "correct": [3], "exp": "Change board approvals formally authorize a normal change.", "id": "c2t29q23"}, {"q": "Which scenario best represents the implementation phase of the change management process?", "type": "single", "options": ["Applying a configuration update to a server according to a documented procedure", "Reviewing the proposed technical steps with another administrator for quality assurance", "Testing the change in a non-production environment before deployment", "Validating that the update resolves the documented bug after the work is complete"], "correct": [0], "exp": "Actually applying the change per procedure is the implementation phase itself.", "id": "c2t29q24"}, {"q": "In the change management lifecycle, formal peer review of a proposed change typically occurs:", "type": "single", "options": ["During sandbox testing of the proposed change", "After the change has failed in production", "Before the implementation phase", "After the change has been fully implemented"], "correct": [2], "exp": "Peer review happens before implementation, as part of the approval process.", "id": "c2t29q25"}]}, {"id": "test30", "label": "Test 30", "questions": [{"q": "In a standard change management workflow, end-user acceptance typically takes place:", "type": "single", "options": ["During the impact analysis phase, before any changes are applied to systems", "In a test environment before full production deployment", "During the implementation phase, while the change is being applied", "After the change is implemented, once all systems are live in production"], "correct": [1], "exp": "End-user acceptance testing occurs in a test environment before full production deployment.", "id": "c2t30q1"}, {"q": "A system admin performs a backup that copies every file on a workstation each night, even if no files were modified. Which backup type is being used?", "type": "single", "options": ["Differential backup", "Full backup", "Incremental backup", "Synthetic full backup"], "correct": [1], "exp": "Copying every file regardless of changes is a full backup.", "id": "c2t30q2"}, {"q": "A workstation backup strategy uses a full backup on Sunday and small daily backups that capture only the files changed since the last backup. What type of backup is being performed?", "type": "single", "options": ["File-level backup", "Differential backup", "Snapshot backup", "Incremental backup"], "correct": [3], "exp": "Capturing only changes since the LAST backup (not last full) is incremental.", "id": "c2t30q3"}, {"q": "Which backup type copies all data changed since the last full backup?", "type": "single", "options": ["Synthetic full backup", "Incremental backup", "Snapshot backup", "Differential backup"], "correct": [3], "exp": "Differential backups capture all changes since the last full backup.", "id": "c2t30q4"}, {"q": "A backup strategy uses a weekly full backup and daily incrementals, then creates a new full backup copy by combining existing backup data instead of pulling data from the workstation. What type of backup is generated?", "type": "single", "options": ["Replication backup", "Synthetic full backup", "Offsite backup", "Differential backup"], "correct": [1], "exp": "Combining existing backup data (rather than re-reading source) to create a new full is a synthetic full backup.", "id": "c2t30q5"}, {"q": "A technician is configuring a backup schedule. The goal is to ensure that daily backups include only files modified since the previous day and that the backup process marks those files as backed up. Which backup type should be used?", "type": "single", "options": ["Differential backup", "Full backup", "Incremental backup", "Synthetic full backup"], "correct": [2], "exp": "Only files modified since the previous backup, marked as backed up, describes incremental backup.", "id": "c2t30q6"}, {"q": "In a differential backup strategy, restoring data from backup requires a working copy of the last full backup and the most recent copy of the differential backup.", "type": "bool", "options": ["True", "False"], "correct": [0], "exp": "Differential restore needs only the last full backup plus the most recent differential.", "id": "c2t30q7"}, {"q": "A workstation uses a full backup on Sunday at 11:00 PM and an incremental nightly backup schedule at 11:00 PM on weekdays. The system fails on Friday at 9:00 AM. How many backup sets must be restored to fully recover the system?", "type": "single", "options": ["2", "3", "4", "5"], "correct": [3], "exp": "Full (Sun) + incrementals Mon/Tue/Wed/Thu = 5 backup sets needed to restore incremental chains.", "id": "c2t30q8"}, {"q": "A technician restores a user's documents directly back into the original Documents folder, replacing the corrupted files. What type of recovery is being performed?", "type": "single", "options": ["Selective recovery", "Local recovery", "In-place/overwrite recovery", "Folder-level recovery"], "correct": [2], "exp": "Restoring directly over the original location/files is in-place/overwrite recovery.", "id": "c2t30q9"}, {"q": "A backup copy of data is being restored to a temporary folder on a secondary drive to compare versions of files before replacing anything. What recovery method is being used?", "type": "single", "options": ["Bare-metal recovery", "In-place recovery", "Alternative-location recovery", "Duplicative recovery"], "correct": [2], "exp": "Restoring to a different location for comparison is alternative-location recovery.", "id": "c2t30q10"}, {"q": "A scheduled restore test is performed each month to ensure that the backed-up data has not been altered or corrupted. The purpose of this activity is to verify the backup's:", "type": "single", "options": ["Availability", "Scope", "Reliability", "Integrity"], "correct": [3], "exp": "Checking that data hasn't been altered/corrupted verifies backup integrity.", "id": "c2t30q11"}, {"q": "A company's backup policy states that restore tests must be performed once per week to verify that mission-critical data remains recoverable. This requirement defines the company's:", "type": "single", "options": ["Backup scheduling window", "Backup retention period", "Backup rotation scheme", "Backup testing frequency"], "correct": [3], "exp": "How often restore tests occur defines backup testing frequency.", "id": "c2t30q12"}, {"q": "The advantages of on-site backups over off-site backups include: (Select 3 answers)", "type": "multi", "options": ["Faster data access and restore speeds", "Greater control over backup media & backup process", "Lower or no ongoing subscription fees", "Improved physical and environmental security", "Geographic redundancy", "Scalability without additional hardware investment"], "correct": [0, 1, 2], "exp": "On-site backups offer faster access, more direct control, and lower/no subscription costs.", "id": "c2t30q13"}, {"q": "What are the advantages of off-site backups in comparison to on-site backups? (Select 3 answers)", "type": "multi", "options": ["Greater control over backup media & backup process", "Improved physical and environmental security", "Faster data access and restore speeds", "Geographic redundancy", "Lower or no ongoing subscription fees", "Scalability without additional on-premises hardware investment"], "correct": [1, 3, 5], "exp": "Off-site backups offer better physical/environmental security, geographic redundancy, and easier scalability.", "id": "c2t30q14"}, {"q": "A company utilizes a backup rotation scheme where backups performed daily during a week are used to create a weekly backup and backups created at the end of each week are used to create a monthly backup. What type of backup rotation scheme is being used?", "type": "single", "options": ["Synthetic full backup", "Tower of Hanoi", "3-2-1", "Grandfather-Father-Son"], "correct": [3], "exp": "Daily→weekly→monthly tiered rotation is the classic Grandfather-Father-Son scheme.", "id": "c2t30q15"}, {"q": "Which of the answers listed below can be used to describe the 3-2-1 backup strategy? (Select 3 answers)", "type": "multi", "options": ["Keep at least 1 backup copy offsite", "Save backups to 3 different storage media types", "Keep at least 1 backup copy onsite", "Maintain 3 total copies of data (original + 2 backups)", "Use at least 2 different storage media types", "Keep all 3 backup copies offsite", "Create 2 copies of the primary backup copy"], "correct": [0, 3, 4], "exp": "3-2-1: 3 total copies of data, on 2 different media types, with 1 copy kept offsite.", "id": "c2t30q16"}, {"q": "Which action violates proper ESD strap usage?", "type": "single", "options": ["Ensuring the strap makes skin contact", "Connecting the strap to a grounded metal object", "Wearing the strap on the wrist", "Leaving the strap disconnected while working"], "correct": [3], "exp": "An ESD strap left disconnected provides no grounding protection — that's the violation.", "id": "c2t30q17"}, {"q": "Which of the following statements is not true?", "type": "single", "options": ["An ESD mat must be connected to an unpainted, grounded metal surface to operate correctly", "An ESD mat is designed to be used in conjunction with a grounded ESD wrist strap", "An ESD mat alone provides complete protection against electrostatic discharge", "An ESD mat requires a physical connection to a verified ground to function as intended"], "correct": [2], "exp": "An ESD mat alone does NOT provide complete protection — it needs to be properly grounded and paired with a wrist strap.", "id": "c2t30q18"}, {"q": "An ESD mat is connected to a metal computer chassis, but the chassis is sitting on a wooden table and is not plugged into a wall outlet. Which of the statements listed below is true?", "type": "single", "options": ["The mat is now a high-voltage hazard", "The mat will still dissipate all static to the floor", "The mat and chassis are at the same potential, but neither is grounded", "The wooden table acts as a ground for the mat"], "correct": [2], "exp": "Without an actual ground connection, the mat/chassis just equalize potential with each other, not with true earth ground.", "id": "c2t30q19"}, {"q": "Which devices may pose a risk to electrical safety due to accumulated high voltage? (Select all that apply)", "type": "multi", "options": ["CRTs", "PSUs", "Inverters", "GPUs", "Laser printers"], "correct": [0, 1, 2, 4], "exp": "CRTs, PSUs, inverters, and laser printers can retain high voltage even when unplugged.", "id": "c2t30q20"}, {"q": "Which of the following statements best describes the purpose of electrical grounding in a workstation?", "type": "single", "options": ["Balances the electrical potential between the user and the internal components", "Prevents voltage fluctuations from affecting internal workstation components", "Provides a low-resistance path to earth for stray current to protect the user from shock", "Prevents high-voltage spikes from damaging the power supply during a lightning strike"], "correct": [2], "exp": "Grounding's core purpose is providing a low-resistance path to earth for stray current, protecting against shock.", "id": "c2t30q21"}, {"q": "Which best practices help protect internal PC components from physical damage during handling or storage? (Select 3 answers)", "type": "multi", "options": ["Holding components by their edges", "Placing components in antistatic bags for temporary storage", "Storing components in a dry, temperature-controlled environment for long-term storage", "Keeping components in sealed plastic bags to prevent moisture", "Wearing cotton gloves to improve grip on components"], "correct": [0, 1, 2], "exp": "Holding by edges, antistatic bag storage, and controlled environment storage are the correct handling practices.", "id": "c2t30q22"}, {"q": "Which of the actions listed below does not align with cable-management best practices?", "type": "single", "options": ["Securing external cables within wall-mounted raceways in an office environment", "Routing cables away from fans and vents inside a desktop PC case", "Providing additional slack at cable ends to reduce strain on connectors", "Bundling power and data cables together for easier installation through wall conduits", "Using cable ties (e.g., Velcro straps) to bundle cables loosely", "Labeling networking cables at both ends for easy identification during maintenance"], "correct": [3], "exp": "Bundling power and data cables together can cause interference — this is a bad practice, not a best practice.", "id": "c2t30q23"}, {"q": "Which of the following items do not require antistatic bags for safe handling when not installed?", "type": "single", "options": ["Motherboards", "Expansion cards", "Power cables", "Memory modules"], "correct": [2], "exp": "Power cables have no static-sensitive electronics, so they don't need antistatic bags.", "id": "c2t30q24"}, {"q": "Examples of devices/components regulated under special disposal procedures due to environmental/safety hazards include: (Select all that apply)", "type": "multi", "options": ["Heatsinks", "CRTs", "Toner cartridges", "Batteries"], "correct": [1, 2, 3], "exp": "CRTs, toner cartridges, and batteries all require special regulated disposal; heatsinks are ordinary metal/plastic with no hazard.", "id": "c2t30q25"}]}, {"id": "test31", "label": "Test 31", "questions": [{"q": "A technician is preparing to replace a faulty internal cooling fan inside a PC workstation. Which of the actions listed below is the most important first step to ensure personal safety?", "type": "single", "options": ["Switch off the surge protector connected to the PC", "Press and hold the power button for several seconds", "Turn off the power supply switch on the back of the PC", "Disconnect the power cable from the wall outlet"], "correct": [3], "exp": "Fully unplugging the power cable is the safest first step before opening the case.", "id": "c2t31q1"}, {"q": "Which of the following actions is considered an incorrect lifting technique according to workplace safety guidelines?", "type": "single", "options": ["Lifting with the legs, not the back", "Performing a team lift for heavy objects", "Locking the knees while lifting", "Keeping the load close to the body"], "correct": [2], "exp": "Locking the knees while lifting is unsafe and against proper lifting technique.", "id": "c2t31q2"}, {"q": "A technician encounters a small electrical fire inside a desktop PC. Which action is unsafe?", "type": "single", "options": ["Disconnecting the PC from power", "Using a Class C extinguisher", "Evacuating if the fire spreads", "Using water to extinguish the fire"], "correct": [3], "exp": "Water conducts electricity and should never be used on an electrical fire.", "id": "c2t31q3"}, {"q": "Which type of fire extinguishing agent poses the greatest safety risk to humans due to the rapid displacement of oxygen?", "type": "single", "options": ["Water-based foam", "Clean agent gas", "Dry powder chemical", "Carbon dioxide"], "correct": [3], "exp": "CO2 extinguishers rapidly displace oxygen, posing an asphyxiation risk.", "id": "c2t31q4"}, {"q": "What is the primary reason clean agent fire suppression systems are preferred over traditional sprinkler systems in modern IT environments?", "type": "single", "options": ["They lower the air pressure to prevent combustion", "They reduce the cost of fire suppression system maintenance", "They are easier to install than traditional sprinkler systems", "They do not damage sensitive electronic hardware"], "correct": [3], "exp": "Clean agent systems don't leave residue/water damage on sensitive electronics, unlike sprinklers.", "id": "c2t31q5"}, {"q": "Safety goggles reduce the risk of eye injury during tasks that involve:", "type": "single", "options": ["Handling damaged or swollen batteries", "Cutting or trimming cables", "Using pressurized air", "Grinding, cutting, or drilling metal parts", "Soldering or desoldering components", "All of the above"], "correct": [5], "exp": "Safety goggles protect against all of these eye-injury risks — all of the above.", "id": "c2t31q6"}, {"q": "While servicing a laser printer a technician notices spilled toner inside the chassis. Which piece of safety equipment is most important to wear before beginning the cleanup?", "type": "single", "options": ["Safety goggles", "Latex gloves", "ESD wrist strap", "Air filter mask"], "correct": [3], "exp": "An air filter mask protects against inhaling fine toner particles.", "id": "c2t31q7"}, {"q": "Removing jewelry, such as rings or watches, is a recommended personal safety practice when working inside a computer case.", "type": "bool", "options": ["True", "False"], "correct": [0], "exp": "Removing jewelry prevents electrical shorts/conductivity hazards while working inside a case.", "id": "c2t31q8"}, {"q": "Which of the answers listed below refers to a standardized document outlining the hazards, safe handling procedures, storage requirements, and proper disposal methods for potentially hazardous materials?", "type": "single", "options": ["EPA", "OSHA", "SOP", "MSDS"], "correct": [3], "exp": "An MSDS documents hazards, handling, storage, and disposal for hazardous materials.", "id": "c2t31q9"}, {"q": "A technician is decommissioning a variety of older hardware components. Which of the following items should not be placed in standard electronic waste due to special handling requirements? (Select all that apply)", "type": "multi", "options": ["Optical media drives", "CRT display units", "Laser printer toner cartridges", "USB flash drives", "Lithium-ion battery packs"], "correct": [1, 2, 4], "exp": "CRT units, toner cartridges, and lithium-ion batteries require special disposal handling.", "id": "c2t31q10"}, {"q": "Which of the terms listed below refers to an environmental control system?", "type": "single", "options": ["SCADA", "DCS", "TEMPEST", "HVAC"], "correct": [3], "exp": "HVAC is the environmental control (heating/cooling/ventilation) system.", "id": "c2t31q11"}, {"q": "A user reports that a high-performance workstation's speed drops significantly during the afternoon when the office's ambient temperature rises. What is the most likely cause of this performance decrease?", "type": "single", "options": ["System fan failure", "Thermal paste degradation", "Drop in voltage from the power utility", "Thermal throttling"], "correct": [3], "exp": "Rising ambient temperature triggering thermal throttling explains the correlated slowdown.", "id": "c2t31q12"}, {"q": "A server room is experiencing an unusually high number of component failures due to ESD. Which environmental condition is the most likely cause?", "type": "single", "options": ["Humidity levels that are too high", "Ambient temperature that is too low", "Humidity levels that are too low", "Ambient temperature that is too high"], "correct": [2], "exp": "Low humidity increases static buildup, causing more ESD-related failures.", "id": "c2t31q13"}, {"q": "A data center hardware audit reveals recurring corrosion and oxidation on metal connectors used in network and server equipment. Which environmental condition would most likely explain this issue?", "type": "single", "options": ["Humidity levels that are too low", "Ambient temperature that is too high", "Humidity levels that are too high", "Ambient temperature that is too low"], "correct": [2], "exp": "High humidity causes corrosion/oxidation on metal connectors.", "id": "c2t31q14"}, {"q": "Which of the following is not considered a best-practice guideline for proper equipment placement to ensure adequate temperature and ventilation?", "type": "single", "options": ["Maintain clear airflow around intake and exhaust vents", "Avoid placing equipment near heat-generating sources", "Ensure all exhaust fans are pushing air into the cold aisle", "Position equipment in a climate-controlled environment", "Ensure adequate clearance around all sides of the device"], "correct": [2], "exp": "Exhaust should push hot air into the HOT aisle, not the cold aisle — this is backwards from best practice.", "id": "c2t31q15"}, {"q": "What is the primary risk associated with excessive dust accumulation inside a workstation's chassis?", "type": "single", "options": ["Power supply voltage fluctuations", "Increased electromagnetic interference", "Reduced Wi-Fi signal strength", "Thermal buildup due to insulation"], "correct": [3], "exp": "Dust insulates components and traps heat, causing thermal buildup.", "id": "c2t31q16"}, {"q": "Which precautions should be followed to avoid moisture-related damage when using compressed air to clean computer hardware? (Select 3 answers)", "type": "multi", "options": ["Avoid shaking the can during use", "Keep the can upright", "Apply long, continuous sprays to ensure all dust is dislodged", "Use short, controlled bursts", "Shake the can frequently during use to maintain high pressure", "Keep the can tilted to prevent liquid leakage"], "correct": [0, 1, 3], "exp": "Don't shake the can, keep it upright, and use short bursts to avoid expelling liquid propellant.", "id": "c2t31q17"}, {"q": "A technician is cleaning a laser printer and notices toner dust mixed with regular dust inside the device. What is the safest course of action?", "type": "single", "options": ["Shake the toner cartridge to loosen debris", "Use a wet cloth to wipe the toner", "Blow the toner out with compressed air", "Use an ESD-safe vacuum designed for toner"], "correct": [3], "exp": "An ESD-safe toner vacuum safely removes toner without spreading dust or risking static damage.", "id": "c2t31q18"}, {"q": "The term \"Brownout\" refers to what kind of situation?", "type": "single", "options": ["Power fluctuation", "Power sag", "Prolonged undervoltage", "Power outage"], "correct": [2], "exp": "A brownout is a prolonged period of undervoltage/reduced power.", "id": "c2t31q19"}, {"q": "What does the term \"Blackout\" refer to?", "type": "single", "options": ["Intermittent power loss", "Drop in voltage", "Power sag", "Complete loss of power"], "correct": [3], "exp": "A blackout is a complete loss of power.", "id": "c2t31q20"}, {"q": "Which of the answers listed below best describes the primary function of a UPS?", "type": "single", "options": ["Filters electrical noise from the power line", "Ensures consistent voltage delivery to hardware", "Provides battery-backed power during an outage", "Regulates incoming voltage to a stable level"], "correct": [2], "exp": "A UPS's primary function is providing battery-backed power during an outage.", "id": "c2t31q21"}, {"q": "A technician is setting up a new workstation in an area prone to frequent lightning storms. Which device should be installed to protect the computer's power supply from sudden, high-voltage spikes?", "type": "single", "options": ["Line conditioner", "Standby power supply", "Power strip", "Surge suppressor"], "correct": [3], "exp": "A surge suppressor protects against sudden high-voltage spikes like lightning-induced surges.", "id": "c2t31q22"}, {"q": "Which of the following best describes the primary purpose of maintaining a chain of custody?", "type": "single", "options": ["To provide a step-by-step log of the incident remediation process", "To track the movement of corporate assets for inventory management purposes", "To track which systems were affected during an incident", "To preserve the integrity of evidence for potential legal proceedings"], "correct": [3], "exp": "Chain of custody preserves evidence integrity for potential legal use.", "id": "c2t31q23"}, {"q": "Which items must always be included when documenting a chain of custody? (Select 2 answers)", "type": "multi", "options": ["Description of the location where the evidence was found", "Method used to collect the evidence", "Chronological log of everyone who handled the evidence", "Date and time of evidence transfer", "List of remediation steps taken after evidence collection"], "correct": [2, 3], "exp": "A chronological log of handlers and the date/time of each transfer are essential chain of custody elements.", "id": "c2t31q24"}, {"q": "A technician discovers evidence of credit card data theft on a company server. What is the most appropriate next step?", "type": "single", "options": ["Shut down the server to preserve its current state", "Contact local law enforcement directly", "Disconnect the server from the network to prevent further access", "Notify management and follow escalation procedures"], "correct": [3], "exp": "Following the organization's escalation procedure (notify management) is the appropriate next step, not acting unilaterally.", "id": "c2t31q25"}]}, {"id": "test32", "label": "Test 32", "questions": [{"q": "Which of the terms listed below is used to describe a forensic copy of a storage device that captures every sector of the drive, including deleted files, hidden partitions, and unallocated space?", "type": "single", "options": ["Disk mirroring", "File system dump", "Bit-by-bit image", "Snapshot image"], "correct": [2], "exp": "A bit-by-bit image captures every sector, including deleted/hidden/unallocated data.", "id": "c2t32q1"}, {"q": "During an incident investigation, a technician must acquire data from a suspect's storage drive without altering any information. Which of the following ensures the contents of the drive cannot be modified during this process?", "type": "single", "options": ["Disk encryption", "Password-protected access", "Checksum verification", "Write blocker"], "correct": [3], "exp": "A write blocker prevents any modification to the source drive during acquisition.", "id": "c2t32q2"}, {"q": "A technician needs to confirm that a forensic image has not been altered since its creation. Which method provides this assurance?", "type": "single", "options": ["Running a disk integrity check", "Checking the system event logs", "Examining the evidence transfer records", "Comparing hash values"], "correct": [3], "exp": "Comparing hash values confirms a forensic image hasn't changed since creation.", "id": "c2t32q3"}, {"q": "When documenting a security incident, which type of detail should be strictly avoided to maintain the integrity of the report?", "type": "single", "options": ["Timeline of events", "Actions taken during remediation", "Personnel involved in the incident", "Collected evidence", "Speculative statements"], "correct": [4], "exp": "Speculative statements undermine the factual integrity of an incident report.", "id": "c2t32q4"}, {"q": "Which of the answers listed below shows the basic order of volatility for a typical system?", "type": "single", "options": ["Archival media, Disk, RAM, CPU registers/cache", "RAM, CPU registers/cache, Disk, Archival media", "Disk, Archival media, CPU registers/cache, RAM", "CPU registers/cache, RAM, Disk, Archival media"], "correct": [3], "exp": "Order of volatility (most to least volatile): CPU registers/cache, RAM, disk, archival media.", "id": "c2t32q5"}, {"q": "Which action best ensures compliance with software licensing requirements?", "type": "single", "options": ["Monitoring application launch frequency", "Purchasing a perpetual license for every device", "Tracking license keys and installations", "Enforcing DRM restrictions across all devices"], "correct": [2], "exp": "Tracking license keys/installations directly ensures licensing compliance.", "id": "c2t32q6"}, {"q": "The primary purpose of DRM is to:", "type": "single", "options": ["Specify the number of permitted software installations", "Define legal rights and obligations for software use", "Monitor software installation activity for license compliance", "Enforce access and usage restrictions on digital content"], "correct": [3], "exp": "DRM's primary purpose is enforcing access/usage restrictions on digital content.", "id": "c2t32q7"}, {"q": "A technician is tasked with reviewing the permissions for a new software suite. The company needs to know the specific restrictions regarding the redistribution of the software and the consequences of exceeding the allowed installation count. Which document contains this information?", "type": "single", "options": ["SLA", "EULA", "ToS", "AUP"], "correct": [1], "exp": "The EULA (End User License Agreement) governs redistribution restrictions and installation limits.", "id": "c2t32q8"}, {"q": "An IT asset manager is performing a department-wide software audit to ensure that all applications have valid licenses. Which of the following elements must be verified to confirm full licensing compliance? (Select all that apply)", "type": "multi", "options": ["Permitted seat count or installation limit", "Legal entitlement or proof of purchase", "Authorized usage scope based on license type", "Event log entries related to application usage"], "correct": [0, 1, 2], "exp": "Seat count, proof of purchase, and authorized usage scope are all needed to confirm licensing compliance.", "id": "c2t32q9"}, {"q": "Which statement best defines a perpetual license agreement?", "type": "single", "options": ["Grants the user ownership of the software source code", "Provides unlimited installations across all devices", "Allows indefinite software use after a one-time purchase", "Requires regular renewal payments for continued access"], "correct": [2], "exp": "A perpetual license allows indefinite use after a single one-time purchase.", "id": "c2t32q10"}, {"q": "A technician finds that an employee installed a personal-use licensed application for business tasks on a company-owned workstation. This indicates that the software is:", "type": "single", "options": ["Exempt from licensing rules", "Not licensed for business use", "Automatically covered by corporate licensing", "Open source and unrestricted"], "correct": [1], "exp": "A personal-use license doesn't cover business use — this is a licensing violation.", "id": "c2t32q11"}, {"q": "Which of the statements listed below accurately describe the characteristics of a personal-use software license? (Select 3 answers)", "type": "multi", "options": ["Grants usage rights without transferring legal ownership", "Prohibits the redistribution or resale of the software", "Allows the end user to modify the software", "Transfers full legal ownership of the software to the end user", "Restricts the software usage to non-commercial purposes"], "correct": [0, 1, 4], "exp": "Personal-use licenses grant usage rights (not ownership), prohibit redistribution, and restrict to non-commercial use.", "id": "c2t32q12"}, {"q": "A technician is tasked with setting up a shared computer in a retail environment. The computer will be used by various employees to process customer orders and manage inventory. Which of the following license types must be assigned to the software to ensure the business remains compliant with legal usage rights?", "type": "single", "options": ["Shareware license", "Corporate-use license", "Perpetual license", "Concurrent license"], "correct": [1], "exp": "A corporate-use license is required for a business-context, multi-employee shared computer.", "id": "c2t32q13"}, {"q": "Which type of software licensing model grants free access to the application code as well as permission to modify and redistribute the application?", "type": "single", "options": ["Perpetual license", "Freeware license", "Open-source license", "Shareware license"], "correct": [2], "exp": "Open-source licenses grant free access to source code plus modification/redistribution rights.", "id": "c2t32q14"}, {"q": "Which of the answers listed below refers to a legal contract that restricts a party from disclosing confidential or proprietary information?", "type": "single", "options": ["SLA", "NDA", "ISA", "BPA"], "correct": [1], "exp": "An NDA restricts disclosure of confidential/proprietary information.", "id": "c2t32q15"}, {"q": "Which type of legal agreement involves a mutual obligation between parties to protect shared confidential information from unauthorized disclosure?", "type": "single", "options": ["GDPR", "MSA", "ToS", "MNDA"], "correct": [3], "exp": "An MNDA (Mutual NDA) creates mutual confidentiality obligations between both parties.", "id": "c2t32q16"}, {"q": "The purpose of PCI DSS is to provide protection for:", "type": "single", "options": ["Personal health information", "Bank account credentials", "Intellectual property and trade secrets", "Credit cardholder data"], "correct": [3], "exp": "PCI DSS protects credit cardholder data specifically.", "id": "c2t32q17"}, {"q": "Examples of government-issued identifiers include: (Select all that apply)", "type": "multi", "options": ["Driver's license number", "Passport number", "Medical record number", "Taxpayer identification number", "Social security number"], "correct": [0, 1, 3, 4], "exp": "Driver's license, passport, taxpayer ID, and SSN are government-issued identifiers; a medical record number is not.", "id": "c2t32q18"}, {"q": "Which of the following acronyms refers to any type of information pertaining to an individual that can be used to uniquely identify that person?", "type": "single", "options": ["PHI", "UID", "PII", "SSN"], "correct": [2], "exp": "PII (Personally Identifiable Information) uniquely identifies an individual.", "id": "c2t32q19"}, {"q": "The US Health Insurance Portability and Accountability Act (HIPAA) provides privacy protection for: (Select best answer)", "type": "single", "options": ["PFI", "PII", "CUI", "PHI"], "correct": [3], "exp": "HIPAA specifically protects PHI (Protected Health Information).", "id": "c2t32q20"}, {"q": "Which type of policy defines the required timeframe for the preservation of regulated data prior to its permanent disposal?", "type": "single", "options": ["Data protection policy", "Data classification policy", "Data backup policy", "Data retention policy"], "correct": [3], "exp": "A data retention policy defines how long regulated data must be preserved before disposal.", "id": "c2t32q21"}, {"q": "A type of document stipulating rules of behavior to be followed by users of computers, networks, and associated resources is known as:", "type": "single", "options": ["ToS", "EULA", "AUP", "SLA"], "correct": [2], "exp": "An AUP (Acceptable Use Policy) stipulates rules for using computers/networks.", "id": "c2t32q22"}, {"q": "A technician is configuring a captive portal for a guest wireless network. To ensure compliance, guests must agree to the company's terms of service on a special page before accessing the internet. Which feature should be deployed?", "type": "single", "options": ["Post-login warning banner", "Desktop pop-up alert", "Splash screen", "Browser pop-up message"], "correct": [2], "exp": "A captive portal splash screen presents terms of service before granting internet access.", "id": "c2t32q23"}, {"q": "Which description best defines appropriate attire in a professional IT environment?", "type": "single", "options": ["Casual clothing with minimal branding", "Clothing that prioritizes comfort", "Clothing that adheres to company dress code", "Clothing suitable for physical labor"], "correct": [2], "exp": "Appropriate professional attire adheres to the company's established dress code.", "id": "c2t32q24"}, {"q": "Which approach best demonstrates effective communication with a customer in a technical support scenario?", "type": "single", "options": ["Describe the issue with precise, technical terms to avoid any ambiguity", "Use technical abbreviations to streamline the communication process", "Avoid using jargon, acronyms, and slang when applicable", "Describe the issue using informal language to simplify the explanation"], "correct": [2], "exp": "Avoiding jargon/acronyms/slang ensures clear communication with non-technical customers.", "id": "c2t32q25"}]}, {"id": "test33", "label": "Test 33", "questions": [{"q": "A technician is troubleshooting a recurring software issue while the user expresses frustration. Which behavior best demonstrates maintaining a positive attitude?", "type": "single", "options": ["Focusing exclusively on resolving the issue without engaging the user", "Promising a definitive fix time regardless of the actual troubleshooting progress", "Informing the user that similar issues are common and unavoidable", "Acknowledging the user's frustration while remaining calm and respectful"], "correct": [3], "exp": "Acknowledging frustration while staying calm/respectful is the professional, positive response.", "id": "c2t33q1"}, {"q": "Which of the statements listed below best describes projecting confidence in a customer support role?", "type": "single", "options": ["Reassuring the customer by minimizing the perceived complexity of the issue", "Providing a definitive repair timeline before completing a full diagnostic", "Communicating assurance and competence while managing expectations", "Minimizing the customer's questions to maintain control of the interaction"], "correct": [2], "exp": "Confidence means conveying competence while realistically managing expectations.", "id": "c2t33q2"}, {"q": "A customer begins describing a printing issue in detail. Which action best demonstrates active listening according to professional support standards?", "type": "single", "options": ["Interrupting to confirm understanding of something stated earlier in the description", "Politely cutting in to redirect a lengthy or off-topic story back to the main technical issue", "Listening without interrupting until the customer finishes describing the problem", "Correcting the customer's technical terminology or phrasing during their explanation"], "correct": [2], "exp": "Active listening means letting the customer finish without interrupting.", "id": "c2t33q3"}, {"q": "Which behavior best reflects the guideline to use appropriate professional titles and designations?", "type": "single", "options": ["Relying on generic respectful terms when unsure about the provided title", "Applying titles or designations only when explicitly requested to do so", "Omitting titles entirely to focus attention on the technical problem", "Addressing a self-identified PhD holder as Dr. followed by the last name"], "correct": [3], "exp": "Using the correct professional title (Dr.) once known is proper etiquette.", "id": "c2t33q4"}, {"q": "Which actions best demonstrate proper time management in customer support interactions? (Select 2 answers)", "type": "multi", "options": ["Relying on the customer to reschedule if a delay occurs", "Planning travel and preparation to avoid delays", "Offering extra service time to compensate for late arrival", "Contacting the customer promptly if running late", "Depending on customer understanding of common overruns"], "correct": [1, 3], "exp": "Planning ahead to avoid delays and proactively notifying the customer if running late are proper time management.", "id": "c2t33q5"}, {"q": "Which of the following activities are considered unprofessional distractions that should be avoided in a customer support scenario? (Select 3 answers)", "type": "multi", "options": ["Photographing damaged equipment", "Texting or using social media sites", "Answering a supervisor's call", "Engaging in personal conversations with co-workers", "Taking personal calls"], "correct": [1, 3, 4], "exp": "Texting/social media, personal conversations, and personal calls are all unprofessional distractions during customer interactions.", "id": "c2t33q6"}, {"q": "Which practice most directly supports the guideline to not argue with the customer or be defensive?", "type": "single", "options": ["Asking the customer to remain calm before continuing", "Redirecting the discussion to a different topic", "Escalating the issue immediately to avoid conflict", "Avoiding counterarguments when facing complaints"], "correct": [3], "exp": "Not countering/arguing with complaints directly supports the non-defensive guideline.", "id": "c2t33q7"}, {"q": "Which of the actions listed below align with the guideline to avoid dismissing customer issues? (Select 3 answers)", "type": "multi", "options": ["Treating every reported symptom as legitimate until investigated", "Restating the customer's concern to confirm understanding", "Asking open-ended questions to better understand the complaint", "Clarifying customer statements by interrupting them if necessary", "Pointing out that the problem is common among other customers"], "correct": [0, 1, 2], "exp": "Treating symptoms as legitimate, restating concerns, and asking open questions all show the issue is taken seriously.", "id": "c2t33q8"}, {"q": "Which of the following actions align with avoiding being judgmental in a technical support scenario? (Select 3 answers)", "type": "multi", "options": ["Reassuring the customer that the mistake is understandable for non-technical users", "Asking open-ended questions to better understand the complaint", "Treating the customer's technical knowledge level without assumption or criticism", "Focusing on facts and solutions rather than the customer's past decisions", "Advising the customer to stop experimenting with settings they don't understand"], "correct": [1, 2, 3], "exp": "Asking open questions, not assuming skill level, and focusing on facts/solutions avoid being judgmental.", "id": "c2t33q9"}, {"q": "In a customer support scenario, which actions best demonstrate the ability to clarify customer statements? (Select 3 answers)", "type": "multi", "options": ["Restating the customer's description to verify understanding", "Aligning communication style with the customer's technical level", "Correcting the customer's use of non-technical language", "Questioning to confirm key details of the reported problem", "Asking open-ended questions to narrow the scope of the issue"], "correct": [0, 3, 4], "exp": "Restating, confirming key details, and open-ended questions all clarify the customer's statements.", "id": "c2t33q10"}, {"q": "Which of the practices listed below do not align with the guideline on maintaining discretion when discussing past customer encounters? (Select 2 answers)", "type": "multi", "options": ["Focusing on technical details when describing issues", "Discussing specific customer experiences outside work", "Avoiding specific customer names or locations", "Posting details of a customer interaction on a personal social media account", "Using anonymized examples in training or meetings"], "correct": [1, 3], "exp": "Discussing specific experiences outside work and posting details on social media both violate customer discretion.", "id": "c2t33q11"}, {"q": "After diagnosing a failed motherboard on a laptop that is out of warranty, a technician determines the repair cost is nearly equal to a new system. Which of the following is the most professional course of action?", "type": "single", "options": ["Present both options but emphasize repair as better value", "Quote only the repair cost without mentioning replacement price", "Recommend replacing the laptop with a new system", "Offer both repair and replacement options to the customer"], "correct": [3], "exp": "Presenting both options neutrally lets the customer make an informed decision.", "id": "c2t33q12"}, {"q": "After finishing a repair and verifying full system functionality, what is the most important final step to complete the service workflow?", "type": "single", "options": ["Providing the customer with proper documentation of the services performed", "Asking the customer to sign a waiver stating that no other components were damaged", "Identifying potential negative impacts of the implemented solution", "Updating internal documentation with the hardware manufacturer's information"], "correct": [0], "exp": "Providing documentation of services performed is the proper final step for the customer.", "id": "c2t33q13"}, {"q": "After resolving a customer issue, following up at a later date to verify satisfaction is optional unless the customer reports a new problem.", "type": "bool", "options": ["True", "False"], "correct": [1], "exp": "Follow-up is a recommended best practice, not something that's only done if problems recur.", "id": "c2t33q14"}, {"q": "Which of the answers listed below describes appropriate handling of the customer's confidential data in a situation where troubleshooting requires access to a password-protected system?", "type": "single", "options": ["Create a temporary account with the same permissions", "Ask user to type in the password themselves", "Temporarily disable password protection", "Ask user for password and their consent to use it"], "correct": [1], "exp": "Having the user enter their own password keeps the technician from directly handling the credential.", "id": "c2t33q15"}, {"q": "Which type of file extension would be found on a script file that runs a sequence of DOS commands in Windows Command Prompt?", "type": "single", "options": [".bat", ".ps1", ".sh", ".vbs"], "correct": [0], "exp": ".bat files run DOS command sequences in the Windows Command Prompt.", "id": "c2t33q16"}, {"q": "Which file extension is used for scripts executed by the PowerShell interpreter on Windows systems?", "type": "single", "options": [".vbs", ".py", ".bat", ".ps1"], "correct": [3], "exp": ".ps1 is the PowerShell script file extension.", "id": "c2t33q17"}, {"q": "Which scripting language is associated with the .vbs file extension?", "type": "single", "options": ["JavaScript", "Python", "Visual Basic Scripting Edition", "PowerShell"], "correct": [2], "exp": ".vbs files use VBScript (Visual Basic Scripting Edition).", "id": "c2t33q18"}, {"q": "A technician needs to create a logon script that displays a graphical (popup) welcome message for domain users on legacy Windows workstations. Which type of script file should be used?", "type": "single", "options": [".cmd", ".bat", ".sh", ".vbs"], "correct": [3], "exp": ".vbs supports graphical popup dialogs, unlike plain batch scripts.", "id": "c2t33q19"}, {"q": "Which of the following is the standard file extension for shell scripts executed on Unix-like systems such as Linux and macOS?", "type": "single", "options": [".py", ".js", ".bat", ".sh"], "correct": [3], "exp": ".sh is the standard shell script extension on Unix-like systems.", "id": "c2t33q20"}, {"q": "Which type of script file is used to control interactive elements on web pages in modern browsers?", "type": "single", "options": [".css", ".php", ".js", ".vbs"], "correct": [2], "exp": ".js (JavaScript) controls interactive web page elements.", "id": "c2t33q21"}, {"q": "Which of the answers listed below refers to a filename extension associated with a cross-platform, general-purpose programming language?", "type": "single", "options": [".vbs", ".py", ".ps1", ".bat"], "correct": [1], "exp": ".py (Python) is a cross-platform general-purpose language.", "id": "c2t33q22"}, {"q": "A Windows technician is tasked with ensuring that temporary files and folders are deleted from all workstations on a specific time-based schedule. What should the technician do to provide basic automation for this task?", "type": "single", "options": ["Modify a registry key to automatically purge temporary data", "Configure Group Policy to delete temporary data at user logoff", "Implement a script to run the deletion task on schedule", "Use Disk Cleanup's built-in settings to remove temporary data"], "correct": [2], "exp": "A scheduled script provides the flexible, time-based automation described here.", "id": "c2t33q23"}, {"q": "Which file extension is used for scripts that are the current industry standard for automating administrative tasks, such as system restarts, in a modern Windows environment?", "type": "single", "options": [".bat", ".vbs", ".cmd", ".ps1"], "correct": [3], "exp": ".ps1 (PowerShell) is the current standard for Windows administrative task automation.", "id": "c2t33q24"}, {"q": "A technician needs to ensure that all employees in the Finance department have a specific shared folder mapped to the Z: drive every time they log into their Windows workstations. Which of the following options allows the technician to achieve this goal?", "type": "single", "options": ["Write a startup script that maps the drive at system boot", "Configure a script that uses a net share command", "Use a shutdown script to remap the drive before the system powers off", "Create a login script that runs a net use command"], "correct": [3], "exp": "A login script running net use maps the drive every time a user logs in.", "id": "c2t33q25"}]}, {"id": "test34", "label": "Test 34", "questions": [{"q": "What are the primary benefits of using scripts to install applications in enterprise environments? (Select 3 answers)", "type": "multi", "options": ["Ensuring consistent software configuration across multiple systems", "Reducing the time required to install software on a single workstation", "Improving efficiency and scalability of software deployment", "Bypassing the requirement for administrative privileges on target systems", "Minimizing errors that occur during manual software deployment"], "correct": [0, 2, 4], "exp": "Scripted installs ensure consistency, improve efficiency/scalability, and reduce manual errors.", "id": "c2t34q1"}, {"q": "Which advantages does scripting provide when used for backups? (Select 3 answers)", "type": "multi", "options": ["Minimizing the risk of human error during repetitive tasks", "Reducing the overall storage space required for backups", "Ensuring consistent and standardized backup execution", "Improving efficiency through automated off-hours scheduling", "Reducing CPU and memory usage during the backup process"], "correct": [0, 2, 3], "exp": "Scripted backups reduce human error, standardize execution, and enable automated off-hours scheduling.", "id": "c2t34q2"}, {"q": "A security analyst uses a script to pull a list of all installed software from every computer in the accounting department. This is an example of which scripting use case?", "type": "single", "options": ["Running software compliance checks", "Conducting vulnerability scanning", "Gathering of information/data", "Monitoring application performance"], "correct": [2], "exp": "Pulling installed software lists is a data/information gathering task.", "id": "c2t34q3"}, {"q": "A system administrator uses a script to remotely trigger the download and installation of the latest firmware on several network appliances. Which of the answers listed below best describes the primary function of this script?", "type": "single", "options": ["Update propagation", "Update initiation", "Update provisioning", "Update enforcement"], "correct": [1], "exp": "Triggering the download/install remotely is update initiation.", "id": "c2t34q4"}, {"q": "Primary countermeasures against the unintentional introduction of malware via scripting include verifying the source code and testing the script's behavior in a sandbox or lab environment prior to production deployment.", "type": "bool", "options": ["True", "False"], "correct": [0], "exp": "Source verification and sandbox testing are standard countermeasures against script-borne malware.", "id": "c2t34q5"}, {"q": "A script is deployed to enforce a standardized corporate desktop background across the company's workstations. Post-execution, users report that certain applications no longer launch correctly. Which type of risk associated with scripting does this scenario represent?", "type": "single", "options": ["Unintentional introduction of malware", "Increased system resource usage", "Software compatibility errors", "Inadvertent changes to system settings"], "correct": [3], "exp": "An unintended side effect breaking other apps is an inadvertent change to system settings.", "id": "c2t34q6"}, {"q": "A Windows user runs a browser automation script written in JavaScript to scrape data from multiple web pages. After several minutes, the browser becomes completely unresponsive and must be terminated via Task Manager. Which of the following answers best describes a scripting-related risk presented in this scenario?", "type": "single", "options": ["Application timeout from low bandwidth", "Unintentional introduction of malware", "Mishandling of system resources", "Incompatible JavaScript runtime version"], "correct": [2], "exp": "An unresponsive browser from a poorly-designed script points to mishandling of system resources.", "id": "c2t34q7"}, {"q": "A technician needs to enable full graphical remote control of a Windows 11 Pro workstation for troubleshooting from another Windows device. Which built-in remote access method is the most appropriate?", "type": "single", "options": ["SSH", "VNC", "WinRM", "RDP"], "correct": [3], "exp": "RDP is the built-in Windows graphical remote control method.", "id": "c2t34q8"}, {"q": "A field technician at a client site needs to securely access internal company servers and shared folders from an untrusted Wi-Fi network. Which remote access method best addresses this requirement?", "type": "single", "options": ["RDP", "SSH", "VPN", "VNC"], "correct": [2], "exp": "A VPN secures the connection to internal resources over an untrusted network.", "id": "c2t34q9"}, {"q": "A technician needs to remotely control a Linux workstation's graphical desktop from a Windows laptop. Which remote access method should the technician use to accomplish this task?", "type": "single", "options": ["VNC", "RDP", "WinRM", "SSH"], "correct": [0], "exp": "VNC provides cross-platform graphical remote desktop access, including Linux.", "id": "c2t34q10"}, {"q": "A technician needs to securely manage a remote Linux server using a command-line interface over the internet. Which remote access technology should be used?", "type": "single", "options": ["IPsec", "Telnet", "SSH", "rlogin"], "correct": [2], "exp": "SSH provides secure command-line remote management.", "id": "c2t34q11"}, {"q": "Which of the terms listed below refers to a general category of software platforms designed for the remote monitoring, management, maintenance, and support of client computers, servers, and networks?", "type": "single", "options": ["EDR", "RMM", "VDI", "MDM"], "correct": [1], "exp": "RMM (Remote Monitoring and Management) covers this general category of platforms.", "id": "c2t34q12"}, {"q": "Which of the following is an open-source remote desktop protocol designed for virtual machine access?", "type": "single", "options": ["WinRM", "VNC", "DaaS", "SPICE"], "correct": [3], "exp": "SPICE is an open-source remote protocol designed for VM access.", "id": "c2t34q13"}, {"q": "A system administrator needs to execute a PowerShell script on multiple remote Windows workstations without opening a graphical session on each machine. Which protocol should be used?", "type": "single", "options": ["PCoIP", "SSH", "WinRM", "Telnet"], "correct": [2], "exp": "WinRM enables remote PowerShell execution without a graphical session.", "id": "c2t34q14"}, {"q": "Screen-sharing software — match to its category examples.", "type": "single", "options": ["TeamViewer, AnyDesk, GoToMyPC", "Zoom, Microsoft Teams, Google Meet", "Dropbox, Google Drive, FileZilla", "ManageEngine Endpoint Central, Microsoft Intune"], "correct": [0], "exp": "TeamViewer, AnyDesk, and GoToMyPC are screen-sharing tools.", "id": "c2t34q15"}, {"q": "Videoconferencing software — match to its category examples.", "type": "single", "options": ["TeamViewer, AnyDesk, GoToMyPC", "Zoom, Microsoft Teams, Google Meet", "Dropbox, Google Drive, FileZilla", "ManageEngine Endpoint Central, Microsoft Intune"], "correct": [1], "exp": "Zoom, Teams, and Google Meet are videoconferencing tools.", "id": "c2t34q16"}, {"q": "File transfer software — match to its category examples.", "type": "single", "options": ["TeamViewer, AnyDesk, GoToMyPC", "Zoom, Microsoft Teams, Google Meet", "Dropbox, Google Drive, FileZilla", "ManageEngine Endpoint Central, Microsoft Intune"], "correct": [2], "exp": "Dropbox, Google Drive, and FileZilla are file transfer tools.", "id": "c2t34q17"}, {"q": "Desktop management software — match to its category examples.", "type": "single", "options": ["TeamViewer, AnyDesk, GoToMyPC", "Zoom, Microsoft Teams, Google Meet", "Dropbox, Google Drive, FileZilla", "ManageEngine Endpoint Central, Microsoft Intune"], "correct": [3], "exp": "ManageEngine Endpoint Central and Microsoft Intune are desktop management tools.", "id": "c2t34q18"}, {"q": "Which default TCP port must be restricted or managed on a firewall to prevent unauthorized RDP connections?", "type": "single", "options": ["Port 513", "Port 3389", "Port 22", "Port 5900"], "correct": [1], "exp": "RDP uses TCP port 3389 by default.", "id": "c2t34q19"}, {"q": "Which practice best mitigates the risk of unauthorized VPN access?", "type": "single", "options": ["Requiring multifactor authentication for VPN logins", "Enabling a split-tunneling setup for all remote users", "Increasing the VPN session timeout value", "Requiring users to connect only during business hours"], "correct": [0], "exp": "MFA is the strongest mitigation against unauthorized VPN access.", "id": "c2t34q20"}, {"q": "Unlike RDP, standard VNC is often considered less secure because it frequently lacks native end-to-end encryption for the entire session and typically requires the use of an SSH tunnel or a VPN to secure data in transit and prevent credential interception.", "type": "bool", "options": ["True", "False"], "correct": [0], "exp": "Standard VNC indeed often lacks built-in encryption, unlike RDP, and needs a tunnel/VPN for security.", "id": "c2t34q21"}, {"q": "A network administrator is concerned about automated brute-force attacks successfully guessing passwords on a Linux server used for remote management. Which of the actions listed below would provide the most significant increase in security for the SSH service in this scenario?", "type": "single", "options": ["Restricting SSH access to specific IP addresses or using a firewall", "Disabling direct root user or administrator login capability", "Changing the default TCP port 22 to reduce automated attacks", "Using public-key authentication (SSH keys) instead of passwords"], "correct": [3], "exp": "SSH key authentication eliminates password-guessing brute-force attacks entirely.", "id": "c2t34q22"}, {"q": "Which of the following best describes the most significant architectural security risk associated with RMM platforms?", "type": "single", "options": ["Data exfiltration", "Insecure APIs", "Human error", "Centralized control"], "correct": [3], "exp": "RMM's centralized control over many endpoints is its biggest architectural risk — a single compromise affects everything.", "id": "c2t34q23"}, {"q": "An administrator is configuring SPICE for secure remote access across multiple guest operating systems. What is the most important security measure that should be implemented to protect data in transit?", "type": "single", "options": ["Enabling TLS encryption for all SPICE channels", "Changing the default SPICE port to a non-standard port", "Restricting SPICE access to specific IP addresses using firewall rules", "Limiting SPICE connections to a trusted VLAN"], "correct": [0], "exp": "TLS encryption directly protects data in transit for SPICE sessions.", "id": "c2t34q24"}, {"q": "A network technician is configuring a Windows workstation for remote PowerShell management over an untrusted network segment. To ensure that remote management traffic is encrypted during transit, the technician should modify the WinRM configuration and switch from the default HTTP setting to:", "type": "single", "options": ["SSH", "HTTPS", "IPsec", "VPN"], "correct": [1], "exp": "Switching WinRM from HTTP to HTTPS encrypts the remote management traffic.", "id": "c2t34q25"}, {"q": "An in-house software developer is tasked with enhancing the company's internal helpdesk portal by adding an AI chatbot to assist employees with common IT questions. This new feature implementation is an example of AI:", "type": "single", "options": ["Model training", "Application integration", "Vibe coding", "Prompt engineering"], "correct": [1], "exp": "Adding an AI chatbot feature into an existing portal is AI application integration.", "id": "c2t34q26"}, {"q": "A company policy states that generative AI may be used only to draft internal documentation and never to create customer-facing communications without human review. This policy is primarily addressing the AI's:", "type": "single", "options": ["Content attribution", "Goal misalignment", "Appropriate use", "Data quality issues"], "correct": [2], "exp": "This policy governs what the AI is appropriately used for.", "id": "c2t34q27"}, {"q": "A technical writer copies AI-generated troubleshooting steps into a public document without citation and submits the entire guide as original work. This behavior can be most accurately described as an example of:", "type": "single", "options": ["Copyright infringement", "Plagiarism", "IP theft", "Data misappropriation"], "correct": [1], "exp": "Presenting AI-generated content as original work without attribution is plagiarism.", "id": "c2t34q28"}, {"q": "A predictive maintenance AI consistently flags hardware from one specific manufacturer for replacement, despite telemetry data showing those units are functioning within normal parameters. The system was trained primarily on repair logs from a period when that manufacturer had a known temporary defect. This type of error in the AI's output can be best described as:", "type": "single", "options": ["Hallucinations", "Bias", "Context loss", "Alignment issue"], "correct": [1], "exp": "Skewed training data causing systematically unfair flagging of one manufacturer is bias.", "id": "c2t34q29"}, {"q": "A Windows help desk technician queries a generative AI tool for steps to troubleshoot a printer connectivity issue. The AI provides a detailed solution referencing a non-existent firmware version and a specific registry key that is not present in Windows. Which AI-related problem does this scenario illustrate?", "type": "single", "options": ["Model drift", "Evaluation gap", "Overfitting", "Hallucinations"], "correct": [3], "exp": "Fabricated, non-existent details (firmware/registry key) is a classic AI hallucination.", "id": "c2t34q30"}, {"q": "What is the most reliable way to mitigate the risks associated with AI accuracy limitations?", "type": "single", "options": ["Prompting the AI to provide a confidence score for its answers", "Increasing the token limit of AI-generated responses", "Verifying all AI-generated output against relevant official sources", "Cross-referencing the output with other generative AI tools"], "correct": [2], "exp": "Verifying AI output against official/authoritative sources is the most reliable mitigation.", "id": "c2t34q31"}, {"q": "Which of the answers listed below describe the characteristics of private AI deployments? (Select 3 answers)", "type": "multi", "options": ["User inputs may be used to improve the provider's AI systems", "Models are trained on broad, unvetted public internet datasets", "User inputs are isolated and excluded from external model training", "Organizations maintain exclusive control over data security", "Models are trained on specific, internally vetted data sources", "Service providers manage data storage in a multi-tenant cloud"], "correct": [2, 3, 4], "exp": "Private AI deployments isolate inputs from external training, keep org control over security, and use vetted internal data.", "id": "c2t34q32"}, {"q": "Which of the answers listed below describe the characteristics of public AI deployments? (Select 3 answers)", "type": "multi", "options": ["Models are trained on specific, internally vetted data sources", "Organizations maintain exclusive control over data security", "User inputs are isolated and excluded from external model training", "Service providers manage data storage in a multi-tenant cloud", "Models are trained on broad, unvetted public internet datasets", "User inputs may be used to improve the provider's AI systems"], "correct": [3, 4, 5], "exp": "Public AI deployments use multi-tenant cloud storage, broad public training data, and may reuse user inputs to improve the model.", "id": "c2t34q33"}]}], "acronym_quizzes": [{"id": "quiz1", "label": "Quiz 1", "questions": [{"q": "Which type of legal agreement involves a mutual obligation between parties to protect shared confidential information from unauthorized disclosure?", "type": "single", "options": ["MNDA", "SLA", "MSA", "EULA"], "correct": [0], "exp": "An MNDA (Mutual NDA) creates mutual confidentiality obligations.", "id": "c2aq1q1"}, {"q": "Which of the terms listed below refers to the final stage of a product's life cycle when it is permanently discontinued and no longer supported or sold?", "type": "single", "options": ["EOS", "EOD", "EOL", "EOA"], "correct": [2], "exp": "EOL (End of Life) is the final discontinued/unsupported stage.", "id": "c2aq1q2"}, {"q": "Which of the following acronyms refers to a short-range wireless communication technology used for contactless payments and data exchange?", "type": "single", "options": ["BLE", "IR", "RFID", "NFC"], "correct": [3], "exp": "NFC enables short-range contactless payments/data exchange.", "id": "c2aq1q3"}, {"q": "Which of the answers listed below refers to a security solution that provides the capability for detection, analysis, response, and real-time monitoring of cyber threats on endpoints such as workstations and servers?", "type": "single", "options": ["SWG", "CASB", "EDR", "NGFW"], "correct": [2], "exp": "EDR monitors/responds to threats at the endpoint level.", "id": "c2aq1q4"}, {"q": "Which of the following acronyms refers to a standardized document that provides detailed information about the properties, hazards, and safe handling of chemicals?", "type": "single", "options": ["SOP", "GHS", "EPA", "SDS"], "correct": [3], "exp": "An SDS (Safety Data Sheet) documents chemical properties/hazards/handling.", "id": "c2aq1q5"}, {"q": "As opposed to the simple DoS attacks that usually are performed from a single system, a DDoS attack uses multiple compromised computer systems to perform the attack against its target.", "type": "bool", "options": ["True", "False"], "correct": [0], "exp": "DDoS uses multiple compromised systems, unlike single-source DoS.", "id": "c2aq1q6"}, {"q": "What is the name of the default macOS file system optimized for SSDs and encryption?", "type": "single", "options": ["ReFS", "HFS+", "EFS", "APFS"], "correct": [3], "exp": "APFS is the default macOS file system optimized for SSDs/encryption.", "id": "c2aq1q7"}, {"q": "Which technology uses biometric data to identify or verify a person based on their facial features?", "type": "single", "options": ["VAM", "BRS", "FRT", "AFIS"], "correct": [2], "exp": "FRT (Facial Recognition Technology) identifies by facial features.", "id": "c2aq1q8"}, {"q": "Which Windows feature prompts for elevation to perform tasks with administrative privileges?", "type": "single", "options": ["ACL", "GPO", "UAC", "LUA"], "correct": [2], "exp": "UAC prompts for elevation to perform admin tasks.", "id": "c2aq1q9"}, {"q": "A type of authentication mechanism that generates one-time passwords based on the current time and a secret key is known as:", "type": "single", "options": ["OAuth", "TOTP", "RADIUS", "HOTP"], "correct": [1], "exp": "TOTP generates time-based one-time passwords.", "id": "c2aq1q10"}, {"q": "Which of the acronyms listed below refers to a backup rotation scheme?", "type": "single", "options": ["VTL", "RPO", "GFS", "LTO"], "correct": [2], "exp": "GFS (Grandfather-Father-Son) is a backup rotation scheme.", "id": "c2aq1q11"}, {"q": "Which of the following characteristics apply to the standard GPT partitioning scheme in Windows? (Select 3 answers)", "type": "multi", "options": ["Support for disks larger than 2 TB", "Overall number of partitions limited to 4", "Native UEFI compatibility", "Support for up to 128 partitions", "Native compatibility with Legacy BIOS", "Maximum disk size limit of 2 TB"], "correct": [0, 2, 3], "exp": "GPT supports disks over 2 TB, is UEFI-native, and allows up to 128 partitions.", "id": "c2aq1q12"}, {"q": "In GPT disk architecture, each partition is labeled with a unique identifier known as GUID.", "type": "bool", "options": ["True", "False"], "correct": [0], "exp": "GPT labels each partition with a unique GUID.", "id": "c2aq1q13"}, {"q": "A computer's primary storage media (main system memory) used for quick access to working data and code is referred to as:", "type": "single", "options": ["ROM", "SSD", "EPROM", "RAM"], "correct": [3], "exp": "RAM is the primary storage for quick working data/code access.", "id": "c2aq1q14"}, {"q": "Which of the answers listed below refers to a dedicated programming language used in database management?", "type": "single", "options": ["PHP", "C", "SQL", "JS"], "correct": [2], "exp": "SQL is the dedicated database management language.", "id": "c2aq1q15"}, {"q": "Which of the following acronyms refers to any type of information pertaining to an individual that can be used to uniquely identify that person?", "type": "single", "options": ["PHI", "PIV", "PII", "PKI"], "correct": [2], "exp": "PII uniquely identifies an individual.", "id": "c2aq1q16"}, {"q": "What is the primary function of SMS?", "type": "single", "options": ["Enhanced messaging services", "Multimedia messaging services", "Text messaging services", "Rich communication services"], "correct": [2], "exp": "SMS provides text messaging services.", "id": "c2aq1q17"}, {"q": "What is the name of a Windows management shell that provides an interface for hosting administrative tools known as snap-ins?", "type": "single", "options": ["SDK", "MMC", "API", ".NET"], "correct": [1], "exp": "MMC hosts administrative snap-ins.", "id": "c2aq1q18"}, {"q": "Which of the cryptographic algorithms listed below is considered the strongest by modern security standards?", "type": "single", "options": ["AES", "DES", "RC4", "3DES"], "correct": [0], "exp": "AES is the strongest of the listed algorithms by modern standards.", "id": "c2aq1q19"}, {"q": "Which type of memory is specifically designed to store image and video data for fast access by the graphics processor?", "type": "single", "options": ["DRAM", "VRAM", "ROM", "SRAM"], "correct": [1], "exp": "VRAM stores image/video data for fast GPU access.", "id": "c2aq1q20"}, {"q": "Whic
