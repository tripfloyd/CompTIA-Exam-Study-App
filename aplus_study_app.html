 data", "Device storage nearing full capacity", "Insufficient memory"], "correct": [1, 4], "exp": "Heavy CPU load and insufficient memory are the most direct causes of slow app launches.", "id": "t21q9"}, {"q": "Wireless connectivity issues can be caused by physical obstructions and electronic interference. Dense objects like heavy household items or large appliances can weaken Wi-Fi signals, especially when using the 5 GHz frequency, which has a shorter range and weaker penetration through walls and obstacles. Positioning the router in a central, elevated, and open location helps improve coverage. Electronic interference from devices such as microwaves, cordless phones, or Bluetooth equipment can disrupt signals, particularly on the 2.4 GHz band. In such cases, switching to the 5 GHz band or selecting a less congested wireless channel can help reduce interference and improve connection stability.", "type": "bool", "options": ["True", "False"], "correct": [0], "exp": "This accurately describes obstruction/interference effects on 2.4 GHz vs 5 GHz and typical remedies.", "id": "t21q10"}, {"q": "When troubleshooting intermittent wireless connectivity, what tool can a technician use to measure signal strength and detect potential dead zones?", "type": "single", "options": ["Bandwidth tester", "Power level controls", "Wi-Fi analyzer", "Network mapper"], "correct": [2], "exp": "A Wi-Fi analyzer measures signal strength and detects dead zones.", "id": "t21q11"}, {"q": "A user's laptop connects to the wireless network, but the connection is unstable and frequently drops, even after forcing reconnection and restarting the system. Other nearby devices on the same network are functioning normally. Which action should the technician take to resolve the problem?", "type": "single", "options": ["Scan the laptop for malware and viruses", "Check the router's logs for unusual activity", "Update or reinstall the laptop's wireless adapter driver", "Connect to a different Wi-Fi network"], "correct": [2], "exp": "Since only this laptop is affected, its wireless adapter driver is the most likely culprit.", "id": "t21q12"}, {"q": "Which troubleshooting steps can help resolve intermittent wireless connectivity caused by external interference? (Select 2 answers)", "type": "multi", "options": ["Restarting the wireless access point", "Disabling SSID broadcast", "Reducing the number of connected devices", "Switching frequency bands", "Changing the wireless channel"], "correct": [3, 4], "exp": "Switching frequency bands or changing channels are the direct fixes for external interference.", "id": "t21q13"}, {"q": "During a network performance audit, a technician observes that several wired workstations are consistently negotiating connections at 100 Mbps, despite having Gigabit Ethernet NICs and being connected to a Gigabit switch. What is the most probable physical layer cause for this speed limitation?", "type": "single", "options": ["Outdated firmware on the network switch", "Excessive network traffic causing congestion", "Older cabling type not supporting higher transfer rates", "Switch port speed manually set to 100 Mbps"], "correct": [2], "exp": "Older (e.g. Cat5) cabling not rated for Gigabit speeds is the most likely physical-layer cause.", "id": "t21q14"}, {"q": "Which symptoms are most likely to indicate that slow network speeds are caused by network congestion rather than a hardware or software issue? (Select 2 answers)", "type": "multi", "options": ["The issue occurs intermittently without a clear pattern", "The slowness affects only one specific device", "The issue results from throttling imposed by the ISP", "The slowness is noticeable across multiple devices", "The issue occurs during specific, busy periods"], "correct": [3, 4], "exp": "Slowness across multiple devices during busy periods points to network congestion, not a device-specific issue.", "id": "t21q15"}, {"q": "A user notices their online gaming experience suffers from high network latency and lag spikes. What common internal factors on their computer could explain these symptoms, particularly if they have many installed programs? (Select 2 answers)", "type": "multi", "options": ["Internal hardware components are overheating, causing frame drops", "Ongoing background processes or updates are slowing down the network connection", "Remote game servers are overloaded with high traffic", "Video graphics options in game are set way above recommended settings for optimal performance", "Other, currently active applications are consuming bandwidth"], "correct": [1, 4], "exp": "Background processes/updates and other bandwidth-consuming apps are common internal causes of lag.", "id": "t21q16"}, {"q": "What is the most likely cause of limited network connectivity if a Windows machine is assigned an IP address in the 169.254.x.x range?", "type": "single", "options": ["DNS", "DHCP", "NAT", "DDoS"], "correct": [1], "exp": "A 169.254.x.x APIPA address means the machine failed to reach a DHCP server.", "id": "t21q17"}, {"q": "An administrator is troubleshooting a computer showing \"Limited Connectivity.\" The network icon in the Windows taskbar displays an \"X\" symbol, indicating no active network connection. Which of the actions listed below should the administrator take first? (Select 2 answers)", "type": "multi", "options": ["Renew the IP address via command line", "Verify the network adapter status", "Run the built-in network diagnostics tool", "Check the physical network connection", "Update the network adapter driver"], "correct": [1, 3], "exp": "Verify the adapter status and check the physical connection first — the simplest likely causes.", "id": "t21q18"}, {"q": "A network admin can successfully ping a remote host by its IP address but cannot do so by its domain name. What is the most probable cause of this issue?", "type": "single", "options": ["NIC", "ICMP", "DNS", "DHCP"], "correct": [2], "exp": "Working by IP but not by name points to a DNS resolution problem.", "id": "t21q19"}, {"q": "What is jitter in the context of network performance?", "type": "single", "options": ["Loss of data packets", "Signal attenuation", "Variation in packet delay", "Packet fragmentation"], "correct": [2], "exp": "Jitter is variation in packet delay over time.", "id": "t21q20"}, {"q": "Which network application types are most sensitive to jitter?", "type": "single", "options": ["Web browsing", "Email", "File transfer", "Real-time"], "correct": [3], "exp": "Real-time applications (voice/video) are most sensitive to jitter.", "id": "t21q21"}, {"q": "During a VoIP call, a user hears their own voice echoing back to them with a slight delay. Which network performance issue is this symptom most indicative of?", "type": "single", "options": ["High latency", "Jitter", "Packet loss", "Audio syncing"], "correct": [0], "exp": "Delayed echo of one's own voice is a classic sign of high latency.", "id": "t21q22"}, {"q": "What is the most likely cause of choppy or distorted audio during a VoIP call?", "type": "single", "options": ["Outdated VoIP software", "Jitter", "Faulty microphone hardware", "Corrupted audio codec"], "correct": [1], "exp": "Jitter (inconsistent packet timing) commonly causes choppy/distorted VoIP audio.", "id": "t21q23"}, {"q": "What is the primary purpose of a jitter buffer in VoIP systems?", "type": "single", "options": ["To compress audio data", "To improve call stability", "To reduce packet loss", "To even out packet delays"], "correct": [3], "exp": "A jitter buffer smooths out inconsistent packet arrival delays.", "id": "t21q24"}, {"q": "Port flapping refers to a condition where a network port light rapidly alternates between up and down states, with the status LED blinking erratically as it continuously loses and regains connection.", "type": "bool", "options": ["True", "False"], "correct": [0], "exp": "That's an accurate description of port flapping behavior.", "id": "t21q25"}]}, {"id": "test22", "label": "Test 22", "questions": [{"q": "Which of the following answers refer to the primary causes of port flapping? (Select 2 answers)", "type": "multi", "options": ["Mismatched speed and duplex settings", "Outdated device firmware", "Excessive traffic on a network device", "Loose, faulty, or unsupported network cabling", "Incorrect network topology design"], "correct": [0, 3], "exp": "Mismatched speed/duplex settings and bad/loose cabling are the primary causes of port flapping.", "id": "t22q1"}, {"q": "Which network issues are directly linked to port flapping? (Select 2 answers)", "type": "multi", "options": ["Intermittent connectivity", "Degraded data transfer speeds", "High network latency", "Permanent loss of connectivity", "Excessive bandwidth usage"], "correct": [0, 1], "exp": "Port flapping causes intermittent connectivity and degraded transfer speeds, not permanent loss.", "id": "t22q2"}, {"q": "What is the recommended first step when troubleshooting port flapping?", "type": "single", "options": ["Check physical connections", "Restart the device", "Disable all unused physical ports", "Update the device's firmware"], "correct": [0], "exp": "Check physical connections/cabling first — the most common cause.", "id": "t22q3"}, {"q": "What condition may lead to increased latency on a network?", "type": "single", "options": ["Network congestion due to excessive traffic", "Physical distance between the sender and receiver of data", "Wireless interference and signal degradation", "Outdated or inefficient network hardware", "All of the above"], "correct": [4], "exp": "Congestion, distance, interference, and old hardware can all increase latency — all of the above.", "id": "t22q4"}, {"q": "Which of the solutions listed below has no direct impact on decreasing network latency?", "type": "single", "options": ["Using wired connections instead of wireless when possible", "Reducing network congestion", "Implementing VLANs to segment network traffic", "Reducing physical distance between network devices", "Upgrading hardware and infrastructure"], "correct": [2], "exp": "VLANs segment traffic logically but don't directly reduce latency the way the other options do.", "id": "t22q5"}, {"q": "Which type of network cabling is most susceptible to external interference?", "type": "single", "options": ["UTP", "STP", "Fiber optic", "Coaxial"], "correct": [0], "exp": "UTP is unshielded, making it the most susceptible to external interference.", "id": "t22q6"}, {"q": "Which network cabling provides immunity against external interference?", "type": "single", "options": ["UTP", "STP", "Fiber optic", "Coaxial"], "correct": [2], "exp": "Fiber optic uses light, making it immune to electromagnetic interference.", "id": "t22q7"}, {"q": "For a wireless client to successfully connect and authenticate to a Wi-Fi network, the security type (e.g., WEP, WPA, WPA2, or WPA3) and encryption type (e.g., TKIP or AES) settings on the connecting host must match the corresponding wireless security settings on a WAP.", "type": "bool", "options": ["True", "False"], "correct": [0], "exp": "Security/encryption settings must match between client and WAP to authenticate successfully.", "id": "t22q8"}, {"q": "Which of the following can result in an authentication failure even if the username and password are typed correctly?", "type": "single", "options": ["Expired user password", "User account locked out", "Disabled or deleted user account", "Time synchronization issues", "All of the above"], "correct": [4], "exp": "Expired passwords, locked/disabled accounts, and time sync issues can all cause auth failures — all of the above.", "id": "t22q9"}, {"q": "A technician is called to a small office where users are experiencing random Internet connection drops. Network cabling has been checked and confirmed intact, ping tests to the local gateway remain successful during outages. Router/switch pass diagnostics, but the router's admin logs show repeated signal loss on the WAN side. What is the most appropriate next step?", "type": "single", "options": ["Restart the router", "Modify firewall rules on the router", "Run Internet speed test", "Contact the ISP"], "correct": [3], "exp": "Since local equipment checks out and the WAN side shows signal loss, the issue is upstream — contact the ISP.", "id": "t22q10"}, {"q": "In laser printing, vertical lines appearing on each output page indicate a problem related to the:", "type": "single", "options": ["Imaging drum", "Printer driver", "Fuser unit", "Printhead nozzles"], "correct": [0], "exp": "Vertical lines on laser printouts usually indicate a scratched/damaged imaging drum.", "id": "t22q11"}, {"q": "Which of the troubleshooting steps listed below would resolve vertical lines on the output pages of an inkjet printer?", "type": "single", "options": ["Replacing the imaging drum", "Updating printer drivers", "Cleaning printheads", "Replacing the toner cartridge"], "correct": [2], "exp": "Cleaning the printhead resolves vertical line issues on inkjet printers.", "id": "t22q12"}, {"q": "Garbled characters on printed pages typically indicate a problem with how the printer receives or interprets data — faulty/outdated drivers, corrupted print jobs, communication errors, mismatched PDLs, or formatting issues.", "type": "bool", "options": ["True", "False"], "correct": [0], "exp": "Garbled output is typically a data interpretation issue: drivers, corrupted jobs, PDL mismatch, etc.", "id": "t22q13"}, {"q": "Which of the following issues is least likely to contribute to paper jams in printers?", "type": "single", "options": ["Paper path obstructed by foreign objects", "Curled or deformed paper sheets", "Incorrect paper size or type", "High humidity levels affecting paper", "Overloaded paper tray", "Dirty or worn paper pickup rollers", "Incorrect page orientation settings"], "correct": [6], "exp": "Page orientation is a software/formatting setting, not a mechanical cause of paper jams.", "id": "t22q14"}, {"q": "Which of the steps listed below are not considered best practices when clearing printer paper jams? (Select 2 answers)", "type": "multi", "options": ["Open all access doors and trays to gain a clear view of the paper path", "Inspect all areas of the paper path for torn fragments or debris", "Check for worn or dirty paper pickup rollers", "Apply mild force (if necessary) to pull jammed paper in the opposite feed direction", "Keep the printer powered on and try another print job to see if the jam resolves automatically", "Power cycle the printer after clearing jam to reset sensors"], "correct": [3, 4], "exp": "Forcing paper backward and printing through a jam can damage the printer — both are bad practice.", "id": "t22q15"}, {"q": "Which of the following answers refers to a common cause of faded printouts in a laser printer?", "type": "single", "options": ["Near-empty ink cartridges", "Dried ink buildup in printhead nozzles", "Low or uneven toner levels", "Misaligned printheads"], "correct": [2], "exp": "Low or uneven toner levels are a common cause of faded laser printouts.", "id": "t22q16"}, {"q": "Which of the issues listed below are common causes of faded printouts in inkjet printers? (Select 2 answers)", "type": "multi", "options": ["Incorrect toner density", "Worn-out drum unit", "Low ink levels", "Insufficient fuser heat", "Clogged printhead nozzles"], "correct": [2, 4], "exp": "Low ink levels and clogged printhead nozzles are common causes of faded inkjet output.", "id": "t22q17"}, {"q": "Which of the following can cause paper not feeding in a printer? (Select all that apply)", "type": "multi", "options": ["Overloaded paper tray", "Foreign objects or paper debris in the paper path", "Worn or dirty paper feed rollers", "Corrupted print spooler", "Paper quality or type issues"], "correct": [0, 1, 2, 4], "exp": "Overloaded trays, debris, worn rollers, and paper quality issues are mechanical causes of feed failures.", "id": "t22q18"}, {"q": "A user reports that their printer is frequently pulling two or more sheets of paper at once, leading to jams or blank pages mixed with printed ones. What should a technician check for to resolve the problem?", "type": "single", "options": ["Paper quality issues", "Worn or faulty separation pad", "Overfilled paper tray", "Worn or dirty pickup rollers", "Humidity affecting paper", "All of the above"], "correct": [5], "exp": "Multi-sheet feeding can stem from any of these causes — all of the above.", "id": "t22q19"}, {"q": "A user reports that several documents are stuck in the print queue and not printing. What should a technician try first?", "type": "single", "options": ["Clear all print jobs from the queue", "Verify the network connection status", "Check for paper jams in the printer", "Restart the print spooler service"], "correct": [3], "exp": "Restarting the print spooler service is the standard first fix for a stuck print queue.", "id": "t22q20"}, {"q": "What are the most common causes of speckling on printed pages in a laser printer? (Select 3 answers)", "type": "multi", "options": ["Leaking toner cartridge", "Paper dust, debris, or excess toner buildup", "Contaminated or faulty imaging drum", "Partially clogged or dirty printhead nozzles", "Defective ink cartridge"], "correct": [0, 1, 2], "exp": "A leaking cartridge, debris/toner buildup, and a faulty drum are the common laser speckling causes.", "id": "t22q21"}, {"q": "An office inkjet printer is leaving small, dark spots appearing randomly across each printout page. What are the most probable causes of this issue? (Select 3 answers)", "type": "multi", "options": ["Defective toner cartridge", "Excess paper dust, debris, or ink residue on the paper path", "Partial blockages or dirt in printhead nozzles", "Leaking ink cartridge", "Dirty or damaged drum unit"], "correct": [1, 2, 3], "exp": "Debris on the paper path, clogged nozzles, and a leaking ink cartridge are the likely inkjet causes.", "id": "t22q22"}, {"q": "In laser printers, double or echo images on the printed page are often caused by a residual latent image on the imaging drum being reused during the same print cycle. Check the drum for wear/toner buildup, verify fuser temperature/bonding, and replace faulty components.", "type": "bool", "options": ["True", "False"], "correct": [0], "exp": "Residual drum images causing echo/double prints, checked via drum wear and fuser temperature, is accurate.", "id": "t22q23"}, {"q": "In an inkjet printer, which issues are commonly associated with a grinding noise? (Select 3 answers)", "type": "multi", "options": ["Worn, damaged or misaligned paper feed rollers", "Small paper pieces or foreign objects stuck in the paper path", "Printhead carriage mechanism malfunctions (e.g., misaligned or obstructed carriage)", "Worn or damaged gears and bearings affecting the drum unit", "Faulty or worn fuser rollers and bearings"], "correct": [0, 1, 2], "exp": "Worn feed rollers, debris in the paper path, and carriage mechanism issues commonly cause grinding in inkjets.", "id": "t22q24"}, {"q": "Which possible issues should a technician investigate when a grinding noise is heard during laser printer operation? (Select all that apply)", "type": "multi", "options": ["Malfunctioning or obstructed printhead carriage", "Faulty or worn fuser rollers and bearings", "Worn or damaged gears and bearings affecting the imaging drum assembly", "Small foreign objects or paper pieces stuck in the paper path", "Improperly aligned, worn, or faulty paper feed rollers"], "correct": [1, 2, 3, 4], "exp": "Worn fuser rollers, drum gear/bearing wear, foreign debris, and feed roller issues are laser printer grinding causes (no printhead carriage in laser printers).", "id": "t22q25"}, {"q": "On the CompTIA A+ exam, \"Finishing issues\" refers to post-printing problems like stapling/hole-punching. Staple jams are solved by manually removing jammed staples; hole-punch waste containers need periodic emptying. Placement of staples/holes is adjusted via printer software.", "type": "bool", "options": ["True", "False"], "correct": [0], "exp": "That's an accurate description of printer \"finishing\" features and how to maintain them.", "id": "t22q26"}, {"q": "Which of the print configuration options listed below would be the best place to verify default page orientation settings?", "type": "single", "options": ["Printer driver settings", "Application settings", "Print dialog options", "Printer utility settings"], "correct": [0], "exp": "Default page orientation is set in the printer driver settings.", "id": "t22q27"}, {"q": "Which of the following is the least likely cause of a printer failing to recognize a paper tray?", "type": "single", "options": ["A dirty or malfunctioning paper tray sensor", "Use of lower-grade, inexpensive, or recycled paper", "Printer settings that do not match the paper type or size", "Unseated or improperly inserted paper tray"], "correct": [1], "exp": "Paper grade affects print quality, not whether the printer recognizes the tray itself.", "id": "t22q28"}, {"q": "Which of the actions listed below would be of help when troubleshooting connectivity issues related to a network printer?", "type": "single", "options": ["Verify physical connections (cables, power)", "Restart devices (printer, router/modem, computer)", "Check firewall settings on the computer and network", "Update printer drivers to the latest version", "Check the printer's IP configuration settings", "Uninstall/reinstall printer software on the computer", "All of the above"], "correct": [6], "exp": "All of these are valid network printer troubleshooting steps — all of the above.", "id": "t22q29"}, {"q": "Which of the following actions is least likely to solve the problem of a frozen print queue on a printer?", "type": "single", "options": ["Restart the Print Spooler service", "Manually cancel all pending jobs in the printer settings", "Power cycle the computer and/or printer", "Update or reinstall the printer driver/software", "Change the printer's default output tray"], "correct": [4], "exp": "Changing the default output tray has nothing to do with a frozen print queue.", "id": "t22q30"}]}], "acronym_quizzes": [{"id": "quiz1", "label": "Quiz 1", "questions": [{"q": "Which main hardware component of a computer is responsible for executing instructions and processing data?", "type": "single", "options": ["GPU", "ALU", "CPU", "FPU"], "correct": [2], "exp": "The CPU executes instructions and processes data.", "id": "aq1q1"}, {"q": "A cyberattack focused on making a website, service, or network unavailable to users by overloading it with traffic or malicious requests is referred to as:", "type": "single", "options": ["SQLi", "XSS", "DoS", "CSRF"], "correct": [2], "exp": "A DoS (Denial of Service) attack overwhelms a target to make it unavailable.", "id": "aq1q2"}, {"q": "What is the name of a network protocol that secures web traffic via SSL/TLS encryption?", "type": "single", "options": ["IPSec", "SSH", "HTTPS", "VPN"], "correct": [2], "exp": "HTTPS secures web traffic using SSL/TLS.", "id": "aq1q3"}, {"q": "A legal contract between the holder of confidential information and another person to whom that information is disclosed restricting that other person from disclosing the confidential information to any other party is known as:", "type": "single", "options": ["ISA", "NDA", "BPA", "SLA"], "correct": [1], "exp": "An NDA (Non-Disclosure Agreement) restricts disclosure of confidential information.", "id": "aq1q4"}, {"q": "Which wireless technology enables identification and tracking of tags attached to objects?", "type": "single", "options": ["WTLS", "GPS", "NFC", "RFID"], "correct": [3], "exp": "RFID identifies and tracks tags attached to objects.", "id": "aq1q5"}, {"q": "A type of cryptographic network protocol for secure data communication, remote command-line login, remote command execution, and other secure network services between two networked computers is called:", "type": "single", "options": ["RSH", "RDP", "VNC", "SSH"], "correct": [3], "exp": "SSH is the cryptographic protocol for secure remote login/command execution.", "id": "aq1q6"}, {"q": "Which acronym refers to the network name visible to users when they look for available Wi-Fi networks?", "type": "single", "options": ["ESS", "SSID", "BSS", "BSSID"], "correct": [1], "exp": "SSID is the visible network name for a Wi-Fi network.", "id": "aq1q7"}, {"q": "What is the common term for a group of protocols used to carry voice data over a packet-switched network?", "type": "single", "options": ["ISDN", "PBX", "VoIP", "PSTN"], "correct": [2], "exp": "VoIP carries voice over packet-switched (IP) networks.", "id": "aq1q8"}, {"q": "A computer network connecting multiple LANs over an area of a city is referred to as:", "type": "single", "options": ["PAN", "SAN", "MAN", "CAN"], "correct": [2], "exp": "A MAN spans a city, connecting multiple LANs.", "id": "aq1q9"}, {"q": "LDAP is an example of:", "type": "single", "options": ["Data encryption protocol", "Address resolution protocol", "Directory access protocol", "File exchange protocol"], "correct": [2], "exp": "LDAP is a directory access protocol.", "id": "aq1q10"}, {"q": "What is the name of a network layer protocol that specifies the format of packets and addressing scheme in network communications?", "type": "single", "options": ["UDP", "IP", "TCP", "NetBIOS"], "correct": [1], "exp": "IP defines packet format and addressing at the network layer.", "id": "aq1q11"}, {"q": "Which digital media interface provides the capability for transmission of both video and audio data?", "type": "single", "options": ["S/PDIF", "DVI", "VGA", "HDMI"], "correct": [3], "exp": "HDMI carries both video and audio data.", "id": "aq1q12"}, {"q": "Which of the following acronyms refers to a set of rules that specify which users or system processes are granted access to objects as well as what operations are allowed on a given object?", "type": "single", "options": ["ACL", "MFA", "NAC", "AUP"], "correct": [0], "exp": "An ACL (Access Control List) specifies who can access an object and what they can do.", "id": "aq1q13"}, {"q": "TCP is a connection-oriented network protocol using a three-way handshake which is a set of initial steps required for establishing network connection. TCP supports retransmission of lost packets, flow control (managing the amount of data that is being sent), and sequencing (rearranging packets that arrived out of order). Example applications of TCP include transmission of text and image data.", "type": "bool", "options": ["True", "False"], "correct": [0], "exp": "This correctly describes TCP's connection-oriented, reliable behavior.", "id": "aq1q14"}, {"q": "A type of smart card used in mobile phones to identify the client is known as:", "type": "single", "options": ["IMSI", "SIM", "IMEI", "eSIM"], "correct": [1], "exp": "A SIM card identifies the subscriber/client in a mobile phone.", "id": "aq1q15"}, {"q": "Which part of the AAA security architecture ensures that users are who they claim to be, typically through credentials like passwords or biometrics?", "type": "single", "options": ["Auditing", "Authentication", "Authorization", "Accounting"], "correct": [1], "exp": "Authentication verifies identity claims.", "id": "aq1q16"}, {"q": "Which of the answers listed below refers to a system containing mappings of domain names to various types of data, such as numerical IP addresses?", "type": "single", "options": ["TCP/IP", "DNS", "SQL", "DHCP"], "correct": [1], "exp": "DNS maps domain names to IP addresses and other data.", "id": "aq1q17"}, {"q": "Which of the following devices combines printing, scanning, copying, and often faxing into a single unit? (Select the best answer)", "type": "single", "options": ["MFD", "AIO", "DMS", "MFP"], "correct": [3], "exp": "An MFP (Multi-Function Printer) combines print/scan/copy/fax in one device.", "id": "aq1q18"}, {"q": "An internal hardware component that converts electrical power from an outlet into usable power for a computer's internal parts is called:", "type": "single", "options": ["SVC", "UPS", "VRM", "PSU"], "correct": [3], "exp": "The PSU converts outlet power into usable power for internal components.", "id": "aq1q19"}, {"q": "Which type of software acts as an intermediary between users and computer hardware, enabling both system operations and application execution?", "type": "single", "options": ["API", "BIOS", "OS", "GUI"], "correct": [2], "exp": "The OS is the intermediary between users/applications and hardware.", "id": "aq1q20"}, {"q": "Which of the acronyms listed below refers to a network protocol for secure file transfer over SSH?", "type": "single", "options": ["FTPS", "SFTP", "FTP", "TFTP"], "correct": [1], "exp": "SFTP transfers files securely over SSH.", "id": "aq1q21"}, {"q": "What is the primary purpose of S.M.A.R.T. in a storage media drive?", "type": "single", "options": ["Automatic correction of detected drive errors", "Real-time monitoring and regulation of power consumption", "Prediction and reporting of impending drive failures", "Optimization of drive read/write speeds"], "correct": [2], "exp": "S.M.A.R.T. predicts and reports impending drive failures.", "id": "aq1q22"}, {"q": "A solution that allows to supply electricity over standard Ethernet cables is referred to as:", "type": "single", "options": ["PLC", "ECP", "PoE", "EPP"], "correct": [2], "exp": "PoE (Power over Ethernet) delivers power over standard Ethernet cabling.", "id": "aq1q23"}, {"q": "IMAP is used for:", "type": "single", "options": ["Serving web pages", "Translating domain names into IP addresses", "Retrieving email messages from a mail server", "Sending email messages"], "correct": [2], "exp": "IMAP retrieves email from a mail server.", "id": "aq1q24"}, {"q": "A dedicated data storage solution that combines multiple disk drive components into a single logical unit to increase volume size, performance, or reliability is known as:", "type": "single", "options": ["SAN", "RAID", "NAS", "JBOD"], "correct": [1], "exp": "RAID combines multiple disks into one logical unit for capacity, performance, or redundancy.", "id": "aq1q25"}]}, {"id": "quiz2", "label": "Quiz 2", "questions": [{"q": "A computer's primary storage media used for quick access to working data and code is known as:", "type": "single", "options": ["GPR", "RAM", "FPR", "ROM"], "correct": [1], "exp": "RAM is the primary storage for quick access to working data/code.", "id": "aq2q1"}, {"q": "Which of the following answers refers to a unique 48-bit address assigned to every network adapter?", "type": "single", "options": ["EUI", "SSID", "IP", "MAC"], "correct": [3], "exp": "A MAC address is the unique 48-bit hardware address of a network adapter.", "id": "aq2q2"}, {"q": "What is the function of FTP?", "type": "single", "options": ["Email service", "Directory access", "Serving of web pages", "File exchange"], "correct": [3], "exp": "FTP is used for file exchange.", "id": "aq2q3"}, {"q": "Which of the terms listed below is used to describe a mechanical data storage medium type that relies on magnetic plates and moving parts for data storage and retrieval?", "type": "single", "options": ["HDD", "SD", "ROM", "SSD"], "correct": [0], "exp": "An HDD uses magnetic plates and moving parts for storage.", "id": "aq2q4"}, {"q": "What is the name of a hardware device that allows for administering multiple hosts with the use of a single mouse, keyboard, and computer screen?", "type": "single", "options": ["MFD", "KVM", "MMC", "UTM"], "correct": [1], "exp": "A KVM switch lets one keyboard/video/mouse control multiple hosts.", "id": "aq2q5"}, {"q": "Which technology uses infrared light waves to enable short-range wireless communication, often found in remote controls?", "type": "single", "options": ["NFC", "IR", "Wi-Fi", "RF"], "correct": [1], "exp": "IR (infrared) is used in remote controls for short-range wireless communication.", "id": "aq2q6"}, {"q": "PCIe is a high-speed, serial expansion bus designed as a replacement for PCI, PCI-X, and AGP standards.", "type": "bool", "options": ["True", "False"], "correct": [0], "exp": "PCIe replaced PCI, PCI-X, and AGP as the standard expansion bus.", "id": "aq2q7"}, {"q": "A type of firmware interface designed as a replacement for traditional BIOS is called:", "type": "single", "options": ["UEFI", "GUI", "ACPI", "CMOS"], "correct": [0], "exp": "UEFI is the modern replacement for traditional BIOS.", "id": "aq2q8"}, {"q": "Which of the following acronyms refers to a general-purpose computing device designed for individual use?", "type": "single", "options": ["MFD", "PDA", "PC", "PED"], "correct": [2], "exp": "A PC is a general-purpose computing device for individual use.", "id": "aq2q9"}, {"q": "What is the most common motherboard form factor used in desktop PCs?", "type": "single", "options": ["ATX", "mATX", "ITX", "mITX"], "correct": [0], "exp": "ATX is the most common desktop motherboard form factor.", "id": "aq2q10"}, {"q": "Which of the cryptographic algorithms listed below is the least vulnerable to attacks?", "type": "single", "options": ["AES", "DES", "RC4", "3DES"], "correct": [0], "exp": "AES is the strongest/least vulnerable of the listed algorithms.", "id": "aq2q11"}, {"q": "A type of limited-range computer network used for data transmission among various types of personal devices is referred to as:", "type": "single", "options": ["PAN", "LAN", "SAN", "MAN"], "correct": [0], "exp": "A PAN connects personal devices over a limited range.", "id": "aq2q12"}, {"q": "Which type of firmware performs initial hardware checks after the computer is powered on?", "type": "single", "options": ["CMOS", "ROM", "BIOS", "EPROM"], "correct": [2], "exp": "BIOS performs POST (initial hardware checks) after power-on.", "id": "aq2q13"}, {"q": "A mobile device deployment model that allows employees to use private mobile devices for accessing the company's restricted data and applications is known as:", "type": "single", "options": ["COPE", "BYOD", "JBOD", "CYOD"], "correct": [1], "exp": "BYOD lets employees use personal devices for company access.", "id": "aq2q14"}, {"q": "Which of the following terms refers to a common PnP interface that allows a PC to communicate with peripherals and other devices?", "type": "single", "options": ["PCIe", "IDE", "USB", "eSATA"], "correct": [2], "exp": "USB is the common plug-and-play interface for peripherals.", "id": "aq2q15"}, {"q": "Antistatic bags, antistatic wrist straps, and ground mats are all countermeasures used to protect computer and communications equipment components against:", "type": "single", "options": ["RFI", "ESD", "EFT", "EMI"], "correct": [1], "exp": "These are all ESD (electrostatic discharge) protection measures.", "id": "aq2q16"}, {"q": "APIPA allows a Windows host to self-configure an IPv4 address and subnet mask when a DHCP server is unavailable. APIPA uses the address block range from 169.254.0.0 to 169.254.255.255. APIPA-assigned addresses are valid only for communication within the network segment to which the host is connected. A host with an APIPA-assigned address cannot connect to the Internet.", "type": "bool", "options": ["True", "False"], "correct": [0], "exp": "APIPA self-assigns a local-only 169.254.x.x address when DHCP is unreachable.", "id": "aq2q17"}, {"q": "In the AAA security architecture, the process of tracking user activity and resource usage for reporting or billing is called:", "type": "single", "options": ["Authentication", "Auditing", "Accounting", "Authorization"], "correct": [2], "exp": "Accounting tracks resource usage/activity for reporting or billing.", "id": "aq2q18"}, {"q": "Which of the answers listed below refers to one of the major CPU manufacturers for PCs?", "type": "single", "options": ["ASUS", "nVidia", "AMD", "EVGA"], "correct": [2], "exp": "AMD is one of the two major PC CPU manufacturers.", "id": "aq2q19"}, {"q": "Which hardware component in a PC stores BIOS/UEFI configuration settings and retains them using battery power?", "type": "single", "options": ["CMOS", "SRAM", "ROM", "EEPROM"], "correct": [0], "exp": "CMOS stores BIOS/UEFI settings, retained via battery power.", "id": "aq2q20"}, {"q": "Which of the following acronyms refers to an agreement that specifies performance requirements for a vendor?", "type": "single", "options": ["MSA", "SLA", "MOU", "SOW"], "correct": [1], "exp": "An SLA specifies performance requirements for a vendor/service.", "id": "aq2q21"}, {"q": "A type of network connecting computers within a small geographical area such as a building or group of buildings is referred to as:", "type": "single", "options": ["PAN", "LAN", "MAN", "WAN"], "correct": [1], "exp": "A LAN covers a small geographic area like a building.", "id": "aq2q22"}, {"q": "Which of the answers listed below refers to a display technology most commonly used in modern laptops?", "type": "single", "options": ["CRT", "OLED", "LCD", "HDR"], "correct": [2], "exp": "LCD is the most common display technology in modern laptops.", "id": "aq2q23"}, {"q": "Which cloud service model would provide the best solution for a web developer intending to create a web app?", "type": "single", "options": ["XaaS", "SaaS", "PaaS", "IaaS"], "correct": [2], "exp": "PaaS provides a platform for developers to build/deploy web apps.", "id": "aq2q24"}, {"q": "Which network protocol is used to retrieve content from a web server?", "type": "single", "options": ["CIFS", "FTP", "SSH", "HTTP"], "correct": [3], "exp": "HTTP retrieves content from a web server.", "id": "aq2q25"}]}, {"id": "quiz3", "label": "Quiz 3", "questions": [{"q": "Which of the following is an MS Windows component that enables encryption of individual files?", "type": "single", "options": ["EFS", "TPM", "DFS", "AES"], "correct": [0], "exp": "EFS (Encrypting File System) encrypts individual files in Windows.", "id": "aq3q1"}, {"q": "Which technology allows a physical network to be divided into multiple logical broadcast domains for better segmentation and management?", "type": "single", "options": ["VPN", "DMZ", "VLAN", "WAN"], "correct": [2], "exp": "VLANs divide a physical network into logical broadcast domains.", "id": "aq3q2"}, {"q": "Which MFP feature optimizes the processing of multi-page documents?", "type": "single", "options": ["ALU", "API", "ASIC", "ADF"], "correct": [3], "exp": "An ADF (Automatic Document Feeder) optimizes multi-page document handling.", "id": "aq3q3"}, {"q": "A cloud computing service model offering remote access to applications based on monthly or annual subscription fee is referred to as:", "type": "single", "options": ["PaaS", "SaaS", "IaaS", "DaaS"], "correct": [1], "exp": "SaaS offers subscription-based remote access to applications.", "id": "aq3q4"}, {"q": "Which of the acronyms listed below refers to a network of interconnected devices equipped with sensors (such as wearable tech or home automation devices) that can interact with each other to perform various tasks and functions?", "type": "single", "options": ["ICS", "PAN", "IoT", "SoC"], "correct": [2], "exp": "IoT describes networked sensor-equipped devices interacting together.", "id": "aq3q5"}, {"q": "Which DNS database record maps a domain name to a list of mail servers for that domain?", "type": "single", "options": ["SPF", "NS", "MX", "PTR"], "correct": [2], "exp": "MX records list a domain's mail servers.", "id": "aq3q6"}, {"q": "A network protocol providing an alternative solution to the manual allocation of IP addresses is known as:", "type": "single", "options": ["DNS", "SNMP", "NAT", "DHCP"], "correct": [3], "exp": "DHCP automates IP address allocation.", "id": "aq3q7"}, {"q": "Which of the following terms refers to an older hardware bus standard, now largely deprecated, used to connect peripheral devices directly to a computer's motherboard?", "type": "single", "options": ["PCI", "S/PDIF", "COM", "PS/2"], "correct": [0], "exp": "PCI is the older, largely deprecated hardware bus standard.", "id": "aq3q8"}, {"q": "The term \"SMS\" is used in reference to:", "type": "single", "options": ["Text messaging services", "Enhanced messaging services", "Multimedia messaging services", "Rich communication services"], "correct": [0], "exp": "SMS refers to text messaging services.", "id": "aq3q9"}, {"q": "Which of the answers listed below refer to the RJ11 connector? (Select 3 answers)", "type": "multi", "options": ["Ethernet network cabling", "Telephone equipment", "Fiber-optic cabling", "Coaxial cabling", "Dial-up networking", "Twisted-pair copper cabling"], "correct": [1, 4, 5], "exp": "RJ11 is used for telephone equipment and dial-up networking over twisted-pair copper.", "id": "aq3q10"}, {"q": "What is the most common memory module form factor used in laptops?", "type": "single", "options": ["ECC RAM", "DIMM", "SODIMM", "CRIMM"], "correct": [2], "exp": "SODIMM is the compact laptop RAM module form factor.", "id": "aq3q11"}, {"q": "The backlight technology most commonly used in modern laptops is called:", "type": "single", "options": ["CCFL", "CRT", "OLED", "LED"], "correct": [3], "exp": "LED backlighting is standard in modern laptops.", "id": "aq3q12"}, {"q": "For a wireless client to be able to connect to a network, the security type (e.g., WEP, WPA, WPA2, or WPA3) and encryption type (e.g., TKIP or AES) settings on the connecting host must match the corresponding wireless security settings on a WAP.", "type": "bool", "options": ["True", "False"], "correct": [0], "exp": "Security/encryption settings must match between client and WAP.", "id": "aq3q13"}, {"q": "Which of the following terms refers to a network security solution providing a single point of protection against various types of threats?", "type": "single", "options": ["IDP", "AV", "UTM", "NGFW"], "correct": [2], "exp": "UTM bundles multiple protections into one appliance.", "id": "aq3q14"}, {"q": "Which of the MS Windows features allows users to run programs with the security privileges of another user?", "type": "single", "options": ["OTP", "MMC", "GPO", "UAC"], "correct": [3], "exp": "UAC (User Account Control) manages running programs with elevated privileges.", "id": "aq3q15"}, {"q": "Which of the acronyms listed below refers to software that provides the functionality of a physical computer?", "type": "single", "options": ["SDN", "SaaS", "VM", "SoC"], "correct": [2], "exp": "A VM (virtual machine) provides the functionality of a physical computer.", "id": "aq3q16"}, {"q": "What are the characteristic features of the RJ45 connector? (Select 2 answers)", "type": "multi", "options": ["Fiber-optic cabling", "Coaxial cabling", "Dial-up networking", "Twisted-pair copper cabling", "Telephone equipment", "Ethernet network cabling"], "correct": [3, 5], "exp": "RJ45 is used with twisted-pair copper cabling for Ethernet networking.", "id": "aq3q17"}, {"q": "Which type of memory is specifically designed to store image and video data for fast access by the graphics processor?", "type": "single", "options": ["DRAM", "VRAM", "ROM", "SRAM"], "correct": [1], "exp": "VRAM stores image/video data for fast GPU access.", "id": "aq3q18"}, {"q": "Which of the following answers refers to a software- or hardware-based security solution designed to detect and prevent the unauthorized use or transmission of confidential information?", "type": "single", "options": ["EDR", "DEP", "XDR", "DLP"], "correct": [3], "exp": "DLP (Data Loss Prevention) detects/prevents unauthorized transmission of confidential data.", "id": "aq3q19"}, {"q": "A specialized electronic component that accelerates visual rendering is referred to as:", "type": "single", "options": ["TPU", "GPU", "DSP", "CPU"], "correct": [1], "exp": "The GPU accelerates visual/graphics rendering.", "id": "aq3q20"}, {"q": "Which of the answers listed below refers to a network protocol used for synchronizing clocks over a computer network?", "type": "single", "options": ["NTP", "VTP", "NNTP", "RTP"], "correct": [0], "exp": "NTP synchronizes clocks over a network.", "id": "aq3q21"}, {"q": "SMB is a protocol used for:", "type": "single", "options": ["File and printer sharing between devices on a network", "Collecting diagnostic and monitoring data from networked devices", "Routing network traffic between different subnets", "Managing and allocating IP addresses within a network"], "correct": [0], "exp": "SMB is used for file and printer sharing.", "id": "aq3q22"}, {"q": "Which of the following acronyms refers to a Microsoft-developed file system that provides advanced features including file and folder permissions, encryption, compression, and the ability to handle very large files and partitions?", "type": "single", "options": ["FAT32", "HFS+", "exFAT", "NTFS"], "correct": [3], "exp": "NTFS is Microsoft's advanced file system with permissions, encryption, and compression.", "id": "aq3q23"}, {"q": "In the AAA security architecture, the process of granting or denying access to resources is known as:", "type": "single", "options": ["Authorization", "Accounting", "Auditing", "Authentication"], "correct": [0], "exp": "Authorization grants or denies access to resources.", "id": "aq3q24"}, {"q": "Which of the answers listed below refers to a solution that allows network administrators to prioritize certain types of network traffic?", "type": "single", "options": ["NAC", "QoS", "NAT", "UTM"], "correct": [1], "exp": "QoS (Quality of Service) prioritizes certain network traffic types.", "id": "aq3q25"}]}, {"id": "quiz4", "label": "Quiz 4", "questions": [{"q": "What is the function of POP3?", "type": "single", "options": ["Name resolution", "Sending email messages", "File exchange", "Email retrieval"], "correct": [3], "exp": "POP3 retrieves email from a mail server.", "id": "aq4q1"}, {"q": "Which of the following acronyms refers to a short-range wireless communication technology used for contactless payments and data exchange?", "type": "single", "options": ["BLE", "IR", "RFID", "NFC"], "correct": [3], "exp": "NFC enables short-range contactless payments/data exchange.", "id": "aq4q2"}, {"q": "UDP is an example of a connectionless protocol. Because UDP does not support three-way handshake while establishing a network connection, it is referred to as unreliable or best-effort protocol. Example applications of UDP include transmission of video and audio streaming data.", "type": "bool", "options": ["True", "False"], "correct": [0], "exp": "UDP is indeed connectionless, best-effort, and used for streaming applications.", "id": "aq4q3"}, {"q": "A networking hardware device connecting wireless devices to a wired network is referred to as:", "type": "single", "options": ["WAF", "AP", "RAS", "NIC"], "correct": [1], "exp": "An AP (access point) connects wireless devices to a wired network.", "id": "aq4q4"}, {"q": "Which of the terms listed below refers to a product's life-cycle management phase in which a product is no longer being produced or sold?", "type": "single", "options": ["EOS", "EOF", "EOL", "EOA"], "correct": [2], "exp": "EOL (End of Life) is when a product is no longer produced/sold.", "id": "aq4q5"}, {"q": "What is a PUP? (Select 3 answers)", "type": "multi", "options": ["A type of computer program not explicitly classified as malware by AV software", "An application downloaded and installed without the user's consent (illegal app)", "A type of software that may adversely affect the computer's security and performance, compromise user's privacy, or display unsolicited ads", "An application downloaded and installed with the user's consent, but often without fully informed agreement (typically bundled with other software)", "A type of computer program explicitly classified as malware by AV applications", "A type of free, utility software often bundled with a paid app"], "correct": [0, 2, 3], "exp": "A PUP is unwanted software (privacy/security/ads concerns), not classified as outright malware, usually bundled with user consent that's not fully informed.", "id": "aq4q6"}, {"q": "Which metric might be of help in diagnosing the declining performance of a storage drive?", "type": "single", "options": ["PPM", "MTBF", "RPM", "IOPS"], "correct": [3], "exp": "IOPS helps diagnose declining storage drive performance.", "id": "aq4q7"}, {"q": "Which of the following answers refers to a computer's hardware component designed for enabling network access?", "type": "single", "options": ["CPU", "PSU", "NIC", "GPU"], "correct": [2], "exp": "A NIC enables network access.", "id": "aq4q8"}, {"q": "Which type of software allows centralized control over the configuration, monitoring, and security of mobile devices used within an organization?", "type": "single", "options": ["MDR", "IAM", "SIEM", "MDM"], "correct": [3], "exp": "MDM centrally manages configuration/monitoring/security of mobile devices.", "id": "aq4q9"}, {"q": "A type of network consisting of computers and peripheral devices that use high-frequency radio waves to communicate with each other is known as:", "type": "single", "options": ["EPN", "WLAN", "WAN", "PAN"], "correct": [1], "exp": "A WLAN uses radio waves to network devices.", "id": "aq4q10"}, {"q": "Which of the terms listed below refers to a cloud computing service model in which clients, instead of buying all the hardware and software, purchase computing resources as an outsourced service from suppliers who own and maintain all the necessary equipment and software?", "type": "single", "options": ["SaaS", "DaaS", "PaaS", "IaaS"], "correct": [3], "exp": "IaaS provides outsourced computing infrastructure.", "id": "aq4q11"}, {"q": "A Microsoft-proprietary protocol providing a user with graphical interface for connecting to another networked host is called:", "type": "single", "options": ["VDI", "RDP", "SSH", "VNC"], "correct": [1], "exp": "RDP provides Microsoft's proprietary graphical remote connection.", "id": "aq4q12"}, {"q": "Which WAN technology takes advantage of cell towers that provide wireless signal coverage for mobile devices?", "type": "single", "options": ["WiMAX", "WMN", "ATM", "WWAN"], "correct": [3], "exp": "WWAN uses cell towers to provide wireless WAN coverage.", "id": "aq4q13"}, {"q": "Which of the following answers refers to an analog video interface standard commonly used for connecting computer monitors before digital connections?", "type": "single", "options": ["XGA", "HDMI", "VGA", "DVI-I"], "correct": [2], "exp": "VGA is the older analog video interface standard.", "id": "aq4q14"}, {"q": "Which technology uses biometric data to identify or verify a person based on their facial features?", "type": "single", "options": ["VAM", "IRIS", "FRT", "AFIS"], "correct": [2], "exp": "FRT (Facial Recognition Technology) identifies people by facial features.", "id": "aq4q15"}, {"q": "An MS Windows stop error is informally referred to as:", "type": "single", "options": ["BYOD", "JBOD", "BSoD", "DDoS"], "correct": [2], "exp": "A Windows stop error is informally called the BSoD (Blue Screen of Death).", "id": "aq4q16"}, {"q": "Which of the acronyms listed below refers to a security standard introduced to address the vulnerabilities found in WEP?", "type": "single", "options": ["TKIP", "AES", "WPA", "CCMP"], "correct": [2], "exp": "WPA was introduced to address WEP's vulnerabilities.", "id": "aq4q17"}, {"q": "ECC type RAM:", "type": "single", "options": ["Can only detect errors, but does not have the capability to correct them", "Refers to parity RAM (the two terms are interchangeable)", "Offers better performance in terms of speed when compared to a non-ECC type of RAM", "Can detect and correct errors"], "correct": [3], "exp": "ECC RAM can both detect and correct data errors.", "id": "aq4q18"}, {"q": "Which of the following terms refers to a global standard development organization composed of different national standards bodies?", "type": "single", "options": ["NIST", "ISO", "IEEE", "ANSI"], "correct": [1], "exp": "ISO is the global standards body composed of national standards organizations.", "id": "aq4q19"}, {"q": "A dedicated local network consisting of devices providing data access is known as:", "type": "single", "options": ["SDN", "NAS", "iSCSI", "SAN"], "correct": [3], "exp": "A SAN is a dedicated network for centralized data access.", "id": "aq4q20"}, {"q": "As opposed to the simple DoS attacks that usually are performed from a single system, a DDoS attack uses multiple compromised computer systems to perform the attack against its target.", "type": "bool", "options": ["True", "False"], "correct": [0], "exp": "DDoS uses multiple compromised systems, unlike a single-source DoS attack.", "id": "aq4q21"}, {"q": "Which of the answers listed below refers to a dedicated programming language used in database management?", "type": "single", "options": ["PHP", "C", "SQL", "JS"], "correct": [2], "exp": "SQL is the dedicated database management language.", "id": "aq4q22"}, {"q": "A system that uses a public network (such as the Internet) as a means for creating private encrypted connections between remote locations is called:", "type": "single", "options": ["WWAN", "VPN", "PAN", "VLAN"], "correct": [1], "exp": "A VPN creates private encrypted connections over a public network.", "id": "aq4q23"}, {"q": "The SMTP protocol is used for: (Select 2 answers)", "type": "multi", "options": ["Sending email messages between mail servers", "Name resolution services", "Serving of web pages", "Retrieving email messages from mail servers", "Sending email messages from a client device"], "correct": [0, 4], "exp": "SMTP handles outgoing mail: client submission and server-to-server relay.", "id": "aq4q24"}, {"q": "An authentication subsystem that enables a user to access multiple, connected system components (such as separate hosts on a network) after a single login on only one of the components is referred to as:", "type": "single", "options": ["NAC", "SSO", "AAA", "MFA"], "correct": [1], "exp": "SSO (Single Sign-On) lets one login grant access to multiple connected systems.", "id": "aq4q25"}]}, {"id": "quiz5", "label": "Quiz 5", "questions": [{"q": "Which of the following answers refers to a file system developed by Apple for use in its operating systems?", "type": "single", "options": ["XFS", "APFS", "EFS", "CIFS"], "correct": [1], "exp": "APFS is Apple's file system.", "id": "aq5q1"}, {"q": "A type of LAN used in small business environments is referred to as:", "type": "single", "options": ["BAN", "SOHO", "MWN", "WLAN"], "correct": [1], "exp": "SOHO (Small Office/Home Office) describes small business LAN environments.", "id": "aq5q2"}, {"q": "Which cyberattack involves impersonating a legitimate business contact via email to trick employees into harmful actions such as transferring funds or sharing sensitive information?", "type": "single", "options": ["XSS", "CSRF", "APT", "BEC"], "correct": [3], "exp": "BEC (Business Email Compromise) impersonates a contact to trick employees.", "id": "aq5q3"}, {"q": "Which DVI connector type does not provide support for analog signal transmission?", "type": "single", "options": ["DVI-D", "DVI-A", "DVI-I", "DVI-A/D"], "correct": [0], "exp": "DVI-D is digital-only, no analog support.", "id": "aq5q4"}, {"q": "Adding an eSATA device to a PC can be done either by attaching the device cable directly to the motherboard's integrated I/O panel, connecting it via eSATA port on a modular bracket, or attaching it directly to a dedicated slot on the motherboard.", "type": "bool", "options": ["True", "False"], "correct": [1], "exp": "eSATA connects via I/O panel or bracket port, not a dedicated internal motherboard slot.", "id": "aq5q5"}, {"q": "Which of the acronyms listed below refers to a backup rotation scheme?", "type": "single", "options": ["LIFO", "GFS", "EFS", "FIFO"], "correct": [1], "exp": "GFS (Grandfather-Father-Son) is a common backup rotation scheme.", "id": "aq5q6"}, {"q": "A type of document stipulating rules of behavior to be followed by users of computers, networks, and associated resources is known as:", "type": "single", "options": ["SLA", "EULA", "AUP", "BPA"], "correct": [2], "exp": "An AUP (Acceptable Use Policy) stipulates rules for using computers/networks.", "id": "aq5q7"}, {"q": "What are the characteristic features of an OLED display? (Select 3 answers)", "type": "multi", "options": ["Works without backlight", "Inferior contrast ratio and color representation in comparison to LCDs", "Lower light output (brightness) in comparison to LCDs", "Display type commonly used in modern laptop devices", "Better contrast ratio and color representation in comparison to LCDs", "Requires backlight to illuminate the screen", "Lower cost in comparison to LCDs", "Higher light output (brightness) in comparison to LCDs"], "correct": [0, 2, 4], "exp": "OLED works without a backlight, has lower peak brightness than LCD, but better contrast/color representation.", "id": "aq5q8"}, {"q": "Which of the AAA solutions listed below relies on TCP, separates authentication, authorization, and accounting, and is commonly used for device administration in enterprise networks?", "type": "single", "options": ["OAuth", "TACACS+", "SAML", "RADIUS"], "correct": [1], "exp": "TACACS+ uses TCP, separates AAA functions, used for device admin.", "id": "aq5q9"}, {"q": "What is the function of a DNS TXT record? (Select 2 answers)", "type": "multi", "options": ["Resolves an IP address to a hostname for reverse lookups", "Maps a domain name to a list of mail servers for that domain", "Used to store text-based data associated with a domain", "Not used to direct any traffic", "Allows multiple domain names to resolve to the same IP address"], "correct": [2, 3], "exp": "TXT records store arbitrary text data and don't direct traffic themselves.", "id": "aq5q10"}, {"q": "A type of ISP offering Internet access to subscribers at a designated wireless hotspot is called:", "type": "single", "options": ["NSP", "WISP", "TSP", "NaaS"], "correct": [1], "exp": "A WISP provides wireless Internet access at hotspots.", "id": "aq5q11"}, {"q": "Which of the following answers refers to the diagnostic test a computer performs immediately after powering on to check hardware functionality?", "type": "single", "options": ["BIT", "POST", "CRC", "MBIST"], "correct": [1], "exp": "POST checks hardware functionality immediately after power-on.", "id": "aq5q12"}, {"q": "Which DVI connector type does not provide support for digital signal transmission?", "type": "single", "options": ["DVI-D", "DVI-A", "DVI-I", "DVI-A/D"], "correct": [1], "exp": "DVI-A is analog-only, no digital support.", "id": "aq5q13"}, {"q": "Which of the following characteristics describe the LC fiber-optic connector? (Select 3 answers)", "type": "multi", "options": ["Large cylindrical shape", "Common in older networks and multimode fiber setups", "Bayonet twist-and-lock mechanism", "Latch locking mechanism similar to RJ-45 connectors", "Common in high-density network environments like data centers", "Small form factor connector"], "correct": [3, 4, 5], "exp": "LC connectors are small form factor, RJ-45-like latching, common in high-density data centers.", "id": "aq5q14"}, {"q": "What are the characteristic features of IPS? (Select 3 answers)", "type": "multi", "options": ["High color quality", "Fast response times", "Wide viewing angles", "Low color quality", "Slow response times", "Low viewing angles"], "correct": [0, 2, 4], "exp": "IPS panels offer high color quality, wide viewing angles, but slower response times.", "id": "aq5q15"}, {"q": "A rule-based access control mechanism implemented on routers, switches, and firewalls is referred to as:", "type": "single", "options": ["MAC", "AUP", "DAC", "ACL"], "correct": [3], "exp": "An ACL is the rule-based access control mechanism on network devices.", "id": "aq5q16"}, {"q": "Which of the answers listed below refers to a set of parallel interface standards designed for connecting peripheral devices?", "type": "single", "options": ["SCSI", "NVMe", "SATA", "PCIe"], "correct": [0], "exp": "SCSI is the parallel interface standard for peripherals.", "id": "aq5q17"}, {"q": "Which of the following terms describes the remote delivery of a wide range of computing services, including software, platforms, and infrastructure?", "type": "single", "options": ["AaaS", "FaaS", "XaaS", "EaaS"], "correct": [2], "exp": "XaaS (Anything as a Service) covers the broad delivery of computing services.", "id": "aq5q18"}, {"q": "A mobile device's built-in functionality enabling the usage of locator applications is known as:", "type": "single", "options": ["IMSI", "GSM", "IMEI", "GPS"], "correct": [3], "exp": "GPS enables locator app functionality.", "id": "aq5q19"}, {"q": "The DVI-I connector type provides support for both digital and analog video signal transmission.", "type": "bool", "options": ["True", "False"], "correct": [0], "exp": "DVI-I supports both digital and analog signals.", "id": "aq5q20"}, {"q": "Which of the acronyms listed below refers to a page description language developed to control printer features and manage document printing?", "type": "single", "options": ["LPD", "IPP", "PCL", "LPR"], "correct": [2], "exp": "PCL is a page description language for printer control.", "id": "aq5q21"}, {"q": "Which type of RAM features separate electrical contacts on each side of the module?", "type": "single", "options": ["SRAM", "DIMM", "DRAM", "SIMM"], "correct": [1], "exp": "DIMM modules have separate contacts on each side.", "id": "aq5q22"}, {"q": "A computer network connecting multiple smaller networks over very large geographical areas is called:", "type": "single", "options": ["MAN", "WLAN", "SAN", "WAN"], "correct": [3], "exp": "A WAN connects networks across large geographic areas.", "id": "aq5q23"}, {"q": "A network admin can ping remote host by its IP address, but not by its domain name. Which of the following is the most probable source of this problem?", "type": "single", "options": ["ICMP", "DNS", "HTTP", "DHCP"], "correct": [1], "exp": "Working by IP but not by name indicates a DNS problem.", "id": "aq5q24"}, {"q": "Which of the answers listed below refer to IMAP? (Select 2 answers)", "type": "multi", "options": ["Offers improved functionality in comparison to POP3", "Serves the same function as POP3", "Enables sending email messages from client devices", "Offers less functions than POP3", "Enables email exchange between mail servers"], "correct": [0, 1], "exp": "IMAP retrieves email like POP3 but with more functionality (multi-device sync).", "id": "aq5q25"}]}, {"id": "quiz6", "label": "Quiz 6", "questions": [{"q": "Which of the following answers describe characteristic features of DSL? (Select 3 answers)", "type": "multi", "options": ["Leased lines", "Copper cabling", "Telephone lines", "Fiber-optic cabling", "Last mile solutions", "WAN links"], "correct": [1, 2, 4], "exp": "DSL runs over copper telephone lines and is a common last-mile solution.", "id": "aq6q1"}, {"q": "An agreement granting the right to use a software application in a manner determined by the software vendor is referred to as:", "type": "single", "options": ["AUP", "ToS", "EULA", "SLA"], "correct": [2], "exp": "A EULA governs the terms of using a software application.", "id": "aq6q2"}, {"q": "Which of the answers listed below refers to a secure replacement for Telnet?", "type": "single", "options": ["RDP", "RSH", "SSH", "VNC"], "correct": [2], "exp": "SSH is the secure replacement for Telnet.", "id": "aq6q3"}, {"q": "Which DNS database record type allows multiple domain names to resolve to the same IP address?", "type": "single", "options": ["MX", "CNAME", "AAAA", "PTR"], "correct": [1], "exp": "CNAME records alias domain names to the same target.", "id": "aq6q4"}, {"q": "Which of the following file systems is known for its 4 GB maximum file size and 2 TB maximum volume size limitations?", "type": "single", "options": ["NTFS", "FAT32", "NFS", "exFAT"], "correct": [1], "exp": "FAT32 has a 4 GB max file size and 2 TB max volume limitation.", "id": "aq6q5"}, {"q": "What are the characteristics of GPT? (Select 3 answers)", "type": "multi", "options": ["Support for disks larger than 2 TB", "Overall number of partitions limited to 4", "Legacy BIOS", "Up 128 primary partitions", "UEFI BIOS", "Maximum disk size limit of 2 TB"], "correct": [0, 3, 4], "exp": "GPT supports disks over 2 TB, up to 128 partitions, and pairs with UEFI BIOS.", "id": "aq6q6"}, {"q": "Which of the acronyms listed below refers to a unique string of characters used to identify hardware, software, and data?", "type": "single", "options": ["OID", "GUID", "URI", "OUI"], "correct": [1], "exp": "A GUID is a unique identifier for hardware, software, or data.", "id": "aq6q7"}, {"q": "An agreement between a service provider and users defining the nature, availability, quality, and scope of the service to be provided is known as:", "type": "single", "options": ["SOW", "MSA", "SLA", "MOU"], "correct": [2], "exp": "An SLA defines service nature, availability, quality, and scope.", "id": "aq6q8"}, {"q": "Which of the following terms refers to a solution used for authentication, authorization, and user identity management within an organization?", "type": "single", "options": ["CIA", "IAM", "AAA", "ICS"], "correct": [1], "exp": "IAM manages authentication, authorization, and identity within an org.", "id": "aq6q9"}, {"q": "IPS, TN, VA, and OLED are all implementations of LCD display technology.", "type": "bool", "options": ["True", "False"], "correct": [1], "exp": "IPS/TN/VA are LCD types, but OLED is a distinct, non-LCD technology.", "id": "aq6q10"}, {"q": "Which type of fiber-optic equipment can be found at a demarc?", "type": "single", "options": ["MDI", "IDF", "ONT", "MDF"], "correct": [2], "exp": "An ONT sits at the fiber demarcation point.", "id": "aq6q11"}, {"q": "What are the characteristic features of the BNC connector? (Select 3 answers)", "type": "multi", "options": ["Bayonet-style (twist-and-lock) connector", "Twisted-pair copper cabling", "Professional audio and video equipment, CCTV systems, laboratory, and testing equipment", "Coaxial cabling", "Satellite/cable TV, broadband Internet connections via cable modems", "Threaded (screw-on) connector"], "correct": [0, 2, 3], "exp": "BNC is a bayonet twist-lock coaxial connector used in pro AV/CCTV/lab equipment.", "id": "aq6q12"}, {"q": "A device designed to provide emergency power during an unexpected main power source outage is called:", "type": "single", "options": ["UPS", "PoE", "SVC", "PSU"], "correct": [0], "exp": "A UPS provides emergency backup power during outages.", "id": "aq6q13"}, {"q": "In GPT disk architecture, each partition is labeled with a unique identifier known as GUID.", "type": "bool", "options": ["True", "False"], "correct": [0], "exp": "GPT labels each partition with a unique GUID.", "id": "aq6q14"}, {"q": "Which of the answers listed below refers to a proprietary line of low-power, small form factor motherboards designed for industrial and embedded PC applications?", "type": "single", "options": ["NLX", "ITX", "ATX", "LPX"], "correct": [1], "exp": "ITX is the low-power, small form factor board for embedded/industrial use.", "id": "aq6q15"}, {"q": "A type of control access technology providing protection against copyright infringements is referred to as:", "type": "single", "options": ["OEM", "EULA", "DRM", "AUP"], "correct": [2], "exp": "DRM protects against copyright infringement.", "id": "aq6q16"}, {"q": "Which of the following acronyms refers to a security vulnerability that allows attackers to inject malicious scripts into web pages viewed by other users?", "type": "single", "options": ["CSRF", "XSS", "SQLi", "XSRF"], "correct": [1], "exp": "XSS (Cross-Site Scripting) injects malicious scripts into web pages.", "id": "aq6q17"}, {"q": "Which AAA solution uses UDP as its transport protocol, combines authentication and authorization, and is commonly deployed for network access control such as VPNs and Wi-Fi authentication?", "type": "single", "options": ["RADIUS", "LDAP", "TACACS+", "Kerberos"], "correct": [0], "exp": "RADIUS uses UDP and combines authN/authZ for VPN/Wi-Fi access control.", "id": "aq6q18"}, {"q": "Which of the terms listed below best applies to the authentication process?", "type": "single", "options": ["UAC", "SSO", "ACL", "MFA"], "correct": [3], "exp": "MFA (Multi-Factor Authentication) is directly part of the authentication process.", "id": "aq6q19"}, {"q": "A Microsoft-proprietary file system optimized for flash drives is known as:", "type": "single", "options": ["FAT32", "NFS", "exFAT", "CDFS"], "correct": [2], "exp": "exFAT is Microsoft's file system optimized for flash drives.", "id": "aq6q20"}, {"q": "What are the characteristic features of SMB/CIFS? (Select 2 answers)", "type": "multi", "options": ["Optimized for secure file sharing over the Internet", "Primarily used in Microsoft Windows environments", "Used to provide shared access to files, directories, and devices", "Intended for voice and multimedia communication over IP networks", "Designed for Linux-based environments"], "correct": [1, 2], "exp": "SMB/CIFS is native to Windows and provides shared access to files/directories/devices.", "id": "aq6q21"}, {"q": "Which of the following answers refers to an older, portable device SSD form factor superseded by M.2?", "type": "single", "options": ["SATA", "NVMe", "mSATA", "PCIe"], "correct": [2], "exp": "mSATA was the older compact SSD form factor superseded by M.2.", "id": "aq6q22"}, {"q": "What are the characteristic features of the ST fiber-optic connector? (Select 3 answers)", "type": "multi", "options": ["Bayonet twist-and-lock mechanism", "Common in high-density network environments like data centers", "Large cylindrical shape", "Common in older networks and multimode fiber setups", "Small form factor connector", "Latch locking mechanism similar to RJ-45 connectors"], "correct": [0, 2, 3], "exp": "ST connectors use a bayonet twist-lock, have a larger cylindrical shape, common in older/multimode setups.", "id": "aq6q23"}, {"q": "Which of the terms listed below refers to the concept of ephemeral access, where temporary code is used to verify user identity?", "type": "single", "options": ["OTP", "CAPTCHA", "SSO", "HMAC"], "correct": [0], "exp": "An OTP (One-Time Password) is temporary code used for identity verification.", "id": "aq6q24"}, {"q": "Which of the following acronyms refers to a document that outlines safety information, hazards, and handling instructions for chemicals or materials?", "type": "single", "options": ["EPA", "MSDS", "MSRP", "SOP"], "correct": [1], "exp": "An MSDS (Material Safety Data Sheet) outlines chemical/material safety information.", "id": "aq6q25"}]}, {"id": "quiz7", "label": "Quiz 7", "questions": [{"q": "Which of the following characteristics apply to the type of RAM most commonly used as the main system memory in desktop PCs? (Select 2 answers)", "type": "multi", "options": ["SODIMM", "Non-ECC memory", "Static RAM", "MicroDIMM", "Dynamic RAM", "ECC memory"], "correct": [1, 4], "exp": "Desktop main memory is typically non-ECC DRAM.", "id": "aq7q1"}, {"q": "In older, non-UEFI-based PCs, the first sector of a storage drive containing information about partitions and a piece of executable code used to load the installed OS is referred to as:", "type": "single", "options": ["MBR", "GPT", "LBA", "GUID"], "correct": [0], "exp": "The MBR is the first sector containing partition info and boot code on legacy BIOS systems.", "id": "aq7q2"}, {"q": "Which type of legal agreement involves a mutual obligation between parties to protect shared confidential information from unauthorized disclosure?", "type": "single", "options": ["MNDA", "SLA", "MSA", "EULA"], "correct": [0], "exp": "An MNDA (Mutual NDA) involves mutual obligations to protect shared confidential info.", "id": "aq7q3"}, {"q": "Which of the answers listed below describe the SC fiber-optic connector? (Select 2 answers)", "type": "multi", "options": ["Widely used in datacom and telecom applications", "Latch locking mechanism similar to RJ-45 connectors", "Bayonet twist-and-lock mechanism", "Push-pull locking mechanism for easy insertion and removal", "Common in older networks and multimode fiber setups"], "correct": [0, 3], "exp": "SC connectors are widely used in datacom/telecom, with a push-pull locking mechanism.", "id": "aq7q4"}, {"q": "Which non-proprietary remote-access protocol enables control over another computer on the network with the use of GUI?", "type": "single", "options": ["VTP", "VRF", "VTC", "VNC"], "correct": [3], "exp": "VNC is the non-proprietary GUI remote access protocol.", "id": "aq7q5"}, {"q": "Which of the following acronyms refers to a video or display resolution standard that defines high-quality image resolutions, primarily in formats such as 720p and 1080p?", "type": "single", "options": ["HD", "QHD", "SD", "UHD"], "correct": [0], "exp": "HD (High Definition) covers 720p/1080p resolution standards.", "id": "aq7q6"}, {"q": "Which of the answers listed below refers to an API that enables communication between hosts on a LAN?", "type": "single", "options": ["DNS", "TCP/IP", "NetBIOS", "DHCP"], "correct": [2], "exp": "NetBIOS is the API for LAN host communication.", "id": "aq7q7"}, {"q": "The VA display technology can be characterized by: (Select 3 answers)", "type": "multi", "options": ["High contrast ratios", "Low color quality", "Good viewing angles", "Low contrast ratios", "Good color quality", "Low viewing angles"], "correct": [0, 2, 4], "exp": "VA panels offer high contrast ratios, good viewing angles, and good color quality.", "id": "aq7q8"}, {"q": "Which type of RAM transfers data on both the rising and falling edges of the clock signal?", "type": "single", "options": ["SDR", "DDR", "QDR", "ODR"], "correct": [1], "exp": "DDR (Double Data Rate) transfers on both clock edges.", "id": "aq7q9"}, {"q": "Which of the following terms refers to an embedded microcontroller used for secure boot, disk encryption, and system integrity verification?", "type": "single", "options": ["TPM", "SoC", "UEFI", "HSM"], "correct": [0], "exp": "TPM provides secure boot, disk encryption keys, and integrity verification.", "id": "aq7q10"}, {"q": "Which of the acronyms listed below refers to the primary color model used in electronic displays, digital imaging, and screen-based color reproduction?", "type": "single", "options": ["HSV", "RGB", "CMYK", "LAB"], "correct": [1], "exp": "RGB is the primary color model for electronic displays.", "id": "aq7q11"}, {"q": "A type of customizable framework providing access to a collection of system tools designed to manage networks, computers, services, and other system components in MS Windows is known as:", "type": "single", "options": ["SDK", "MMC", "API", ".NET"], "correct": [1], "exp": "MMC (Microsoft Management Console) is the customizable Windows system management framework.", "id": "aq7q12"}, {"q": "Which of the following refers to a Microsoft file system specifically designed for maximum resilience, data integrity, and large-scale storage deployments in enterprise environments?", "type": "single", "options": ["XFS", "Btrfs", "ZFS", "ReFS"], "correct": [3], "exp": "ReFS is Microsoft's resilience-focused enterprise file system.", "id": "aq7q13"}, {"q": "Which Microsoft protocol enables remote command-line management and automation of tasks on Windows-based systems?", "type": "single", "options": ["RDP", "VNC", "WinRM", "ICS"], "correct": [2], "exp": "WinRM enables remote command-line management/automation on Windows.", "id": "aq7q14"}, {"q": "Which of the terms listed below refers to a high-speed serial interface designed specifically for connecting enterprise storage?", "type": "single", "options": ["SAS", "PCIe", "USB", "SATA"], "correct": [0], "exp": "SAS is designed specifically for enterprise storage connections.", "id": "aq7q15"}, {"q": "Which cybersecurity service offers continuous monitoring, threat detection, and response, typically managed by a third party to protect an organization from advanced threats?", "type": "single", "options": ["EDR", "MDR", "IAM", "XDR"], "correct": [1], "exp": "MDR (Managed Detection and Response) is the third-party-managed continuous monitoring service.", "id": "aq7q16"}, {"q": "Which acronym refers to the management of users with elevated privileges on critical systems?", "type": "single", "options": ["OAuth", "IAM", "RBAC", "PAM"], "correct": [3], "exp": "PAM (Privileged Access Management) manages elevated-privilege users.", "id": "aq7q17"}, {"q": "Which of the following answers refers to hardware, often accompanied by software or firmware, designed to provide cryptographic key management and encryption functions?", "type": "single", "options": ["EFS", "HSM", "SFC", "TPM"], "correct": [1], "exp": "An HSM provides dedicated cryptographic key management/encryption hardware.", "id": "aq7q18"}, {"q": "Which acronym refers to a common interface for connecting consumer-level storage devices like hard drives and SSDs?", "type": "single", "options": ["SATA", "USB", "SAS", "PCIe"], "correct": [0], "exp": "SATA is the common consumer-level storage interface.", "id": "aq7q19"}, {"q": "What is the name of a policy framework that allows domain owners to specify how email receivers should handle emails that fail authentication checks?", "type": "single", "options": ["DKIM", "SPF", "PGP", "DMARC"], "correct": [3], "exp": "DMARC tells receivers how to handle messages failing authentication.", "id": "aq7q20"}, {"q": "An authentication mechanism that generates one-time passwords based on the current time and a secret key is called:", "type": "single", "options": ["OAuth", "TOTP", "RADIUS", "HOTP"], "correct": [1], "exp": "TOTP generates time-based one-time passwords.", "id": "aq7q21"}, {"q": "Which of the terms listed below refers to a high-performance file system commonly used in UNIX-like operating systems such as Linux to handle very large files and storage volumes?", "type": "single", "options": ["ReFS", "DFS", "XFS", "exFAT"], "correct": [2], "exp": "XFS is a high-performance Linux/UNIX file system for large files/volumes.", "id": "aq7q22"}, {"q": "What is the name of a DNS TXT record that allows the owner of a domain to specify all the servers authorized to send mail from their domain?", "type": "single", "options": ["DKIM", "SRV", "CNAME", "SPF"], "correct": [3], "exp": "SPF (as a TXT record) specifies authorized mail-sending servers for a domain.", "id": "aq7q23"}, {"q": "Which of the following answers refers to a serial communication copper connector often found on older PCs, networking equipment, and industrial hardware?", "type": "single", "options": ["RG-6", "PS/2", "RG-59", "DB-9"], "correct": [3], "exp": "DB-9 is the older serial communication connector.", "id": "aq7q24"}, {"q": "Which of the answers listed below refer to valid examples of items tracked in a CMDB? (Select 2 answers)", "type": "multi", "options": ["Server hardware", "Log data", "Asset disposal records", "Installed applications", "User passwords"], "correct": [0, 3], "exp": "A CMDB (Configuration Management Database) tracks assets like server hardware and installed applications.", "id": "aq7q25"}]}, {"id": "quiz8", "label": "Quiz 8", "questions": [{"q": "Which of the following wireless encryption protocols was introduced with WPA to replace WEP?", "type": "single", "options": ["AES", "TKIP", "CCMP", "EAP"], "correct": [1], "exp": "TKIP was introduced with WPA to replace WEP's weak encryption.", "id": "aq8q1"}, {"q": "A type of architecture that simplifies networking by allowing devices to dynamically join a network, autoconfigure, and learn about the presence and capabilities of other devices is referred to as:", "type": "single", "options": ["SSDP", "UPnP", "PXE", "BOOTP"], "correct": [1], "exp": "UPnP allows devices to dynamically join, autoconfig
