 output lists each hop, its hostname/IP, and round-trip time — it doesn't total packets sent/received.", "id": "c2t14q24"}, {"q": "A Linux network admin runs traceroute to a remote server. One of the intermediary hops shows * * *, but all subsequent hops display normal response times. What is the most common cause of this outcome?", "type": "single", "options": ["One of the intermediary routers is offline", "The traceroute command failed to execute properly", "Router did not respond within the timeout period", "The entire network path is down"], "correct": [2], "exp": "A * * * hop usually just means that router didn't respond within the timeout, not that the path is broken.", "id": "c2t14q25"}]}, {"id": "test15", "label": "Test 15", "questions": [{"q": "While viewing a man page in Linux, which key advances the display by one full screen at a time?", "type": "single", "options": ["Enter", "Spacebar", "Tab", "Shift"], "correct": [1], "exp": "Spacebar advances a man page by a full screen.", "id": "c2t15q1"}, {"q": "After opening a manual page, a Linux user wants to quit back to the shell prompt. Which key(s) should be pressed?", "type": "single", "options": ["Ctrl+C", "Q", "Esc", "Shift + X"], "correct": [1], "exp": "Pressing Q quits a man page back to the shell.", "id": "c2t15q2"}, {"q": "A Linux system admin wants to view the contents of multiple log files in the terminal. Which command will output the contents of log1.txt followed by log2.txt in the same terminal view?", "type": "single", "options": ["cat log1.txt + log2.txt", "cat log1.txt | log2.txt", "cat log1.txt log2.txt", "cat log1.txt > log2.txt"], "correct": [2], "exp": "cat log1.txt log2.txt outputs both files in sequence to the terminal.", "id": "c2t15q3"}, {"q": "A technician wants to append the contents of notes.txt to the end of log.txt. Which Linux command will add the contents of notes.txt to the bottom of log.txt without overwriting it?", "type": "single", "options": ["cat notes.txt > log.txt", "cat notes.txt + log.txt", "cat notes.txt >> log.txt", "cat notes.txt | log.txt"], "correct": [2], "exp": ">> appends output to a file without overwriting existing content.", "id": "c2t15q4"}, {"q": "A Linux administrator wants to combine the contents of file1.txt and file2.txt into a new file called combined.txt. Which command accomplishes this?", "type": "single", "options": ["cat file1.txt file2.txt > combined.txt", "cat file1.txt + file2.txt = combined.txt", "cat file1.txt file2.txt | combined.txt", "cat file1.txt file2.txt >> combined.txt"], "correct": [0], "exp": "cat file1.txt file2.txt > combined.txt concatenates both files into a new combined file.", "id": "c2t15q5"}, {"q": "A user is running the top command in Linux and notices a process consuming a large amount of CPU resources. Which key should the user press to sort the process list by CPU usage?", "type": "single", "options": ["P", "M", "C", "R"], "correct": [0], "exp": "Pressing P in top sorts the process list by CPU usage.", "id": "c2t15q6"}, {"q": "A Linux technician is viewing processes in top and needs to sort them by RAM usage. In the top interface, which key reorders processes based on memory consumption?", "type": "single", "options": ["R", "C", "P", "M"], "correct": [3], "exp": "Pressing M in top sorts by memory (RAM) usage.", "id": "c2t15q7"}, {"q": "A system administrator is using the top command in Linux and wants to terminate a process with PID 4567. Which key should be pressed within top to initiate this action?", "type": "single", "options": ["X", "R", "T", "K"], "correct": [3], "exp": "Pressing K in top prompts to kill a process by PID.", "id": "c2t15q8"}, {"q": "Which ps command in Linux is used to display a minimal snapshot of processes for the current shell?", "type": "single", "options": ["ps -a", "ps", "ps -e", "ps -f"], "correct": [1], "exp": "Plain ps shows a minimal snapshot of the current shell's processes.", "id": "c2t15q9"}, {"q": "A Linux admin suspects a process running under a system account is causing issues. The administrator needs to see a list of all running processes system-wide, including those not associated with a specific terminal session. What is the most appropriate command to get a complete static list of all processes?", "type": "single", "options": ["ps -f", "ps", "ps -s", "ps -e"], "correct": [3], "exp": "ps -e lists all running processes system-wide.", "id": "c2t15q10"}, {"q": "An administrator needs to identify if a service called \"sshd\" is currently running on a Linux server. The administrator wants to quickly check whether any process contains \"sshd\" in its name. Which command line combination will show only the lines from the process list that contain the \"sshd\" string?", "type": "single", "options": ["ps -e > sshd", "grep sshd ps -e", "ps -e | grep sshd", "sshd | ps -e"], "correct": [2], "exp": "Piping ps -e into grep sshd filters the process list for matching lines.", "id": "c2t15q11"}, {"q": "A Linux user needs to identify which subdirectories under /usr/local are taking up the most space. For better readability, the user wants to view the output values in KBs, MBs, or GBs. Which command should be used?", "type": "single", "options": ["df -h /usr/local", "ls -lh /usr/local", "du -h /usr/local", "df -a /usr/local"], "correct": [2], "exp": "du -h shows directory space usage in human-readable units.", "id": "c2t15q12"}, {"q": "An administrator needs to quickly determine the amount of free and used disk space across all mounted filesystems on a Linux server. The administrator wants the output displayed in an easy-to-read format. What is the most appropriate command to use in this case?", "type": "single", "options": ["du -h", "df -a", "ls -lh", "df -h"], "correct": [3], "exp": "df -h shows filesystem-level free/used space in human-readable format.", "id": "c2t15q13"}, {"q": "A Linux administrator is auditing user accounts for security compliance. The administrator needs to determine password hashes, password aging policies, and expiration data for each account. Which file stores this information?", "type": "single", "options": ["/etc/passwd", "/etc/group", "/etc/shadow", "/etc/sudoers"], "correct": [2], "exp": "/etc/shadow stores password hashes and aging/expiration data.", "id": "c2t15q14"}, {"q": "A Linux system admin is reviewing a user account entry in /etc/passwd. The second field for a user's entry contains the character 'x'. What does the 'x' in this field indicate?", "type": "single", "options": ["The account is disabled", "The user's password hash is stored in /etc/shadow", "The user has a blank password", "The user is not part of a group"], "correct": [1], "exp": "An 'x' in the password field of /etc/passwd means the actual hash lives in /etc/shadow.", "id": "c2t15q15"}, {"q": "An administrator needs to view the list of all user accounts on the Linux system along with their associated information such as user/group ID numbers, home directory, and default shell. Which file should be checked?", "type": "single", "options": ["/etc/shadow", "/etc/group", "/etc/login.defs", "/etc/passwd"], "correct": [3], "exp": "/etc/passwd lists user accounts with UID/GID, home directory, and default shell.", "id": "c2t15q16"}, {"q": "A Linux technician is troubleshooting name resolution and wants to confirm whether a hostname is being resolved from a local static entry rather than DNS. Which file should the technician inspect?", "type": "single", "options": ["/etc/hostname", "/etc/nsswitch.conf", "/etc/hosts", "/etc/resolv.conf"], "correct": [2], "exp": "/etc/hosts contains local static hostname-to-IP entries checked before DNS.", "id": "c2t15q17"}, {"q": "What is the main functional difference between the mount command and the /etc/fstab file in Linux?", "type": "single", "options": ["mount is for local drives; /etc/fstab is for network drives", "mount is for read-only mounts; /etc/fstab is for read/write mounts", "mount creates temporary mounts; /etc/fstab defines mounts that persist across reboots", "mount requires a restart to take effect; /etc/fstab does not"], "correct": [2], "exp": "mount creates a one-time/temporary mount, while /etc/fstab defines mounts that persist across reboots.", "id": "c2t15q18"}, {"q": "During troubleshooting, a Linux admin notices that hostname lookups are failing even though /etc/hosts contains valid entries. Which file determines the DNS servers that should be queried for hostnames not listed in /etc/hosts?", "type": "single", "options": ["/etc/nsswitch.conf", "/etc/network/interfaces", "/etc/resolv.conf", "/etc/hostname"], "correct": [2], "exp": "/etc/resolv.conf specifies which DNS servers to query.", "id": "c2t15q19"}, {"q": "Which of the statements listed correctly describes application compatibility with different CPU architectures?", "type": "single", "options": ["A 32-bit hardware can run both 32-bit and 64-bit applications", "A computer with a 32-bit CPU can run 64-bit applications without compatibility issues", "A 64-bit hardware can run only 64-bit applications", "A computer with a 64-bit CPU can run most 32-bit applications"], "correct": [3], "exp": "64-bit CPUs are typically backward-compatible and can run most 32-bit applications.", "id": "c2t15q20"}, {"q": "Which scenario would most likely allow integrated graphics to be sufficient?", "type": "single", "options": ["High-end gaming", "Web browsing and email", "Professional video editing", "3D rendering"], "correct": [1], "exp": "Basic tasks like web browsing/email don't require dedicated graphics — integrated GPUs handle these fine.", "id": "c2t15q21"}, {"q": "Which factor differentiates a dedicated graphics card from an integrated graphics solution?", "type": "single", "options": ["A dedicated graphics card has its own VRAM", "Integrated graphics uses system RAM", "Dedicated graphics cards deliver higher performance", "All of the above"], "correct": [3], "exp": "Dedicated GPUs have their own VRAM and generally outperform integrated graphics, which shares system RAM — all of the above.", "id": "c2t15q22"}, {"q": "A software download page lists a GPU with at least 4 GB of VRAM as a requirement. Which type of graphics card is needed to fulfill this requirement?", "type": "single", "options": ["Integrated graphics", "Onboard graphics", "Any graphics controller option", "Dedicated graphics card"], "correct": [3], "exp": "Dedicated VRAM requirements point to needing a dedicated graphics card.", "id": "c2t15q23"}, {"q": "A 32-bit operating system typically supports a maximum of:", "type": "single", "options": ["4 GB of RAM", "8 GB of RAM", "16 GB of RAM", "32 GB of RAM"], "correct": [0], "exp": "32-bit OSes are typically capped around 4 GB of addressable RAM.", "id": "c2t15q24"}, {"q": "What is the theoretical limit of addressable RAM for a 64-bit CPU?", "type": "single", "options": ["64 GB", "128 GB", "256 GB", "None of the above"], "correct": [3], "exp": "64-bit addressing's theoretical limit is far beyond these figures (exabytes), so none of the above.", "id": "c2t15q25"}]}, {"id": "test16", "label": "Test 16", "questions": [{"q": "Which of the following terms is commonly used to denote a 32-bit CPU architecture?", "type": "single", "options": ["x32", "x48", "x64", "x86"], "correct": [3], "exp": "x86 refers to 32-bit CPU architecture.", "id": "c2t16q1"}, {"q": "Which of the answers listed below refers to 64-bit CPU architecture?", "type": "single", "options": ["x32", "x48", "x64", "x86"], "correct": [2], "exp": "x64 refers to 64-bit CPU architecture.", "id": "c2t16q2"}, {"q": "The presence of the Program Files (x86) folder on the C: drive in MS Windows indicates that the PC takes advantage of 32-bit architecture and OS version.", "type": "bool", "options": ["True", "False"], "correct": [1], "exp": "That folder actually indicates a 64-bit system, which keeps a separate folder for 32-bit apps.", "id": "c2t16q3"}, {"q": "In certain software licensing models, an application might require the presence of a connected external hardware token before it can run. These devices function as physical license keys, ensuring that the software only operates when the token is attached to the system. Common implementations of external hardware tokens include USB-based dongles or smart cards that must be inserted into a reader.", "type": "bool", "options": ["True", "False"], "correct": [0], "exp": "Hardware dongles/tokens are a real licensing enforcement mechanism.", "id": "c2t16q4"}, {"q": "Computer software installations often require additional disk space beyond the installer size. This extra space supports the expansion of compressed installer archives, creation of temporary files during setup, scratch space for processing, and post-installation growth from logs, caches, and updates.", "type": "bool", "options": ["True", "False"], "correct": [0], "exp": "Installations typically need extra space beyond just the installer file itself.", "id": "c2t16q5"}, {"q": "A user needs to run a legacy accounting application designed for Windows 7 on a Windows 11 PC. Which operating system feature should allow the software to execute on Windows 11?", "type": "single", "options": ["Windows AppLocker", "Windows Sandbox", "Windows Compatibility Mode", "Windows PowerShell"], "correct": [2], "exp": "Compatibility Mode lets older software run properly on newer Windows versions.", "id": "c2t16q6"}, {"q": "Which of the following solutions allows an application designed for a specific operating system to run locally on a device within a different operating system architecture? (Select 2 answers)", "type": "multi", "options": ["Emulator software", "Multiboot environment", "Virtualization", "Application sandboxing", "Compatibility mode"], "correct": [0, 2], "exp": "Emulator software and virtualization both allow apps built for one OS/architecture to run on another.", "id": "c2t16q7"}, {"q": "A 32-bit application is being installed on a 64-bit Windows 11 system. What is the expected behavior?", "type": "single", "options": ["The application will fail to install due to architecture mismatch", "The user will be prompted to switch OS versions to complete the installation", "The application will install and run using WOW64", "The system will create a sandbox environment for the application"], "correct": [2], "exp": "WOW64 lets 32-bit apps run on 64-bit Windows.", "id": "c2t16q8"}, {"q": "Which of the answers listed below refers to a digital representation of an optical disc that can be mounted on an operating system?", "type": "single", "options": ["VHD file", "CUE file", "ISO file", "WIM file"], "correct": [2], "exp": "An ISO file is a mountable digital representation of an optical disc.", "id": "c2t16q9"}, {"q": "One of the ways of confirming that a software application comes from a trusted source is the verification of its digital signature. A digitally signed software proves the identity of the developer and guarantees that the application code has not been tampered with since it was signed. The authenticity and integrity of the application's code can also be verified by comparing results of a cryptographic hash function (original hash published by the application developer vs. hash obtained from a downloaded app).", "type": "bool", "options": ["True", "False"], "correct": [0], "exp": "Digital signatures and hash verification are standard ways to confirm software authenticity/integrity.", "id": "c2t16q10"}, {"q": "A technician configures a reference computer with the operating system, drivers, and applications, then captures this configuration and replicates it to multiple PCs over the network. What is this process called?", "type": "single", "options": ["Network boot", "Remote installation", "Image deployment", "Disk cloning"], "correct": [2], "exp": "Capturing and replicating a reference computer's configuration is image deployment.", "id": "c2t16q11"}, {"q": "When installing a new application, it is essential to consider its potential impact across multiple areas. On the device level, applications may require significant CPU, RAM, GPU, or storage resources, and in some cases external hardware, which can affect overall system performance. From a network perspective, applications that rely on updates, cloud services, or continuous communication may increase bandwidth consumption and impact latency. In terms of operation, software can influence system stability, compatibility with other applications, security posture, and user workflows. Finally, at the business level, factors such as licensing, compliance requirements, productivity, downtime, and data protection must be evaluated to ensure the application aligns with organizational needs.", "type": "bool", "options": ["True", "False"], "correct": [0], "exp": "App installation impact assessment should cover device, network, operational, and business considerations.", "id": "c2t16q12"}, {"q": "A technician is configuring a cloud-based email account for a user. The user needs to access their email from multiple devices and ensure that all changes, such as marking an email as read or moving it to a folder, are synchronized across all devices. Which protocol is the best choice?", "type": "single", "options": ["POP3", "HTTPS", "SMTP", "IMAP4"], "correct": [3], "exp": "IMAP4 keeps mail state synchronized across multiple devices, unlike POP3 which downloads/removes mail.", "id": "c2t16q13"}, {"q": "A user wants only a specific folder from their cloud storage to be available locally on a laptop. What feature controls individual folders that are downloaded for local access?", "type": "single", "options": ["Offline access", "Folder mirroring", "Local caching", "Selective sync"], "correct": [3], "exp": "Selective sync controls which specific folders are downloaded locally from cloud storage.", "id": "c2t16q14"}, {"q": "Cloud-based collaboration platforms often provide multiple integrated tools to support teamwork, including:", "type": "single", "options": ["Instant messaging", "Document editing", "Videoconferencing", "All of the above"], "correct": [3], "exp": "Cloud collaboration platforms typically bundle messaging, document editing, and videoconferencing — all of the above.", "id": "c2t16q15"}, {"q": "Enabling identity synchronization between on-premises systems and cloud services allows users to log in to both with a single set of credentials.", "type": "bool", "options": ["True", "False"], "correct": [0], "exp": "Identity sync enables single sign-on across on-prem and cloud systems with one credential set.", "id": "c2t16q16"}, {"q": "A technician is auditing license usage for a cloud-based application. What tool is typically used to view license assignments and availability?", "type": "single", "options": ["Local user account settings", "Domain controller", "Credential manager software", "Admin dashboard or portal"], "correct": [3], "exp": "An admin dashboard/portal is used to view cloud license assignments and availability.", "id": "c2t16q17"}, {"q": "What is the primary function of bollards as a physical security control?", "type": "single", "options": ["To prevent tailgating through secure areas", "To deter and physically stop vehicle intrusions", "To prevent unauthorized pedestrian entry", "To restrict both people and cars simultaneously"], "correct": [1], "exp": "Bollards are designed to physically stop vehicle intrusions.", "id": "c2t16q18"}, {"q": "An access control vestibule (also known as a mantrap) is a physical security access control system used to prevent unauthorized users from gaining access to restricted areas. An example mantrap could be a two-door entrance point connected to a guard station where an individual entering from the outside remains locked inside until they provide the required authentication token to unlock the inner door.", "type": "bool", "options": ["True", "False"], "correct": [0], "exp": "That's an accurate description of a mantrap/access control vestibule.", "id": "c2t16q19"}, {"q": "A facility implements badge readers at entry doors, requiring staff to present RFID cards to unlock them. This setup is an example of which type of security measure?", "type": "single", "options": ["Logical security control", "Administrative security control", "Physical security control", "Technical security control"], "correct": [2], "exp": "Badge readers/locks are a physical security control.", "id": "c2t16q20"}, {"q": "What type of physical security control does video surveillance represent?", "type": "single", "options": ["Preventive control", "Compensating control", "Detective control", "Corrective control"], "correct": [2], "exp": "Video surveillance is a detective control — it detects/records rather than prevents incidents.", "id": "c2t16q21"}, {"q": "Which physical security measure often works together with motion sensors to provide real-time alerts of unauthorized activity?", "type": "single", "options": ["Proximity readers", "Smart locks", "Perimeter lighting", "Alarm systems"], "correct": [3], "exp": "Alarm systems pair with motion sensors to trigger real-time alerts.", "id": "c2t16q22"}, {"q": "Which of the following security controls are designed to physically prevent unauthorized access? (Select 2 answers)", "type": "multi", "options": ["Motion sensors", "Door locks", "Video surveillance", "Alarm systems", "Equipment locks"], "correct": [1, 4], "exp": "Door locks and equipment locks physically prevent access; sensors/cameras/alarms only detect/alert.", "id": "c2t16q23"}, {"q": "A company wants a physical security control measure that can provide both deterrence and on-site, in-person response to suspicious activity. Which of the solutions listed below should the company implement?", "type": "single", "options": ["CCTV monitoring", "Alarm system with motion sensors", "Security guards", "Intrusion detection system"], "correct": [2], "exp": "Security guards provide both deterrence and an in-person response capability.", "id": "c2t16q24"}, {"q": "A business wants to reduce the likelihood of both unauthorized pedestrian and vehicle access across its entire restricted perimeter. Which physical security control would best serve this purpose?", "type": "single", "options": ["Bollards", "Turnstiles", "Security guards", "Fencing"], "correct": [3], "exp": "Fencing secures an entire perimeter against both pedestrian and vehicle access.", "id": "c2t16q25"}]}, {"id": "test17", "label": "Test 17", "questions": [{"q": "Which of the following answers describe the characteristics of a key fob? (Select 3 answers)", "type": "multi", "options": ["Contains a simple embedded chip with a unique identifier or code", "Often used as a simple, single-purpose physical access security token", "Credit card-sized, flat plastic card", "Multi-purpose use for both physical and logical access, identity, and finance", "Contains an embedded chip that can perform complex functions like encryption and data processing", "Small, portable plastic device, often attached to a keyring"], "correct": [0, 1, 5], "exp": "A key fob has a simple embedded chip/code, is a single-purpose token, and is a small portable device on a keyring.", "id": "c2t17q1"}, {"q": "Which of the features listed below apply to smart cards? (Select 3 answers)", "type": "multi", "options": ["Contains a simple embedded chip with a unique identifier or code", "Small, portable plastic device, often attached to a keyring", "Contains an embedded chip that can perform complex functions like encryption and data processing", "Multi-purpose use for both physical and logical access, identity, and finance", "Often used as a simple, single-purpose physical access security token", "Credit card-sized, flat plastic card"], "correct": [2, 3, 5], "exp": "Smart cards have a complex embedded chip, multi-purpose use, and a credit-card-sized flat form factor.", "id": "c2t17q2"}, {"q": "A technician configures an access control system that allows employees to unlock doors by holding their smartphone near a reader. This technology is an example of what type of security measure?", "type": "single", "options": ["Biometric authentication", "Mobile digital key", "Two-factor authentication", "Hardware security token"], "correct": [1], "exp": "A phone-based unlock system is a mobile digital key.", "id": "c2t17q3"}, {"q": "A locked cabinet with a corresponding sign-out log is a standard procedure to maintain accountability and tracking for:", "type": "single", "options": ["Physical keys", "Key fobs", "Smart cards", "Access badges"], "correct": [0], "exp": "Physical keys are typically tracked with a sign-out log in a locked cabinet.", "id": "c2t17q4"}, {"q": "In IT security, \"Biometrics\" covers physiological (fingerprints, retina, face) and behavioral traits (keystroke dynamics, gait, voice) used for identification and access control.", "type": "bool", "options": ["True", "False"], "correct": [0], "exp": "Biometrics includes both physiological and behavioral traits as described.", "id": "c2t17q5"}, {"q": "A security system uses infrared light to scan the unique pattern of blood vessels at the back of a user's eye to grant access. This is an example of what type of biometric technology?", "type": "single", "options": ["Iris scanner", "Facial recognition technology", "Eye-tracking authentication", "Retina scanner"], "correct": [3], "exp": "Retina scanners read the blood vessel pattern at the back of the eye.", "id": "c2t17q6"}, {"q": "Which biometric technology is widely used for mobile device authentication due to low cost and ease of integration?", "type": "single", "options": ["Fingerprint scanner", "Retina scanner", "Voice recognition", "Palm print scanner"], "correct": [0], "exp": "Fingerprint scanners are cheap and easy to integrate into mobile devices.", "id": "c2t17q7"}, {"q": "A large corporation needs a biometric solution for a restricted server farm. The solution must provide strong security and be difficult to spoof. Of the available options, which physical access control method would be the best choice?", "type": "single", "options": ["Fingerprint scanner", "Voiceprint authentication system", "Facial recognition terminal", "Palm print scanner"], "correct": [3], "exp": "Palm print scanners offer strong, hard-to-spoof security for high-security areas.", "id": "c2t17q8"}, {"q": "Which technology uses biometric data to identify or verify a person based on their facial features?", "type": "single", "options": ["FAR", "AFIS", "FRT", "FRR"], "correct": [2], "exp": "FRT (Facial Recognition Technology) identifies people by facial features.", "id": "c2t17q9"}, {"q": "Voice recognition (or voiceprint recognition) is a biometric authentication method used in physical access security systems to identify or verify individuals based on unique vocal characteristics such as pitch, tone, and speech patterns. A key advantage of this technology is its convenience and ability to be used remotely, enabling secure access without the need for physical contact or additional devices. A key disadvantage is that its accuracy can be affected by background noise, poor audio quality, or changes in a person's voice due to illness or aging. In addition, using a voiceprint as the only form of authentication makes a system vulnerable to replay attacks, where it can be bypassed with a high-quality recording of an authorized user's voice.", "type": "bool", "options": ["True", "False"], "correct": [0], "exp": "This accurately describes voice recognition's advantages and weaknesses (including replay attack risk).", "id": "c2t17q10"}, {"q": "What is the primary role of lighting as a physical access security measure?", "type": "single", "options": ["Detection", "Surveillance", "Prevention", "Deterrence"], "correct": [3], "exp": "Lighting's primary role is deterrence — discouraging intrusion attempts.", "id": "c2t17q11"}, {"q": "In a multi-layered physical security system, where would a magnetometer typically be placed?", "type": "single", "options": ["At the final access point, just before the secure room", "On the perimeter fence to detect intruders", "At the building's main entrance as a primary screening point", "Inside the secure room to prevent theft"], "correct": [2], "exp": "Magnetometers (metal detectors) are typically placed at the main entrance for initial screening.", "id": "c2t17q12"}, {"q": "A security rule that prevents users from accessing information and resources that lie beyond the scope of their responsibilities is referred to as:", "type": "single", "options": ["Implicit deny policy", "Zero Trust model", "Principle of least privilege", "Separation of duties"], "correct": [2], "exp": "The principle of least privilege restricts access to only what's needed for one's role.", "id": "c2t17q13"}, {"q": "Which of the following answers refers to a security approach that eliminates implicit trust from networks requiring all users and devices to be continuously verified before being granted access to resources?", "type": "single", "options": ["Least privilege access", "AAA framework", "Zero Trust model", "Policy-driven access control"], "correct": [2], "exp": "Zero Trust eliminates implicit trust, requiring continuous verification.", "id": "c2t17q14"}, {"q": "Which of the acronyms listed below refers to a logical security rule set that controls access to objects and specifies the operations allowed on a given object?", "type": "single", "options": ["AUP", "SSO", "ACL", "OTP"], "correct": [2], "exp": "An ACL controls access to objects and allowed operations.", "id": "c2t17q15"}, {"q": "Authentication factors: knowledge (\"something you know\"), possession (\"something you have\"), inherence (\"something you are\"), and location (\"somewhere you are\"). MFA requires factors from two or more distinct categories.", "type": "bool", "options": ["True", "False"], "correct": [0], "exp": "This accurately describes the four authentication factor categories and MFA's requirement of using 2+ categories.", "id": "c2t17q16"}, {"q": "After typing in a password, a login system prompts the user to enter a one-time verification code sent to the account's associated inbox. Which MFA method is being used?", "type": "single", "options": ["TOTP", "SMS", "Email", "PIN code"], "correct": [2], "exp": "A code sent to an inbox is the email MFA delivery method.", "id": "c2t17q17"}, {"q": "A technician begins the login process by entering a password. The system detects that the account is configured for multifactor authentication and prompts the technician for a USB-based cryptographic key. What type of MFA device is the technician using?", "type": "single", "options": ["Software token", "OTP display key fob", "Hardware token", "USB flash drive"], "correct": [2], "exp": "A USB cryptographic key is a hardware token.", "id": "c2t17q18"}, {"q": "A technician is troubleshooting a user's failed login attempt. The user states they are using an authenticator application, and the code they entered was incorrect. What is the most likely cause of this issue?", "type": "single", "options": ["The user is not connected to the internet", "The user's phone is set to the wrong time", "The user's password was entered incorrectly", "The MFA service is experiencing an outage"], "correct": [1], "exp": "TOTP codes depend on accurate time sync — an incorrect phone clock causes wrong codes.", "id": "c2t17q19"}, {"q": "After entering a password, a user receives a text message containing a one-time verification code. Which delivery method is being used for the second MFA prompt?", "type": "single", "options": ["PIN code", "Email", "SMS", "TOTP app"], "correct": [2], "exp": "A text message code is the SMS MFA delivery method.", "id": "c2t17q20"}, {"q": "In voice call multifactor authentication, a user receives a one-time verification code or approval prompt through an automated or live telephone call.", "type": "bool", "options": ["True", "False"], "correct": [0], "exp": "Voice call MFA delivers the code/prompt via an automated or live phone call.", "id": "c2t17q21"}, {"q": "Which of the following statements about TOTP is not true?", "type": "single", "options": ["Generated offline using a shared secret and the current time", "Requires time synchronization between client and server", "Its validity does not depend on short, recurring time intervals", "Commonly implemented in authenticator apps and hardware tokens"], "correct": [2], "exp": "TOTP codes ARE tied to short, recurring time intervals — the opposite of what this statement claims.", "id": "c2t17q22"}, {"q": "Which acronym is used to describe a general category of single-use authentication codes?", "type": "single", "options": ["MFA", "PIV", "OTP", "SSO"], "correct": [2], "exp": "OTP (One-Time Password) describes single-use authentication codes.", "id": "c2t17q23"}, {"q": "Which of the following is a markup language used for exchanging authentication and authorization data?", "type": "single", "options": ["OAuth", "XML", "SAML", "XHTML"], "correct": [2], "exp": "SAML is the markup language for exchanging auth/authz data.", "id": "c2t17q24"}, {"q": "An authentication subsystem that enables a user to access multiple, connected system components (such as separate hosts on a network) after a single login on only one of the components is called:", "type": "single", "options": ["NAC", "SSO", "AAA", "MFA"], "correct": [1], "exp": "SSO lets one login grant access to multiple connected systems.", "id": "c2t17q25"}]}, {"id": "test18", "label": "Test 18", "questions": [{"q": "Which of the answers listed below refers to a security measure that grants temporary, on-demand, and limited-time access to privileged accounts?", "type": "single", "options": ["Zero Trust architecture", "Context-based authentication", "Principle of least privilege", "Just-in-time access"], "correct": [3], "exp": "Just-in-time access grants temporary, on-demand privileged access.", "id": "c2t18q1"}, {"q": "Which of the following refers to a cybersecurity tool dedicated to managing, monitoring, and securing access to critical systems and accounts with elevated privileges?", "type": "single", "options": ["OAuth", "IAM", "RBAC", "PAM"], "correct": [3], "exp": "PAM (Privileged Access Management) manages/secures elevated-privilege accounts.", "id": "c2t18q2"}, {"q": "Which type of software provides a solution specifically designed to centrally manage, monitor, and secure mobile devices such as smartphones and tablets?", "type": "single", "options": ["UEM", "EDR", "IAM", "MDM"], "correct": [3], "exp": "MDM centrally manages/monitors/secures mobile devices.", "id": "c2t18q3"}, {"q": "Which of the acronyms listed below refers to a dedicated software or hardware-based security solution designed to detect and prevent unauthorized use and transmission of confidential information?", "type": "single", "options": ["DEP", "IPS", "DLP", "UTM"], "correct": [2], "exp": "DLP detects/prevents unauthorized transmission of confidential data.", "id": "c2t18q4"}, {"q": "Which of the following refers to a comprehensive security framework that manages the entire lifecycle of a digital identity (such as a user account or device) and controls how it can access organizational resources?", "type": "single", "options": ["AAA", "SSO", "RADIUS", "IAM"], "correct": [3], "exp": "IAM manages the full lifecycle of digital identities and their resource access.", "id": "c2t18q5"}, {"q": "What is the primary purpose of a directory service in a network environment?", "type": "single", "options": ["Network file system storage and retrieval", "Hosting and synchronization of data between devices", "Centralized management of users and network objects", "Storage and delivery of web-based content"], "correct": [2], "exp": "A directory service centrally manages users and network objects.", "id": "c2t18q6"}, {"q": "LDAP is an example of:", "type": "single", "options": ["Data encryption protocol", "Address resolution protocol", "Directory access protocol", "File exchange protocol"], "correct": [2], "exp": "LDAP is a directory access protocol.", "id": "c2t18q7"}, {"q": "In Windows 10 and 11, which section of the Windows Security app is used to turn Microsoft Defender Antivirus on or off?", "type": "single", "options": ["Firewall & network protection", "App & browser control", "Device security", "Virus & threat protection"], "correct": [3], "exp": "Virus & threat protection toggles Microsoft Defender Antivirus.", "id": "c2t18q8"}, {"q": "Which feature in Windows 10 and Windows 11 enables automatic installation of Microsoft Defender Antivirus definitions?", "type": "single", "options": ["Task Scheduler", "Virus & threat protection settings", "Windows Update", "System Configuration"], "correct": [2], "exp": "Windows Update handles automatic installation of Defender definition updates.", "id": "c2t18q9"}, {"q": "In Windows 10 and Windows 11, which section of the Windows Security app provides the option to manually update Microsoft Defender Antivirus definitions?", "type": "single", "options": ["Virus & threat protection", "Firewall & network protection", "App & browser control", "Device performance & health"], "correct": [0], "exp": "Virus & threat protection also includes the manual update option for definitions.", "id": "c2t18q10"}, {"q": "Which Control Panel paths in Windows provide access to turn Windows Defender Firewall on or off? (Select 2 answers)", "type": "multi", "options": ["Control Panel (category view) > Network and Internet > Windows Defender Firewall", "Control Panel (icon view) > System and Security > Windows Defender Firewall", "Control Panel (category view) > Security and Maintenance > Windows Defender Firewall", "Control Panel (icon view) > Windows Defender Firewall", "Control Panel (category view) > System and Security > Windows Defender Firewall"], "correct": [3, 4], "exp": "Windows Defender Firewall on/off is reached via Control Panel icon view directly, or category view > System and Security.", "id": "c2t18q11"}, {"q": "Which section of the Windows Security app in Windows 10 and 11 contains the option to turn the firewall on or off?", "type": "single", "options": ["Windows Defender Firewall", "Virus & threat protection settings", "Device security", "Firewall & network protection"], "correct": [3], "exp": "Firewall & network protection in Windows Security controls the firewall on/off state.", "id": "c2t18q12"}, {"q": "In Windows 10 and 11, a firewall interface providing options to create custom exceptions for applications or ports can be accessed via:", "type": "single", "options": ["Control Panel (icon view) > Windows Defender Firewall > Advanced settings > right-click on Inbound/Outbound Rules > New Rule...", "Control Panel (category view) > System and Security > Windows Defender Firewall > Advanced settings > right-click on Inbound/Outbound Rules > New Rule...", "Windows Security app > Firewall & network protection > Advanced settings > right-click on Inbound/Outbound Rules > New Rule...", "Any of the above paths"], "correct": [3], "exp": "Custom firewall rules are reachable via any of these three navigation paths — all lead to the same Advanced Security interface.", "id": "c2t18q13"}, {"q": "Which navigation path in Windows 10 and Windows 11 can be used to access a simplified interface for allowing or blocking applications across private or public networks?", "type": "single", "options": ["Control Panel (icon view) > Windows Defender Firewall > Allow an app or feature through Windows Defender Firewall", "Control Panel (category view) > System and Security > Windows Defender Firewall > Allow an app or feature through Windows Defender Firewall", "Windows Security app > Firewall & network protection > Allow an app through the firewall", "Any of the above"], "correct": [3], "exp": "The simplified app-allow interface is reachable via any of these three paths.", "id": "c2t18q14"}, {"q": "Which type of Windows account is primarily used for an offline, single-device setup?", "type": "single", "options": ["Microsoft account", "Local account", "Domain account", "Administrator account"], "correct": [1], "exp": "A local account is used for offline, single-device Windows setups.", "id": "c2t18q15"}, {"q": "Which of the answers listed below refers to an SSO account type in Windows?", "type": "single", "options": ["Local account", "Microsoft account", "Administrator account", "Standard account"], "correct": [1], "exp": "A Microsoft account provides SSO across Microsoft services in Windows.", "id": "c2t18q16"}, {"q": "Which user group in Windows 10 and 11 can use most of the software and change system settings that do not affect other users or the computer's security?", "type": "single", "options": ["Standard Users", "Guests", "Power Users", "Administrators"], "correct": [0], "exp": "Standard Users can use most software and change non-security-affecting settings.", "id": "c2t18q17"}, {"q": "Which of the following answers refers to a built-in Windows account type that has complete and unrestricted access to a computer or domain?", "type": "single", "options": ["Account Operators", "Power Users", "Network Configuration Operators", "Administrators"], "correct": [3], "exp": "Administrators have complete, unrestricted access to the computer/domain.", "id": "c2t18q18"}, {"q": "In Microsoft Windows environments, the Guest account is intended for users who do not have a permanent account on a Windows computer or domain. Users with this type of account cannot install software or hardware, change system settings, create passwords, or access protected files and folders. However, because the Guest account allows logging on to a network, browsing the Internet, and shutting down the computer, it is recommended to keep it disabled unless temporarily required for a specific purpose.", "type": "bool", "options": ["True", "False"], "correct": [0], "exp": "This accurately describes the Guest account's restricted capabilities and the recommendation to keep it disabled.", "id": "c2t18q19"}, {"q": "Which user group in Windows 10 and Windows 11 is largely a legacy local group with limited administrative rights retained for backward compatibility with older applications and Windows versions?", "type": "single", "options": ["Standard Users", "Replicators", "Account Operators", "Power Users"], "correct": [3], "exp": "Power Users is a legacy group retained mainly for backward compatibility.", "id": "c2t18q20"}, {"q": "Which Windows authentication method is device-independent, allowing users to log into different systems with the same set of credentials?", "type": "single", "options": ["PIN", "Username and password", "Windows Hello", "Fingerprint"], "correct": [1], "exp": "A username/password combo works across devices, unlike device-bound methods like PIN or biometrics.", "id": "c2t18q21"}, {"q": "Which Windows sign-in method uses a device-specific code that is stored locally and not transmitted over the network?", "type": "single", "options": ["Username and password", "PIN", "Security key", "Passwordless authentication"], "correct": [1], "exp": "A Windows PIN is tied to the specific device and stored/verified locally.", "id": "c2t18q22"}, {"q": "Which of the answers listed below refer(s) to built-in biometric authentication options available in Windows 10 and Windows 11? (Select all that apply)", "type": "multi", "options": ["Fingerprint", "Smart card sign-in", "Voice recognition", "Retina scan", "Facial recognition"], "correct": [0, 4], "exp": "Windows Hello supports fingerprint and facial recognition as built-in biometric options.", "id": "c2t18q23"}, {"q": "A technician sets up a new Windows 11 computer for a user. The user wants to log in once and have automatic access to Microsoft 365, OneDrive, and the Microsoft Store without re-entering credentials. Which feature enables this functionality?", "type": "single", "options": ["Domain-based authentication", "Biometric authentication", "Single sign-on authentication", "Passwordless authentication"], "correct": [2], "exp": "Single sign-on lets one login grant access to multiple connected Microsoft services.", "id": "c2t18q24"}, {"q": "Windows Hello lets users sign in without relying solely on a password, offering passwordless options such as: (Select all that apply)", "type": "multi", "options": ["PIN-based sign-in", "Fingerprint scan", "Voice recognition", "Facial recognition"], "correct": [0, 1, 3], "exp": "Windows Hello supports PIN, fingerprint, and facial recognition sign-in — not voice recognition.", "id": "c2t18q25"}]}, {"id": "test19", "label": "Test 19", "questions": [{"q": "Which of the following statements describing share permissions in Microsoft Windows are true? (Select 2 answers)", "type": "multi", "options": ["Apply exclusively to network users", "Can be set only at the file level", "Apply to both network and local users", "Can be set only at the folder level"], "correct": [0, 3], "exp": "Share permissions apply only to network users and can be set only at the folder level.", "id": "c2t19q1"}, {"q": "Which of these statements about NTFS permissions are correct? (Select 2 answers)", "type": "multi", "options": ["Apply to both network and local users", "Can be set only at the folder level", "Apply exclusively to local users", "Can be applied at the folder or file level"], "correct": [0, 3], "exp": "NTFS permissions apply to both network and local users and can be set at the file or folder level.", "id": "c2t19q2"}, {"q": "A Windows resource with conflicting NTFS and share permissions will assume:", "type": "single", "options": ["The least restrictive permission", "NTFS permissions", "The most restrictive permission", "Share permissions"], "correct": [2], "exp": "When NTFS and share permissions conflict, the most restrictive combined permission applies.", "id": "c2t19q3"}, {"q": "The share permissions on a Windows folder grant Read access, while the NTFS permissions grant Modify access. What are the user's effective permission levels? (Select 2 answers)", "type": "multi", "options": ["Read when accessing the share remotely", "Modify when accessing the folder locally", "Read when accessing the folder locally", "Modify when accessing the share remotely"], "correct": [0, 1], "exp": "Remote access is capped by the share permission (Read); local access uses NTFS permission (Modify) since share permissions don't apply locally.", "id": "c2t19q4"}, {"q": "The share permissions on a Windows folder grant the user Full Control access, while the NTFS permissions grant Read access. Which of the answers listed below represent the user's effective permission levels? (Select 2 answers)", "type": "multi", "options": ["Read when accessing the share remotely", "Full Control when accessing the folder locally", "Read when accessing the folder locally", "Full Control when accessing the share remotely"], "correct": [0, 2], "exp": "Remote access is limited by the most restrictive combined permission (NTFS Read), and local access uses NTFS directly (also Read).", "id": "c2t19q5"}, {"q": "What is the correct hierarchy of precedence for permissions settings in NTFS?", "type": "single", "options": ["Explicit Allow > Inherited Allow > Explicit Deny > Inherited Deny", "Explicit Deny > Explicit Allow > Inherited Deny > Inherited Allow", "Explicit Allow > Explicit Deny > Inherited Allow > Inherited Deny", "Explicit Deny > Inherited Deny > Explicit Allow > Inherited Allow"], "correct": [1], "exp": "NTFS precedence: Explicit Deny > Explicit Allow > Inherited Deny > Inherited Allow.", "id": "c2t19q6"}, {"q": "In MS Windows, the attrib command is used to display or modify file and folder attributes (read-only, archive, system, hidden). \"+\" sets an attribute, \"-\" removes it.", "type": "bool", "options": ["True", "False"], "correct": [0], "exp": "attrib with + and - toggles file/folder attributes as described.", "id": "c2t19q7"}, {"q": "What is the correct syntax for applying the read-only attribute to a file in Windows?", "type": "single", "options": ["attrib +R [drive:][path][filename]", "attrib [drive:][path][filename] /R", "attrib /R [drive:][path][filename]", "attrib [drive:][path][filename] +R"], "correct": [0], "exp": "attrib +R [drive:][path][filename] is the correct syntax to set read-only.", "id": "c2t19q8"}, {"q": "In NTFS, permissions inherited from a parent object, such as a folder or user group, take precedence over explicit permissions applied directly to an object.", "type": "bool", "options": ["True", "False"], "correct": [1], "exp": "Actually explicit permissions take precedence over inherited ones in NTFS.", "id": "c2t19q9"}, {"q": "In NTFS, a folder or file moved from one location to another on the same volume inherits the permissions of its new parent folder.", "type": "bool", "options": ["True", "False"], "correct": [1], "exp": "A same-volume move retains the original permissions rather than inheriting new ones.", "id": "c2t19q10"}, {"q": "In NTFS, a folder or file copied from one location to another on the same volume retains its original permissions.", "type": "bool", "options": ["True", "False"], "correct": [1], "exp": "A copy actually inherits the destination folder's permissions rather than retaining the original.", "id": "c2t19q11"}, {"q": "In NTFS, a file or folder copied or moved from one location to another on a different volume inherits the permissions of its new parent folder.", "type": "bool", "options": ["True", "False"], "correct": [0], "exp": "Moving/copying across volumes is treated as a copy, so it inherits the new parent folder's permissions.", "id": "c2t19q12"}, {"q": "In NTFS, permission propagation occurs when a folder or file created inside another folder takes on (inherits) permissions applied to that folder, propagating down to child objects.", "type": "bool", "options": ["True", "False"], "correct": [0], "exp": "Permission propagation/inheritance flows from parent folders down to newly created child objects.", "id": "c2t19q13"}, {"q": "The \"Run as administrator\" option is a Windows feature that launches a program with elevated system privileges, allowing it to perform tasks that a standard user account cannot, such as installing software, modifying system settings, or accessing protected files. The option can be used by right-clicking an executable or shortcut and selecting \"Run as administrator\" from the context menu, which may require administrator credentials to confirm the elevated action.", "type": "bool", "options": ["True", "False"], "correct": [0], "exp": "This accurately describes the \"Run as administrator\" feature.", "id": "c2t19q14"}, {"q": "Windows Vista+ offers a feature that limits app privileges and admin task access, prompting for an admin password when elevated changes are attempted. This functionality is known as:", "type": "single", "options": ["ACL", "UAC", "AppLocker", "SmartScreen Filter"], "correct": [1], "exp": "UAC (User Account Control) is this privilege-limiting, prompt-based security feature.", "id": "c2t19q15"}, {"q": "Which Windows feature enables encryption of entire drives?", "type": "single", "options": ["FileVault", "DriveCrypt", "BitLocker", "TrueCrypt"], "correct": [2], "exp": "BitLocker encrypts entire drives in Windows.", "id": "c2t19q16"}, {"q": "Which of the following answers refers to a Microsoft Windows feature specifically designed to encrypt removable drives?", "type": "single", "options": ["BitLocker", "TrueCrypt", "BitLocker To Go", "DriveCrypt"], "correct": [2], "exp": "BitLocker To Go is designed specifically for encrypting removable drives.", "id": "c2t19q17"}, {"q": "Which built-in Windows component enables the encryption of individual files?", "type": "single", "options": ["AES", "HSM", "EFS", "TPM"], "correct": [2], "exp": "EFS (Encrypting File System) encrypts individual files in Windows.", "id": "c2t19q18"}, {"q": "Which Windows tool allows administrators to verify that a computer is successfully joined to a domain?", "type": "single", "options": ["Group Policy Editor", "Windows Security app", "Computer Management", "System Properties"], "correct": [3], "exp": "System Properties shows domain membership status.", "id": "c2t19q19"}, {"q": "A company hires a new employee, and the IT administrator needs to ensure that the employee's network drives are mapped and shared printers are available as part of their desktop setup. Which Active Directory feature should the administrator use to configure this initial desktop environment?", "type": "single", "options": ["Task Scheduler", "Local Security Policy", "User Profile", "Log-in script"], "correct": [3], "exp": "A log-in script automates mapping drives/printers at sign-in.", "id": "c2t19q20"}, {"q": "An administrator needs to move a user account from the Sales Organizational Unit (OU) to the Marketing OU. Which Active Directory tool is used to perform this action?", "type": "single", "options": ["Active Directory Domains and Trusts", "Active Directory Migration Tool", "Active Directory Users and Computers", "Active Directory Sites and Services"], "correct": [2], "exp": "Active Directory Users and Computers is used to move accounts between OUs.", "id": "c2t19q21"}, {"q": "Which Active Directory feature provides each domain user with a dedicated network location to store personal documents on a network share?", "type": "single", "options": ["Roaming profile", "My Documents folder", "Shared network drive", "Home folder"], "correct": [3], "exp": "A home folder is a dedicated network location for a user's personal documents.", "id": "c2t19q22"}, {"q": "An Active Directory domain admin wants to prevent users in a specific Organizational Unit (OU) from running a particular application. Which tool should the administrator use to enforce this setting?", "type": "single", "options": ["System Configuration", "Group Policy Management Console", "Active Directory Users and Computers", "Local Security Policy"], "correct": [1], "exp": "Group Policy Management Console enforces OU-scoped policy restrictions like app blocking.", "id": "c2t19q23"}, {"q": "Which tool is used to add a user to a security group in Active Directory?", "type": "single", "options": ["Active Directory Domains and Trusts", "Group Policy Object Editor", "Active Directory Users and Computers", "Group Policy Management Console"], "correct": [2], "exp": "Active Directory Users and Computers manages group memberships.", "id": "c2t19q24"}, {"q": "Which feature of the Windows Active Directory's Group Policy Management Console is used to ensure a user's profile folders are stored on a centralized network share rather than on their local computer?", "type": "single", "options": ["Home folders", "Roaming profiles", "Folder redirection", "Drive quotas"], "correct": [2], "exp": "Folder redirection stores profile folders on a network share instead of locally.", "id": "c2t19q25"}]}, {"id": "test20", "label": "Test 20", "questions": [{"q": "Which of the wireless encryption schemes listed below offers the highest level of protection?", "type": "single", "options": ["WEP", "WPA3", "TKIP", "WPS"], "correct": [1], "exp": "WPA3 offers the strongest protection among the listed wireless encryption schemes.", "id": "c2t20q1"}, {"q": "Which of the following characteristics apply to the WPA2/WPA3 Personal mode? (Select 3)", "type": "multi", "options": ["Provides unique login credentials for each user", "Typically deployed in business or enterprise networks", "Authentication through 802.1X with a RADIUS server", "Simple to set up without requiring extra infrastructure", "Commonly used in home or SOHO environments", "Authentication via a single, shared password"], "correct": [3, 4, 5], "exp": "Personal mode is simple to set up, common in home/SOHO, and uses a single shared password.", "id": "c2t20q2"}, {"q": "Which of the answers listed below refer to the characteristic features of the WPA2/WPA3 Enterprise mode? (Select 3 answers)", "type": "multi", "options": ["Authentication via a single, shared password", "Simple to set up without requiring extra infrastructure", "Typically deployed in business or enterprise networks", "Authentication through 802.1X with a RADIUS server", "Provides unique login credentials for each user", "Commonly used in home or SOHO environments"], "correct": [2, 3, 4], "exp": "Enterprise mode is deployed in businesses, uses 802.1X/RADIUS, and gives each user unique credentials.", "id": "c2t20q3"}, {"q": "Which of the following answers refers to a stopgap protocol introduced with WPA to replace WEP?", "type": "single", "options": ["AES", "TKIP", "CCMP", "RC4"], "correct": [1], "exp": "TKIP was the stopgap encryption protocol introduced with WPA to replace WEP.", "id": "c2t20q4"}, {"q": "Which of the cryptographic algorithms listed below is the least vulnerable to attacks?", "type": "single", "options": ["AES", "DES", "RC4", "3DES"], "correct": [0], "exp": "AES is the strongest/least vulnerable of the listed algorithms.", "id": "c2t20q5"}, {"q": "For a wireless client to be able to connect to a network, the security type (e.g., WEP, WPA, WPA2, or WPA3) and encryption type (e.g., TKIP or AES) settings on the connecting host must match the corresponding wireless security settings on a WAP.", "type": "bool", "options": ["True", "False"], "correct": [0], "exp": "Security/encryption settings must match between client and WAP to connect.", "id": "c2t20q6"}, {"q": "Which AAA solution uses UDP as its transport protocol, combines authentication and authorization, and is commonly deployed for network access control such as VPNs and Wi-Fi authentication?", "type": "single", "options": ["RADIUS", "LDAP", "TACACS+", "Kerberos"], "correct": [0], "exp": "RADIUS uses UDP and combines authN/authZ for VPN/Wi-Fi access control.", "id": "c2t20q7"}, {"q": "Which of the following AAA solutions relies on TCP, separates authentication, authorization, and accounting, and is commonly used for device administration in enterprise networks?", "type": "single", "options": ["OAuth", "TACACS+", "SAML", "RADIUS"], "correct": [1], "exp": "TACACS+ uses TCP, separates AAA functions, used for device admin.", "id": "c2t20q8"}, {"q": "Which of the answers listed below refers to the primary and default authentication protocol used in Windows Active Directory environments to enable SSO?", "type": "single", "options": ["RADIUS", "NTLM", "Kerberos", "MS-CHAP"], "correct": [2], "exp": "Kerberos is the default AD authentication protocol enabling SSO.", "id": "c2t20q9"}, {"q": "Which of the following examples meets the requirement of multifactor authentication?", "type": "single", "options": ["Smart card and mobile digital key", "Password and biometric scan", "Username and pattern lock (on a device screen)", "Retina scan and voice recognition"], "correct": [1], "exp": "Password (knowledge) + biometric scan (inherence) uses two distinct factor categories — true MFA.", "id": "c2t20q10"}, {"q": "A Trojan horse is a type of software that performs harmful actions under the guise of a legitimate and useful program. The most characteristic feature of a Trojan horse is that while it may function as a legitimate program and offer expected functionality, it also contains a concealed portion of malicious code that the user is unaware of.", "type": "bool", "options": ["True", "False"], "correct": [0], "exp": "That's the defining characteristic of a Trojan horse.", "id": "c2t20q11"}, {"q": "Which of the answers listed below refers to a collection of software tools used by a hacker to mask intrusion and obtain administrator-level access on a computer or network?", "type": "single", "options": ["Rootkit", "Spyware", "Backdoor", "Trojan"], "correct": [0], "exp": "A rootkit is a toolset for masking intrusion and gaining admin-level access.", "id": "c2t20q12"}, {"q": "Which of the following statements apply to the definition of a computer virus? (Select 2 answers)", "type": "multi", "options": ["A self-replicating computer program that contains a malicious segment", "Malicious code that typically attaches itself to an application or executable component", "A standalone malicious program that replicates itself over a network", "Malware that can operate independently without any interaction", "A self-contained malicious program that does not require a host to propagate"], "correct": [0, 1], "exp": "A virus is self-replicating and attaches itself to a host application/executable, unlike a worm which is standalone.", "id": "c2t20q13"}, {"q": "Malicious software collecting information about users without their knowledge/consent is referred to as:", "type": "single", "options": ["Adware", "Cryptomalware", "Ransomware", "Spyware"], "correct": [3], "exp": "Spyware secretly collects user information.", "id": "c2t20q14"}, {"q": "Malware that restricts access to a computer system by encrypting files or locking the entire system until the user performs a requested action is known as:", "type": "single", "options": ["Grayware", "Adware", "Ransomware", "Spyware"], "correct": [2], "exp": "Ransomware locks/encrypts a system until a demand is met.", "id": "c2t20q15"}, {"q": "Which of the answers listed below refer to examples of spyware? (Select 2 answers)", "type": "multi", "options": ["Backdoor", "Stalkerware", "Keylogger", "Port scanner", "Rootkit"], "correct": [1, 2], "exp": "Stalkerware and keyloggers are both types of spyware.", "id": "c2t20q16"}, {"q": "A type of malware that infects the storage drive area containing the necessary data and code used to start the OS is called:", "type": "single", "options": ["Rootkit", "Worm", "Boot sector virus", "Trojan horse"], "correct": [2], "exp": "A boot sector virus infects the disk area used to start the OS.", "id": "c2t20q17"}, {"q": "Which of the following answers refers to a malware type designed to exploit computing resources without the owner's consent?", "type": "single", "options": ["Adware", "PUP", "Fileless malware", "Cryptominer"], "correct": [3], "exp": "A cryptominer exploits computing resources (for mining) without consent.", "id": "c2t20q18"}, {"q": "Which of the answers listed below describes the key characteristics of stalkerware? (Select best answer)", "type": "single", "options": ["Provides hidden remote access while transmitting user activity to an external party", "Captures on-screen output and periodic screenshots to reveal user activity", "Installs tracking cookies and monitors user activity across websites for profiling", "Collects location data, call logs, messages, and app usage for continuous monitoring"], "correct": [3], "exp": "Stalkerware focuses on continuous personal monitoring: location, calls, messages, app usage.", "id": "c2t20q19"}, {"q": "Fileless malware: (Select 3 answers)", "type": "multi", "options": ["Modifies the boot sector of the storage drive for persistence", "Requires a rootkit to hide its presence on a drive", "Abuses legitimate operating system tools to execute code", "Operates entirely in RAM without writing its payload to storage", "Evades traditional signature-based antivirus detection"], "correct": [2, 3, 4], "exp": "Fileless malware abuses legitimate OS tools, runs entirely in RAM, and evades signature-based AV.", "id": "c2t20q20"}, {"q": "Which of the following statements can be used to describe a PUP? (Select all that apply)", "type": "multi", "options": ["Installed with user consent but often without fully informed agreement", "Not explicitly classified as malware by AV software", "May adversely affect security or performance, compromise privacy, or display unsolicited ads", "Commonly bundled with other software", "Installed without user consent and considered illegal", "Explicitly detected and classified as malware by AV applications"], "correct": [0, 1, 2, 3], "exp": "A PUP is installed with (uninformed) consent, not classified as outright malware, may harm privacy/performance, and is often bundled.", "id": "c2t20q21"}, {"q": "In Windows 10 and 11, Windows Recovery Environment (WinRE) is the modern recovery and troubleshooting environment that replaces the legacy:", "type": "single", "options": ["Startup Repair", "Windows Boot Manager", "System Restore", "Recovery Console"], "correct": [3], "exp": "WinRE replaces the legacy Recovery Console.", "id": "c2t20q22"}, {"q": "Which of the answers listed below refers to a security solution that provides the capability for detection, analysis, response, and real-time monitoring of cyber threats at the device level?", "type": "single", "options": ["DLP", "IDS", "UTM", "EDR"], "correct": [3], "exp": "EDR monitors/responds to threats at the endpoint/device level.", "id": "c2t20q23"}, {"q": "Which dedicated cybersecurity service offers continuous monitoring, threat detection, and incident response typically delivered by an external provider?", "type": "single", "options": ["SIEM", "MSP", "MDR", "SaaS"], "correct": [2], "exp": "MDR (Managed Detection and Response) is typically delivered by an external provider.", "id": "c2t20q24"}, {"q": "Which of the following acronyms refers to a unified cybersecurity approach that collects and correlates data across multiple security layers (such as endpoint, network, and cloud) for enhanced threat detection and response?", "type": "single", "options": ["UTM", "SWG", "XDR", "WAF"], "correct": [2], "exp": "XDR correlates data across endpoint/network/cloud for unified threat detection.", "id": "c2t20q25"}]}, {"id": "test21", "label": "Test 21", "questions": [{"q": "What is the primary purpose of antivirus signature updates?", "type": "single", "options": ["Patching vulnerabilities in the operating system", "Optimizing the antivirus scanning speed", "Reducing the frequency of false positives", "Identifying newly discovered malware variants"], "correct": [3], "exp": "Signature updates let AV software recognize newly discovered malware.", "id": "c2t21q1"}, {"q": "Unlike traditional antivirus, anti-malware software enhances detection using behavioral analysis and heuristic scanning to catch polymorphic malware, rootkits, and zero-day exploits that evade signature-based detection.", "type": "bool", "options": ["True", "False"], "correct": [0], "exp": "Anti-malware's behavioral/heuristic methods catch threats signature-based AV would miss.", "id": "c2t21q2"}, {"q": "Which of the solutions listed below would be the best choice for real-time protection against spam and phishing attacks?", "type": "single", "options": ["Host-based AV software", "Email client filter", "Cloud-based email service", "Email security gateway"], "correct": [3], "exp": "An email security gateway provides dedicated real-time filtering against spam/phishing.", "id": "c2t21q3"}, {"q": "Which of the following firewall types is specifically designed to protect a single physical end-user device?", "type": "single", "options": ["Hardware firewall", "Application-layer firewall", "Next-generation firewall", "Software firewall"], "correct": [3], "exp": "A software firewall runs on and protects a single device.", "id": "c2t21q4"}, {"q": "What type of threat is antiphishing training primarily designed to prevent?", "type": "single", "options": ["Data exfiltration", "Unauthorized physical access attempts", "Social engineering attacks", "Insider threat"], "correct": [2], "exp": "Antiphishing training targets social engineering attacks like phishing.", "id": "c2t21q5"}, {"q": "A Windows technician determines that a system infected with persistent malware cannot be cleaned using antivirus tools. Which of the actions listed below should be performed next to ensure system integrity?", "type": "single", "options": ["Reboot the system in Safe Mode", "Run a disk defragmentation", "Roll back the system to a restore point", "Reinstall the operating system"], "correct": [3], "exp": "When AV tools can't clean persistent malware, a clean OS reinstall is the reliable next step.", "id": "c2t21q6"}, {"q": "Which of the following answer choices is an example of a threat vector type that is typical for voice communication?", "type": "single", "options": ["Pharming", "Vishing", "Phishing", "Smishing"], "correct": [1], "exp": "Vishing is voice-call-based phishing.", "id": "c2t21q7"}, {"q": "Which of the terms listed below refers to a threat vector commonly associated with SMS-based communication?", "type": "single", "options": ["Phishing", "Vishing", "Smishing", "Pharming"], "correct": [2], "exp": "Smishing is SMS-based phishing.", "id": "c2t21q8"}, {"q": "QR code phishing embeds malicious URLs into QR codes appearing in emails, posters, packaging, or displays; scanning can redirect to fake login pages, trigger malware downloads, or capture sensitive info.", "type": "bool", "options": ["True", "False"], "correct": [0], "exp": "QR phishing does exactly this via malicious embedded URLs.", "id": "c2t21q9"}, {"q": "Which of the following answers refers to a phishing attack aimed at specific individuals or groups?", "type": "single", "options": ["Email spoofing", "Whaling", "Spear phishing", "Watering hole attack"], "correct": [2], "exp": "Spear phishing targets specific individuals or groups.", "id": "c2t21q10"}, {"q": "A senior company executive receives a personalized email, appearing to be from an external law firm, demanding urgent settlement of a fictitious legal matter. This type of phishing attack is an example of:", "type": "single", "options": ["Spear phishing", "Business email compromise", "Impersonation attack", "Whaling"], "correct": [3], "exp": "Whaling specifically targets high-profile executives with personalized attacks.", "id": "c2t21q11"}, {"q": "Privacy filter narrows the viewing angle so screen content is only visible directly in front, protecting against:", "type": "single", "options": ["Identity theft", "Shoulder surfing", "Privilege escalation", "Screen scraping"], "correct": [1], "exp": "Privacy filters counter shoulder surfing by limiting the visible viewing angle.", "id": "c2t21q12"}, {"q": "A visitor without a badge enters a company building right after a delivery worker opens the door. This situation best describes:", "type": "single", "options": ["Tailgating", "Shoulder surfing", "Pretexting", "Impersonation"], "correct": [0], "exp": "Following someone through a secured door without authorization is tailgating.", "id": "c2t21q13"}, {"q": "A technician receives a call from someone claiming to be a data center manager requesting an immediate password reset for a critical account. This scenario is an example of:", "type": "single", "options": ["Identity theft", "Phishing", "Unauthorized access", "Impersonation"], "correct": [3], "exp": "Falsely claiming to be an authority figure to manipulate someone is impersonation.", "id": "c2t21q14"}, {"q": "\"Dumpster diving\" refers to searching through trash for discarded documents/media that may contain sensitive data usable for malicious purposes.", "type": "bool", "options": ["True", "False"], "correct": [0], "exp": "Dumpster diving is exactly this — mining discarded trash for sensitive info.", "id": "c2t21q15"}, {"q": "A DoS attack disrupts access by overwhelming a target from a single compromised source. A more advanced form using multiple compromised systems flooding a target, harder to detect/defend against, is referred to as:", "type": "single", "options": ["Syn flood", "Amplification attack", "DDoS", "MitM attack"], "correct": [2], "exp": "DDoS uses multiple compromised systems to flood a target, unlike single-source DoS.", "id": "c2t21q16"}, {"q": "\"Evil twin\" refers to a rogue WAP set up for eavesdropping/data theft, replacing a legitimate AP by advertising the same SSID so hosts perceive it as correct.", "type": "bool", "options": ["True", "False"], "correct": [0], "exp": "That's an accurate description of an evil twin attack.", "id": "c2t21q17"}, {"q": "An attack that takes advantage of a previously unknown software vulnerability that the developer has not yet patched is known as:", "type": "single", "options": ["Trojan horse", "Backdoor exploit", "Logic bomb", "Zero-day attack"], "correct": [3], "exp": "A zero-day attack exploits an unpatched, previously unknown vulnerability.", "id": "c2t21q18"}, {"q": "Which term best describes a situation where an attacker falsifies an identifier (email, IP, MAC, caller ID, or website) to appear as a trusted source, deceiving targets or redirecting traffic?", "type": "single", "options": ["Phishing", "Impersonation", "Spoofing", "Pretexting"], "correct": [2], "exp": "Falsifying an identifier to appear trusted is spoofing.", "id": "c2t21q19"}, {"q": "Which of the statements listed below describe an on-path attack? (Select 3 answers)", "type": "multi", "options": ["Attackers intercept and modify the packets sent between two communicating devices", "Attackers must have physical access to the network infrastructure to execute an on-path attack", "Attackers can impersonate one of the communicating parties to alter the communication", "An on-path attack may succeed only if at least one of the communicating devices has been compromised", "Attackers place themselves on the communication route between two devices"], "correct": [0, 2, 4], "exp": "On-path attacks intercept/modify packets, can impersonate a party, and position the attacker on the communication route.", "id": "c2t21q20"}, {"q": "Which of the following answers refers to a cyberattack that relies on testing every possible combination of letters, numbers, and symbols to gain unauthorized access to accounts, systems, or encrypted data?", "type": "single", "options": ["Replay attack", "Brute-force attack", "Dictionary attack", "Birthday attack"], "correct": [1], "exp": "A brute-force attack tries every possible combination systematically.", "id": "c2t21q21"}, {"q": "Which password attack takes advantage of a predefined list of words?", "type": "single", "options": ["Birthday attack", "Replay attack", "Dictionary attack", "Brute-force attack"], "correct": [2], "exp": "A dictionary attack uses a predefined wordlist rather than trying every combination.", "id": "c2t21q22"}, {"q": "Which term best describes a disgruntled employee abusing legitimate access to a company's internal resources?", "type": "single", "options": ["APT", "Insider threat", "Gray hat", "Threat actor"], "correct": [1], "exp": "An insider threat is someone with legitimate access misusing it maliciously.", "id": "c2t21q23"}, {"q": "Which of the answers listed below refers to a security vulnerability that allows an attacker to inject malicious code into input fields, such as search bars or login forms, to execute unauthorized commands on a database?", "type": "single", "options": ["Format string exploit", "Buffer overflow", "SQL injection", "Cross-site scripting"], "correct": [2], "exp": "SQL injection exploits input fields to run unauthorized database commands.", "id": "c2t21q24"}, {"q": "Which of the following answers can be used to describe the characteristics of an XSS attack? (Select 3 answers)", "type": "multi", "options": ["A user unknowingly submits a forged request to a trusted website", "An attack that exploits the trust a website has in the user's web browser", "The trusted website executes an action on behalf of the user without their consent", "An attacker injects a malicious script into a trusted website", "An attack that exploits the trust a user's web browser has in a website", "The attacker's script is executed in the user's browser"], "correct": [3, 4, 5], "exp": "XSS injects a malicious script into a trusted site, exploiting the browser's trust in that site, executing in the victim's browser.", "id": "c2t21q25"}]}, {"id": "test22", "label": "Test 22", "questions": [{"q": "A BEC attack is a targeted subtype of which broader social engineering attack category?", "type": "single", "options": ["Smishing", "Phishing", "Vishing", "Pharming"], "correct": [1], "exp": "BEC is a targeted subtype of phishing.", "id": "c2t22q1"}, {"q": "Which cyberattack involves impersonating executives, vendors, or trusted partners via email to trick organizations into harmful actions such as making unauthorized wire transfers or disclosing sensitive data?", "type": "single", "options": ["APT", "BEC", "TTP", "ATO"], "correct": [1], "exp": "BEC (Business Email Compromise) impersonates trusted contacts to trick employees into harmful actions.", "id": "c2t22q2"}, {"q": "Which of the answers listed below refers to a cybersecurity threat in which attackers compromise a trusted third-party vendor, software provider, or service in the distribution pipeline to insert malicious code, hardware, or updates?", "type": "single", "options": ["On-path attack", "Man-in-the-middle attack", "Supply chain attack", "Insider threat"], "correct": [2], "exp": "A supply chain attack compromises a trusted third party in the distribution pipeline.", "id": "c2t22q3"}, {"q": "Network Access Control (NAC) defines a set of rules enforced in a network that clients attempting to access the network must comply with. With NAC, policies can be enforced before or after end-stations gain access to the network. NAC can be implemented as pre-admission NAC, where a host must, for example, be virus-free or have patches applied before it is allowed to connect to the network, and/or post-admission NAC, where a host is granted or denied permissions based on its actions after it has been provided access to the network.", "type": "bool", "options": ["True", "False"], "correct": [0], "exp": "NAC does enforce both pre- and post-admission compliance policies as described.", "id": "c2t22q4"}, {"q": "A network administrator is using an asset inventory report to identify systems running web server software with recently disclosed critical security flaws. This task is an example of managing which type of vulnerability?", "type": "single", "options": ["Unpatched systems", "Zero-day exploits", "Non-compliant systems", "Configuration drift"], "correct": [0], "exp": "Identifying systems missing patches for known flaws is managing unpatched systems.", "id": "c2t22q5"}, {"q": "Which of the following controls are considered basic first-line, active defenses that reduce risk from common vulnerabilities on endpoints? (Select 2 answers)", "type": "multi", "options": ["Strong passwords", "Host-based firewall", "Security awareness training", "Encryption", "Antivirus software"], "correct": [1, 4], "exp": "Host-based firewalls and antivirus software are basic active endpoint defenses.", "id": "c2t22q6"}, {"q": "The most critical security risk posed by an EOL system is that newly discovered vulnerabilities will remain permanently unpatched.", "type": "bool", "options": ["True", "False"], "correct": [0], "exp": "EOL systems no longer receive patches, so new vulnerabilities stay permanently unfixed.", "id": "c2t22q7"}, {"q": "Which mobile device deployment model allows employees to use their personal mobile devices to access a company's restricted data and applications?", "type": "single", "options": ["COPE", "CYOD", "BYOD", "COBO"], "correct": [2], "exp": "BYOD lets employees use personal devices for company access.", "id": "c2t22q8"}, {"q": "A user reports slow performance and suspicious pop-ups, and a technician confirms a malware infection. Which action should the technician perform immediately after investigating and verifying the malware symptoms?", "type": "single", "options": ["Remediate the infected system", "Update the anti-malware software", "Quarantine the infected system", "Create a system restore point"], "correct": [2], "exp": "After confirming infection, the next step is quarantining the system to prevent spread.", "id": "c2t22q9"}, {"q": "After confirming a malware infection on a Windows Home PC, which action related to System Restore should be performed before beginning remediation?", "type": "single", "options": ["Delete user data but keep restore points intact", "Create a new system restore point immediately before removal", "Disable System Restore to prevent reinfection from infected restore points", "Leave System Restore enabled to preserve reco
